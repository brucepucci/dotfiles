# ~/.tmux.conf — managed by chezmoi (dot_tmux.conf in the source repo).
#
# Deliberately minimal. tmux exists here for DETACHABLE sessions: leave the
# desk, reattach from a phone over SSH (README, "Picking up from another
# device"). Local window management is Ghostty's job — no prefix remap, no
# plugin ecosystem, no status-line theming. Shells inside tmux are just more
# zsh reading the same ~/.zshrc.

# pi requires modifier keys to survive the tmux layer: without extended key
# reporting, Shift+Enter collapses to plain Enter, breaking pi's newline
# binding (and any nvim mapping on a modified key). csi-u is the format pi's
# docs recommend; it needs tmux >= 3.5 (the Brewfile's). On distro tmux
# 3.2-3.4 delete the format line only -- pi also supports tmux's default
# xterm format.
set -g extended-keys on
set -g extended-keys-format csi-u

# Focus reporting: without it, focus events stop at the tmux layer and nvim
# never sees FocusGained -- which is what drives the appearance sync
# (light/dark relight) and the refocus :checktime reload. Default is off.
set -g focus-events on

# OSC 52 clipboard: tmux copy-mode yanks (and any app that itself speaks
# OSC 52) reach the CONNECTING client's clipboard -- over SSH, the phone in
# hand. Caveat: nvim on macOS uses pbcopy, so its yanks land on the Mac's
# clipboard, not the connecting device's; copy-mode is the phone path.
set -g set-clipboard on

# Truecolor passthrough. The nvim colorscheme is generated from the theme
# roles as hexes; unless the inner terminal advertises RGB, tmux downgrades
# them to 256-color approximations and the "one look everywhere" design
# quietly breaks under tmux. The catch-all marks every client terminal as
# RGB-capable — fine for this setup, whose clients (Ghostty, Blink, Termius)
# all render truecolor.
set -ga terminal-overrides ',*:RGB'

# The status bar's stock composition runs the session name straight into the
# window list: "[chezmoi-2] 0:node*". A collision-minted name ends in a digit,
# the window index starts with one, and the thin "] " between them disappears
# at a glance (especially from a phone) -- the bar scans as session
# "chezmoi-20". Give every window entry a hard leading separator so the
# fields cannot blend: "[chezmoi-2] | 0:node*". Text only -- still no
# status-line theming.
set -g window-status-format ' | #I:#W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format ' | #I:#W#{?window_flags,#{window_flags}, }'
