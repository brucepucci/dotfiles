name: smoke

# Tier 1 of the test pyramid (see docs/developing.md): apply the repo
# into a pristine HOME on a clean macOS runner and exercise the shell the
# way real sessions do. The repo targets macOS only, so CI runs there too.
# No Ghostty install: the palettes come from the committed mirror in
# themes/ (rooted in mbadolato/iTerm2-Color-Schemes), so this runner
# proving apply green IS the proof that apply needs no Ghostty.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: brew install chezmoi

      - name: From-scratch smoke test
        run: scripts/smoke-test.sh
