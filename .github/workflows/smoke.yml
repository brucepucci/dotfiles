name: smoke

# Tier 1 of the test pyramid (see docs/developing.md): apply the repo
# into a pristine HOME on a clean macOS runner and exercise the shell the
# way real sessions do. The repo targets macOS only, so CI runs there too.
# Ghostty itself is installed (as a cask -- just the app bundle, nothing
# GUI runs) because the palette resolver reads Ghostty's bundled theme
# catalog at apply time: CI resolves theme names against the exact same
# catalog a local machine has. No pins, no proxy catalog to keep fresh.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi and Ghostty
        run: |
          brew install chezmoi
          brew install --cask ghostty

      - name: From-scratch smoke test
        run: scripts/smoke-test.sh
