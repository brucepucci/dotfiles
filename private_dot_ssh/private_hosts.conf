# Shared address book only. Private keys and agent settings stay client-local.
# Include this file near the top of ~/.ssh/config, then reset with Host *.
# HostKeyAlias keeps each server's identity consistent across network routes.

Host mm mini mm-breakglass mini-breakglass
    HostName bruces-mac-mini.cyprus-temperature.ts.net
    HostKeyAlias bruces-mac-mini.cyprus-temperature.ts.net
    User brucepucci

Host air air-breakglass
    HostName bruces-macbook-air.cyprus-temperature.ts.net
    HostKeyAlias bruces-macbook-air.cyprus-temperature.ts.net
    User bp

Host rpi o3c-pi rpi-breakglass o3c-pi-breakglass
    HostName o3c-pi.cyprus-temperature.ts.net
    HostKeyAlias o3c-pi.cyprus-temperature.ts.net
    User brucepucci

Host mm-lan mini-lan mm-lan-breakglass mini-lan-breakglass
    HostName 192.168.1.64
    HostKeyAlias bruces-mac-mini.cyprus-temperature.ts.net
    User brucepucci

# Existing Pi LAN addresses. Wi-Fi is currently connected; Ethernet is not.
Host rpi-lan o3c-pi-wifi rpi-lan-breakglass o3c-pi-wifi-breakglass
    HostName 192.168.4.25
    HostKeyAlias o3c-pi.cyprus-temperature.ts.net
    User brucepucci

Host rpi-eth o3c-pi-eth rpi-eth-breakglass o3c-pi-eth-breakglass
    HostName 192.168.1.220
    HostKeyAlias o3c-pi.cyprus-temperature.ts.net
    User brucepucci
