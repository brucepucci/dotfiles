# Hipster Green
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#100b05"
foreground = "#84c138"
cursor-color = "#23ff18"
cursor-text = "#ff0018"
selection-background = "#083905"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#b6214a"
palette_2 = "#00a600"
palette_3 = "#bfbf00"
palette_4 = "#246eb2"
palette_5 = "#b200b2"
palette_6 = "#00a6b2"
palette_7 = "#bfbfbf"
palette_8 = "#666666"
palette_9 = "#e50000"
palette_10 = "#86a93e"
palette_11 = "#e5e500"
palette_12 = "#0000ff"
palette_13 = "#e500e5"
palette_14 = "#00e5e5"
palette_15 = "#e5e5e5"

[roles]
bg = "#100b05"
bg_deep = "#0c0804"
surface = "#1e210b"
fg = "#84c138"
fg_soft = "#618a29"
fg_bright = "#e5e5e5"
grey = "#506f21"
grey_dim = "#394b17"
grey_neutral = "#5b8126"
grey_soft = "#445d1c"
red = "#b6214a"
orange = "#ba7025"
yellow = "#bfbf00"
green = "#00a600"
aqua = "#00a6b2"
blue = "#246eb2"
purple = "#b200b2"
tint_green = "#0d2704"
tint_red = "#2e0f11"
statusline = "#191a09"
statusline_accent = "#252c0e"
statusline_fg = "#84c138"
on_accent = "#100b05"
mode_red = "#b6214a"
mode_green = "#00a600"
