palette_2 = "#100b05"
palette_3 = "#100b05"
palette_4 = "#100b05"
palette_5 = "#100b05"
palette_6 = "#100b05"
palette_7 = "#100b05"
palette_8 = "#100b05"
palette_9 = "#100b05"
palette_10 = "#100b05"
palette_11 = "#100b05"
palette_12 = "#100b05"
palette_13 = "#100b05"
palette_14 = "#100b05"
palette_15 = "#100b05"

[roles]
