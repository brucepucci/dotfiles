# Poimandres Storm
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#252b37"
foreground = "#a6accd"
cursor-color = "#ffffff"
cursor-text = "#252b37"
selection-background = "#a6accd"
selection-foreground = "#ffffff"
palette_0 = "#252b37"
palette_1 = "#d0679d"
palette_2 = "#5de4c7"
palette_3 = "#fffac2"
palette_4 = "#89ddff"
palette_5 = "#f087bd"
palette_6 = "#89ddff"
palette_7 = "#ffffff"
palette_8 = "#a6accd"
palette_9 = "#d0679d"
palette_10 = "#5de4c7"
palette_11 = "#fffac2"
palette_12 = "#add7ff"
palette_13 = "#f087bd"
palette_14 = "#add7ff"
palette_15 = "#ffffff"

[roles]
bg = "#252b37"
bg_deep = "#1c2029"
surface = "#343a49"
fg = "#a6accd"
fg_soft = "#7f85a0"
fg_bright = "#ffffff"
grey = "#6c728a"
grey_dim = "#52586c"
grey_neutral = "#797f98"
grey_soft = "#5f657a"
red = "#d0679d"
orange = "#e8b0b0"
yellow = "#fffac2"
green = "#5de4c7"
aqua = "#89ddff"
blue = "#89ddff"
purple = "#f087bd"
tint_green = "#2f4c51"
tint_red = "#443649"
statusline = "#2f3543"
statusline_accent = "#3c4252"
statusline_fg = "#a6accd"
on_accent = "#252b37"
mode_red = "#d0679d"
mode_green = "#5de4c7"
mode_yellow = "#fffac2"
mode_blue = "#89ddff"
mode_purple = "#f087bd"

[apps]
