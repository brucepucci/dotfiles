# Synthwave
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#dad9c7"
cursor-color = "#19cde6"
cursor-text = "#ffffed"
selection-background = "#19cde6"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#f6188f"
palette_2 = "#1ebb2b"
palette_3 = "#fdf834"
palette_4 = "#2186ec"
palette_5 = "#f85a21"
palette_6 = "#12c3e2"
palette_7 = "#ffffff"
palette_8 = "#7f7094"
palette_9 = "#f841a0"
palette_10 = "#25c141"
palette_11 = "#fdf454"
palette_12 = "#2f9ded"
palette_13 = "#f97137"
palette_14 = "#19cde6"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1a1a18"
fg = "#dad9c7"
fg_soft = "#99988b"
fg_bright = "#ffffff"
grey = "#78776d"
grey_dim = "#4c4c46"
grey_neutral = "#8e8d81"
grey_soft = "#62625a"
red = "#f6188f"
orange = "#fa8862"
yellow = "#fdf834"
green = "#1ebb2b"
aqua = "#12c3e2"
blue = "#2186ec"
purple = "#f85a21"
tint_green = "#052208"
tint_red = "#2c041a"
statusline = "#111110"
statusline_accent = "#272724"
statusline_fg = "#dad9c7"
on_accent = "#000000"
mode_red = "#f6188f"
mode_green = "#1ebb2b"
mode_yellow = "#fdf834"
mode_blue = "#2186ec"
mode_purple = "#f85a21"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
