palette_2 = "#22262d"
palette_3 = "#22262d"
palette_4 = "#22262d"
palette_5 = "#22262d"
palette_6 = "#22262d"
palette_7 = "#22262d"
palette_8 = "#22262d"
palette_9 = "#22262d"
palette_10 = "#22262d"
palette_11 = "#22262d"
palette_12 = "#22262d"
palette_13 = "#22262d"
palette_14 = "#22262d"
palette_15 = "#22262d"

[roles]
bg = "#22262d"
bg_deep = "#1a1c22"
surface = "#363a3f"
fg = "#c5c9c7"
fg_soft = "#949899"
fg_bright = "#22262d"
