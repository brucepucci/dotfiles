# Retro Legends
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d0d0d"
foreground = "#45eb45"
cursor-color = "#45eb45"
cursor-text = "#0d0d0d"
selection-background = "#336633"
selection-foreground = "#f2fff2"
palette_0 = "#262626"
palette_1 = "#de5454"
palette_2 = "#45eb45"
palette_3 = "#f7bf2b"
palette_4 = "#4066f2"
palette_5 = "#bf4cf2"
palette_6 = "#40d9e6"
palette_7 = "#bfe6bf"
palette_8 = "#4c594c"
palette_9 = "#ff6666"
palette_10 = "#59ff59"
palette_11 = "#ffd933"
palette_12 = "#4c80ff"
palette_13 = "#e666ff"
palette_14 = "#59e6ff"
palette_15 = "#f2fff2"

[roles]
bg = "#0d0d0d"
bg_deep = "#0a0a0a"
surface = "#142814"
fg = "#45eb45"
fg_soft = "#34a834"
fg_bright = "#f2fff2"
grey = "#2c872c"
grey_dim = "#215b21"
grey_neutral = "#319d31"
grey_soft = "#267126"
red = "#de5454"
orange = "#ea8a40"
yellow = "#f7bf2b"
green = "#45eb45"
aqua = "#40d9e6"
blue = "#4066f2"
purple = "#bf4cf2"
tint_green = "#173517"
tint_red = "#331a1a"
statusline = "#111f11"
statusline_accent = "#173517"
statusline_fg = "#45eb45"
on_accent = "#0d0d0d"
mode_red = "#de5454"
mode_green = "#45eb45"
mode_yellow = "#f7bf2b"
mode_blue = "#4066f2"
mode_purple = "#bf4cf2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
