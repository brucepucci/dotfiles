palette_6 = "#0d0d0d"
palette_7 = "#0d0d0d"
palette_8 = "#0d0d0d"
palette_9 = "#0d0d0d"
palette_10 = "#0d0d0d"
palette_11 = "#0d0d0d"
palette_12 = "#0d0d0d"
palette_13 = "#0d0d0d"
palette_14 = "#0d0d0d"
palette_15 = "#0d0d0d"

[roles]
