# Bluloco Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f9f9f9"
foreground = "#373a41"
cursor-color = "#f32759"
cursor-text = "#ffffff"
selection-background = "#daf0ff"
selection-foreground = "#373a41"
palette_0 = "#373a41"
palette_1 = "#d52753"
palette_2 = "#23974a"
palette_3 = "#df631c"
palette_4 = "#275fe4"
palette_5 = "#823ff1"
palette_6 = "#27618d"
palette_7 = "#babbc2"
palette_8 = "#676a77"
palette_9 = "#ff6480"
palette_10 = "#3cbc66"
palette_11 = "#c5a332"
palette_12 = "#0099e1"
palette_13 = "#ce33c0"
palette_14 = "#6d93bb"
palette_15 = "#d3d3d3"

[roles]
bg = "#f9f9f9"
bg_deep = "#fafafa"
surface = "#e2e2e3"
fg = "#373a41"
fg_soft = "#717378"
fg_bright = "#24262a"
grey = "#8e9094"
grey_dim = "#b5b6b9"
grey_neutral = "#7b7d81"
grey_soft = "#a2a3a6"
red = "#d52753"
orange = "#da4538"
yellow = "#df631c"
green = "#23974a"
aqua = "#27618d"
blue = "#275fe4"
purple = "#823ff1"
tint_green = "#d2e7da"
tint_red = "#f3d3db"
statusline = "#e9eaea"
statusline_accent = "#d6d7d8"
statusline_fg = "#373a41"
on_accent = "#f9f9f9"
mode_red = "#d52753"
mode_green = "#23974a"
mode_yellow = "#df631c"
mode_blue = "#275fe4"
mode_purple = "#823ff1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
