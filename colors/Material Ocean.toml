palette_8 = "#0f111a"
palette_9 = "#0f111a"
palette_10 = "#0f111a"
palette_11 = "#0f111a"
palette_12 = "#0f111a"
palette_13 = "#0f111a"
palette_14 = "#0f111a"
palette_15 = "#0f111a"

