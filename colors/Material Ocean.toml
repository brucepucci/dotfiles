# Material Ocean
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0f111a"
foreground = "#8f93a2"
cursor-color = "#ffcc00"
cursor-text = "#0f111a"
selection-background = "#1f2233"
selection-foreground = "#8f93a2"
palette_0 = "#546e7a"
palette_1 = "#ff5370"
palette_2 = "#c3e88d"
palette_3 = "#ffcb6b"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#89ddff"
palette_7 = "#ffffff"
palette_8 = "#546e7a"
palette_9 = "#ff5370"
palette_10 = "#c3e88d"
palette_11 = "#ffcb6b"
palette_12 = "#82aaff"
palette_13 = "#c792ea"
palette_14 = "#89ddff"
palette_15 = "#ffffff"

[roles]
bg = "#0f111a"
bg_deep = "#0b0d14"
surface = "#1e212a"
fg = "#8f93a2"
