palette_8 = "#2a2139"
palette_9 = "#2a2139"
palette_10 = "#2a2139"
palette_11 = "#2a2139"
palette_12 = "#2a2139"
palette_13 = "#2a2139"
palette_14 = "#2a2139"
palette_15 = "#2a2139"

