# Synthwave Everything
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2a2139"
foreground = "#f0eff1"
cursor-color = "#72f1b8"
cursor-text = "#1a1a1a"
selection-background = "#181521"
selection-foreground = "#f0eff1"
palette_0 = "#fefefe"
palette_1 = "#f97e72"
palette_2 = "#72f1b8"
palette_3 = "#fede5d"
palette_4 = "#6d77b3"
palette_5 = "#c792ea"
palette_6 = "#f772e0"
palette_7 = "#fefefe"
palette_8 = "#fefefe"
palette_9 = "#f88414"
palette_10 = "#72f1b8"
palette_11 = "#fff951"
palette_12 = "#36f9f6"
palette_13 = "#e1acff"
palette_14 = "#f92aad"
palette_15 = "#fefefe"

[roles]
bg = "#2a2139"
bg_deep = "#20192b"
surface = "#423a4f"
fg = "#f0eff1"
fg_soft = "#b5b1ba"
fg_bright = "#fefefe"
grey = "#97929e"
grey_dim = "#6f6979"
grey_neutral = "#aba7b1"
grey_soft = "#837e8c"
red = "#f97e72"
orange = "#fcae68"
yellow = "#fede5d"
green = "#72f1b8"
aqua = "#f772e0"
