palette_2 = "#fafafa"
palette_3 = "#fafafa"
palette_4 = "#fafafa"
palette_5 = "#fafafa"
palette_6 = "#fafafa"
palette_7 = "#fafafa"
palette_8 = "#fafafa"
palette_9 = "#fafafa"
palette_10 = "#fafafa"
palette_11 = "#fafafa"
palette_12 = "#fafafa"
palette_13 = "#fafafa"
palette_14 = "#fafafa"
palette_15 = "#fafafa"

[roles]
