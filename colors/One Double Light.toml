# One Double Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fafafa"
foreground = "#383a43"
cursor-color = "#1a1919"
cursor-text = "#dbdfe5"
selection-background = "#454e5e"
selection-foreground = "#1a1919"
palette_0 = "#454b58"
palette_1 = "#f74840"
palette_2 = "#25a343"
palette_3 = "#cc8100"
palette_4 = "#0087c1"
palette_5 = "#b50da9"
palette_6 = "#009ab7"
palette_7 = "#c5b2b3"
palette_8 = "#0e131f"
palette_9 = "#ff3711"
palette_10 = "#00b90e"
palette_11 = "#ec9900"
palette_12 = "#1065de"
palette_13 = "#e500d8"
palette_14 = "#00b4dd"
palette_15 = "#ffffff"

[roles]
bg = "#fafafa"
bg_deep = "#fbfbfb"
surface = "#e3e3e4"
fg = "#383a43"
fg_soft = "#72747a"
fg_bright = "#24262c"
grey = "#8f9095"
grey_dim = "#b6b7ba"
grey_neutral = "#7c7d83"
grey_soft = "#a3a4a8"
red = "#f74840"
orange = "#e26420"
yellow = "#cc8100"
green = "#25a343"
aqua = "#009ab7"
blue = "#0087c1"
purple = "#b50da9"
tint_green = "#d4ead9"
tint_red = "#f9dad9"
statusline = "#eaebeb"
statusline_accent = "#d7d7d9"
statusline_fg = "#383a43"
on_accent = "#fafafa"
mode_red = "#f74840"
mode_green = "#25a343"
mode_yellow = "#cc8100"
mode_blue = "#0087c1"
mode_purple = "#b50da9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
