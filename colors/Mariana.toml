palette_2 = "#343d46"
palette_3 = "#343d46"
palette_4 = "#343d46"
palette_5 = "#343d46"
palette_6 = "#343d46"
palette_7 = "#343d46"
palette_8 = "#343d46"
palette_9 = "#343d46"
palette_10 = "#343d46"
palette_11 = "#343d46"
palette_12 = "#343d46"
palette_13 = "#343d46"
palette_14 = "#343d46"
palette_15 = "#343d46"

[roles]
