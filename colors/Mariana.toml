# Mariana
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#343d46"
foreground = "#d8dee9"
cursor-color = "#fcbb6a"
cursor-text = "#8c8c8c"
selection-background = "#4e5a65"
selection-foreground = "#d8dee9"
palette_0 = "#000000"
palette_1 = "#ec5f66"
palette_2 = "#99c794"
palette_3 = "#f9ae58"
palette_4 = "#6699cc"
palette_5 = "#c695c6"
palette_6 = "#5fb4b4"
palette_7 = "#f7f7f7"
palette_8 = "#666666"
palette_9 = "#f97b58"
palette_10 = "#acd1a8"
palette_11 = "#fac761"
palette_12 = "#85add6"
palette_13 = "#d8b6d8"
palette_14 = "#82c4c4"
palette_15 = "#ffffff"

[roles]
bg = "#343d46"
bg_deep = "#272e34"
surface = "#48505a"
fg = "#d8dee9"
fg_soft = "#a7aeb8"
fg_bright = "#ffffff"
grey = "#8e96a0"
grey_dim = "#6d757f"
grey_neutral = "#9fa6b0"
grey_soft = "#7e858f"
red = "#ec5f66"
orange = "#f2865f"
yellow = "#f9ae58"
green = "#99c794"
aqua = "#5fb4b4"
