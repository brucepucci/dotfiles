# Starlight
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#242424"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#242424"
selection-background = "#ffffff"
selection-foreground = "#242424"
palette_0 = "#242424"
palette_1 = "#f62b5a"
palette_2 = "#47b413"
palette_3 = "#e3c401"
palette_4 = "#24acd4"
palette_5 = "#f2affd"
palette_6 = "#13c299"
palette_7 = "#e6e6e6"
palette_8 = "#616161"
palette_9 = "#ff4d51"
palette_10 = "#35d450"
palette_11 = "#e9e836"
palette_12 = "#5dc5f8"
palette_13 = "#feabf2"
palette_14 = "#24dfc4"
palette_15 = "#ffffff"

[roles]
bg = "#242424"
bg_deep = "#1b1b1b"
surface = "#3e3e3e"
fg = "#ffffff"
fg_soft = "#bdbdbd"
fg_bright = "#ffffff"
grey = "#9c9c9c"
grey_dim = "#717171"
grey_neutral = "#b2b2b2"
grey_soft = "#878787"
red = "#f62b5a"
orange = "#ec782e"
yellow = "#e3c401"
green = "#47b413"
aqua = "#13c299"
blue = "#24acd4"
purple = "#f2affd"
