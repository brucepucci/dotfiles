# Galaxy
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d2837"
foreground = "#ffffff"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#f9555f"
palette_2 = "#21b089"
palette_3 = "#fef02a"
palette_4 = "#589df6"
palette_5 = "#944d95"
palette_6 = "#1f9ee7"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#fa8c8f"
palette_10 = "#35bb9a"
palette_11 = "#ffff55"
palette_12 = "#589df6"
palette_13 = "#e75699"
palette_14 = "#3979bc"
palette_15 = "#ffffff"

[roles]
bg = "#1d2837"
bg_deep = "#161e29"
surface = "#38424f"
fg = "#ffffff"
fg_soft = "#bbbec3"
fg_bright = "#ffffff"
grey = "#999ea5"
grey_dim = "#6c737d"
grey_neutral = "#b0b4b9"
grey_soft = "#838991"
red = "#f9555f"
orange = "#fca244"
yellow = "#fef02a"
green = "#21b089"
aqua = "#1f9ee7"
blue = "#589df6"
purple = "#944d95"
tint_green = "#1e4046"
tint_red = "#45303e"
statusline = "#2f3947"
statusline_accent = "#464f5b"
statusline_fg = "#ffffff"
on_accent = "#1d2837"
mode_red = "#f9555f"
mode_green = "#21b089"
mode_yellow = "#fef02a"
mode_blue = "#589df6"
mode_purple = "#944d95"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
