palette_2 = "#1d2837"
palette_3 = "#1d2837"
palette_4 = "#1d2837"
palette_5 = "#1d2837"
palette_6 = "#1d2837"
palette_7 = "#1d2837"
palette_8 = "#1d2837"
palette_9 = "#1d2837"
palette_10 = "#1d2837"
palette_11 = "#1d2837"
palette_12 = "#1d2837"
palette_13 = "#1d2837"
palette_14 = "#1d2837"
palette_15 = "#1d2837"

[roles]
