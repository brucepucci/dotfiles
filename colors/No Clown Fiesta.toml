# No Clown Fiesta
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101010"
foreground = "#e0e1e4"
cursor-color = "#e0e1e4"
cursor-text = "#18191b"
selection-background = "#696d79"
selection-foreground = "#e0e1e4"
palette_0 = "#151515"
palette_1 = "#b46958"
palette_2 = "#90a959"
palette_3 = "#f4bf75"
palette_4 = "#bad7ff"
palette_5 = "#aa759f"
palette_6 = "#88afa2"
palette_7 = "#e1e1e1"
palette_8 = "#727272"
palette_9 = "#7e97ab"
palette_10 = "#90a959"
palette_11 = "#f4bf75"
palette_12 = "#bad7ff"
palette_13 = "#aa759f"
palette_14 = "#88afa2"
palette_15 = "#afafaf"

[roles]
bg = "#101010"
bg_deep = "#0c0c0c"
surface = "#292929"
fg = "#e0e1e4"
fg_soft = "#a2a2a4"
fg_bright = "#afafaf"
grey = "#828385"
grey_dim = "#59595a"
grey_neutral = "#97989a"
grey_soft = "#6e6e6f"
red = "#b46958"
orange = "#d49466"
yellow = "#f4bf75"
green = "#90a959"
aqua = "#88afa2"
blue = "#bad7ff"
purple = "#aa759f"
tint_green = "#272c1d"
tint_red = "#2e201d"
statusline = "#212121"
statusline_accent = "#353636"
statusline_fg = "#e0e1e4"
on_accent = "#101010"
mode_red = "#b46958"
mode_green = "#90a959"
mode_yellow = "#f4bf75"
mode_blue = "#bad7ff"
