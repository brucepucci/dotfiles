# Sublette
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#202535"
foreground = "#ccced0"
cursor-color = "#ccced0"
cursor-text = "#202535"
selection-background = "#ccced0"
selection-foreground = "#202535"
palette_0 = "#253045"
palette_1 = "#ee5577"
palette_2 = "#55ee77"
palette_3 = "#ffdd88"
palette_4 = "#5588ff"
palette_5 = "#ff77cc"
palette_6 = "#44eeee"
palette_7 = "#f5f5da"
palette_8 = "#405570"
palette_9 = "#ee6655"
palette_10 = "#99ee77"
palette_11 = "#ffff77"
palette_12 = "#77bbff"
palette_13 = "#aa88ff"
palette_14 = "#55ffbb"
palette_15 = "#ffffee"

[roles]
bg = "#202535"
bg_deep = "#181c28"
surface = "#353948"
fg = "#ccced0"
fg_soft = "#989ba2"
fg_bright = "#ffffee"
grey = "#7f828a"
grey_dim = "#5c606b"
grey_neutral = "#90939a"
grey_soft = "#6d717b"
red = "#ee5577"
orange = "#f69980"
yellow = "#ffdd88"
green = "#55ee77"
aqua = "#44eeee"
blue = "#5588ff"
purple = "#ff77cc"
tint_green = "#2a4941"
tint_red = "#452e41"
statusline = "#2e3341"
