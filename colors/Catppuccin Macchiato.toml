# Catppuccin Macchiato
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#24273a"
foreground = "#cad3f5"
cursor-color = "#f4dbd6"
cursor-text = "#24273a"
selection-background = "#5b6078"
selection-foreground = "#cad3f5"
palette_0 = "#494d64"
palette_1 = "#ed8796"
palette_2 = "#a6da95"
palette_3 = "#eed49f"
palette_4 = "#8aadf4"
palette_5 = "#f5bde6"
palette_6 = "#8bd5ca"
palette_7 = "#a5adcb"
palette_8 = "#5b6078"
palette_9 = "#ec7486"
palette_10 = "#8ccf7f"
palette_11 = "#e1c682"
palette_12 = "#78a1f6"
palette_13 = "#f2a9dd"
palette_14 = "#63cbc0"
palette_15 = "#b8c0e0"

[roles]
bg = "#24273a"
bg_deep = "#1b1d2c"
surface = "#383c50"
fg = "#cad3f5"
fg_soft = "#989fbd"
fg_bright = "#b8c0e0"
grey = "#7f86a1"
