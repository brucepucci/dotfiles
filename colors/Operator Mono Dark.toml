# Operator Mono Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#191919"
foreground = "#c3cac2"
cursor-color = "#fcdc08"
cursor-text = "#161616"
selection-background = "#19273b"
selection-foreground = "#dde5dc"
palette_0 = "#5a5a5a"
palette_1 = "#ca372d"
palette_2 = "#4d7b3a"
palette_3 = "#d4d697"
palette_4 = "#4387cf"
palette_5 = "#b86cb4"
palette_6 = "#72d5c6"
palette_7 = "#ced4cd"
palette_8 = "#9a9b99"
palette_9 = "#c37d62"
palette_10 = "#83d0a2"
palette_11 = "#fdfdc5"
palette_12 = "#89d3f6"
palette_13 = "#ff2c7a"
palette_14 = "#82eada"
palette_15 = "#fdfdf6"

[roles]
bg = "#191919"
bg_deep = "#131313"
surface = "#2d2e2d"
fg = "#c3cac2"
fg_soft = "#90958f"
fg_bright = "#fdfdf6"
grey = "#767a76"
grey_dim = "#545754"
grey_neutral = "#888c87"
grey_soft = "#656965"
red = "#ca372d"
orange = "#cf8662"
yellow = "#d4d697"
green = "#4d7b3a"
aqua = "#72d5c6"
blue = "#4387cf"
purple = "#b86cb4"
tint_green = "#222b1f"
tint_red = "#391e1d"
statusline = "#272727"
statusline_accent = "#383937"
statusline_fg = "#c3cac2"
on_accent = "#191919"
mode_red = "#ca372d"
mode_green = "#4d7b3a"
mode_yellow = "#d4d697"
mode_blue = "#4387cf"
mode_purple = "#b86cb4"

[apps]
