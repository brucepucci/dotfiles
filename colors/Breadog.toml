# Breadog
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f1ebe6"
foreground = "#362c24"
cursor-color = "#362c24"
cursor-text = "#f1ebe6"
selection-background = "#362c24"
selection-foreground = "#f1ebe6"
palette_0 = "#362c24"
palette_1 = "#b10b00"
palette_2 = "#007232"
palette_3 = "#8b4c00"
palette_4 = "#005cb4"
palette_5 = "#9b0097"
palette_6 = "#006a78"
palette_7 = "#baa99d"
palette_8 = "#514337"
palette_9 = "#de1100"
palette_10 = "#008f40"
palette_11 = "#ae6000"
palette_12 = "#0074e1"
palette_13 = "#c300bd"
palette_14 = "#008697"
palette_15 = "#eae1da"

[roles]
bg = "#f1ebe6"
bg_deep = "#f4f0ec"
surface = "#dbd4cf"
fg = "#362c24"
fg_soft = "#6e655e"
fg_bright = "#231d17"
grey = "#8a827b"
grey_dim = "#b0a8a2"
grey_neutral = "#776f68"
grey_soft = "#9d958f"
red = "#b10b00"
orange = "#9e2c00"
yellow = "#8b4c00"
green = "#007232"
aqua = "#006a78"
blue = "#005cb4"
purple = "#9b0097"
tint_green = "#c6d5c6"
tint_red = "#e5c3bd"
statusline = "#e2dcd6"
