# Snazzy Soft
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282a36"
foreground = "#eff0eb"
cursor-color = "#eaeaea"
cursor-text = "#282a36"
selection-background = "#92bcd0"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff5c57"
palette_2 = "#5af78e"
palette_3 = "#f3f99d"
palette_4 = "#57c7ff"
palette_5 = "#ff6ac1"
palette_6 = "#9aedfe"
palette_7 = "#f1f1f0"
palette_8 = "#686868"
palette_9 = "#ff5c57"
palette_10 = "#5af78e"
palette_11 = "#f3f99d"
palette_12 = "#57c7ff"
palette_13 = "#ff6ac1"
palette_14 = "#9aedfe"
palette_15 = "#f1f1f0"

[roles]
bg = "#282a36"
bg_deep = "#1e2028"
surface = "#40424c"
fg = "#eff0eb"
fg_soft = "#b3b5b5"
fg_bright = "#f1f1f0"
grey = "#95979a"
grey_dim = "#6e6f75"
grey_neutral = "#a9abac"
grey_soft = "#828387"
red = "#ff5c57"
orange = "#f9aa7a"
yellow = "#f3f99d"
green = "#5af78e"
aqua = "#9aedfe"
blue = "#57c7ff"
purple = "#ff6ac1"
tint_green = "#314f46"
tint_red = "#4f333c"
statusline = "#383a44"
