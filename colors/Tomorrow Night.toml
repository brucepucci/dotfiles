# Tomorrow Night
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1f21"
foreground = "#c5c8c6"
cursor-color = "#c5c8c6"
cursor-text = "#1d1f21"
selection-background = "#373b41"
selection-foreground = "#c5c8c6"
palette_0 = "#000000"
palette_1 = "#cc6666"
palette_2 = "#b5bd68"
palette_3 = "#f0c674"
palette_4 = "#81a2be"
palette_5 = "#b294bb"
palette_6 = "#8abeb7"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#cc6666"
palette_10 = "#b5bd68"
palette_11 = "#f0c674"
palette_12 = "#81a2be"
palette_13 = "#b294bb"
palette_14 = "#8abeb7"
palette_15 = "#ffffff"

[roles]
bg = "#1d1f21"
bg_deep = "#161719"
surface = "#313335"
fg = "#c5c8c6"
fg_soft = "#939594"
fg_bright = "#ffffff"
grey = "#797c7c"
grey_dim = "#585a5b"
grey_neutral = "#8a8d8c"
grey_soft = "#696b6b"
red = "#cc6666"
orange = "#de966d"
yellow = "#f0c674"
green = "#b5bd68"
aqua = "#8abeb7"
blue = "#81a2be"
purple = "#b294bb"
tint_green = "#383b2e"
tint_red = "#3c2c2d"
statusline = "#2a2d2e"
statusline_accent = "#3b3d3f"
statusline_fg = "#c5c8c6"
on_accent = "#1d1f21"
mode_red = "#cc6666"
mode_green = "#b5bd68"
mode_yellow = "#f0c674"
mode_blue = "#81a2be"
mode_purple = "#b294bb"

[apps]
