# Paraiso Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2f1e2e"
foreground = "#a39e9b"
cursor-color = "#a39e9b"
cursor-text = "#2f1e2e"
selection-background = "#4f424c"
selection-foreground = "#a39e9b"
palette_0 = "#2f1e2e"
palette_1 = "#ef6155"
palette_2 = "#48b685"
palette_3 = "#fec418"
palette_4 = "#06b6ef"
palette_5 = "#815ba4"
palette_6 = "#5bc4bf"
palette_7 = "#a39e9b"
palette_8 = "#776e71"
palette_9 = "#ef6155"
palette_10 = "#48b685"
palette_11 = "#fec418"
palette_12 = "#06b6ef"
palette_13 = "#815ba4"
palette_14 = "#5bc4bf"
palette_15 = "#e7e9db"

[roles]
bg = "#2f1e2e"
bg_deep = "#231622"
surface = "#3d2d3b"
fg = "#a39e9b"
