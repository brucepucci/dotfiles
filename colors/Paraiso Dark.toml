palette_2 = "#2f1e2e"
palette_3 = "#2f1e2e"
palette_4 = "#2f1e2e"
palette_5 = "#2f1e2e"
palette_6 = "#2f1e2e"
palette_7 = "#2f1e2e"
palette_8 = "#2f1e2e"
palette_9 = "#2f1e2e"
palette_10 = "#2f1e2e"
palette_11 = "#2f1e2e"
palette_12 = "#2f1e2e"
palette_13 = "#2f1e2e"
palette_14 = "#2f1e2e"
palette_15 = "#2f1e2e"

[roles]
bg = "#2f1e2e"
bg_deep = "#231622"
