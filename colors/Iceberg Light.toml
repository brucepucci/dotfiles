# Iceberg Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e8e9ec"
foreground = "#33374c"
cursor-color = "#33374c"
cursor-text = "#e8e9ec"
selection-background = "#33374c"
selection-foreground = "#e8e9ec"
palette_0 = "#dcdfe7"
palette_1 = "#cc517a"
palette_2 = "#668e3d"
palette_3 = "#c57339"
palette_4 = "#2d539e"
palette_5 = "#7759b4"
palette_6 = "#3f83a6"
palette_7 = "#33374c"
palette_8 = "#8389a3"
palette_9 = "#cc3768"
palette_10 = "#598030"
palette_11 = "#b6662d"
palette_12 = "#22478e"
palette_13 = "#6845ad"
palette_14 = "#327698"
palette_15 = "#262a3f"

[roles]
bg = "#e8e9ec"
bg_deep = "#eeeef1"
surface = "#d2d4d9"
fg = "#33374c"
fg_soft = "#696c7c"
