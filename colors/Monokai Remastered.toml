# Monokai Remastered
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0c0c0c"
foreground = "#d9d9d9"
cursor-color = "#fc971f"
cursor-text = "#000000"
selection-background = "#343434"
selection-foreground = "#ffffff"
palette_0 = "#1a1a1a"
palette_1 = "#f4005f"
palette_2 = "#98e024"
palette_3 = "#fd971f"
palette_4 = "#9d65ff"
palette_5 = "#f4005f"
palette_6 = "#58d1eb"
palette_7 = "#c4c5b5"
palette_8 = "#625e4c"
palette_9 = "#f4005f"
palette_10 = "#98e024"
palette_11 = "#e0d561"
palette_12 = "#9d65ff"
palette_13 = "#f4005f"
palette_14 = "#58d1eb"
palette_15 = "#f6f6ef"

[roles]
bg = "#0c0c0c"
bg_deep = "#090909"
surface = "#252525"
fg = "#d9d9d9"
fg_soft = "#9c9c9c"
fg_bright = "#f6f6ef"
grey = "#7d7d7d"
grey_dim = "#545454"
grey_neutral = "#919191"
grey_soft = "#686868"
red = "#f4005f"
orange = "#f84c3f"
yellow = "#fd971f"
green = "#98e024"
aqua = "#58d1eb"
blue = "#9d65ff"
purple = "#f4005f"
tint_green = "#253210"
tint_red = "#360a1b"
statusline = "#1c1c1c"
