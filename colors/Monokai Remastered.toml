palette_8 = "#0c0c0c"
palette_9 = "#0c0c0c"
palette_10 = "#0c0c0c"
palette_11 = "#0c0c0c"
palette_12 = "#0c0c0c"
palette_13 = "#0c0c0c"
palette_14 = "#0c0c0c"
palette_15 = "#0c0c0c"

