# Apple System Colors Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#feffff"
foreground = "#000000"
cursor-color = "#98989d"
cursor-text = "#ffffff"
selection-background = "#abd8ff"
selection-foreground = "#000000"
palette_0 = "#1a1a1a"
palette_1 = "#cc372e"
palette_2 = "#26a439"
palette_3 = "#cdac08"
palette_4 = "#0869cb"
palette_5 = "#9647bf"
palette_6 = "#479ec2"
palette_7 = "#98989d"
palette_8 = "#464646"
palette_9 = "#ff453a"
palette_10 = "#32d74b"
palette_11 = "#e5bc00"
palette_12 = "#0a84ff"
palette_13 = "#bf5af2"
palette_14 = "#69c9f2"
palette_15 = "#ffffff"

[roles]
bg = "#feffff"
bg_deep = "#feffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#727373"
grey_dim = "#a5a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#cc372e"
orange = "#cc721b"
yellow = "#cdac08"
green = "#26a439"
aqua = "#479ec2"
blue = "#0869cb"
purple = "#9647bf"
tint_green = "#d7efdb"
tint_red = "#f5dbd9"
statusline = "#eaebeb"
statusline_accent = "#d0d1d1"
statusline_fg = "#000000"
on_accent = "#feffff"
mode_red = "#cc372e"
mode_green = "#26a439"
mode_yellow = "#cdac08"
mode_blue = "#0869cb"
mode_purple = "#9647bf"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
