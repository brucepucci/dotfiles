# IBM 5153 CGA
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141414"
foreground = "#cecece"
cursor-color = "#cecece"
cursor-text = "#141414"
selection-background = "#cecece"
selection-foreground = "#141414"
palette_0 = "#141414"
palette_1 = "#d03333"
palette_2 = "#1bd01b"
palette_3 = "#d08c1b"
palette_4 = "#1b1bd0"
palette_5 = "#d01bd0"
palette_6 = "#1bd0d0"
palette_7 = "#cecece"
palette_8 = "#4e4e4e"
palette_9 = "#dc4e4e"
palette_10 = "#4edc4e"
palette_11 = "#f3f34e"
palette_12 = "#4e4edc"
palette_13 = "#f34ef3"
palette_14 = "#4ef3f3"
palette_15 = "#ffffff"

[roles]
bg = "#141414"
bg_deep = "#0f0f0f"
surface = "#2a2a2a"
fg = "#cecece"
fg_soft = "#969696"
fg_bright = "#ffffff"
grey = "#7a7a7a"
grey_dim = "#555555"
grey_neutral = "#8d8d8d"
grey_soft = "#686868"
red = "#d03333"
orange = "#d06027"
yellow = "#d08c1b"
green = "#1bd01b"
aqua = "#1bd0d0"
blue = "#1b1bd0"
purple = "#d01bd0"
tint_green = "#153615"
tint_red = "#361a1a"
statusline = "#232323"
statusline_accent = "#353535"
statusline_fg = "#cecece"
on_accent = "#cecece"
mode_red = "#d03333"
mode_green = "#1bd01b"
mode_yellow = "#d08c1b"
mode_blue = "#1b1bd0"
mode_purple = "#d01bd0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
