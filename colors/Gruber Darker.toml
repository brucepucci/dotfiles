palette_7 = "#181818"
palette_8 = "#181818"
palette_9 = "#181818"
palette_10 = "#181818"
palette_11 = "#181818"
palette_12 = "#181818"
palette_13 = "#181818"
palette_14 = "#181818"
palette_15 = "#181818"

[roles]
