# Gruber Darker
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#181818"
foreground = "#e4e4e4"
cursor-color = "#ffdb00"
cursor-text = "#a6a6a6"
selection-background = "#ffffff"
selection-foreground = "#54494e"
palette_0 = "#181818"
palette_1 = "#ff0a36"
palette_2 = "#42dc00"
palette_3 = "#ffdb00"
palette_4 = "#92a7cb"
palette_5 = "#a095cb"
palette_6 = "#90aa9e"
palette_7 = "#e4e4e4"
palette_8 = "#54494e"
palette_9 = "#ff3851"
palette_10 = "#42dc00"
palette_11 = "#ffdb00"
palette_12 = "#92a7cb"
palette_13 = "#afafda"
palette_14 = "#90aa9e"
palette_15 = "#f5f5f5"

[roles]
bg = "#181818"
bg_deep = "#121212"
surface = "#303030"
fg = "#e4e4e4"
fg_soft = "#a7a7a7"
fg_bright = "#f5f5f5"
grey = "#888888"
grey_dim = "#5f5f5f"
grey_neutral = "#9d9d9d"
grey_soft = "#747474"
red = "#ff0a36"
orange = "#ff721b"
yellow = "#ffdb00"
green = "#42dc00"
aqua = "#90aa9e"
blue = "#92a7cb"
purple = "#a095cb"
tint_green = "#203b14"
tint_red = "#42151d"
statusline = "#282828"
