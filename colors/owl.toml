# owl
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2f2b2c"
foreground = "#dedede"
cursor-color = "#dedede"
cursor-text = "#2f2b2c"
selection-background = "#dedede"
selection-foreground = "#2f2b2c"
palette_0 = "#302c2c"
palette_1 = "#5a5a5a"
palette_2 = "#989898"
palette_3 = "#cacaca"
palette_4 = "#656565"
palette_5 = "#b1b1b1"
palette_6 = "#7f7f7f"
palette_7 = "#dedede"
palette_8 = "#5d595b"
palette_9 = "#da5b2c"
palette_10 = "#989898"
palette_11 = "#cacaca"
palette_12 = "#656565"
palette_13 = "#b1b1b1"
palette_14 = "#7f7f7f"
palette_15 = "#ffffff"

[roles]
bg = "#2f2b2c"
bg_deep = "#232021"
surface = "#444041"
fg = "#dedede"
fg_soft = "#aaa8a9"
fg_bright = "#ffffff"
grey = "#8f8d8e"
grey_dim = "#6c6a6a"
grey_neutral = "#a19fa0"
grey_soft = "#7e7c7c"
red = "#5a5a5a"
orange = "#929292"
yellow = "#cacaca"
green = "#989898"
aqua = "#7f7f7f"
blue = "#656565"
purple = "#b1b1b1"
tint_green = "#423f3f"
tint_red = "#373334"
statusline = "#3d393a"
statusline_accent = "#4e4b4c"
statusline_fg = "#dedede"
on_accent = "#dedede"
mode_red = "#5a5a5a"
mode_green = "#989898"
mode_yellow = "#cacaca"
mode_blue = "#656565"
mode_purple = "#b1b1b1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
