palette_2 = "#2f2b2c"
palette_3 = "#2f2b2c"
palette_4 = "#2f2b2c"
palette_5 = "#2f2b2c"
palette_6 = "#2f2b2c"
palette_7 = "#2f2b2c"
palette_8 = "#2f2b2c"
palette_9 = "#2f2b2c"
palette_10 = "#2f2b2c"
palette_11 = "#2f2b2c"
palette_12 = "#2f2b2c"
palette_13 = "#2f2b2c"
palette_14 = "#2f2b2c"
palette_15 = "#2f2b2c"

[roles]
