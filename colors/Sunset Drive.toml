palette_6 = "#0f0f1a"
palette_7 = "#0f0f1a"
palette_8 = "#0f0f1a"
palette_9 = "#0f0f1a"
palette_10 = "#0f0f1a"
palette_11 = "#0f0f1a"
palette_12 = "#0f0f1a"
palette_13 = "#0f0f1a"
palette_14 = "#0f0f1a"
palette_15 = "#0f0f1a"

[roles]
