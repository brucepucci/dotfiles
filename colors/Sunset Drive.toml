# Sunset Drive
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0f0f1a"
foreground = "#ededfe"
cursor-color = "#ededfe"
cursor-text = "#0f0f1a"
selection-background = "#202036"
selection-foreground = "#ededff"
palette_0 = "#0a0a13"
palette_1 = "#ff0063"
palette_2 = "#00f992"
palette_3 = "#ffe900"
palette_4 = "#00a4ff"
palette_5 = "#ff57fd"
palette_6 = "#00ffed"
palette_7 = "#ededff"
palette_8 = "#3e3e4b"
palette_9 = "#ff948b"
palette_10 = "#00fcb9"
palette_11 = "#ffff68"
palette_12 = "#3ea0ff"
palette_13 = "#ff93ff"
palette_14 = "#38ffff"
palette_15 = "#f8f8ff"

[roles]
bg = "#0f0f1a"
bg_deep = "#0b0b14"
surface = "#2a2a35"
fg = "#ededfe"
fg_soft = "#aaaaba"
fg_bright = "#f8f8ff"
grey = "#898997"
grey_dim = "#5d5d6a"
grey_neutral = "#9f9fae"
grey_soft = "#737381"
red = "#ff0063"
orange = "#ff7432"
yellow = "#ffe900"
green = "#00f992"
aqua = "#00ffed"
blue = "#00a4ff"
purple = "#ff57fd"
tint_green = "#0c3930"
tint_red = "#3a0c27"
statusline = "#21212c"
statusline_accent = "#373743"
statusline_fg = "#ededfe"
on_accent = "#0f0f1a"
mode_red = "#ff0063"
mode_green = "#00f992"
mode_yellow = "#ffe900"
mode_blue = "#00a4ff"
mode_purple = "#ff57fd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
