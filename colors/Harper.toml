# Harper
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#010101"
foreground = "#a8a49d"
cursor-color = "#a8a49d"
cursor-text = "#010101"
selection-background = "#5a5753"
selection-foreground = "#a8a49d"
palette_0 = "#010101"
palette_1 = "#f8b63f"
palette_2 = "#7fb5e1"
palette_3 = "#d6da25"
palette_4 = "#489e48"
palette_5 = "#b296c6"
palette_6 = "#f5bfd7"
palette_7 = "#a8a49d"
palette_8 = "#726e6a"
palette_9 = "#f8b63f"
palette_10 = "#7fb5e1"
palette_11 = "#d6da25"
palette_12 = "#489e48"
palette_13 = "#b296c6"
palette_14 = "#f5bfd7"
palette_15 = "#fefbea"

[roles]
bg = "#010101"
bg_deep = "#010101"
surface = "#151514"
fg = "#a8a49d"
