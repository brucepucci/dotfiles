# iTerm2 Light Background
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c91b00"
palette_2 = "#00c200"
palette_3 = "#c7c400"
palette_4 = "#0225c7"
palette_5 = "#ca30c7"
palette_6 = "#00c5c7"
palette_7 = "#bababa"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#39d442"
palette_11 = "#ccc934"
palette_12 = "#6871ff"
palette_13 = "#ff77ff"
palette_14 = "#3ad7d9"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#c91b00"
orange = "#c87000"
yellow = "#c7c400"
green = "#00c200"
aqua = "#00c5c7"
blue = "#0225c7"
purple = "#ca30c7"
tint_green = "#d1f4d1"
tint_red = "#f5d6d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#c91b00"
mode_green = "#00c200"
mode_yellow = "#c7c400"
mode_blue = "#0225c7"
mode_purple = "#ca30c7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
