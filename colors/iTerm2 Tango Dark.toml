# iTerm2 Tango Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#d81e00"
palette_2 = "#5ea702"
palette_3 = "#cfae00"
palette_4 = "#427ab3"
palette_5 = "#89658e"
palette_6 = "#00a7aa"
palette_7 = "#dbded8"
palette_8 = "#686a66"
palette_9 = "#f54235"
palette_10 = "#99e343"
palette_11 = "#fdeb61"
palette_12 = "#84b0d8"
palette_13 = "#bc94b7"
palette_14 = "#37e6e8"
palette_15 = "#f1f1f0"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#f1f1f0"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#d81e00"
orange = "#d46600"
yellow = "#cfae00"
green = "#5ea702"
aqua = "#00a7aa"
blue = "#427ab3"
purple = "#89658e"
tint_green = "#111e00"
tint_red = "#270500"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#d81e00"
mode_green = "#5ea702"
mode_yellow = "#cfae00"
mode_blue = "#427ab3"
mode_purple = "#89658e"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
