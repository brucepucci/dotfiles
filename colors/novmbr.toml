# novmbr
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#241d1a"
foreground = "#c7b8ac"
cursor-color = "#c7b8ac"
cursor-text = "#241d1a"
selection-background = "#c7b8ac"
selection-foreground = "#241d1a"
palette_0 = "#282a2e"
palette_1 = "#9f6434"
palette_2 = "#9dac5f"
palette_3 = "#cca75f"
palette_4 = "#2f7d7c"
palette_5 = "#b5896e"
palette_6 = "#52877f"
palette_7 = "#c7b8ac"
palette_8 = "#5d4e47"
palette_9 = "#9f6434"
palette_10 = "#9dac5f"
palette_11 = "#cca75f"
palette_12 = "#2f7d7c"
palette_13 = "#b5896e"
palette_14 = "#52877f"
palette_15 = "#c7b8ac"

[roles]
bg = "#241d1a"
bg_deep = "#1b1614"
surface = "#38302c"
fg = "#c7b8ac"
