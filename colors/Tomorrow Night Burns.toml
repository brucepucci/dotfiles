# Tomorrow Night Burns
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#151515"
foreground = "#a1b0b8"
cursor-color = "#ff443e"
cursor-text = "#b0c2c4"
selection-background = "#b0bec5"
selection-foreground = "#2a2d32"
palette_0 = "#252525"
palette_1 = "#832e31"
palette_2 = "#a63c40"
palette_3 = "#d3494e"
palette_4 = "#fc595f"
palette_5 = "#df9395"
palette_6 = "#ba8586"
palette_7 = "#f5f5f5"
palette_8 = "#5d6f71"
palette_9 = "#832e31"
palette_10 = "#a63c40"
palette_11 = "#d2494e"
palette_12 = "#fc595f"
palette_13 = "#df9395"
palette_14 = "#ba8586"
palette_15 = "#f5f5f5"

[roles]
bg = "#151515"
bg_deep = "#101010"
surface = "#262829"
fg = "#a1b0b8"
fg_soft = "#778287"
fg_bright = "#f5f5f5"
grey = "#626a6f"
grey_dim = "#464b4e"
grey_neutral = "#707a7f"
