palette_2 = "#002a1a"
palette_3 = "#002a1a"
palette_4 = "#002a1a"
palette_5 = "#002a1a"
palette_6 = "#002a1a"
palette_7 = "#002a1a"
palette_8 = "#002a1a"
palette_9 = "#002a1a"
palette_10 = "#002a1a"
palette_11 = "#002a1a"
palette_12 = "#002a1a"
palette_13 = "#002a1a"
palette_14 = "#002a1a"
palette_15 = "#002a1a"

[roles]
bg = "#002a1a"
bg_deep = "#002014"
surface = "#1f4435"
fg = "#ffffff"
fg_soft = "#b2bfba"
fg_bright = "#002a1a"
grey = "#8c9f98"
grey_dim = "#59756a"
