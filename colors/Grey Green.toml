# Grey Green
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002a1a"
foreground = "#ffffff"
cursor-color = "#fff400"
cursor-text = "#aeb1b0"
selection-background = "#517e50"
selection-foreground = "#e2e2e2"
palette_0 = "#000000"
palette_1 = "#fe1414"
palette_2 = "#74ff00"
palette_3 = "#f1ff01"
palette_4 = "#00deff"
palette_5 = "#ff00f0"
palette_6 = "#00ffbc"
palette_7 = "#ffffff"
palette_8 = "#666666"
palette_9 = "#ff3939"
palette_10 = "#00ff44"
palette_11 = "#ffd100"
palette_12 = "#00afff"
palette_13 = "#ff008a"
palette_14 = "#00ffd3"
palette_15 = "#f5ecec"

[roles]
bg = "#002a1a"
bg_deep = "#002014"
surface = "#1f4435"
fg = "#ffffff"
fg_soft = "#b2bfba"
fg_bright = "#f5ecec"
grey = "#8c9f98"
grey_dim = "#59756a"
grey_neutral = "#a6b4af"
grey_soft = "#738a81"
red = "#fe1414"
orange = "#f88a0a"
yellow = "#f1ff01"
green = "#74ff00"
aqua = "#00ffbc"
blue = "#00deff"
purple = "#ff00f0"
tint_green = "#155015"
tint_red = "#2e2619"
statusline = "#143b2c"
statusline_accent = "#2e5043"
statusline_fg = "#ffffff"
on_accent = "#002a1a"
mode_red = "#fe1414"
mode_green = "#74ff00"
mode_yellow = "#f1ff01"
mode_blue = "#00deff"
mode_purple = "#ff00f0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
