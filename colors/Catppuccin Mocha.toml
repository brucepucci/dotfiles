# Catppuccin Mocha
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor-color = "#f5e0dc"
cursor-text = "#1e1e2e"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"
palette_0 = "#1e1e2e"
palette_1 = "#1e1e2e"
palette_2 = "#1e1e2e"
palette_3 = "#1e1e2e"
palette_4 = "#1e1e2e"
palette_5 = "#1e1e2e"
palette_6 = "#1e1e2e"
palette_7 = "#1e1e2e"
palette_8 = "#1e1e2e"
palette_9 = "#1e1e2e"
palette_10 = "#1e1e2e"
palette_11 = "#1e1e2e"
palette_12 = "#1e1e2e"
palette_13 = "#1e1e2e"
palette_14 = "#1e1e2e"
palette_15 = "#1e1e2e"

[roles]
bg = "#1e1e2e"
bg_deep = "#161622"
surface = "#333446"
fg = "#cdd6f4"
fg_soft = "#989fb9"
fg_bright = "#1e1e2e"
grey = "#7e839b"
grey_dim = "#5b5e73"
grey_neutral = "#9096af"
grey_soft = "#6d7187"
red = "#1e1e2e"
orange = "#1e1e2e"
yellow = "#1e1e2e"
green = "#1e1e2e"
