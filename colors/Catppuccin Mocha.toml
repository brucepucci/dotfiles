# Catppuccin Mocha
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor-color = "#f5e0dc"
cursor-text = "#1e1e2e"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"
palette_0 = "#45475a"
palette_1 = "#f38ba8"
palette_2 = "#a6e3a1"
palette_3 = "#f9e2af"
palette_4 = "#89b4fa"
palette_5 = "#f5c2e7"
palette_6 = "#94e2d5"
palette_7 = "#a6adc8"
palette_8 = "#585b70"
palette_9 = "#f37799"
palette_10 = "#89d88b"
palette_11 = "#ebd391"
palette_12 = "#74a8fc"
palette_13 = "#f2aede"
palette_14 = "#6bd7ca"
palette_15 = "#bac2de"

[roles]
bg = "#1e1e2e"
bg_deep = "#161622"
surface = "#333446"
fg = "#cdd6f4"
fg_soft = "#989fb9"
fg_bright = "#bac2de"
grey = "#7e839b"
grey_dim = "#5b5e73"
grey_neutral = "#9096af"
grey_soft = "#6d7187"
red = "#f38ba8"
orange = "#f6b6ac"
yellow = "#f9e2af"
green = "#a6e3a1"
aqua = "#94e2d5"
blue = "#89b4fa"
purple = "#f5c2e7"
tint_green = "#364143"
tint_red = "#443244"
statusline = "#2c2d3e"
statusline_accent = "#3e3f52"
statusline_fg = "#cdd6f4"
on_accent = "#1e1e2e"
mode_red = "#f38ba8"
mode_green = "#a6e3a1"
mode_yellow = "#f9e2af"
mode_blue = "#89b4fa"
