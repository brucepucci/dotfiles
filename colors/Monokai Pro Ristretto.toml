palette_4 = "#f38d70"
palette_5 = "#a8a9eb"
palette_6 = "#85dacc"
palette_7 = "#fff1f3"
palette_8 = "#72696a"
palette_9 = "#fd6883"
palette_10 = "#adda78"
palette_11 = "#f9cc6c"
palette_12 = "#f38d70"
palette_13 = "#a8a9eb"
palette_14 = "#85dacc"
palette_15 = "#fff1f3"

[roles]
