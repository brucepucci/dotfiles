# Fish Tank
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#232537"
foreground = "#ecf0fe"
cursor-color = "#fecd5e"
cursor-text = "#232537"
selection-background = "#fcf7e9"
selection-foreground = "#232537"
palette_0 = "#03073c"
palette_1 = "#c6004a"
palette_2 = "#acf157"
palette_3 = "#fecd5e"
palette_4 = "#525fb8"
palette_5 = "#986f82"
palette_6 = "#968763"
palette_7 = "#ecf0fc"
palette_8 = "#6c5b30"
palette_9 = "#da4b8a"
palette_10 = "#dbffa9"
palette_11 = "#fee6a9"
palette_12 = "#b2befa"
palette_13 = "#fda5cd"
palette_14 = "#a5bd86"
palette_15 = "#f6ffec"

[roles]
bg = "#232537"
bg_deep = "#1a1c29"
surface = "#3b3d4f"
fg = "#ecf0fe"
