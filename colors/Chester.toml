# Chester
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c3643"
foreground = "#ffffff"
cursor-color = "#b4b1b1"
cursor-text = "#000000"
selection-background = "#67747c"
selection-foreground = "#ffffff"
palette_0 = "#080200"
palette_1 = "#fa5e5b"
palette_2 = "#16c98d"
palette_3 = "#ffc83f"
palette_4 = "#288ad6"
palette_5 = "#d34590"
palette_6 = "#28ddde"
palette_7 = "#e7e7e7"
palette_8 = "#6f6b68"
palette_9 = "#fa5e5b"
palette_10 = "#16c98d"
palette_11 = "#feef6d"
palette_12 = "#278ad6"
palette_13 = "#d34590"
palette_14 = "#27dede"
palette_15 = "#ffffff"

[roles]
bg = "#2c3643"
bg_deep = "#212832"
surface = "#454e5a"
fg = "#ffffff"
fg_soft = "#c0c3c7"
fg_bright = "#ffffff"
grey = "#a0a5aa"
grey_dim = "#767c85"
grey_neutral = "#b5b9bd"
grey_soft = "#8b9098"
red = "#fa5e5b"
orange = "#fc934d"
yellow = "#ffc83f"
green = "#16c98d"
aqua = "#28ddde"
blue = "#288ad6"
purple = "#d34590"
tint_green = "#285050"
tint_red = "#513d47"
statusline = "#3d4652"
statusline_accent = "#525a65"
statusline_fg = "#ffffff"
on_accent = "#2c3643"
mode_red = "#fa5e5b"
