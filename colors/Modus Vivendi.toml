# Modus Vivendi
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#5a5a5a"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ff5f59"
palette_2 = "#44bc44"
palette_3 = "#d0bc00"
palette_4 = "#2fafff"
palette_5 = "#feacd0"
palette_6 = "#00d3d0"
palette_7 = "#a6a6a6"
palette_8 = "#595959"
palette_9 = "#ff7f9f"
palette_10 = "#00c06f"
palette_11 = "#fec43f"
palette_12 = "#79a8ff"
palette_13 = "#b6a0ff"
palette_14 = "#6ae4b9"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#ffffff"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#ff5f59"
orange = "#e88e2c"
yellow = "#d0bc00"
green = "#44bc44"
aqua = "#00d3d0"
blue = "#2fafff"
purple = "#feacd0"
tint_green = "#0c220c"
tint_red = "#2e1110"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#000000"
mode_red = "#ff5f59"
mode_green = "#44bc44"
mode_yellow = "#d0bc00"
mode_blue = "#2fafff"
mode_purple = "#feacd0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
