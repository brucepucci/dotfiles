# Light Owl
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fbfbfb"
foreground = "#403f53"
cursor-color = "#403f53"
cursor-text = "#f6f6f6"
selection-background = "#e0e0e0"
selection-foreground = "#403f53"
palette_0 = "#403f53"
palette_1 = "#de3d3b"
palette_2 = "#08916a"
palette_3 = "#e0af02"
palette_4 = "#288ed7"
palette_5 = "#d6438a"
palette_6 = "#2aa298"
palette_7 = "#bdbdbd"
palette_8 = "#989fb1"
palette_9 = "#de3d3b"
palette_10 = "#08916a"
palette_11 = "#daaa01"
palette_12 = "#288ed7"
palette_13 = "#d6438a"
palette_14 = "#2aa298"
palette_15 = "#f0f0f0"

[roles]
bg = "#fbfbfb"
bg_deep = "#fcfcfc"
surface = "#e5e4e7"
fg = "#403f53"
fg_soft = "#787785"
fg_bright = "#2a2936"
grey = "#94949f"
grey_dim = "#bab9c0"
grey_neutral = "#81818e"
grey_soft = "#a7a6af"
red = "#de3d3b"
orange = "#df761e"
yellow = "#e0af02"
