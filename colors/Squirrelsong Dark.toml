palette_7 = "#d3b9a2"
palette_8 = "#704f39"
palette_9 = "#df4d43"
palette_10 = "#659a4c"
palette_11 = "#e8c23f"
palette_12 = "#4ca4db"
palette_13 = "#9d70da"
palette_14 = "#60aca9"
palette_15 = "#f2d4bb"

[roles]
