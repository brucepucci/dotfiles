palette_7 = "#0e1729"
palette_8 = "#0e1729"
palette_9 = "#0e1729"
palette_10 = "#0e1729"
palette_11 = "#0e1729"
palette_12 = "#0e1729"
palette_13 = "#0e1729"
palette_14 = "#0e1729"
palette_15 = "#0e1729"

[roles]
