# Overnight Slumber
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e1729"
foreground = "#ced2d6"
cursor-color = "#ffa7c4"
cursor-text = "#ffffff"
selection-background = "#1f2b41"
selection-foreground = "#ced2d6"
palette_0 = "#0a1222"
palette_1 = "#ffa7c4"
palette_2 = "#85cc95"
palette_3 = "#ffcb8b"
palette_4 = "#8dabe1"
palette_5 = "#c792eb"
palette_6 = "#78ccf0"
palette_7 = "#ffffff"
palette_8 = "#575656"
palette_9 = "#ffa7c4"
palette_10 = "#85cc95"
palette_11 = "#ffcb8b"
palette_12 = "#8dabe1"
palette_13 = "#c792eb"
palette_14 = "#ffa7c4"
palette_15 = "#ffffff"

[roles]
bg = "#0e1729"
bg_deep = "#0a111f"
surface = "#252d3e"
fg = "#ced2d6"
fg_soft = "#949aa2"
fg_bright = "#ffffff"
grey = "#787e88"
grey_dim = "#515866"
grey_neutral = "#8b9199"
grey_soft = "#646b77"
red = "#ffa7c4"
orange = "#ffb9a8"
yellow = "#ffcb8b"
green = "#85cc95"
aqua = "#78ccf0"
blue = "#8dabe1"
purple = "#c792eb"
tint_green = "#23383c"
tint_red = "#393145"
statusline = "#1d2637"
statusline_accent = "#313948"
statusline_fg = "#ced2d6"
on_accent = "#0e1729"
mode_red = "#ffa7c4"
mode_green = "#85cc95"
mode_yellow = "#ffcb8b"
mode_blue = "#8dabe1"
mode_purple = "#c792eb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
