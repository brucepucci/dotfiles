# Kanagawabones
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1f28"
foreground = "#ddd8bb"
cursor-color = "#e6e0c2"
cursor-text = "#1f1f28"
selection-background = "#49473e"
selection-foreground = "#ddd8bb"
palette_0 = "#1f1f28"
palette_1 = "#e46a78"
palette_2 = "#98bc6d"
palette_3 = "#e5c283"
palette_4 = "#7eb3c9"
palette_5 = "#957fb8"
palette_6 = "#7eb3c9"
palette_7 = "#ddd8bb"
palette_8 = "#49495e"
palette_9 = "#ec818c"
palette_10 = "#9ec967"
palette_11 = "#f1c982"
palette_12 = "#7bc2df"
palette_13 = "#a98fd2"
palette_14 = "#7bc2df"
palette_15 = "#a8a48d"

[roles]
bg = "#1f1f28"
bg_deep = "#17171e"
surface = "#36353a"
fg = "#ddd8bb"
fg_soft = "#a4a08f"
fg_bright = "#a8a48d"
grey = "#888579"
grey_dim = "#62605b"
