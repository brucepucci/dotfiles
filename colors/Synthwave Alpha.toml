# Synthwave Alpha
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#241b30"
foreground = "#f2f2e3"
cursor-color = "#f2f2e3"
cursor-text = "#241b30"
selection-background = "#6e29ad"
selection-foreground = "#f2f2e3"
palette_0 = "#241b30"
palette_1 = "#e60a70"
palette_2 = "#00986c"
palette_3 = "#adad3e"
palette_4 = "#6e29ad"
palette_5 = "#b300ad"
palette_6 = "#00b0b1"
palette_7 = "#b9b1bc"
palette_8 = "#7f7094"
palette_9 = "#e60a70"
palette_10 = "#0ae4a4"
palette_11 = "#f9f972"
palette_12 = "#aa54f9"
palette_13 = "#ff00f6"
palette_14 = "#00fbfd"
palette_15 = "#f2f2e3"

[roles]
bg = "#241b30"
bg_deep = "#1b1424"
surface = "#3d3545"
fg = "#f2f2e3"
fg_soft = "#b4b2ad"
fg_bright = "#f2f2e3"
grey = "#959192"
grey_dim = "#6c666f"
grey_neutral = "#aaa7a4"
