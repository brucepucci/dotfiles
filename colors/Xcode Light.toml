# Xcode Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#262626"
cursor-color = "#262626"
cursor-text = "#ffffff"
selection-background = "#b4d8fd"
selection-foreground = "#262626"
palette_0 = "#b4d8fd"
palette_1 = "#d12f1b"
palette_2 = "#3e8087"
palette_3 = "#78492a"
palette_4 = "#0f68a0"
palette_5 = "#ad3da4"
palette_6 = "#804fb8"
palette_7 = "#262626"
palette_8 = "#8a99a6"
palette_9 = "#d12f1b"
palette_10 = "#23575c"
palette_11 = "#78492a"
palette_12 = "#0b4f79"
palette_13 = "#ad3da4"
palette_14 = "#4b21b0"
palette_15 = "#262626"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e5e5e5"
fg = "#262626"
fg_soft = "#676767"
fg_bright = "#191919"
grey = "#888888"
