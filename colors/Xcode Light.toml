# Xcode Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#262626"
cursor-color = "#262626"
cursor-text = "#ffffff"
selection-background = "#b4d8fd"
selection-foreground = "#262626"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e5e5e5"
fg = "#262626"
fg_soft = "#676767"
fg_bright = "#191919"
grey = "#888888"
grey_dim = "#b3b3b3"
grey_neutral = "#727272"
grey_soft = "#9d9d9d"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
blue = "#ffffff"
purple = "#ffffff"
tint_green = "#ffffff"
tint_red = "#ffffff"
statusline = "#eeeeee"
