# Onenord
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e3440"
foreground = "#e5e9f0"
cursor-color = "#81a1c1"
cursor-text = "#3b4252"
selection-background = "#434c5e"
selection-foreground = "#d8dee9"
palette_0 = "#2e3440"
palette_1 = "#2e3440"
palette_2 = "#2e3440"
palette_3 = "#2e3440"
palette_4 = "#2e3440"
palette_5 = "#2e3440"
palette_6 = "#2e3440"
palette_7 = "#2e3440"
palette_8 = "#2e3440"
palette_9 = "#2e3440"
palette_10 = "#2e3440"
palette_11 = "#2e3440"
palette_12 = "#2e3440"
palette_13 = "#2e3440"
palette_14 = "#2e3440"
palette_15 = "#2e3440"

[roles]
bg = "#2e3440"
bg_deep = "#222730"
surface = "#444a55"
fg = "#e5e9f0"
fg_soft = "#aeb3bb"
fg_bright = "#2e3440"
grey = "#9398a1"
