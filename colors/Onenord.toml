# Onenord
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e3440"
foreground = "#e5e9f0"
cursor-color = "#81a1c1"
cursor-text = "#3b4252"
selection-background = "#434c5e"
selection-foreground = "#d8dee9"
palette_0 = "#3b4252"
palette_1 = "#e06c75"
palette_2 = "#9ec183"
palette_3 = "#ebcb8b"
palette_4 = "#81a1c1"
palette_5 = "#b988b0"
palette_6 = "#88c0d0"
palette_7 = "#e5e9f0"
palette_8 = "#596377"
palette_9 = "#e06c75"
palette_10 = "#9ec183"
palette_11 = "#ebcb8b"
palette_12 = "#81a1c1"
palette_13 = "#b988b0"
palette_14 = "#8fbcbb"
palette_15 = "#eceff4"

[roles]
bg = "#2e3440"
bg_deep = "#222730"
surface = "#444a55"
fg = "#e5e9f0"
fg_soft = "#aeb3bb"
fg_bright = "#eceff4"
grey = "#9398a1"
grey_dim = "#6e737e"
grey_neutral = "#a5aab2"
grey_soft = "#80858f"
red = "#e06c75"
orange = "#e69c80"
yellow = "#ebcb8b"
green = "#9ec183"
aqua = "#88c0d0"
blue = "#81a1c1"
purple = "#b988b0"
tint_green = "#424d4c"
tint_red = "#4e3e4a"
statusline = "#3d424e"
