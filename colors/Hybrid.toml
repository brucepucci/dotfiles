# Hybrid
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161719"
foreground = "#b7bcba"
cursor-color = "#b7bcba"
cursor-text = "#1e1f22"
selection-background = "#1e1f22"
selection-foreground = "#b7bcba"
palette_0 = "#2a2e33"
palette_1 = "#b84d51"
palette_2 = "#b3bf5a"
palette_3 = "#e4b55e"
palette_4 = "#6e90b0"
palette_5 = "#a17eac"
palette_6 = "#7fbfb4"
palette_7 = "#b5b9b6"
palette_8 = "#434548"
palette_9 = "#8d2e32"
palette_10 = "#798431"
palette_11 = "#e58a50"
palette_12 = "#4b6b88"
palette_13 = "#6e5079"
palette_14 = "#4d7b74"
palette_15 = "#5a626a"

[roles]
bg = "#161719"
bg_deep = "#101113"
surface = "#292b2c"
fg = "#b7bcba"
fg_soft = "#878a8a"
fg_bright = "#5a626a"
grey = "#6f7272"
grey_dim = "#4e5151"
grey_neutral = "#7f8282"
grey_soft = "#5e6161"
red = "#b84d51"
orange = "#ce8158"
yellow = "#e4b55e"
green = "#b3bf5a"
aqua = "#7fbfb4"
blue = "#6e90b0"
purple = "#a17eac"
tint_green = "#323525"
tint_red = "#332123"
statusline = "#232426"
statusline_accent = "#333536"
