palette_2 = "#85981c"
palette_3 = "#b4881d"
palette_4 = "#2e8bce"
palette_5 = "#d13a82"
palette_6 = "#32a198"
palette_7 = "#b9b6af"
palette_8 = "#45484b"
palette_9 = "#bd3613"
palette_10 = "#738a04"
palette_11 = "#a57705"
palette_12 = "#2176c7"
palette_13 = "#c61c6f"
palette_14 = "#259286"
palette_15 = "#c9c6bd"

[roles]
bg = "#fcf4dc"
bg_deep = "#fdf7e5"
surface = "#e8e3cf"
fg = "#536870"
