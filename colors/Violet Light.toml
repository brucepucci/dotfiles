palette_7 = "#fcf4dc"
palette_8 = "#fcf4dc"
palette_9 = "#fcf4dc"
palette_10 = "#fcf4dc"
palette_11 = "#fcf4dc"
palette_12 = "#fcf4dc"
palette_13 = "#fcf4dc"
palette_14 = "#fcf4dc"
palette_15 = "#fcf4dc"

[roles]
