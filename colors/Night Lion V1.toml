# Night Lion V1
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#bbbbbb"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#4c4c4c"
palette_1 = "#bb0000"
palette_2 = "#5fde8f"
palette_3 = "#f3f167"
palette_4 = "#276bd8"
palette_5 = "#bb00bb"
palette_6 = "#00dadf"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#161616"
fg = "#bbbbbb"
fg_soft = "#838383"
fg_bright = "#ffffff"
grey = "#676767"
grey_dim = "#414141"
grey_neutral = "#7a7a7a"
grey_soft = "#545454"
red = "#bb0000"
orange = "#d77834"
yellow = "#f3f167"
green = "#5fde8f"
aqua = "#00dadf"
blue = "#276bd8"
purple = "#bb00bb"
tint_green = "#11281a"
tint_red = "#220000"
statusline = "#0f0f0f"
statusline_accent = "#222222"
statusline_fg = "#bbbbbb"
on_accent = "#000000"
mode_red = "#bb0000"
mode_green = "#5fde8f"
mode_yellow = "#f3f167"
mode_blue = "#276bd8"
mode_purple = "#bb00bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
