# Spacegray Eighties
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#bdbaae"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#272e35"
selection-foreground = "#ffffff"
palette_0 = "#15171c"
palette_1 = "#ec5f67"
palette_2 = "#81a764"
palette_3 = "#fec254"
palette_4 = "#5486c0"
palette_5 = "#bf83c1"
palette_6 = "#57c2c1"
palette_7 = "#efece7"
palette_8 = "#555555"
palette_9 = "#ff6973"
palette_10 = "#93d493"
palette_11 = "#ffd256"
palette_12 = "#4d84d1"
palette_13 = "#ff55ff"
palette_14 = "#83e9e4"
palette_15 = "#ffffff"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#353433"
fg = "#bdbaae"
fg_soft = "#8e8c84"
fg_bright = "#ffffff"
grey = "#77766f"
grey_dim = "#585753"
grey_neutral = "#87857d"
grey_soft = "#686661"
red = "#ec5f67"
orange = "#f5905e"
yellow = "#fec254"
green = "#81a764"
aqua = "#57c2c1"
blue = "#5486c0"
purple = "#bf83c1"
tint_green = "#333a2e"
tint_red = "#462d2e"
statusline = "#2e2e2d"
statusline_accent = "#3e3d3b"
statusline_fg = "#bdbaae"
on_accent = "#222222"
mode_red = "#ec5f67"
mode_green = "#81a764"
mode_yellow = "#fec254"
mode_blue = "#5486c0"
mode_purple = "#bf83c1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
