palette_7 = "#051f14"
palette_8 = "#051f14"
palette_9 = "#051f14"
palette_10 = "#051f14"
palette_11 = "#051f14"
palette_12 = "#051f14"
palette_13 = "#051f14"
palette_14 = "#051f14"
palette_15 = "#051f14"

