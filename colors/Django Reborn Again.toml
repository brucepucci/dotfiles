# Django Reborn Again
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#051f14"
foreground = "#dadedc"
cursor-color = "#ffcc00"
cursor-text = "#9a9e9c"
selection-background = "#203727"
selection-foreground = "#dadedc"
palette_0 = "#000000"
palette_1 = "#fd6209"
palette_2 = "#41a83e"
palette_3 = "#ffe862"
palette_4 = "#245032"
palette_5 = "#f8f8f8"
palette_6 = "#9df39f"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#ff943b"
palette_10 = "#73da70"
palette_11 = "#ffff94"
palette_12 = "#568264"
palette_13 = "#ffffff"
palette_14 = "#cfffd1"
palette_15 = "#ffffff"

[roles]
bg = "#051f14"
bg_deep = "#04170f"
surface = "#1f362c"
fg = "#dadedc"
fg_soft = "#9aa5a0"
fg_bright = "#ffffff"
grey = "#7a8882"
