# One Double Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#dbdfe5"
cursor-color = "#f5e0dc"
cursor-text = "#9aa3c1"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"
palette_0 = "#282c34"
palette_1 = "#282c34"
palette_2 = "#282c34"
palette_3 = "#282c34"
palette_4 = "#282c34"
palette_5 = "#282c34"
palette_6 = "#282c34"
palette_7 = "#282c34"
palette_8 = "#282c34"
palette_9 = "#282c34"
palette_10 = "#282c34"
palette_11 = "#282c34"
palette_12 = "#282c34"
palette_13 = "#282c34"
palette_14 = "#282c34"
palette_15 = "#282c34"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#3d4149"
fg = "#dbdfe5"
fg_soft = "#a5a9b0"
fg_bright = "#282c34"
grey = "#8a8e95"
grey_dim = "#676b72"
grey_neutral = "#9ca0a7"
grey_soft = "#797d84"
red = "#282c34"
orange = "#282c34"
yellow = "#282c34"
green = "#282c34"
aqua = "#282c34"
blue = "#282c34"
purple = "#282c34"
tint_green = "#282c34"
