# One Double Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#dbdfe5"
cursor-color = "#f5e0dc"
cursor-text = "#9aa3c1"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"
palette_0 = "#3d4452"
palette_1 = "#f16372"
palette_2 = "#8cc570"
palette_3 = "#ecbe70"
palette_4 = "#3fb1f5"
palette_5 = "#d373e3"
palette_6 = "#17b9c4"
palette_7 = "#dbdfe5"
palette_8 = "#525d6f"
palette_9 = "#ff777b"
palette_10 = "#82d882"
palette_11 = "#f5c065"
palette_12 = "#6dcaff"
palette_13 = "#ff7bf4"
palette_14 = "#00e5fb"
palette_15 = "#f7f9fc"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#3d4149"
fg = "#dbdfe5"
fg_soft = "#a5a9b0"
fg_bright = "#f7f9fc"
grey = "#8a8e95"
grey_dim = "#676b72"
grey_neutral = "#9ca0a7"
grey_soft = "#797d84"
red = "#f16372"
orange = "#ee9071"
yellow = "#ecbe70"
green = "#8cc570"
aqua = "#17b9c4"
blue = "#3fb1f5"
purple = "#d373e3"
tint_green = "#3a483f"
tint_red = "#4c363f"
statusline = "#363a42"
statusline_accent = "#484c54"
