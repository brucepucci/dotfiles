# Idea
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#202020"
foreground = "#adadad"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#44475a"
selection-foreground = "#ffffff"
palette_0 = "#adadad"
palette_1 = "#fc5256"
palette_2 = "#98b61c"
palette_3 = "#ccb444"
palette_4 = "#437ee7"
palette_5 = "#9d74b0"
palette_6 = "#248887"
palette_7 = "#4b4b4b"
palette_8 = "#ffffff"
palette_9 = "#fc7072"
palette_10 = "#98b61c"
palette_11 = "#ffff0b"
palette_12 = "#6c9ced"
palette_13 = "#fc7eff"
palette_14 = "#248887"
palette_15 = "#181818"

[roles]
bg = "#202020"
bg_deep = "#181818"
surface = "#313131"
fg = "#adadad"
fg_soft = "#838383"
fg_bright = "#181818"
grey = "#6e6e6e"
grey_dim = "#515151"
grey_neutral = "#7c7c7c"
grey_soft = "#5f5f5f"
red = "#fc5256"
orange = "#e4834d"
yellow = "#ccb444"
green = "#98b61c"
aqua = "#248887"
blue = "#437ee7"
purple = "#9d74b0"
tint_green = "#363b1f"
tint_red = "#48292a"
statusline = "#2b2b2b"
statusline_accent = "#393939"
statusline_fg = "#adadad"
on_accent = "#202020"
mode_red = "#fc5256"
mode_green = "#98b61c"
mode_yellow = "#ccb444"
mode_blue = "#437ee7"
mode_purple = "#9d74b0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
