# Mathias
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#bbbbbb"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#555555"
selection-foreground = "#f2f2f2"
palette_0 = "#000000"
palette_1 = "#e52222"
palette_2 = "#a6e32d"
palette_3 = "#fc951e"
palette_4 = "#c48dff"
palette_5 = "#fa2573"
palette_6 = "#67d9f0"
palette_7 = "#f2f2f2"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#161616"
fg = "#bbbbbb"
fg_soft = "#838383"
fg_bright = "#ffffff"
grey = "#676767"
grey_dim = "#414141"
grey_neutral = "#7a7a7a"
grey_soft = "#545454"
red = "#e52222"
orange = "#f05c20"
yellow = "#fc951e"
green = "#a6e32d"
aqua = "#67d9f0"
blue = "#c48dff"
purple = "#fa2573"
tint_green = "#1e2908"
tint_red = "#290606"
statusline = "#0f0f0f"
statusline_accent = "#222222"
statusline_fg = "#bbbbbb"
on_accent = "#000000"
mode_red = "#e52222"
mode_green = "#a6e32d"
mode_yellow = "#fc951e"
mode_blue = "#c48dff"
mode_purple = "#fa2573"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
