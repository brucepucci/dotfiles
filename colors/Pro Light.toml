# Pro Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#191919"
cursor-color = "#4d4d4d"
cursor-text = "#f2f2f2"
selection-background = "#c1ddff"
selection-foreground = "#191919"
palette_0 = "#000000"
palette_1 = "#e5492b"
palette_2 = "#50d148"
palette_3 = "#c6c440"
palette_4 = "#3b75ff"
palette_5 = "#ed66e8"
palette_6 = "#4ed2de"
palette_7 = "#c2c2c2"
palette_8 = "#9f9f9f"
palette_9 = "#ff6640"
palette_10 = "#48d53e"
palette_11 = "#bfbe23"
palette_12 = "#0082ff"
palette_13 = "#ff7eff"
palette_14 = "#3bd1d2"
palette_15 = "#f2f2f2"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e3e3e3"
fg = "#191919"
fg_soft = "#5e5e5e"
fg_bright = "#101010"
grey = "#808080"
grey_dim = "#aeaeae"
grey_neutral = "#6a6a6a"
grey_soft = "#989898"
red = "#e5492b"
orange = "#d68636"
yellow = "#c6c440"
green = "#50d148"
aqua = "#4ed2de"
blue = "#3b75ff"
purple = "#ed66e8"
tint_green = "#e0f7de"
tint_red = "#faded9"
statusline = "#ededed"
statusline_accent = "#d6d6d6"
statusline_fg = "#191919"
on_accent = "#191919"
mode_red = "#e5492b"
mode_green = "#50d148"
mode_yellow = "#c6c440"
mode_blue = "#3b75ff"
mode_purple = "#ed66e8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
