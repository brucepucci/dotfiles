# Pro Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#191919"
cursor-color = "#4d4d4d"
cursor-text = "#f2f2f2"
selection-background = "#c1ddff"
selection-foreground = "#191919"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e3e3e3"
fg = "#191919"
fg_soft = "#5e5e5e"
fg_bright = "#101010"
grey = "#808080"
grey_dim = "#aeaeae"
grey_neutral = "#6a6a6a"
grey_soft = "#989898"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
blue = "#ffffff"
purple = "#ffffff"
tint_green = "#ffffff"
tint_red = "#ffffff"
statusline = "#ededed"
