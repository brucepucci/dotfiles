# Duotone Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1d27"
foreground = "#b7a1ff"
cursor-color = "#ff9839"
cursor-text = "#1f1d27"
selection-background = "#353147"
selection-foreground = "#b7a2ff"
palette_0 = "#1f1d27"
palette_1 = "#d9393e"
palette_2 = "#2dcd73"
palette_3 = "#d9b76e"
palette_4 = "#ffc284"
palette_5 = "#de8d40"
palette_6 = "#2488ff"
palette_7 = "#b7a1ff"
palette_8 = "#4e4a60"
palette_9 = "#d9393e"
palette_10 = "#2dcd73"
palette_11 = "#d9b76e"
palette_12 = "#ffc284"
palette_13 = "#de8d40"
palette_14 = "#2488ff"
palette_15 = "#eae5ff"

[roles]
bg = "#1f1d27"
bg_deep = "#17161d"
surface = "#312d41"
fg = "#b7a1ff"
fg_soft = "#8979be"
fg_bright = "#eae5ff"
grey = "#73669e"
grey_dim = "#544b73"
grey_neutral = "#8273b3"
grey_soft = "#635888"
red = "#d9393e"
orange = "#d97856"
yellow = "#d9b76e"
green = "#2dcd73"
aqua = "#2488ff"
blue = "#ffc284"
purple = "#de8d40"
tint_green = "#223d35"
