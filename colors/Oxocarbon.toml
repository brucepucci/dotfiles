# Oxocarbon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161616"
foreground = "#f2f4f8"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#393939"
selection-foreground = "#626262"
palette_0 = "#161616"
palette_1 = "#00dfdb"
palette_2 = "#00b4ff"
palette_3 = "#ff4297"
palette_4 = "#00c15a"
palette_5 = "#c693ff"
palette_6 = "#ff74b8"
palette_7 = "#f2f4f8"
palette_8 = "#585858"
palette_9 = "#00dfdb"
palette_10 = "#00b4ff"
palette_11 = "#ff4297"
palette_12 = "#00c15a"
palette_13 = "#c693ff"
palette_14 = "#ff74b8"
palette_15 = "#f2f4f8"

[roles]
bg = "#161616"
bg_deep = "#101010"
surface = "#303131"
fg = "#f2f4f8"
fg_soft = "#b0b1b4"
fg_bright = "#f2f4f8"
grey = "#8f9092"
grey_dim = "#636465"
grey_neutral = "#a5a6a9"
grey_soft = "#797a7c"
red = "#00dfdb"
orange = "#8090b9"
yellow = "#ff4297"
green = "#00b4ff"
aqua = "#ff74b8"
blue = "#00c15a"
purple = "#c693ff"
tint_green = "#123240"
tint_red = "#123a39"
statusline = "#282828"
