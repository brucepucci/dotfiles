# Adventure Time
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1d45"
foreground = "#f8dcc0"
cursor-color = "#efbf38"
cursor-text = "#08080a"
selection-background = "#706b4e"
selection-foreground = "#f3d9c4"
palette_0 = "#050404"
palette_1 = "#bd0013"
palette_2 = "#4ab118"
palette_3 = "#e7741e"
palette_4 = "#0f4ac6"
palette_5 = "#665993"
palette_6 = "#70a598"
palette_7 = "#f8dcc0"
palette_8 = "#4e7cbf"
palette_9 = "#fc5f5a"
palette_10 = "#9eff6e"
palette_11 = "#efc11a"
palette_12 = "#1997c6"
palette_13 = "#9b5953"
palette_14 = "#c8faf4"
palette_15 = "#f6f5fb"

[roles]
bg = "#1f1d45"
bg_deep = "#171634"
surface = "#393454"
fg = "#f8dcc0"
fg_soft = "#b7a39b"
fg_bright = "#f6f5fb"
grey = "#968689"
grey_dim = "#6b6070"
grey_neutral = "#ac9995"
grey_soft = "#81737c"
red = "#bd0013"
orange = "#d23a18"
yellow = "#e7741e"
green = "#4ab118"
aqua = "#70a598"
blue = "#0f4ac6"
purple = "#665993"
tint_green = "#27383d"
