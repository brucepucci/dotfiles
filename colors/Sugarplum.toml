# Sugarplum
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#111147"
foreground = "#db7ddd"
cursor-color = "#53b397"
cursor-text = "#93f3d7"
selection-background = "#5ca8dc"
selection-foreground = "#ead8ff"
palette_0 = "#111147"
palette_1 = "#5ca8dc"
palette_2 = "#53b397"
palette_3 = "#249a84"
palette_4 = "#db7ddd"
palette_5 = "#d0beee"
palette_6 = "#f9f3f9"
palette_7 = "#a175d4"
palette_8 = "#44447a"
palette_9 = "#5cb5dc"
palette_10 = "#52deb5"
palette_11 = "#01f5c7"
palette_12 = "#fa5dfd"
palette_13 = "#c6a5fd"
palette_14 = "#ffffff"
palette_15 = "#b577fd"

[roles]
bg = "#111147"
bg_deep = "#0d0d35"
surface = "#291e59"
fg = "#db7ddd"
fg_soft = "#9e5db0"
fg_bright = "#b577fd"
grey = "#804c9a"
grey_dim = "#58377c"
grey_neutral = "#9457a8"
grey_soft = "#6c428a"
red = "#5ca8dc"
