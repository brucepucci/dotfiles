# Cyberpunk
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#332a57"
foreground = "#e5e5e5"
cursor-color = "#21f6bc"
cursor-text = "#999999"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff7092"
palette_2 = "#00fbac"
palette_3 = "#fffa6a"
palette_4 = "#00bfff"
palette_5 = "#df95ff"
palette_6 = "#86cbfe"
palette_7 = "#ffffff"
palette_8 = "#595959"
palette_9 = "#ff8aa4"
palette_10 = "#21f6bc"
palette_11 = "#fff787"
palette_12 = "#1bccfd"
palette_13 = "#e6aefe"
palette_14 = "#99d6fc"
palette_15 = "#ffffff"

[roles]
bg = "#332a57"
bg_deep = "#262041"
surface = "#484068"
fg = "#e5e5e5"
fg_soft = "#b0adba"
fg_bright = "#ffffff"
grey = "#9591a5"
grey_dim = "#716b89"
grey_neutral = "#a7a4b3"
grey_soft = "#837e97"
red = "#ff7092"
orange = "#ffb57e"
yellow = "#fffa6a"
green = "#00fbac"
aqua = "#86cbfe"
blue = "#00bfff"
purple = "#df95ff"
tint_green = "#2a5066"
tint_red = "#583762"
statusline = "#413962"
statusline_accent = "#534c71"
statusline_fg = "#e5e5e5"
on_accent = "#332a57"
mode_red = "#ff7092"
mode_green = "#00fbac"
