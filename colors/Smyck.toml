# Smyck
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1b1b"
foreground = "#f7f7f7"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#207483"
selection-foreground = "#f7f7f7"
palette_0 = "#000000"
palette_1 = "#b84131"
palette_2 = "#7da900"
palette_3 = "#c4a500"
palette_4 = "#62a3c4"
palette_5 = "#ba8acc"
palette_6 = "#207383"
palette_7 = "#a1a1a1"
palette_8 = "#7a7a7a"
palette_9 = "#d6837c"
palette_10 = "#c4f137"
palette_11 = "#fee14d"
palette_12 = "#8dcff0"
palette_13 = "#f79aff"
palette_14 = "#6ad9cf"
palette_15 = "#f7f7f7"

[roles]
bg = "#1b1b1b"
bg_deep = "#141414"
surface = "#353535"
fg = "#f7f7f7"
fg_soft = "#b5b5b5"
fg_bright = "#f7f7f7"
grey = "#949494"
grey_dim = "#686868"
grey_neutral = "#aaaaaa"
grey_soft = "#7e7e7e"
red = "#b84131"
orange = "#be7318"
yellow = "#c4a500"
green = "#7da900"
aqua = "#207383"
blue = "#62a3c4"
purple = "#ba8acc"
tint_green = "#2d3516"
tint_red = "#37221f"
statusline = "#2d2d2d"
statusline_accent = "#434343"
statusline_fg = "#f7f7f7"
on_accent = "#1b1b1b"
mode_red = "#b84131"
mode_green = "#7da900"
mode_yellow = "#c4a500"
mode_blue = "#62a3c4"
mode_purple = "#ba8acc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
