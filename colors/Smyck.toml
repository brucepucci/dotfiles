palette_4 = "#1b1b1b"
palette_5 = "#1b1b1b"
palette_6 = "#1b1b1b"
palette_7 = "#1b1b1b"
palette_8 = "#1b1b1b"
palette_9 = "#1b1b1b"
palette_10 = "#1b1b1b"
palette_11 = "#1b1b1b"
palette_12 = "#1b1b1b"
palette_13 = "#1b1b1b"
palette_14 = "#1b1b1b"
palette_15 = "#1b1b1b"

[roles]
bg = "#1b1b1b"
bg_deep = "#141414"
