# Terminal Basic Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1e1d"
foreground = "#ffffff"
cursor-color = "#9d9d9d"
cursor-text = "#1d1e1d"
selection-background = "#3f638a"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#c65339"
palette_2 = "#6ac44b"
palette_3 = "#b8b74a"
palette_4 = "#6444ed"
palette_5 = "#d357db"
palette_6 = "#69c1cf"
palette_7 = "#d1d1d1"
palette_8 = "#909090"
palette_9 = "#eb5a3a"
palette_10 = "#77ea51"
palette_11 = "#efef53"
palette_12 = "#d09af9"
palette_13 = "#eb5af7"
palette_14 = "#78f1f2"
palette_15 = "#ededed"

[roles]
bg = "#1d1e1d"
bg_deep = "#161616"
surface = "#383938"
fg = "#ffffff"
fg_soft = "#bbbcbb"
fg_bright = "#ededed"
grey = "#999a99"
grey_dim = "#6c6d6c"
grey_neutral = "#b0b0b0"
grey_soft = "#838383"
red = "#c65339"
orange = "#bf8542"
yellow = "#b8b74a"
green = "#6ac44b"
aqua = "#69c1cf"
blue = "#6444ed"
purple = "#d357db"
tint_green = "#2b3c25"
tint_red = "#3b2822"
statusline = "#2f302f"
statusline_accent = "#464646"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#c65339"
mode_green = "#6ac44b"
mode_yellow = "#b8b74a"
mode_blue = "#6444ed"
mode_purple = "#d357db"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
