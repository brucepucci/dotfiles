# Terminal Basic Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1e1d"
foreground = "#ffffff"
cursor-color = "#9d9d9d"
cursor-text = "#1d1e1d"
selection-background = "#3f638a"
selection-foreground = "#ffffff"
palette_0 = "#1d1e1d"
palette_1 = "#1d1e1d"
palette_2 = "#1d1e1d"
palette_3 = "#1d1e1d"
palette_4 = "#1d1e1d"
palette_5 = "#1d1e1d"
palette_6 = "#1d1e1d"
palette_7 = "#1d1e1d"
palette_8 = "#1d1e1d"
palette_9 = "#1d1e1d"
palette_10 = "#1d1e1d"
palette_11 = "#1d1e1d"
palette_12 = "#1d1e1d"
palette_13 = "#1d1e1d"
palette_14 = "#1d1e1d"
palette_15 = "#1d1e1d"

[roles]
bg = "#1d1e1d"
bg_deep = "#161616"
surface = "#383938"
fg = "#ffffff"
fg_soft = "#bbbcbb"
fg_bright = "#1d1e1d"
grey = "#999a99"
grey_dim = "#6c6d6c"
grey_neutral = "#b0b0b0"
grey_soft = "#838383"
red = "#1d1e1d"
orange = "#1d1e1d"
yellow = "#1d1e1d"
green = "#1d1e1d"
aqua = "#1d1e1d"
blue = "#1d1e1d"
purple = "#1d1e1d"
tint_green = "#1d1e1d"
tint_red = "#1d1e1d"
statusline = "#2f302f"
statusline_accent = "#464646"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#1d1e1d"
mode_green = "#1d1e1d"
mode_yellow = "#1d1e1d"
mode_blue = "#1d1e1d"
mode_purple = "#1d1e1d"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
