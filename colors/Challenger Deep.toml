# Challenger Deep
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1c31"
foreground = "#cbe1e7"
cursor-color = "#fbfcfc"
cursor-text = "#ff271d"
selection-background = "#cbe1e7"
selection-foreground = "#1e1c31"
palette_0 = "#141228"
palette_1 = "#ff5458"
palette_2 = "#62d196"
palette_3 = "#ffb378"
palette_4 = "#65b2ff"
palette_5 = "#906cff"
palette_6 = "#63f2f1"
palette_7 = "#a6b3cc"
palette_8 = "#565575"
palette_9 = "#ff8080"
palette_10 = "#95ffa4"
palette_11 = "#ffe9aa"
palette_12 = "#91ddff"
palette_13 = "#c991e1"
palette_14 = "#aaffe4"
palette_15 = "#cbe3e7"

[roles]
bg = "#1e1c31"
bg_deep = "#161525"
surface = "#333447"
fg = "#cbe1e7"
fg_soft = "#97a6b0"
fg_bright = "#cbe3e7"
grey = "#7d8895"
grey_dim = "#5b6171"
grey_neutral = "#8e9ca7"
