# iTerm2 Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#e5e5e5"
cursor-text = "#000000"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c91b00"
palette_2 = "#00c200"
palette_3 = "#c7c400"
palette_4 = "#2225c4"
palette_5 = "#ca30c7"
palette_6 = "#00c5c7"
palette_7 = "#ffffff"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#5ffa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#ff77ff"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#ffffff"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#c91b00"
orange = "#c87000"
yellow = "#c7c400"
green = "#00c200"
aqua = "#00c5c7"
blue = "#2225c4"
purple = "#ca30c7"
tint_green = "#002300"
tint_red = "#240500"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#c91b00"
mode_green = "#00c200"
mode_yellow = "#c7c400"
mode_blue = "#2225c4"
mode_purple = "#ca30c7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
