# Firewatch
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e2027"
foreground = "#9ba2b2"
cursor-color = "#f6f7ec"
cursor-text = "#b7b8a8"
selection-background = "#2f363e"
selection-foreground = "#7d8fa4"
palette_0 = "#585f6d"
palette_1 = "#d95360"
palette_2 = "#5ab977"
palette_3 = "#dfb563"
palette_4 = "#4d89c4"
palette_5 = "#d55119"
palette_6 = "#44a8b6"
palette_7 = "#e6e5ff"
palette_8 = "#585f6d"
palette_9 = "#d95360"
palette_10 = "#5ab977"
palette_11 = "#dfb563"
palette_12 = "#4c89c5"
palette_13 = "#d55119"
palette_14 = "#44a8b6"
palette_15 = "#e6e5ff"

[roles]
bg = "#1e2027"
bg_deep = "#16181d"
surface = "#2d3038"
fg = "#9ba2b2"
fg_soft = "#767b88"
fg_bright = "#e6e5ff"
grey = "#636873"
grey_dim = "#4a4e58"
grey_neutral = "#6f7481"
grey_soft = "#565a66"
red = "#d95360"
orange = "#dc8462"
yellow = "#dfb563"
green = "#5ab977"
aqua = "#44a8b6"
blue = "#4d89c4"
purple = "#d55119"
tint_green = "#293c35"
tint_red = "#402931"
statusline = "#282a32"
