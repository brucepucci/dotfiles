palette_7 = "#1e2027"
palette_8 = "#1e2027"
palette_9 = "#1e2027"
palette_10 = "#1e2027"
palette_11 = "#1e2027"
palette_12 = "#1e2027"
palette_13 = "#1e2027"
palette_14 = "#1e2027"
palette_15 = "#1e2027"

[roles]
