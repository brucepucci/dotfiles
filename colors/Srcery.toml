palette_2 = "#519f50"
palette_3 = "#fbb829"
palette_4 = "#2c78bf"
palette_5 = "#e02c6d"
palette_6 = "#0aaeb3"
palette_7 = "#baa67f"
palette_8 = "#918175"
palette_9 = "#f75341"
palette_10 = "#98bc37"
palette_11 = "#fed06e"
palette_12 = "#68a8e4"
palette_13 = "#ff5c8f"
palette_14 = "#2be4d0"
palette_15 = "#fce8c3"

[roles]
