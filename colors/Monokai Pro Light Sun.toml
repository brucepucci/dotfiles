# Monokai Pro Light Sun
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f8efe7"
foreground = "#2c232e"
cursor-color = "#72696d"
cursor-text = "#a59ca0"
selection-background = "#beb5b3"
selection-foreground = "#2c232e"
palette_0 = "#f8efe7"
palette_1 = "#ce4770"
palette_2 = "#218871"
palette_3 = "#b16803"
palette_4 = "#d4572b"
palette_5 = "#6851a2"
palette_6 = "#2473b6"
palette_7 = "#2c232e"
palette_8 = "#a59c9c"
palette_9 = "#ce4770"
palette_10 = "#218871"
palette_11 = "#b16803"
palette_12 = "#d4572b"
palette_13 = "#6851a2"
palette_14 = "#2473b6"
palette_15 = "#2c232e"

[roles]
bg = "#f8efe7"
bg_deep = "#faf3ed"
surface = "#e0d7d1"
fg = "#2c232e"
fg_soft = "#696066"
fg_bright = "#1d171e"
grey = "#887f81"
