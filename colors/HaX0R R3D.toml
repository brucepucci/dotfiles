palette_7 = "#200101"
palette_8 = "#200101"
palette_9 = "#200101"
palette_10 = "#200101"
palette_11 = "#200101"
palette_12 = "#200101"
palette_13 = "#200101"
palette_14 = "#200101"
palette_15 = "#200101"

[roles]
