palette_3 = "#b00d0d"
palette_4 = "#b00d0d"
palette_5 = "#b00d0d"
palette_6 = "#b00d0d"
palette_7 = "#fafafa"
palette_8 = "#554040"
palette_9 = "#ff1111"
palette_10 = "#ff1010"
palette_11 = "#ff1010"
palette_12 = "#ff1010"
palette_13 = "#ff1010"
palette_14 = "#ff1010"
palette_15 = "#fefefe"

[roles]
bg = "#200101"
bg_deep = "#180101"
surface = "#310303"
fg = "#b10e0e"
