# Kanso Pearl
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f2f1ef"
foreground = "#22262d"
cursor-color = "#22262d"
cursor-text = "#f2f1ef"
selection-background = "#e2e1df"
selection-foreground = "#22262d"
palette_0 = "#22262d"
palette_1 = "#c84053"
palette_2 = "#6f894e"
palette_3 = "#77713f"
palette_4 = "#4d699b"
palette_5 = "#b35b79"
palette_6 = "#597b75"
palette_7 = "#545464"
palette_8 = "#6d6f6e"
palette_9 = "#d7474b"
palette_10 = "#6e915f"
palette_11 = "#836f4a"
palette_12 = "#6693bf"
palette_13 = "#624c83"
palette_14 = "#5e857a"
palette_15 = "#43436c"

[roles]
bg = "#f2f1ef"
bg_deep = "#f5f4f3"
surface = "#d9d9d8"
fg = "#22262d"
fg_soft = "#606367"
fg_bright = "#16191d"
grey = "#808184"
grey_dim = "#a9aaab"
grey_neutral = "#6b6d71"
grey_soft = "#949698"
red = "#c84053"
orange = "#a05849"
yellow = "#77713f"
green = "#6f894e"
aqua = "#597b75"
blue = "#4d699b"
purple = "#b35b79"
tint_green = "#daded2"
tint_red = "#ead1d3"
statusline = "#e1e1df"
statusline_accent = "#cdcccc"
statusline_fg = "#22262d"
on_accent = "#f2f1ef"
mode_red = "#c84053"
mode_green = "#6f894e"
mode_yellow = "#77713f"
mode_blue = "#4d699b"
mode_purple = "#b35b79"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
