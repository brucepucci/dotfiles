palette_2 = "#f2f1ef"
palette_3 = "#f2f1ef"
palette_4 = "#f2f1ef"
palette_5 = "#f2f1ef"
palette_6 = "#f2f1ef"
palette_7 = "#f2f1ef"
palette_8 = "#f2f1ef"
palette_9 = "#f2f1ef"
palette_10 = "#f2f1ef"
palette_11 = "#f2f1ef"
palette_12 = "#f2f1ef"
palette_13 = "#f2f1ef"
palette_14 = "#f2f1ef"
palette_15 = "#f2f1ef"

[roles]
bg = "#f2f1ef"
bg_deep = "#f5f4f3"
surface = "#d9d9d8"
fg = "#22262d"
fg_soft = "#606367"
fg_bright = "#16191d"
grey = "#808184"
