palette_8 = "#6c6f85"
palette_9 = "#de293e"
palette_10 = "#49af3d"
palette_11 = "#eea02d"
palette_12 = "#456eff"
palette_13 = "#fe85d8"
palette_14 = "#2d9fa8"
