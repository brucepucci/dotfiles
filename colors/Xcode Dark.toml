palette_7 = "#292a30"
palette_8 = "#292a30"
palette_9 = "#292a30"
palette_10 = "#292a30"
palette_11 = "#292a30"
palette_12 = "#292a30"
palette_13 = "#292a30"
palette_14 = "#292a30"
palette_15 = "#292a30"

