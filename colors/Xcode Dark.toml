# Xcode Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#292a30"
foreground = "#dfdfe0"
cursor-color = "#dfdfe0"
cursor-text = "#292a30"
selection-background = "#414453"
selection-foreground = "#dfdfe0"
palette_0 = "#414453"
palette_1 = "#ff8170"
palette_2 = "#78c2b3"
palette_3 = "#d9c97c"
palette_4 = "#4eb0cc"
palette_5 = "#ff7ab2"
palette_6 = "#b281eb"
palette_7 = "#dfdfe0"
palette_8 = "#7f8c98"
palette_9 = "#ff8170"
palette_10 = "#acf2e4"
palette_11 = "#ffa14f"
palette_12 = "#6bdfff"
palette_13 = "#ff7ab2"
palette_14 = "#dabaff"
palette_15 = "#dfdfe0"

[roles]
bg = "#292a30"
bg_deep = "#1f2024"
surface = "#3f4045"
fg = "#dfdfe0"
fg_soft = "#a8a9ab"
fg_bright = "#dfdfe0"
grey = "#8d8e91"
grey_dim = "#69696e"
grey_neutral = "#9fa0a2"
grey_soft = "#7b7b7f"
red = "#ff8170"
orange = "#eca576"
yellow = "#d9c97c"
green = "#78c2b3"
aqua = "#b281eb"
blue = "#4eb0cc"
purple = "#ff7ab2"
tint_green = "#374548"
tint_red = "#503a3c"
statusline = "#38383e"
