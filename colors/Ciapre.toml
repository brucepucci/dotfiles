palette_2 = "#48513b"
palette_3 = "#cc8b3f"
palette_4 = "#576d8c"
palette_5 = "#724d7c"
palette_6 = "#5c4f4b"
palette_7 = "#aea47f"
palette_8 = "#555555"
palette_9 = "#ac3835"
palette_10 = "#a6a75d"
palette_11 = "#dcdf7c"
palette_12 = "#3097c6"
palette_13 = "#d33061"
palette_14 = "#f3dbb2"
palette_15 = "#f4f4f4"

[roles]
bg = "#191c27"
bg_deep = "#13151d"
surface = "#2b2c31"
fg = "#aea47a"
