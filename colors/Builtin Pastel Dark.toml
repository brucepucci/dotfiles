# Builtin Pastel Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#bbbbbb"
cursor-color = "#ffa560"
cursor-text = "#ffffff"
selection-background = "#363983"
selection-foreground = "#f2f2f2"
palette_0 = "#4f4f4f"
palette_1 = "#ff6c60"
palette_2 = "#a8ff60"
palette_3 = "#ffffb6"
palette_4 = "#96cbfe"
palette_5 = "#ff73fd"
palette_6 = "#c6c5fe"
palette_7 = "#eeeeee"
palette_8 = "#7c7c7c"
palette_9 = "#ffb6b0"
palette_10 = "#ceffac"
palette_11 = "#ffffcc"
palette_12 = "#b5dcff"
palette_13 = "#ff9cfe"
palette_14 = "#dfdffe"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#161616"
fg = "#bbbbbb"
fg_soft = "#838383"
fg_bright = "#ffffff"
grey = "#676767"
grey_dim = "#414141"
grey_neutral = "#7a7a7a"
grey_soft = "#545454"
red = "#ff6c60"
orange = "#ffb68b"
yellow = "#ffffb6"
green = "#a8ff60"
aqua = "#c6c5fe"
blue = "#96cbfe"
purple = "#ff73fd"
tint_green = "#1e2e11"
tint_red = "#2e1311"
statusline = "#0f0f0f"
statusline_accent = "#222222"
statusline_fg = "#bbbbbb"
on_accent = "#000000"
mode_red = "#ff6c60"
mode_green = "#a8ff60"
mode_yellow = "#ffffb6"
mode_blue = "#96cbfe"
mode_purple = "#ff73fd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
