# Arthur
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1c1c"
foreground = "#ddeedd"
cursor-color = "#e2bbef"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#3d352a"
palette_1 = "#cd5c5c"
palette_2 = "#86af80"
palette_3 = "#e8ae5b"
palette_4 = "#6495ed"
palette_5 = "#deb887"
palette_6 = "#b0c4de"
palette_7 = "#bbaa99"
palette_8 = "#554444"
palette_9 = "#cc5533"
palette_10 = "#88aa22"
palette_11 = "#ffa75d"
palette_12 = "#87ceeb"
palette_13 = "#996600"
palette_14 = "#b0c4de"
palette_15 = "#ddccbb"

[roles]
bg = "#1c1c1c"
bg_deep = "#151515"
surface = "#333533"
fg = "#ddeedd"
fg_soft = "#a3afa3"
fg_bright = "#ddccbb"
grey = "#869086"
grey_dim = "#606660"
grey_neutral = "#99a499"
grey_soft = "#737a73"
red = "#cd5c5c"
orange = "#da855c"
yellow = "#e8ae5b"
green = "#86af80"
aqua = "#b0c4de"
blue = "#6495ed"
purple = "#deb887"
tint_green = "#2f362e"
tint_red = "#3c2828"
statusline = "#2b2d2b"
statusline_accent = "#3f423f"
statusline_fg = "#ddeedd"
on_accent = "#1c1c1c"
mode_red = "#cd5c5c"
