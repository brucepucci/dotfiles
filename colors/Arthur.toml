palette_2 = "#1c1c1c"
palette_3 = "#1c1c1c"
palette_4 = "#1c1c1c"
palette_5 = "#1c1c1c"
palette_6 = "#1c1c1c"
palette_7 = "#1c1c1c"
palette_8 = "#1c1c1c"
palette_9 = "#1c1c1c"
palette_10 = "#1c1c1c"
palette_11 = "#1c1c1c"
palette_12 = "#1c1c1c"
palette_13 = "#1c1c1c"
palette_14 = "#1c1c1c"
palette_15 = "#1c1c1c"

[roles]
bg = "#1c1c1c"
