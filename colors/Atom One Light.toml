# Atom One Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f9f9f9"
foreground = "#2a2c33"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#ededed"
selection-foreground = "#2a2c33"
palette_0 = "#000000"
palette_1 = "#de3e35"
palette_2 = "#3f953a"
palette_3 = "#d2b67c"
palette_4 = "#2f5af3"
palette_5 = "#950095"
palette_6 = "#3f953a"
palette_7 = "#bbbbbb"
palette_8 = "#000000"
palette_9 = "#de3e35"
palette_10 = "#3f953a"
palette_11 = "#d2b67c"
palette_12 = "#2f5af3"
palette_13 = "#a00095"
palette_14 = "#3f953a"
palette_15 = "#ffffff"

[roles]
bg = "#f9f9f9"
bg_deep = "#fafafa"
surface = "#e0e0e1"
fg = "#2a2c33"
fg_soft = "#686a6e"
fg_bright = "#1b1d21"
grey = "#87888c"
grey_dim = "#b1b1b4"
grey_neutral = "#727478"
grey_soft = "#9c9da0"
red = "#de3e35"
orange = "#d87a58"
yellow = "#d2b67c"
green = "#3f953a"
aqua = "#3f953a"
blue = "#2f5af3"
purple = "#950095"
tint_green = "#d8e7d7"
tint_red = "#f4d7d6"
statusline = "#e8e9e9"
