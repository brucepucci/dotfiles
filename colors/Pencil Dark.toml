# Pencil Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#f1f1f1"
cursor-color = "#20bbfc"
cursor-text = "#f1f1f1"
selection-background = "#b6d6fd"
selection-foreground = "#989898"
palette_0 = "#212121"
palette_1 = "#c30771"
palette_2 = "#10a778"
palette_3 = "#a89c14"
palette_4 = "#008ec4"
palette_5 = "#5f4986"
palette_6 = "#20a5ba"
palette_7 = "#d9d9d9"
palette_8 = "#4f4f4f"
palette_9 = "#fb007a"
palette_10 = "#5fd7af"
palette_11 = "#f3e430"
palette_12 = "#20bbfc"
palette_13 = "#6855de"
palette_14 = "#4fb8cc"
palette_15 = "#f1f1f1"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#3a3a3a"
fg = "#f1f1f1"
fg_soft = "#b3b3b3"
fg_bright = "#f1f1f1"
grey = "#939393"
grey_dim = "#6a6a6a"
grey_neutral = "#a8a8a8"
grey_soft = "#7f7f7f"
red = "#c30771"
orange = "#b65242"
yellow = "#a89c14"
green = "#10a778"
aqua = "#20a5ba"
blue = "#008ec4"
purple = "#5f4986"
tint_green = "#1e3931"
tint_red = "#3e1c2f"
statusline = "#323232"
statusline_accent = "#464646"
statusline_fg = "#f1f1f1"
