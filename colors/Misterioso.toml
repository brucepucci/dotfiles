# Misterioso
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2d3743"
foreground = "#e1e1e0"
cursor-color = "#666666"
cursor-text = "#ffffff"
selection-background = "#2d37ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff4242"
palette_2 = "#74af68"
palette_3 = "#ffad29"
palette_4 = "#338f86"
palette_5 = "#9414e6"
palette_6 = "#23d7d7"
palette_7 = "#e1e1e0"
palette_8 = "#626262"
palette_9 = "#ff3242"
palette_10 = "#74cd68"
palette_11 = "#ffb929"
palette_12 = "#23d7d7"
palette_13 = "#ff37ff"
palette_14 = "#00ede1"
palette_15 = "#ffffff"

[roles]
bg = "#2d3743"
bg_deep = "#222932"
surface = "#434b56"
fg = "#e1e1e0"
fg_soft = "#abaeb1"
fg_bright = "#ffffff"
grey = "#909499"
grey_dim = "#6c727a"
grey_neutral = "#a2a6a9"
grey_soft = "#7e848a"
red = "#ff4242"
orange = "#ff7836"
yellow = "#ffad29"
green = "#74af68"
aqua = "#23d7d7"
blue = "#338f86"
purple = "#9414e6"
tint_green = "#3a4d4a"
tint_red = "#533943"
statusline = "#3b4550"
