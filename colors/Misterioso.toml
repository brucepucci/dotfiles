palette_7 = "#2d3743"
palette_8 = "#2d3743"
palette_9 = "#2d3743"
palette_10 = "#2d3743"
palette_11 = "#2d3743"
palette_12 = "#2d3743"
palette_13 = "#2d3743"
palette_14 = "#2d3743"
palette_15 = "#2d3743"

