# Phala Green Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c1fc03"
cursor-color = "#c1fc03"
cursor-text = "#ff271d"
selection-background = "#014804"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ab1500"
palette_2 = "#00b100"
palette_3 = "#a9a700"
palette_4 = "#0223c0"
palette_5 = "#c22ec0"
palette_6 = "#00b4c0"
palette_7 = "#cbcbcb"
palette_8 = "#797979"
palette_9 = "#ed2200"
palette_10 = "#00db00"
palette_11 = "#eae700"
palette_12 = "#0433ff"
palette_13 = "#ed3aea"
palette_14 = "#00e8ea"
palette_15 = "#eaeaea"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#171e00"
fg = "#c1fc03"
fg_soft = "#87b002"
fg_bright = "#eaeaea"
grey = "#6a8b02"
grey_dim = "#445801"
grey_neutral = "#7da402"
grey_soft = "#577101"
red = "#ab1500"
orange = "#aa5e00"
yellow = "#a9a700"
green = "#00b100"
aqua = "#00b4c0"
blue = "#0223c0"
purple = "#c22ec0"
tint_green = "#002000"
tint_red = "#1f0400"
statusline = "#0f1400"
statusline_accent = "#232d01"
statusline_fg = "#c1fc03"
on_accent = "#c1fc03"
mode_red = "#ab1500"
mode_green = "#00b100"
mode_yellow = "#a9a700"
mode_blue = "#0223c0"
mode_purple = "#c22ec0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
