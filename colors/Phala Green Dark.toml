# Phala Green Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c1fc03"
cursor-color = "#c1fc03"
cursor-text = "#ff271d"
selection-background = "#014804"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#000000"
palette_2 = "#000000"
palette_3 = "#000000"
palette_4 = "#000000"
palette_5 = "#000000"
palette_6 = "#000000"
palette_7 = "#000000"
palette_8 = "#000000"
palette_9 = "#000000"
palette_10 = "#000000"
palette_11 = "#000000"
palette_12 = "#000000"
palette_13 = "#000000"
palette_14 = "#000000"
palette_15 = "#000000"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#171e00"
fg = "#c1fc03"
fg_soft = "#87b002"
fg_bright = "#000000"
grey = "#6a8b02"
grey_dim = "#445801"
grey_neutral = "#7da402"
grey_soft = "#577101"
red = "#000000"
