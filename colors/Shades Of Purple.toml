# Shades Of Purple
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1d40"
foreground = "#ffffff"
cursor-color = "#fad000"
cursor-text = "#98998e"
selection-background = "#b362ff"
selection-foreground = "#c2c2c2"
palette_0 = "#000000"
palette_1 = "#d90429"
palette_2 = "#3ad900"
palette_3 = "#ffe700"
palette_4 = "#6943ff"
palette_5 = "#ff2c70"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#f92a1c"
palette_10 = "#43d426"
palette_11 = "#f1d000"
palette_12 = "#6871ff"
palette_13 = "#ff77ff"
palette_14 = "#79e8fb"
palette_15 = "#ffffff"

[roles]
bg = "#1e1d40"
bg_deep = "#161630"
surface = "#393857"
fg = "#ffffff"
fg_soft = "#bcbbc6"
fg_bright = "#ffffff"
grey = "#9a99a9"
grey_dim = "#6d6c83"
grey_neutral = "#b0b0bc"
grey_soft = "#838396"
red = "#d90429"
orange = "#ec7614"
yellow = "#ffe700"
green = "#3ad900"
aqua = "#00c5c7"
blue = "#6943ff"
purple = "#ff2c70"
tint_green = "#233f34"
tint_red = "#40183c"
statusline = "#302f4f"
statusline_accent = "#464662"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#d90429"
mode_green = "#3ad900"
mode_yellow = "#ffe700"
mode_blue = "#6943ff"
mode_purple = "#ff2c70"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
