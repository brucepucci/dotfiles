# Kitty Low Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#333333"
foreground = "#ffffff"
cursor-color = "#cccccc"
cursor-text = "#111111"
selection-background = "#fffacd"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0403"
palette_2 = "#19cb00"
palette_3 = "#cecb00"
palette_4 = "#0d73cc"
palette_5 = "#cb1ed1"
palette_6 = "#0dcdcd"
palette_7 = "#dddddd"
palette_8 = "#767676"
palette_9 = "#f2201f"
palette_10 = "#23fd00"
palette_11 = "#fffd00"
palette_12 = "#1a8fff"
palette_13 = "#fd28ff"
palette_14 = "#14ffff"
palette_15 = "#ffffff"

[roles]
bg = "#333333"
bg_deep = "#262626"
surface = "#4b4b4b"
fg = "#ffffff"
fg_soft = "#c2c2c2"
fg_bright = "#ffffff"
grey = "#a3a3a3"
grey_dim = "#7a7a7a"
grey_neutral = "#b8b8b8"
grey_soft = "#8f8f8f"
red = "#cc0403"
orange = "#cd6802"
yellow = "#cecb00"
green = "#19cb00"
aqua = "#0dcdcd"
blue = "#0d73cc"
purple = "#cb1ed1"
tint_green = "#2e4e2a"
tint_red = "#4f2b2a"
statusline = "#434343"
statusline_accent = "#585858"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#cc0403"
mode_green = "#19cb00"
mode_yellow = "#cecb00"
mode_blue = "#0d73cc"
mode_purple = "#cb1ed1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
