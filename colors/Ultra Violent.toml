# Ultra Violent
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#242728"
foreground = "#c1c1c1"
cursor-color = "#c1c1c1"
cursor-text = "#ffffff"
selection-background = "#574c49"
selection-foreground = "#c3c7cb"
palette_0 = "#242728"
palette_1 = "#ff0090"
palette_2 = "#b6ff00"
palette_3 = "#fff727"
palette_4 = "#47e0fb"
palette_5 = "#d731ff"
palette_6 = "#0effbb"
palette_7 = "#e1e1e1"
palette_8 = "#636667"
palette_9 = "#fb58b4"
palette_10 = "#deff8c"
palette_11 = "#ebe087"
palette_12 = "#7fecff"
palette_13 = "#e681ff"
palette_14 = "#69fcd3"
palette_15 = "#f9f9f5"

[roles]
bg = "#242728"
bg_deep = "#1b1d1e"
surface = "#37393a"
fg = "#c1c1c1"
fg_soft = "#929393"
fg_bright = "#f9f9f5"
grey = "#7a7c7c"
grey_dim = "#5b5d5e"
grey_neutral = "#8a8b8b"
grey_soft = "#6b6c6d"
red = "#ff0090"
orange = "#ff7c5c"
yellow = "#fff727"
green = "#b6ff00"
aqua = "#0effbb"
blue = "#47e0fb"
purple = "#d731ff"
tint_green = "#3e4e21"
tint_red = "#4b203b"
statusline = "#313334"
