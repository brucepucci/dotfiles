# Man Page
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fef49c"
foreground = "#000000"
cursor-color = "#7f7f7f"
cursor-text = "#000000"
selection-background = "#a4c9cd"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0000"
palette_2 = "#00a600"
palette_3 = "#999900"
palette_4 = "#0000b2"
palette_5 = "#b200b2"
palette_6 = "#00a6b2"
palette_7 = "#b2b2b2"
palette_8 = "#666666"
palette_9 = "#e50000"
palette_10 = "#00cc00"
palette_11 = "#bfbf00"
palette_12 = "#0000ff"
palette_13 = "#e500e5"
palette_14 = "#00cbcb"
palette_15 = "#e5e5e5"

[roles]
bg = "#fef49c"
bg_deep = "#fef7b5"
surface = "#e0d789"
fg = "#000000"
fg_soft = "#4c492f"
fg_bright = "#000000"
grey = "#726e46"
