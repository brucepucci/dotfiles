# IC Green PPL
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c2c2c"
foreground = "#e0f1dc"
cursor-color = "#47fa6b"
cursor-text = "#292929"
selection-background = "#116b41"
selection-foreground = "#e0f1dc"
palette_0 = "#2c2c2c"
palette_1 = "#2c2c2c"
palette_2 = "#2c2c2c"
palette_3 = "#2c2c2c"
palette_4 = "#2c2c2c"
palette_5 = "#2c2c2c"
palette_6 = "#2c2c2c"
palette_7 = "#2c2c2c"
palette_8 = "#2c2c2c"
palette_9 = "#2c2c2c"
palette_10 = "#2c2c2c"
palette_11 = "#2c2c2c"
palette_12 = "#2c2c2c"
palette_13 = "#2c2c2c"
palette_14 = "#2c2c2c"
palette_15 = "#2c2c2c"

[roles]
bg = "#2c2c2c"
bg_deep = "#212121"
surface = "#424441"
fg = "#e0f1dc"
fg_soft = "#aab6a7"
fg_bright = "#2c2c2c"
grey = "#8f988d"
grey_dim = "#6b716a"
grey_neutral = "#a1ac9e"
