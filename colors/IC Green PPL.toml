# IC Green PPL
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c2c2c"
foreground = "#e0f1dc"
cursor-color = "#47fa6b"
cursor-text = "#292929"
selection-background = "#116b41"
selection-foreground = "#e0f1dc"
palette_0 = "#014401"
palette_1 = "#ff2736"
palette_2 = "#41a638"
palette_3 = "#76a831"
palette_4 = "#2ec3b9"
palette_5 = "#50a096"
palette_6 = "#3ca078"
palette_7 = "#e6fef2"
palette_8 = "#106910"
palette_9 = "#b4fa5c"
palette_10 = "#aefb86"
palette_11 = "#dafa87"
palette_12 = "#2efaeb"
palette_13 = "#50fafa"
palette_14 = "#3cfac8"
palette_15 = "#e0f1dc"

[roles]
bg = "#2c2c2c"
bg_deep = "#212121"
surface = "#424441"
fg = "#e0f1dc"
fg_soft = "#aab6a7"
fg_bright = "#e0f1dc"
grey = "#8f988d"
grey_dim = "#6b716a"
grey_neutral = "#a1ac9e"
grey_soft = "#7d857b"
red = "#ff2736"
orange = "#ba6834"
yellow = "#76a831"
green = "#41a638"
aqua = "#3ca078"
blue = "#2ec3b9"
purple = "#50a096"
tint_green = "#30422e"
tint_red = "#522b2e"
statusline = "#3a3c3a"
statusline_accent = "#4c4f4c"
statusline_fg = "#e0f1dc"
on_accent = "#e0f1dc"
mode_red = "#ff2736"
mode_green = "#41a638"
mode_yellow = "#76a831"
mode_blue = "#2ec3b9"
mode_purple = "#50a096"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
