palette_6 = "#74d3de"
palette_7 = "#d5ced9"
palette_8 = "#7e6c88"
palette_9 = "#fc644d"
palette_10 = "#a5f69c"
palette_11 = "#e9d7a5"
palette_12 = "#3b79c7"
palette_13 = "#f92672"
palette_14 = "#74d3de"
palette_15 = "#ffffff"

[roles]
