# Zenbones Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1917"
foreground = "#b4bdc3"
cursor-color = "#c4cacf"
cursor-text = "#1c1917"
selection-background = "#3d4042"
selection-foreground = "#b4bdc3"
palette_0 = "#1c1917"
palette_1 = "#de6e7c"
palette_2 = "#819b69"
palette_3 = "#b77e64"
palette_4 = "#6099c0"
palette_5 = "#b279a7"
palette_6 = "#66a5ad"
palette_7 = "#b4bdc3"
palette_8 = "#4d4540"
palette_9 = "#e8838f"
palette_10 = "#8bae68"
palette_11 = "#d68c67"
palette_12 = "#61abda"
palette_13 = "#cf86c1"
palette_14 = "#65b8c1"
palette_15 = "#888f94"

[roles]
bg = "#1c1917"
bg_deep = "#151311"
surface = "#2e2d2c"
fg = "#b4bdc3"
