palette_7 = "#0a0c10"
palette_8 = "#0a0c10"
palette_9 = "#0a0c10"
palette_10 = "#0a0c10"
palette_11 = "#0a0c10"
palette_12 = "#0a0c10"
palette_13 = "#0a0c10"
palette_14 = "#0a0c10"
palette_15 = "#0a0c10"

[roles]
