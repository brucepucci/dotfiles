# GitHub Dark High Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0a0c10"
foreground = "#f0f3f6"
cursor-color = "#71b7ff"
cursor-text = "#b1f7ff"
selection-background = "#f0f3f6"
selection-foreground = "#0a0c10"
palette_0 = "#7a828e"
palette_1 = "#ff9492"
palette_2 = "#26cd4d"
palette_3 = "#f0b72f"
palette_4 = "#71b7ff"
palette_5 = "#cb9eff"
palette_6 = "#39c5cf"
palette_7 = "#d9dee3"
palette_8 = "#9ea7b3"
palette_9 = "#ffb1af"
palette_10 = "#4ae168"
palette_11 = "#f7c843"
palette_12 = "#91cbff"
palette_13 = "#dbb7ff"
palette_14 = "#56d4dd"
palette_15 = "#ffffff"

[roles]
bg = "#0a0c10"
bg_deep = "#08090c"
surface = "#26282c"
fg = "#f0f3f6"
fg_soft = "#abaeb1"
fg_bright = "#ffffff"
grey = "#888b8e"
grey_dim = "#5a5d60"
grey_neutral = "#a0a2a6"
grey_soft = "#717477"
red = "#ff9492"
orange = "#f8a660"
yellow = "#f0b72f"
green = "#26cd4d"
aqua = "#39c5cf"
blue = "#71b7ff"
purple = "#cb9eff"
tint_green = "#0f2f1b"
tint_red = "#362427"
statusline = "#1c1e22"
statusline_accent = "#333639"
statusline_fg = "#f0f3f6"
on_accent = "#0a0c10"
mode_red = "#ff9492"
mode_green = "#26cd4d"
mode_yellow = "#f0b72f"
mode_blue = "#71b7ff"
mode_purple = "#cb9eff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
