# GitHub Dark High Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0a0c10"
foreground = "#f0f3f6"
cursor-color = "#71b7ff"
cursor-text = "#b1f7ff"
selection-background = "#f0f3f6"
selection-foreground = "#0a0c10"
palette_0 = "#0a0c10"
