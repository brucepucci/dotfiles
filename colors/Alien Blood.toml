palette_6 = "#327f77"
palette_7 = "#647d75"
palette_8 = "#3c4812"
palette_9 = "#e08009"
palette_10 = "#18e000"
palette_11 = "#bde000"
palette_12 = "#00aae0"
palette_13 = "#0058e0"
palette_14 = "#00e0c4"
palette_15 = "#73fa91"

[roles]
