palette_8 = "#1f1726"
palette_9 = "#1f1726"
palette_10 = "#1f1726"
palette_11 = "#1f1726"
palette_12 = "#1f1726"
palette_13 = "#1f1726"
palette_14 = "#1f1726"
palette_15 = "#1f1726"

[roles]
