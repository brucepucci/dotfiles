# Wild Cherry
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1726"
foreground = "#dafaff"
cursor-color = "#dd00ff"
cursor-text = "#ff7fff"
selection-background = "#002831"
selection-foreground = "#e4ffff"
palette_0 = "#000507"
palette_1 = "#d94085"
palette_2 = "#2ab250"
palette_3 = "#ffd16f"
palette_4 = "#883cdc"
palette_5 = "#ececec"
palette_6 = "#c1b8b7"
palette_7 = "#fff8de"
palette_8 = "#009cc9"
palette_9 = "#da6bac"
palette_10 = "#f4dca5"
palette_11 = "#eac066"
palette_12 = "#308cba"
palette_13 = "#ae636b"
palette_14 = "#ff919d"
palette_15 = "#e4838d"

[roles]
bg = "#1f1726"
bg_deep = "#17111c"
surface = "#353240"
fg = "#dafaff"
fg_soft = "#a2b6be"
fg_bright = "#e4838d"
grey = "#86949d"
grey_dim = "#606672"
grey_neutral = "#99abb3"
grey_soft = "#737d88"
red = "#d94085"
orange = "#ec887a"
yellow = "#ffd16f"
green = "#2ab250"
aqua = "#c1b8b7"
blue = "#883cdc"
purple = "#ececec"
tint_green = "#21332e"
tint_red = "#401e37"
statusline = "#2e2937"
statusline_accent = "#41404d"
statusline_fg = "#dafaff"
on_accent = "#1f1726"
mode_red = "#d94085"
mode_green = "#2ab250"
mode_yellow = "#ffd16f"
mode_blue = "#883cdc"
mode_purple = "#ececec"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
