# Material Darker
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#eeffff"
cursor-color = "#ffffff"
cursor-text = "#bfbfbf"
selection-background = "#eeffff"
selection-foreground = "#545454"
palette_0 = "#212121"
palette_1 = "#212121"
palette_2 = "#212121"
palette_3 = "#212121"
palette_4 = "#212121"
palette_5 = "#212121"
palette_6 = "#212121"
palette_7 = "#212121"
palette_8 = "#212121"
palette_9 = "#212121"
palette_10 = "#212121"
palette_11 = "#212121"
palette_12 = "#212121"
palette_13 = "#212121"
palette_14 = "#212121"
palette_15 = "#212121"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#3a3c3c"
fg = "#eeffff"
fg_soft = "#b0bcbc"
fg_bright = "#212121"
grey = "#929b9b"
grey_dim = "#696f6f"
grey_neutral = "#a6b1b1"
grey_soft = "#7d8585"
red = "#212121"
orange = "#212121"
yellow = "#212121"
green = "#212121"
aqua = "#212121"
blue = "#212121"
purple = "#212121"
tint_green = "#212121"
