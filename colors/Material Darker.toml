# Material Darker
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#eeffff"
cursor-color = "#ffffff"
cursor-text = "#bfbfbf"
selection-background = "#eeffff"
selection-foreground = "#545454"
palette_0 = "#000000"
palette_1 = "#ff5370"
palette_2 = "#c3e88d"
palette_3 = "#ffcb6b"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#89ddff"
palette_7 = "#ffffff"
palette_8 = "#545454"
palette_9 = "#ff5370"
palette_10 = "#c3e88d"
palette_11 = "#ffcb6b"
palette_12 = "#82aaff"
palette_13 = "#c792ea"
palette_14 = "#89ddff"
palette_15 = "#ffffff"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#3a3c3c"
fg = "#eeffff"
fg_soft = "#b0bcbc"
fg_bright = "#ffffff"
grey = "#929b9b"
grey_dim = "#696f6f"
grey_neutral = "#a6b1b1"
grey_soft = "#7d8585"
red = "#ff5370"
orange = "#ff8f6e"
yellow = "#ffcb6b"
green = "#c3e88d"
aqua = "#89ddff"
blue = "#82aaff"
purple = "#c792ea"
tint_green = "#3e4534"
tint_red = "#492a2f"
statusline = "#313333"
statusline_accent = "#464949"
statusline_fg = "#eeffff"
on_accent = "#212121"
mode_red = "#ff5370"
mode_green = "#c3e88d"
mode_yellow = "#ffcb6b"
mode_blue = "#82aaff"
mode_purple = "#c792ea"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
