palette_4 = "#1d1d1d"
palette_5 = "#1d1d1d"
palette_6 = "#1d1d1d"
palette_7 = "#1d1d1d"
palette_8 = "#1d1d1d"
palette_9 = "#1d1d1d"
palette_10 = "#1d1d1d"
palette_11 = "#1d1d1d"
palette_12 = "#1d1d1d"
palette_13 = "#1d1d1d"
palette_14 = "#1d1d1d"
palette_15 = "#1d1d1d"

[roles]
bg = "#1d1d1d"
