# Guezwhoz
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1d1d"
foreground = "#d9d9d9"
cursor-color = "#99d4b1"
cursor-text = "#1d1d1d"
selection-background = "#245354"
selection-foreground = "#58d6ce"
palette_0 = "#333333"
palette_1 = "#e85181"
palette_2 = "#7ad694"
palette_3 = "#b7d074"
palette_4 = "#5aa0d6"
palette_5 = "#9a90e0"
palette_6 = "#58d6ce"
palette_7 = "#d9d9d9"
palette_8 = "#808080"
palette_9 = "#e85181"
palette_10 = "#afd7af"
palette_11 = "#d1ed85"
palette_12 = "#64b2ed"
palette_13 = "#a398ed"
palette_14 = "#61ede4"
palette_15 = "#ededed"

[roles]
bg = "#1d1d1d"
bg_deep = "#161616"
surface = "#343434"
fg = "#d9d9d9"
fg_soft = "#a1a1a1"
fg_bright = "#ededed"
grey = "#848484"
grey_dim = "#5f5f5f"
grey_neutral = "#979797"
grey_soft = "#727272"
red = "#e85181"
orange = "#d0907a"
yellow = "#b7d074"
green = "#7ad694"
aqua = "#58d6ce"
blue = "#5aa0d6"
purple = "#9a90e0"
tint_green = "#2e3e32"
tint_red = "#42262f"
statusline = "#2c2c2c"
statusline_accent = "#3f3f3f"
statusline_fg = "#d9d9d9"
on_accent = "#1d1d1d"
mode_red = "#e85181"
mode_green = "#7ad694"
mode_yellow = "#b7d074"
mode_blue = "#5aa0d6"
mode_purple = "#9a90e0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
