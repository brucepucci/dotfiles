# Bright Lights
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#191919"
foreground = "#b3c9d7"
cursor-color = "#f34b00"
cursor-text = "#002831"
selection-background = "#b3c9d7"
selection-foreground = "#191919"
palette_0 = "#191919"
palette_1 = "#ff355b"
palette_2 = "#b7e876"
palette_3 = "#ffc251"
palette_4 = "#76d4ff"
palette_5 = "#ba76e7"
palette_6 = "#6cbfb5"
palette_7 = "#c2c8d7"
palette_8 = "#4c4c4c"
palette_9 = "#ff355b"
palette_10 = "#b7e876"
palette_11 = "#ffc251"
palette_12 = "#76d5ff"
palette_13 = "#ba76e7"
palette_14 = "#6cbfb5"
palette_15 = "#c2c8d7"

[roles]
bg = "#191919"
bg_deep = "#131313"
surface = "#2b2e30"
fg = "#b3c9d7"
