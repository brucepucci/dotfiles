# Elegant
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#292b31"
foreground = "#ced2d6"
cursor-color = "#00beff"
cursor-text = "#ffffff"
selection-background = "#d5d5d5"
selection-foreground = "#144385"
palette_0 = "#0a1222"
palette_1 = "#ff0257"
palette_2 = "#85cc95"
palette_3 = "#ffcb8b"
palette_4 = "#8dabe1"
palette_5 = "#c792eb"
palette_6 = "#78ccf0"
palette_7 = "#ffffff"
palette_8 = "#575656"
palette_9 = "#ff0057"
palette_10 = "#85cc95"
palette_11 = "#ffcb8b"
palette_12 = "#8dabe1"
palette_13 = "#c792eb"
palette_14 = "#3facef"
palette_15 = "#ffffff"

[roles]
bg = "#292b31"
bg_deep = "#1f2025"
surface = "#3d3f45"
fg = "#ced2d6"
fg_soft = "#9ca0a4"
fg_bright = "#ffffff"
grey = "#84878c"
grey_dim = "#63656b"
grey_neutral = "#94989c"
grey_soft = "#73767b"
red = "#ff0257"
orange = "#ff6671"
yellow = "#ffcb8b"
green = "#85cc95"
aqua = "#78ccf0"
blue = "#8dabe1"
purple = "#c792eb"
tint_green = "#3a4843"
tint_red = "#502438"
statusline = "#36383e"
statusline_accent = "#47494f"
statusline_fg = "#ced2d6"
on_accent = "#292b31"
mode_red = "#ff0257"
mode_green = "#85cc95"
mode_yellow = "#ffcb8b"
mode_blue = "#8dabe1"
mode_purple = "#c792eb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
