# Aardvark Blue
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#102040"
foreground = "#dddddd"
cursor-color = "#007acc"
cursor-text = "#bfdbfe"
selection-background = "#bfdbfe"
selection-foreground = "#000000"
palette_0 = "#102040"
palette_1 = "#102040"
palette_2 = "#102040"
palette_3 = "#102040"
palette_4 = "#102040"
palette_5 = "#102040"
palette_6 = "#102040"
palette_7 = "#102040"
palette_8 = "#102040"
palette_9 = "#102040"
palette_10 = "#102040"
palette_11 = "#102040"
palette_12 = "#102040"
palette_13 = "#102040"
palette_14 = "#102040"
palette_15 = "#102040"

[roles]
bg = "#102040"
bg_deep = "#0c1830"
surface = "#293753"
fg = "#dddddd"
fg_soft = "#a0a4ae"
fg_bright = "#102040"
grey = "#818896"
grey_dim = "#586277"
grey_neutral = "#959ba6"
grey_soft = "#6c7587"
red = "#102040"
orange = "#102040"
yellow = "#102040"
green = "#102040"
aqua = "#102040"
blue = "#102040"
purple = "#102040"
tint_green = "#102040"
tint_red = "#102040"
statusline = "#202f4d"
statusline_accent = "#35425c"
statusline_fg = "#dddddd"
