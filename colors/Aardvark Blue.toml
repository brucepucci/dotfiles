# Aardvark Blue
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#102040"
foreground = "#dddddd"
cursor-color = "#007acc"
cursor-text = "#bfdbfe"
selection-background = "#bfdbfe"
selection-foreground = "#000000"
palette_0 = "#191919"
palette_1 = "#aa342e"
palette_2 = "#4b8c0f"
palette_3 = "#dbba00"
palette_4 = "#1370d3"
palette_5 = "#c43ac3"
palette_6 = "#008eb0"
palette_7 = "#bebebe"
palette_8 = "#525252"
palette_9 = "#f05b50"
palette_10 = "#95dc55"
palette_11 = "#ffe763"
palette_12 = "#60a4ec"
palette_13 = "#e26be2"
palette_14 = "#60b6cb"
palette_15 = "#f7f7f7"

[roles]
bg = "#102040"
bg_deep = "#0c1830"
surface = "#293753"
fg = "#dddddd"
fg_soft = "#a0a4ae"
fg_bright = "#f7f7f7"
grey = "#818896"
grey_dim = "#586277"
grey_neutral = "#959ba6"
grey_soft = "#6c7587"
red = "#aa342e"
orange = "#c27717"
yellow = "#dbba00"
green = "#4b8c0f"
aqua = "#008eb0"
blue = "#1370d3"
purple = "#c43ac3"
tint_green = "#1b3337"
tint_red = "#2c243d"
statusline = "#202f4d"
statusline_accent = "#35425c"
statusline_fg = "#dddddd"
on_accent = "#dddddd"
mode_red = "#aa342e"
mode_green = "#4b8c0f"
mode_yellow = "#dbba00"
mode_blue = "#1370d3"
mode_purple = "#c43ac3"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
