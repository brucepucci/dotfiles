palette_3 = "#31363b"
palette_4 = "#31363b"
palette_5 = "#31363b"
palette_6 = "#31363b"
palette_7 = "#31363b"
palette_8 = "#31363b"
palette_9 = "#31363b"
palette_10 = "#31363b"
palette_11 = "#31363b"
palette_12 = "#31363b"
palette_13 = "#31363b"
palette_14 = "#31363b"
palette_15 = "#31363b"

