# Breeze
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#31363b"
foreground = "#eff0f1"
cursor-color = "#eff0f1"
cursor-text = "#31363b"
selection-background = "#eff0f1"
selection-foreground = "#31363b"
palette_0 = "#31363b"
palette_1 = "#ed1515"
palette_2 = "#11d116"
palette_3 = "#f67400"
palette_4 = "#1d99f3"
palette_5 = "#9b59b6"
palette_6 = "#1abc9c"
palette_7 = "#eff0f1"
palette_8 = "#7f8c8d"
palette_9 = "#c0392b"
palette_10 = "#1cdc9a"
palette_11 = "#fdbc4b"
palette_12 = "#3daee9"
palette_13 = "#8e44ad"
palette_14 = "#16a085"
palette_15 = "#fcfcfc"

[roles]
bg = "#31363b"
bg_deep = "#25282c"
surface = "#484c51"
fg = "#eff0f1"
fg_soft = "#b6b8ba"
fg_bright = "#fcfcfc"
grey = "#9a9c9f"
grey_dim = "#74777b"
grey_neutral = "#acafb1"
grey_soft = "#868a8d"
red = "#ed1515"
orange = "#f2440a"
yellow = "#f67400"
green = "#11d116"
aqua = "#1abc9c"
blue = "#1d99f3"
purple = "#9b59b6"
tint_green = "#2b5234"
