# Konsolas
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#060606"
foreground = "#c8c1c1"
cursor-color = "#c8c1c1"
cursor-text = "#060606"
selection-background = "#060606"
selection-foreground = "#c8c1c1"
palette_0 = "#000000"
palette_1 = "#aa1717"
palette_2 = "#18b218"
palette_3 = "#ebae1f"
palette_4 = "#2323a5"
palette_5 = "#ad1edc"
palette_6 = "#42b0c8"
palette_7 = "#c8c1c1"
palette_8 = "#7b716e"
palette_9 = "#ff4141"
palette_10 = "#5fff5f"
palette_11 = "#ffff55"
palette_12 = "#4b4bff"
palette_13 = "#ff54ff"
palette_14 = "#69ffff"
palette_15 = "#ffffff"

[roles]
bg = "#060606"
bg_deep = "#040404"
surface = "#1d1c1c"
fg = "#c8c1c1"
fg_soft = "#8e8989"
fg_bright = "#ffffff"
grey = "#716d6d"
grey_dim = "#4a4747"
grey_neutral = "#848080"
grey_soft = "#5d5a5a"
red = "#aa1717"
orange = "#ca621b"
yellow = "#ebae1f"
green = "#18b218"
aqua = "#42b0c8"
blue = "#2323a5"
purple = "#ad1edc"
tint_green = "#092509"
tint_red = "#240909"
statusline = "#161515"
statusline_accent = "#292828"
statusline_fg = "#c8c1c1"
on_accent = "#c8c1c1"
mode_red = "#aa1717"
mode_green = "#18b218"
mode_yellow = "#ebae1f"
mode_blue = "#2323a5"
mode_purple = "#ad1edc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
