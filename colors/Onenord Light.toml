# Onenord Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f7f8fa"
foreground = "#2e3440"
cursor-color = "#3879c5"
cursor-text = "#f7f8fa"
selection-background = "#eaebed"
selection-foreground = "#000000"
palette_0 = "#2e3440"
palette_1 = "#cb4f53"
palette_2 = "#48a53d"
palette_3 = "#ee5e25"
palette_4 = "#3879c5"
palette_5 = "#9f4aca"
palette_6 = "#3ea1ad"
palette_7 = "#b2b6bd"
palette_8 = "#646a76"
palette_9 = "#d16366"
palette_10 = "#5f9e9d"
palette_11 = "#ba793e"
palette_12 = "#1b40a6"
palette_13 = "#9665af"
palette_14 = "#8fbcbb"
palette_15 = "#eceff4"

[roles]
bg = "#f7f8fa"
bg_deep = "#f9fafb"
surface = "#dfe0e4"
fg = "#2e3440"
fg_soft = "#6a6f78"
fg_bright = "#1e222a"
grey = "#888c94"
grey_dim = "#b1b3b9"
grey_neutral = "#747981"
grey_soft = "#9da0a6"
red = "#cb4f53"
orange = "#dc563c"
yellow = "#ee5e25"
green = "#48a53d"
aqua = "#3ea1ad"
blue = "#3879c5"
purple = "#9f4aca"
tint_green = "#d8e9d8"
tint_red = "#efdadc"
statusline = "#e7e8eb"
