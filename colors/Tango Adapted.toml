# Tango Adapted
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff0000"
palette_2 = "#59d600"
palette_3 = "#e3be00"
palette_4 = "#00a2ff"
palette_5 = "#c17ecc"
palette_6 = "#00d0d6"
palette_7 = "#c0c5bb"
palette_8 = "#8f928b"
palette_9 = "#ff0013"
palette_10 = "#6dd900"
palette_11 = "#ccbe00"
palette_12 = "#88c9ff"
palette_13 = "#e9a7e1"
palette_14 = "#00d8d9"
palette_15 = "#f6f6f4"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#ff0000"
orange = "#f15f00"
yellow = "#e3be00"
green = "#59d600"
aqua = "#00d0d6"
blue = "#00a2ff"
purple = "#c17ecc"
tint_green = "#e1f8d1"
tint_red = "#ffd1d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#ff0000"
mode_green = "#59d600"
mode_yellow = "#e3be00"
mode_blue = "#00a2ff"
mode_purple = "#c17ecc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
