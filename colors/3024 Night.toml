palette_2 = "#01a252"
palette_3 = "#fded02"
palette_4 = "#01a0e4"
palette_5 = "#a16a94"
palette_6 = "#b5e4f4"
palette_7 = "#a5a2a2"
palette_8 = "#5c5855"
palette_9 = "#e8bbd0"
palette_10 = "#47413f"
palette_11 = "#4a4543"
palette_12 = "#807d7c"
palette_13 = "#d6d5d4"
palette_14 = "#cdab53"
palette_15 = "#f7f7f7"

[roles]
