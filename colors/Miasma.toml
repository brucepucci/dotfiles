# Miasma
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#c2c2b0"
cursor-color = "#c7c7c7"
cursor-text = "#959595"
selection-background = "#e5c47b"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#685742"
palette_2 = "#5f875f"
palette_3 = "#b36d43"
palette_4 = "#78824b"
palette_5 = "#bb7744"
palette_6 = "#c9a554"
palette_7 = "#d7c483"
palette_8 = "#666666"
palette_9 = "#685742"
palette_10 = "#5f875f"
palette_11 = "#b36d43"
palette_12 = "#78824b"
palette_13 = "#bb7744"
palette_14 = "#c9a554"
palette_15 = "#d7c483"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#353533"
fg = "#c2c2b0"
fg_soft = "#929285"
fg_bright = "#d7c483"
grey = "#7a7a70"
grey_dim = "#5a5a54"
grey_neutral = "#8a8a7e"
grey_soft = "#6a6a62"
red = "#685742"
orange = "#8e6242"
yellow = "#b36d43"
green = "#5f875f"
aqua = "#c9a554"
blue = "#78824b"
purple = "#bb7744"
tint_green = "#2d342d"
tint_red = "#2f2c28"
statusline = "#2f2f2d"
statusline_accent = "#3f3f3c"
statusline_fg = "#c2c2b0"
on_accent = "#222222"
mode_red = "#685742"
mode_green = "#5f875f"
mode_yellow = "#b36d43"
mode_blue = "#78824b"
mode_purple = "#bb7744"

[apps]
