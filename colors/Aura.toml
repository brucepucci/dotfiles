# Aura
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#15141b"
foreground = "#edecee"
cursor-color = "#a277ff"
cursor-text = "#edecee"
selection-background = "#a277ff"
selection-foreground = "#edecee"
palette_0 = "#110f18"
palette_1 = "#ff6767"
palette_2 = "#61ffca"
palette_3 = "#ffca85"
palette_4 = "#a277ff"
palette_5 = "#a277ff"
palette_6 = "#61ffca"
palette_7 = "#edecee"
palette_8 = "#4d4d4d"
palette_9 = "#ffca85"
palette_10 = "#a277ff"
palette_11 = "#ffca85"
palette_12 = "#a277ff"
palette_13 = "#a277ff"
palette_14 = "#61ffca"
palette_15 = "#edecee"

[roles]
bg = "#15141b"
bg_deep = "#100f14"
surface = "#2f2e34"
fg = "#edecee"
fg_soft = "#acabaf"
fg_bright = "#edecee"
grey = "#8c8b8f"
grey_dim = "#616065"
grey_neutral = "#a1a0a4"
grey_soft = "#76757a"
red = "#ff6767"
orange = "#ff9876"
yellow = "#ffca85"
green = "#61ffca"
aqua = "#61ffca"
blue = "#a277ff"
purple = "#a277ff"
tint_green = "#233e3a"
tint_red = "#3f2329"
statusline = "#26252c"
statusline_accent = "#3c3b41"
