# Aura
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#15141b"
foreground = "#edecee"
cursor-color = "#a277ff"
cursor-text = "#edecee"
selection-background = "#a277ff"
selection-foreground = "#edecee"
palette_0 = "#15141b"
palette_1 = "#15141b"
palette_2 = "#15141b"
palette_3 = "#15141b"
palette_4 = "#15141b"
palette_5 = "#15141b"
palette_6 = "#15141b"
palette_7 = "#15141b"
palette_8 = "#15141b"
palette_9 = "#15141b"
palette_10 = "#15141b"
palette_11 = "#15141b"
palette_12 = "#15141b"
palette_13 = "#15141b"
palette_14 = "#15141b"
palette_15 = "#15141b"

[roles]
bg = "#15141b"
bg_deep = "#100f14"
surface = "#2f2e34"
fg = "#edecee"
fg_soft = "#acabaf"
fg_bright = "#15141b"
grey = "#8c8b8f"
grey_dim = "#616065"
grey_neutral = "#a1a0a4"
grey_soft = "#76757a"
red = "#15141b"
orange = "#15141b"
yellow = "#15141b"
