# Selenized Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fbf3db"
foreground = "#53676d"
cursor-color = "#53676d"
cursor-text = "#fbf3db"
selection-background = "#ece3cc"
selection-foreground = "#00978a"
palette_0 = "#ece3cc"
palette_1 = "#d2212d"
palette_2 = "#489100"
palette_3 = "#ad8900"
palette_4 = "#0072d4"
palette_5 = "#ca4898"
palette_6 = "#009c8f"
palette_7 = "#53676d"
palette_8 = "#909995"
palette_9 = "#cc1729"
palette_10 = "#428b00"
palette_11 = "#a78300"
palette_12 = "#006dce"
palette_13 = "#c44392"
palette_14 = "#00978a"
palette_15 = "#3a4d53"

[roles]
bg = "#fbf3db"
bg_deep = "#fcf6e4"
surface = "#e7e2ce"
fg = "#53676d"
fg_soft = "#85918e"
fg_bright = "#364347"
grey = "#9fa69e"
grey_dim = "#c0c2b4"
