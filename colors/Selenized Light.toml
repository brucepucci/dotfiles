palette_7 = "#fbf3db"
palette_8 = "#fbf3db"
palette_9 = "#fbf3db"
palette_10 = "#fbf3db"
palette_11 = "#fbf3db"
palette_12 = "#fbf3db"
palette_13 = "#fbf3db"
palette_14 = "#fbf3db"
palette_15 = "#fbf3db"

