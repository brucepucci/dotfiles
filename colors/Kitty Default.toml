# Kitty Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#dddddd"
cursor-color = "#cccccc"
cursor-text = "#111111"
selection-background = "#fffacd"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0403"
palette_2 = "#19cb00"
palette_3 = "#cecb00"
palette_4 = "#0d73cc"
palette_5 = "#cb1ed1"
palette_6 = "#0dcdcd"
palette_7 = "#dddddd"
palette_8 = "#767676"
palette_9 = "#f2201f"
palette_10 = "#23fd00"
palette_11 = "#fffd00"
palette_12 = "#1a8fff"
palette_13 = "#fd28ff"
palette_14 = "#14ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1b1b1b"
fg = "#dddddd"
fg_soft = "#9b9b9b"
fg_bright = "#ffffff"
grey = "#7a7a7a"
grey_dim = "#4d4d4d"
grey_neutral = "#909090"
grey_soft = "#636363"
red = "#cc0403"
orange = "#cd6802"
yellow = "#cecb00"
green = "#19cb00"
aqua = "#0dcdcd"
blue = "#0d73cc"
purple = "#cb1ed1"
tint_green = "#042500"
tint_red = "#250101"
statusline = "#121212"
statusline_accent = "#282828"
statusline_fg = "#dddddd"
on_accent = "#dddddd"
mode_red = "#cc0403"
mode_green = "#19cb00"
mode_yellow = "#cecb00"
mode_blue = "#0d73cc"
mode_purple = "#cb1ed1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
