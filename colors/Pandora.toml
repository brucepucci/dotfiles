# Pandora
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141e43"
foreground = "#e1e1e1"
cursor-color = "#43d58e"
cursor-text = "#ffffff"
selection-background = "#2d37ff"
selection-foreground = "#82e0ff"
palette_0 = "#000000"
palette_1 = "#ff4242"
palette_2 = "#74af68"
palette_3 = "#ffad29"
palette_4 = "#338f86"
palette_5 = "#9414e6"
palette_6 = "#23d7d7"
palette_7 = "#e2e2e2"
palette_8 = "#3f5648"
palette_9 = "#ff3242"
palette_10 = "#74cd68"
palette_11 = "#ffb929"
palette_12 = "#23d7d7"
palette_13 = "#ff37ff"
palette_14 = "#00ede1"
palette_15 = "#ffffff"

[roles]
bg = "#141e43"
bg_deep = "#0f1632"
surface = "#2d3556"
fg = "#e1e1e1"
fg_soft = "#a4a6b2"
fg_bright = "#ffffff"
grey = "#85899a"
grey_dim = "#5c627a"
grey_neutral = "#999daa"
grey_soft = "#70768a"
red = "#ff4242"
orange = "#ff7836"
yellow = "#ffad29"
green = "#74af68"
aqua = "#23d7d7"
blue = "#338f86"
purple = "#9414e6"
tint_green = "#25384a"
tint_red = "#3e2443"
statusline = "#242e50"
statusline_accent = "#39415f"
statusline_fg = "#e1e1e1"
on_accent = "#141e43"
mode_red = "#ff4242"
mode_green = "#74af68"
mode_yellow = "#ffad29"
mode_blue = "#338f86"
mode_purple = "#9414e6"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
