# Pandora
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141e43"
foreground = "#e1e1e1"
cursor-color = "#43d58e"
cursor-text = "#ffffff"
selection-background = "#2d37ff"
selection-foreground = "#82e0ff"
palette_0 = "#141e43"
palette_1 = "#141e43"
palette_2 = "#141e43"
palette_3 = "#141e43"
palette_4 = "#141e43"
palette_5 = "#141e43"
palette_6 = "#141e43"
palette_7 = "#141e43"
palette_8 = "#141e43"
palette_9 = "#141e43"
palette_10 = "#141e43"
palette_11 = "#141e43"
palette_12 = "#141e43"
palette_13 = "#141e43"
palette_14 = "#141e43"
palette_15 = "#141e43"

[roles]
bg = "#141e43"
bg_deep = "#0f1632"
surface = "#2d3556"
fg = "#e1e1e1"
fg_soft = "#a4a6b2"
fg_bright = "#141e43"
grey = "#85899a"
grey_dim = "#5c627a"
grey_neutral = "#999daa"
grey_soft = "#70768a"
red = "#141e43"
orange = "#141e43"
yellow = "#141e43"
green = "#141e43"
aqua = "#141e43"
blue = "#141e43"
purple = "#141e43"
tint_green = "#141e43"
tint_red = "#141e43"
statusline = "#242e50"
