# Medallion
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1908"
foreground = "#cac296"
cursor-color = "#d3ba30"
cursor-text = "#fffc7d"
selection-background = "#626dac"
selection-foreground = "#cac29a"
palette_0 = "#000000"
palette_1 = "#b64c00"
palette_2 = "#7c8b16"
palette_3 = "#d3bd26"
palette_4 = "#616bb0"
palette_5 = "#8c5a90"
palette_6 = "#916c25"
palette_7 = "#cac29a"
palette_8 = "#5e5219"
palette_9 = "#ff9149"
palette_10 = "#b2ca3b"
palette_11 = "#ffe54a"
palette_12 = "#acb8ff"
palette_13 = "#ffa0ff"
palette_14 = "#ffbc51"
palette_15 = "#fed698"

[roles]
bg = "#1d1908"
bg_deep = "#161306"
surface = "#322d19"
fg = "#cac296"
fg_soft = "#968f6b"
fg_bright = "#fed698"
grey = "#7c7656"
grey_dim = "#5a543a"
grey_neutral = "#8d8764"
grey_soft = "#6b6548"
red = "#b64c00"
orange = "#c48413"
yellow = "#d3bd26"
green = "#7c8b16"
aqua = "#916c25"
blue = "#616bb0"
purple = "#8c5a90"
tint_green = "#2e2e0b"
tint_red = "#392207"
statusline = "#2b2713"
statusline_accent = "#3c3722"
statusline_fg = "#cac296"
on_accent = "#1d1908"
mode_red = "#b64c00"
mode_green = "#7c8b16"
mode_yellow = "#d3bd26"
mode_blue = "#616bb0"
mode_purple = "#8c5a90"

[apps]
