# Xcode Light hc
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#b4d8fd"
selection-foreground = "#000000"
palette_0 = "#b4d8fd"
palette_1 = "#ad1805"
palette_2 = "#355d61"
palette_3 = "#78492a"
palette_4 = "#0058a1"
palette_5 = "#9c2191"
palette_6 = "#703daa"
palette_7 = "#000000"
palette_8 = "#8a99a6"
palette_9 = "#ad1805"
palette_10 = "#174145"
palette_11 = "#78492a"
palette_12 = "#003f73"
palette_13 = "#9c2191"
palette_14 = "#441ea1"
palette_15 = "#000000"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#ad1805"
orange = "#923018"
yellow = "#78492a"
green = "#355d61"
aqua = "#703daa"
blue = "#0058a1"
purple = "#9c2191"
tint_green = "#dbe2e3"
tint_red = "#f0d5d2"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#ad1805"
mode_green = "#355d61"
mode_yellow = "#78492a"
mode_blue = "#0058a1"
mode_purple = "#9c2191"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
