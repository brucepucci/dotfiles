# Material Design Colors
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d262a"
foreground = "#e7ebed"
cursor-color = "#eaeaea"
cursor-text = "#000000"
selection-background = "#4e6a78"
selection-foreground = "#e7ebed"
palette_0 = "#435b67"
palette_1 = "#fc3841"
palette_2 = "#5cf19e"
palette_3 = "#fed032"
palette_4 = "#37b6ff"
palette_5 = "#fc226e"
palette_6 = "#59ffd1"
palette_7 = "#ffffff"
palette_8 = "#a1b0b8"
palette_9 = "#fc746d"
palette_10 = "#adf7be"
palette_11 = "#fee16c"
palette_12 = "#70cfff"
palette_13 = "#fc669b"
palette_14 = "#9affe6"
palette_15 = "#ffffff"

[roles]
bg = "#1d262a"
bg_deep = "#161c20"
surface = "#353e41"
fg = "#e7ebed"
fg_soft = "#aab0b2"
fg_bright = "#ffffff"
grey = "#8c9295"
grey_dim = "#646b6e"
grey_neutral = "#a0a6a9"
grey_soft = "#787f82"
red = "#fc3841"
orange = "#fd843a"
yellow = "#fed032"
green = "#5cf19e"
aqua = "#59ffd1"
blue = "#37b6ff"
purple = "#fc226e"
tint_green = "#284b3f"
tint_red = "#45292e"
statusline = "#2d363a"
statusline_accent = "#41494d"
statusline_fg = "#e7ebed"
on_accent = "#1d262a"
mode_red = "#fc3841"
mode_green = "#5cf19e"
mode_yellow = "#fed032"
mode_blue = "#37b6ff"
