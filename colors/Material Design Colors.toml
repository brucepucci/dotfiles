# Material Design Colors
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d262a"
foreground = "#e7ebed"
cursor-color = "#eaeaea"
cursor-text = "#000000"
selection-background = "#4e6a78"
selection-foreground = "#e7ebed"
palette_0 = "#1d262a"
palette_1 = "#1d262a"
palette_2 = "#1d262a"
palette_3 = "#1d262a"
palette_4 = "#1d262a"
palette_5 = "#1d262a"
palette_6 = "#1d262a"
palette_7 = "#1d262a"
palette_8 = "#1d262a"
palette_9 = "#1d262a"
palette_10 = "#1d262a"
palette_11 = "#1d262a"
palette_12 = "#1d262a"
palette_13 = "#1d262a"
palette_14 = "#1d262a"
palette_15 = "#1d262a"

[roles]
bg = "#1d262a"
bg_deep = "#161c20"
surface = "#353e41"
fg = "#e7ebed"
fg_soft = "#aab0b2"
fg_bright = "#1d262a"
grey = "#8c9295"
grey_dim = "#646b6e"
grey_neutral = "#a0a6a9"
grey_soft = "#787f82"
red = "#1d262a"
orange = "#1d262a"
yellow = "#1d262a"
green = "#1d262a"
aqua = "#1d262a"
