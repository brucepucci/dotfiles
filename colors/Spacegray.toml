# Spacegray
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#20242d"
foreground = "#b3b8c3"
cursor-color = "#b3b8c3"
cursor-text = "#1d1f21"
selection-background = "#16181e"
selection-foreground = "#b3b8c3"
palette_0 = "#000000"
palette_1 = "#b04b57"
palette_2 = "#87b379"
palette_3 = "#e5c179"
palette_4 = "#7d8fa4"
palette_5 = "#a47996"
palette_6 = "#85a7a5"
palette_7 = "#b3b8c3"
palette_8 = "#4c4c4c"
palette_9 = "#b04b57"
palette_10 = "#87b379"
palette_11 = "#e5c179"
palette_12 = "#7d8fa4"
palette_13 = "#a47996"
palette_14 = "#85a7a5"
palette_15 = "#ffffff"

[roles]
bg = "#20242d"
bg_deep = "#181b22"
surface = "#32363f"
fg = "#b3b8c3"
fg_soft = "#878c96"
fg_bright = "#ffffff"
grey = "#717580"
grey_dim = "#535862"
grey_neutral = "#80848e"
grey_soft = "#626770"
red = "#b04b57"
orange = "#ca8668"
yellow = "#e5c179"
green = "#87b379"
aqua = "#85a7a5"
blue = "#7d8fa4"
purple = "#a47996"
tint_green = "#333e3b"
tint_red = "#3a2b35"
statusline = "#2c3039"
statusline_accent = "#3a3f48"
statusline_fg = "#b3b8c3"
on_accent = "#20242d"
mode_red = "#b04b57"
mode_green = "#87b379"
mode_yellow = "#e5c179"
mode_blue = "#7d8fa4"
mode_purple = "#a47996"

[apps]
