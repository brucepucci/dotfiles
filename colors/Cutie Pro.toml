# Cutie Pro
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#181818"
foreground = "#d5d0c9"
cursor-color = "#efc4cd"
cursor-text = "#181818"
selection-background = "#363636"
selection-foreground = "#d5d0c9"
palette_0 = "#000000"
palette_1 = "#f56e7f"
palette_2 = "#bec975"
palette_3 = "#f58669"
palette_4 = "#42d9c5"
palette_5 = "#d286b7"
palette_6 = "#37cb8a"
palette_7 = "#d5c3c3"
palette_8 = "#88847f"
palette_9 = "#e5a1a3"
palette_10 = "#e8d6a7"
palette_11 = "#f1bb79"
palette_12 = "#80c5de"
palette_13 = "#b294bb"
palette_14 = "#9dccbb"
palette_15 = "#ffffff"

[roles]
bg = "#181818"
bg_deep = "#121212"
surface = "#2f2e2d"
fg = "#d5d0c9"
fg_soft = "#9c9994"
fg_bright = "#ffffff"
grey = "#807d79"
grey_dim = "#5a5856"
grey_neutral = "#93908b"
grey_soft = "#6d6b68"
red = "#f56e7f"
orange = "#f57a74"
yellow = "#f58669"
green = "#bec975"
aqua = "#37cb8a"
blue = "#42d9c5"
purple = "#d286b7"
tint_green = "#363829"
tint_red = "#40272b"
statusline = "#272726"
