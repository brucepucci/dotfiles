# Kurokula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141515"
foreground = "#e0cfc2"
cursor-color = "#7a1c1c"
cursor-text = "#fffbf2"
selection-background = "#515151"
selection-foreground = "#ffc34c"
palette_0 = "#333333"
palette_1 = "#c35a52"
palette_2 = "#78b3a9"
palette_3 = "#e1b917"
palette_4 = "#5c91dd"
palette_5 = "#8b79a6"
palette_6 = "#867268"
palette_7 = "#e0cfc2"
palette_8 = "#515151"
palette_9 = "#ffc34c"
palette_10 = "#afffa5"
palette_11 = "#fff700"
palette_12 = "#90dbff"
palette_13 = "#ad93ff"
palette_14 = "#ffcdb6"
palette_15 = "#ffffff"

[roles]
bg = "#141515"
bg_deep = "#0f1010"
surface = "#2c2b2a"
fg = "#e0cfc2"
fg_soft = "#a3978e"
fg_bright = "#ffffff"
grey = "#847b74"
grey_dim = "#5b5652"
grey_neutral = "#998e85"
grey_soft = "#706963"
red = "#c35a52"
orange = "#d28a34"
yellow = "#e1b917"
green = "#78b3a9"
aqua = "#867268"
