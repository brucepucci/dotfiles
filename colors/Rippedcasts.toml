palette_9 = "#2b2b2b"
palette_10 = "#2b2b2b"
palette_11 = "#2b2b2b"
palette_12 = "#2b2b2b"
palette_13 = "#2b2b2b"
palette_14 = "#2b2b2b"
palette_15 = "#2b2b2b"

