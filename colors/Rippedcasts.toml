# Rippedcasts
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2b2b2b"
foreground = "#ffffff"
cursor-color = "#7f7f7f"
cursor-text = "#ffffff"
selection-background = "#5a647e"
selection-foreground = "#f2f2f2"
palette_0 = "#000000"
palette_1 = "#cdaf95"
palette_2 = "#a8ff60"
palette_3 = "#bfbb1f"
palette_4 = "#75a5b0"
palette_5 = "#ff73fd"
palette_6 = "#5a647e"
palette_7 = "#bfbfbf"
palette_8 = "#666666"
palette_9 = "#eecbad"
palette_10 = "#bcee68"
palette_11 = "#e5e500"
palette_12 = "#86bdc9"
palette_13 = "#e500e5"
palette_14 = "#8c9bc4"
palette_15 = "#e5e5e5"

[roles]
bg = "#2b2b2b"
bg_deep = "#202020"
surface = "#444444"
fg = "#ffffff"
fg_soft = "#bfbfbf"
fg_bright = "#e5e5e5"
grey = "#a0a0a0"
grey_dim = "#757575"
grey_neutral = "#b5b5b5"
grey_soft = "#8a8a8a"
red = "#cdaf95"
orange = "#c6b55a"
yellow = "#bfbb1f"
green = "#a8ff60"
aqua = "#5a647e"
blue = "#75a5b0"
purple = "#ff73fd"
tint_green = "#425135"
tint_red = "#48433e"
statusline = "#3c3c3c"
statusline_accent = "#515151"
statusline_fg = "#ffffff"
on_accent = "#2b2b2b"
mode_red = "#cdaf95"
mode_green = "#a8ff60"
mode_yellow = "#bfbb1f"
mode_blue = "#75a5b0"
mode_purple = "#ff73fd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
