# Seoulbones Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e2e2e2"
foreground = "#555555"
cursor-color = "#555555"
cursor-text = "#e2e2e2"
selection-background = "#cccccc"
selection-foreground = "#555555"
palette_0 = "#e2e2e2"
palette_1 = "#dc5284"
palette_2 = "#628562"
palette_3 = "#c48562"
palette_4 = "#0084a3"
palette_5 = "#896788"
palette_6 = "#008586"
palette_7 = "#555555"
palette_8 = "#a5a0a1"
palette_9 = "#be3c6d"
palette_10 = "#487249"
palette_11 = "#a76b48"
palette_12 = "#006f89"
palette_13 = "#7f4c7e"
palette_14 = "#006f70"
palette_15 = "#777777"

[roles]
bg = "#e2e2e2"
bg_deep = "#e9e9e9"
surface = "#d1d1d1"
fg = "#555555"
fg_soft = "#7f7f7f"
fg_bright = "#373737"
grey = "#949494"
grey_dim = "#b1b1b1"
grey_neutral = "#868686"
grey_soft = "#a3a3a3"
red = "#dc5284"
orange = "#d06c73"
yellow = "#c48562"
green = "#628562"
aqua = "#008586"
blue = "#0084a3"
purple = "#896788"
tint_green = "#cbd1cb"
tint_red = "#e1c8d1"
statusline = "#d7d7d7"
statusline_accent = "#c9c9c9"
statusline_fg = "#555555"
on_accent = "#e2e2e2"
mode_red = "#dc5284"
mode_green = "#628562"
mode_yellow = "#c48562"
mode_blue = "#0084a3"
mode_purple = "#896788"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
