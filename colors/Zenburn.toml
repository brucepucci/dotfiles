# Zenburn
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#3f3f3f"
foreground = "#dcdccc"
cursor-color = "#73635a"
cursor-text = "#000000"
selection-background = "#21322f"
selection-foreground = "#c2d87a"
palette_0 = "#4d4d4d"
palette_1 = "#7d5d5d"
palette_2 = "#60b48a"
palette_3 = "#f0dfaf"
palette_4 = "#5d6d7d"
palette_5 = "#dc8cc3"
palette_6 = "#8cd0d3"
palette_7 = "#dcdccc"
palette_8 = "#709080"
palette_9 = "#dca3a3"
palette_10 = "#c3bf9f"
palette_11 = "#e0cf9f"
palette_12 = "#94bff3"
palette_13 = "#ec93d3"
palette_14 = "#93e0e3"
palette_15 = "#ffffff"

[roles]
bg = "#3f3f3f"
bg_deep = "#2f2f2f"
surface = "#525250"
fg = "#dcdccc"
fg_soft = "#adada2"
fg_bright = "#ffffff"
grey = "#95958d"
grey_dim = "#767670"
grey_neutral = "#a5a59b"
grey_soft = "#86867e"
red = "#7d5d5d"
orange = "#b69e86"
yellow = "#f0dfaf"
green = "#60b48a"
aqua = "#8cd0d3"
blue = "#5d6d7d"
purple = "#dc8cc3"
tint_green = "#45544c"
tint_red = "#4a4444"
statusline = "#4c4c4a"
statusline_accent = "#5b5b58"
statusline_fg = "#dcdccc"
on_accent = "#3f3f3f"
mode_red = "#7d5d5d"
mode_green = "#60b48a"
mode_yellow = "#f0dfaf"
mode_blue = "#5d6d7d"
mode_purple = "#dc8cc3"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
