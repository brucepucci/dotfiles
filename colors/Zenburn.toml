# Zenburn
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#3f3f3f"
foreground = "#dcdccc"
cursor-color = "#73635a"
cursor-text = "#000000"
selection-background = "#21322f"
selection-foreground = "#c2d87a"
palette_0 = "#3f3f3f"
palette_1 = "#3f3f3f"
palette_2 = "#3f3f3f"
palette_3 = "#3f3f3f"
palette_4 = "#3f3f3f"
palette_5 = "#3f3f3f"
palette_6 = "#3f3f3f"
palette_7 = "#3f3f3f"
palette_8 = "#3f3f3f"
palette_9 = "#3f3f3f"
palette_10 = "#3f3f3f"
palette_11 = "#3f3f3f"
palette_12 = "#3f3f3f"
palette_13 = "#3f3f3f"
palette_14 = "#3f3f3f"
palette_15 = "#3f3f3f"

[roles]
bg = "#3f3f3f"
bg_deep = "#2f2f2f"
surface = "#525250"
fg = "#dcdccc"
