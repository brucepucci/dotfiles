# iTerm2 Pastel Dark Background
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c7c7c7"
cursor-color = "#ffb473"
cursor-text = "#8c8c8c"
selection-background = "#454d96"
selection-foreground = "#f4f4f4"
palette_0 = "#626262"
palette_1 = "#ff8373"
palette_2 = "#b4fb73"
palette_3 = "#fffdc3"
palette_4 = "#a5d5fe"
palette_5 = "#ff90fe"
palette_6 = "#d1d1fe"
palette_7 = "#f1f1f1"
palette_8 = "#8f8f8f"
palette_9 = "#ffc4be"
palette_10 = "#d6fcba"
palette_11 = "#fffed5"
palette_12 = "#c2e3ff"
palette_13 = "#ffb2fe"
palette_14 = "#e6e6fe"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#181818"
fg = "#c7c7c7"
fg_soft = "#8b8b8b"
fg_bright = "#ffffff"
grey = "#6d6d6d"
grey_dim = "#464646"
grey_neutral = "#818181"
grey_soft = "#5a5a5a"
red = "#ff8373"
orange = "#ffc09b"
yellow = "#fffdc3"
green = "#b4fb73"
aqua = "#d1d1fe"
blue = "#a5d5fe"
purple = "#ff90fe"
tint_green = "#202d15"
tint_red = "#2e1815"
statusline = "#101010"
statusline_accent = "#242424"
statusline_fg = "#c7c7c7"
on_accent = "#000000"
mode_red = "#ff8373"
mode_green = "#b4fb73"
mode_yellow = "#fffdc3"
mode_blue = "#a5d5fe"
mode_purple = "#ff90fe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
