palette_2 = "#79ecb3"
palette_3 = "#ece279"
palette_4 = "#a979ec"
palette_5 = "#ec79ec"
palette_6 = "#79ecec"
palette_7 = "#eef4f6"
palette_8 = "#56447a"
palette_9 = "#ef8f8f"
palette_10 = "#9fefbf"
palette_11 = "#efe78f"
palette_12 = "#b78fef"
palette_13 = "#ef8fcf"
palette_14 = "#9fefef"
palette_15 = "#f8fafc"

[roles]
bg = "#241c36"
bg_deep = "#1b1528"
surface = "#3c364d"
fg = "#eef4f6"
