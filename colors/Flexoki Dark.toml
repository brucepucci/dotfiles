palette_2 = "#100f0f"
palette_3 = "#100f0f"
palette_4 = "#100f0f"
palette_5 = "#100f0f"
palette_6 = "#100f0f"
palette_7 = "#100f0f"
palette_8 = "#100f0f"
palette_9 = "#100f0f"
palette_10 = "#100f0f"
palette_11 = "#100f0f"
palette_12 = "#100f0f"
palette_13 = "#100f0f"
palette_14 = "#100f0f"
palette_15 = "#100f0f"

[roles]
