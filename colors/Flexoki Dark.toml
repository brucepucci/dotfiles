# Flexoki Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#100f0f"
foreground = "#cecdc3"
cursor-color = "#cecdc3"
cursor-text = "#100f0f"
selection-background = "#403e3c"
selection-foreground = "#cecdc3"
palette_0 = "#100f0f"
palette_1 = "#d14d41"
palette_2 = "#879a39"
palette_3 = "#d0a215"
palette_4 = "#4385be"
palette_5 = "#ce5d97"
palette_6 = "#3aa99f"
palette_7 = "#878580"
palette_8 = "#575653"
palette_9 = "#af3029"
palette_10 = "#66800b"
palette_11 = "#ad8301"
palette_12 = "#205ea6"
palette_13 = "#a02f6f"
palette_14 = "#24837b"
palette_15 = "#cecdc3"

[roles]
bg = "#100f0f"
bg_deep = "#0c0b0b"
surface = "#272625"
fg = "#cecdc3"
fg_soft = "#95948d"
fg_bright = "#cecdc3"
grey = "#787872"
