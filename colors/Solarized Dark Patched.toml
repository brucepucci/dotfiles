palette_3 = "#a57706"
palette_4 = "#2176c7"
palette_5 = "#c61c6f"
palette_6 = "#259286"
palette_7 = "#eae3cb"
palette_8 = "#475b62"
palette_9 = "#bd3613"
palette_10 = "#475b62"
palette_11 = "#536870"
palette_12 = "#708284"
palette_13 = "#5956ba"
palette_14 = "#819090"
palette_15 = "#fcf4dc"

