palette_7 = "#001e27"
palette_8 = "#001e27"
palette_9 = "#001e27"
palette_10 = "#001e27"
palette_11 = "#001e27"
palette_12 = "#001e27"
palette_13 = "#001e27"
palette_14 = "#001e27"
palette_15 = "#001e27"

