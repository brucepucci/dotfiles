palette_6 = "#1c262b"
palette_7 = "#1c262b"
palette_8 = "#1c262b"
palette_9 = "#1c262b"
palette_10 = "#1c262b"
palette_11 = "#1c262b"
palette_12 = "#1c262b"
palette_13 = "#1c262b"
palette_14 = "#1c262b"
palette_15 = "#1c262b"

[roles]
