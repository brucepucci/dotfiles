# Oceanic Material
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c262b"
foreground = "#c2c8d7"
cursor-color = "#b3b8c3"
cursor-text = "#ffffff"
selection-background = "#6dc2b8"
selection-foreground = "#e8eefd"
palette_0 = "#000000"
palette_1 = "#ee2b2a"
palette_2 = "#40a33f"
palette_3 = "#ffea2e"
palette_4 = "#1e80f0"
palette_5 = "#8800a0"
palette_6 = "#16afca"
palette_7 = "#a4a4a4"
palette_8 = "#777777"
palette_9 = "#dc5c60"
palette_10 = "#70be71"
palette_11 = "#fff163"
palette_12 = "#54a4f3"
palette_13 = "#aa4dbc"
palette_14 = "#42c7da"
palette_15 = "#ffffff"

[roles]
bg = "#1c262b"
bg_deep = "#151c20"
surface = "#303940"
fg = "#c2c8d7"
fg_soft = "#9097a3"
fg_bright = "#ffffff"
grey = "#777f8a"
grey_dim = "#565f67"
grey_neutral = "#888f9b"
grey_soft = "#676f78"
red = "#ee2b2a"
orange = "#f68a2c"
yellow = "#ffea2e"
green = "#40a33f"
aqua = "#16afca"
blue = "#1e80f0"
purple = "#8800a0"
tint_green = "#223c2f"
tint_red = "#42272b"
statusline = "#293339"
statusline_accent = "#3a434a"
statusline_fg = "#c2c8d7"
on_accent = "#1c262b"
mode_red = "#ee2b2a"
mode_green = "#40a33f"
mode_yellow = "#ffea2e"
mode_blue = "#1e80f0"
mode_purple = "#8800a0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
