# Dark Pastel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff5555"
palette_2 = "#55ff55"
palette_3 = "#ffff55"
palette_4 = "#5555ff"
palette_5 = "#ff55ff"
palette_6 = "#55ffff"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#ffffff"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#ff5555"
orange = "#ffaa55"
yellow = "#ffff55"
green = "#55ff55"
aqua = "#55ffff"
blue = "#5555ff"
purple = "#ff55ff"
tint_green = "#0f2e0f"
tint_red = "#2e0f0f"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#000000"
mode_red = "#ff5555"
mode_green = "#55ff55"
mode_yellow = "#ffff55"
mode_blue = "#5555ff"
mode_purple = "#ff55ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
