palette_2 = "#101116"
palette_3 = "#101116"
palette_4 = "#101116"
palette_5 = "#101116"
palette_6 = "#101116"
palette_7 = "#101116"
palette_8 = "#101116"
palette_9 = "#101116"
palette_10 = "#101116"
palette_11 = "#101116"
palette_12 = "#101116"
palette_13 = "#101116"
palette_14 = "#101116"
palette_15 = "#101116"

[roles]
