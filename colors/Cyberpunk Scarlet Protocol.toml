# Cyberpunk Scarlet Protocol
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101116"
foreground = "#e41951"
cursor-color = "#76ff9f"
cursor-text = "#a6a6a6"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#101116"
palette_1 = "#ff0051"
palette_2 = "#01dc84"
palette_3 = "#faf945"
palette_4 = "#0271b6"
palette_5 = "#c930c7"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#60fa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#bd35ec"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#101116"
bg_deep = "#0c0d10"
surface = "#29121d"
fg = "#e41951"
fg_soft = "#a4173f"
fg_bright = "#ffffff"
grey = "#851536"
grey_dim = "#5a142b"
grey_neutral = "#9a163c"
grey_soft = "#6f1531"
red = "#ff0051"
orange = "#fc7c4b"
yellow = "#faf945"
green = "#01dc84"
aqua = "#00c5c7"
blue = "#0271b6"
purple = "#c930c7"
tint_green = "#0d362a"
tint_red = "#3b0e21"
statusline = "#21121b"
statusline_accent = "#361221"
