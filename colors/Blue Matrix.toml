# Blue Matrix
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101116"
foreground = "#00a2ff"
cursor-color = "#76ff9f"
cursor-text = "#a6a6a6"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#101116"
palette_1 = "#ff5680"
palette_2 = "#00ff9c"
palette_3 = "#fffc58"
palette_4 = "#00b0ff"
palette_5 = "#d57bff"
palette_6 = "#76c1ff"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#5ffa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#d682ec"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#101116"
bg_deep = "#0c0d10"
surface = "#0e2232"
fg = "#00a2ff"
fg_soft = "#0576b9"
fg_bright = "#ffffff"
grey = "#076196"
grey_dim = "#0a4468"
grey_neutral = "#066fad"
grey_soft = "#09527f"
red = "#ff5680"
orange = "#ffa96c"
yellow = "#fffc58"
green = "#00ff9c"
aqua = "#76c1ff"
blue = "#00b0ff"
purple = "#d57bff"
tint_green = "#0d3c2e"
tint_red = "#3b1d29"
statusline = "#0f1d29"
statusline_accent = "#0d2b40"
statusline_fg = "#00a2ff"
on_accent = "#101116"
mode_red = "#ff5680"
mode_green = "#00ff9c"
mode_yellow = "#fffc58"
mode_blue = "#00b0ff"
mode_purple = "#d57bff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
