palette_2 = "#0e100a"
palette_3 = "#0e100a"
palette_4 = "#0e100a"
palette_5 = "#0e100a"
palette_6 = "#0e100a"
palette_7 = "#0e100a"
palette_8 = "#0e100a"
palette_9 = "#0e100a"
palette_10 = "#0e100a"
palette_11 = "#0e100a"
palette_12 = "#0e100a"
palette_13 = "#0e100a"
palette_14 = "#0e100a"
palette_15 = "#0e100a"

[roles]
