# Kibble
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e100a"
foreground = "#f7f7f7"
cursor-color = "#9fda9c"
cursor-text = "#000000"
selection-background = "#9ba787"
selection-foreground = "#000000"
palette_0 = "#4d4d4d"
palette_1 = "#c70031"
palette_2 = "#29cf13"
palette_3 = "#d8e30e"
palette_4 = "#3449d1"
palette_5 = "#8400ff"
palette_6 = "#0798ab"
palette_7 = "#e2d1e3"
palette_8 = "#5a5a5a"
palette_9 = "#f01578"
palette_10 = "#6ce05c"
palette_11 = "#f3f79e"
palette_12 = "#97a4f7"
palette_13 = "#c495f0"
palette_14 = "#68f2e0"
palette_15 = "#ffffff"

[roles]
bg = "#0e100a"
bg_deep = "#0a0c08"
surface = "#2a2c26"
fg = "#f7f7f7"
fg_soft = "#b1b2b0"
fg_bright = "#ffffff"
grey = "#8e8f8c"
grey_dim = "#60615d"
grey_neutral = "#a5a6a4"
grey_soft = "#777875"
red = "#c70031"
orange = "#d07220"
yellow = "#d8e30e"
green = "#29cf13"
aqua = "#0798ab"
blue = "#3449d1"
purple = "#8400ff"
tint_green = "#13320c"
tint_red = "#2f0d11"
statusline = "#21221d"
statusline_accent = "#383a35"
statusline_fg = "#f7f7f7"
on_accent = "#f7f7f7"
mode_red = "#c70031"
mode_green = "#29cf13"
mode_yellow = "#d8e30e"
mode_blue = "#3449d1"
mode_purple = "#8400ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
