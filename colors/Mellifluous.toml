palette_6 = "#1a1a1a"
palette_7 = "#1a1a1a"
palette_8 = "#1a1a1a"
palette_9 = "#1a1a1a"
palette_10 = "#1a1a1a"
palette_11 = "#1a1a1a"
palette_12 = "#1a1a1a"
palette_13 = "#1a1a1a"
palette_14 = "#1a1a1a"
palette_15 = "#1a1a1a"

[roles]
bg = "#1a1a1a"
