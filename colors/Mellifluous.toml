# Mellifluous
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#dadada"
cursor-color = "#bfad9e"
cursor-text = "#1a1a1a"
selection-background = "#2d2d2d"
selection-foreground = "#c0af8c"
palette_0 = "#1a1a1a"
palette_1 = "#d29393"
palette_2 = "#b3b393"
palette_3 = "#cbaa89"
palette_4 = "#a8a1be"
palette_5 = "#b39fb0"
palette_6 = "#c0af8c"
palette_7 = "#dadada"
palette_8 = "#5b5b5b"
palette_9 = "#c95954"
palette_10 = "#828040"
palette_11 = "#a6794c"
palette_12 = "#5a6599"
palette_13 = "#9c6995"
palette_14 = "#74a39e"
palette_15 = "#ffffff"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#313131"
fg = "#dadada"
fg_soft = "#a0a0a0"
fg_bright = "#ffffff"
grey = "#848484"
grey_dim = "#5d5d5d"
grey_neutral = "#979797"
grey_soft = "#707070"
red = "#d29393"
orange = "#ce9e8e"
yellow = "#cbaa89"
green = "#b3b393"
aqua = "#c0af8c"
blue = "#a8a1be"
purple = "#b39fb0"
tint_green = "#363630"
tint_red = "#3b3030"
statusline = "#292929"
statusline_accent = "#3d3d3d"
statusline_fg = "#dadada"
on_accent = "#1a1a1a"
mode_red = "#d29393"
mode_green = "#b3b393"
mode_yellow = "#cbaa89"
mode_blue = "#a8a1be"
mode_purple = "#b39fb0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
