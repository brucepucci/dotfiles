# Gruvbox Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fbf1c7"
foreground = "#3c3836"
cursor-color = "#3c3836"
cursor-text = "#fbf1c7"
selection-background = "#3c3836"
selection-foreground = "#fbf1c7"
palette_0 = "#fbf1c7"
palette_1 = "#cc241d"
palette_2 = "#98971a"
palette_3 = "#d79921"
palette_4 = "#458588"
palette_5 = "#b16286"
palette_6 = "#689d6a"
palette_7 = "#7c6f64"
palette_8 = "#928374"
palette_9 = "#9d0006"
palette_10 = "#79740e"
palette_11 = "#b57614"
palette_12 = "#076678"
palette_13 = "#8f3f71"
palette_14 = "#427b58"
palette_15 = "#3c3836"

[roles]
bg = "#fbf1c7"
bg_deep = "#fcf4d5"
surface = "#e4dbb6"
fg = "#3c3836"
