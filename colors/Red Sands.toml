# Red Sands
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#7a251e"
foreground = "#d7c9a7"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#a4a390"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff3f00"
palette_2 = "#00bb00"
palette_3 = "#e7b000"
palette_4 = "#0072ff"
palette_5 = "#bb00bb"
palette_6 = "#00bbbb"
palette_7 = "#bbbbbb"
palette_8 = "#6e6e6e"
palette_9 = "#d41a1a"
palette_10 = "#00bb00"
palette_11 = "#e7b000"
palette_12 = "#0072ae"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#7a251e"
bg_deep = "#5c1c16"
surface = "#85392e"
fg = "#d7c9a7"
fg_soft = "#bb987e"
fg_bright = "#ffffff"
grey = "#ad7f69"
grey_dim = "#9b5e4e"
grey_neutral = "#b69077"
grey_soft = "#a46f5c"
red = "#ff3f00"
orange = "#f37800"
yellow = "#e7b000"
green = "#00bb00"
aqua = "#00bbbb"
blue = "#0072ff"
purple = "#bb00bb"
tint_green = "#644019"
tint_red = "#922a19"
statusline = "#813229"
statusline_accent = "#8b4337"
statusline_fg = "#d7c9a7"
on_accent = "#d7c9a7"
mode_red = "#ff3f00"
mode_green = "#00bb00"
mode_yellow = "#e7b000"
mode_blue = "#0072ff"
mode_purple = "#bb00bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
