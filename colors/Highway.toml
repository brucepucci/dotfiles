# Highway
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222225"
foreground = "#ededed"
cursor-color = "#e0d9b9"
cursor-text = "#1f192a"
selection-background = "#384564"
selection-foreground = "#ededed"
palette_0 = "#000000"
palette_1 = "#d00e18"
palette_2 = "#138034"
palette_3 = "#ffcb3e"
palette_4 = "#006bb3"
palette_5 = "#783482"
palette_6 = "#455271"
palette_7 = "#ededed"
palette_8 = "#5d504a"
palette_9 = "#f07e18"
palette_10 = "#b1d130"
palette_11 = "#fff120"
palette_12 = "#4fc2fd"
palette_13 = "#de0071"
palette_14 = "#5d504a"
palette_15 = "#ffffff"

[roles]
bg = "#222225"
bg_deep = "#1a1a1c"
surface = "#3a3a3d"
fg = "#ededed"
fg_soft = "#b0b0b1"
fg_bright = "#ffffff"
grey = "#929293"
grey_dim = "#69696b"
grey_neutral = "#a6a6a7"
grey_soft = "#7d7d7f"
red = "#d00e18"
orange = "#e86c2b"
yellow = "#ffcb3e"
green = "#138034"
aqua = "#455271"
blue = "#006bb3"
purple = "#783482"
tint_green = "#1f3328"
tint_red = "#411e23"
statusline = "#323235"
statusline_accent = "#474749"
statusline_fg = "#ededed"
on_accent = "#ededed"
mode_red = "#d00e18"
mode_green = "#138034"
mode_yellow = "#ffcb3e"
mode_blue = "#006bb3"
mode_purple = "#783482"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
