bg_deep = "#1a1a1c"
surface = "#3a3a3d"
fg = "#ededed"
fg_soft = "#b0b0b1"
fg_bright = "#222225"
grey = "#929293"
grey_dim = "#69696b"
grey_neutral = "#a6a6a7"
grey_soft = "#7d7d7f"
red = "#222225"
