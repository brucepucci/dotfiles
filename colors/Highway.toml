# Highway
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222225"
foreground = "#ededed"
cursor-color = "#e0d9b9"
cursor-text = "#1f192a"
selection-background = "#384564"
selection-foreground = "#ededed"
palette_0 = "#222225"
palette_1 = "#222225"
palette_2 = "#222225"
palette_3 = "#222225"
palette_4 = "#222225"
palette_5 = "#222225"
palette_6 = "#222225"
palette_7 = "#222225"
palette_8 = "#222225"
palette_9 = "#222225"
palette_10 = "#222225"
palette_11 = "#222225"
palette_12 = "#222225"
palette_13 = "#222225"
palette_14 = "#222225"
palette_15 = "#222225"

[roles]
