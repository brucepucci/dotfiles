# Vibrant Ink
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#878787"
palette_1 = "#ff6600"
palette_2 = "#ccff04"
palette_3 = "#ffcc00"
palette_4 = "#44b4cc"
palette_5 = "#9933cc"
palette_6 = "#44b4cc"
palette_7 = "#f5f5f5"
palette_8 = "#555555"
palette_9 = "#ff0000"
palette_10 = "#00ff00"
palette_11 = "#ffff00"
palette_12 = "#0000ff"
palette_13 = "#ff00ff"
palette_14 = "#00ffff"
palette_15 = "#e5e5e5"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#e5e5e5"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#ff6600"
orange = "#ff9900"
yellow = "#ffcc00"
green = "#ccff04"
aqua = "#44b4cc"
blue = "#44b4cc"
purple = "#9933cc"
tint_green = "#252e01"
tint_red = "#2e1200"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#000000"
mode_red = "#ff6600"
mode_green = "#ccff04"
mode_yellow = "#ffcc00"
mode_blue = "#44b4cc"
mode_purple = "#9933cc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
