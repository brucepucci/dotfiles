palette_6 = "#ebbcba"
palette_7 = "#e0def4"
palette_8 = "#6e6a86"
palette_9 = "#eb6f92"
palette_10 = "#31748f"
palette_11 = "#f6c177"
palette_12 = "#9ccfd8"
palette_13 = "#c4a7e7"
palette_14 = "#ebbcba"
palette_15 = "#e0def4"

[roles]
