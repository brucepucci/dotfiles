# Farmhouse Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e8e4e1"
foreground = "#1d2027"
cursor-color = "#006efe"
cursor-text = "#1d2027"
selection-background = "#b3b1aa"
selection-foreground = "#4d5658"
palette_0 = "#1d2027"
palette_1 = "#8d0003"
palette_2 = "#3a7d00"
palette_3 = "#a95600"
palette_4 = "#092ccd"
palette_5 = "#820046"
palette_6 = "#229256"
palette_7 = "#a8a4a1"
palette_8 = "#394047"
palette_9 = "#eb0009"
palette_10 = "#7ac100"
palette_11 = "#ea9a00"
palette_12 = "#006efe"
palette_13 = "#bf3b7f"
palette_14 = "#00c649"
palette_15 = "#f4eef0"

[roles]
bg = "#e8e4e1"
bg_deep = "#eeebe8"
surface = "#d0cccb"
fg = "#1d2027"
fg_soft = "#5a5b5f"
fg_bright = "#131519"
grey = "#78787b"
grey_dim = "#a19fa0"
grey_neutral = "#646568"
grey_soft = "#8d8c8d"
red = "#8d0003"
orange = "#9b2b02"
yellow = "#a95600"
green = "#3a7d00"
aqua = "#229256"
blue = "#092ccd"
purple = "#820046"
tint_green = "#c9d1b8"
tint_red = "#d8bbb9"
statusline = "#d8d4d2"
statusline_accent = "#c3c1c0"
statusline_fg = "#1d2027"
on_accent = "#e8e4e1"
mode_red = "#8d0003"
