palette_2 = "#e8e4e1"
palette_3 = "#e8e4e1"
palette_4 = "#e8e4e1"
palette_5 = "#e8e4e1"
palette_6 = "#e8e4e1"
palette_7 = "#e8e4e1"
palette_8 = "#e8e4e1"
palette_9 = "#e8e4e1"
palette_10 = "#e8e4e1"
palette_11 = "#e8e4e1"
palette_12 = "#e8e4e1"
palette_13 = "#e8e4e1"
palette_14 = "#e8e4e1"
palette_15 = "#e8e4e1"

[roles]
bg = "#e8e4e1"
bg_deep = "#eeebe8"
surface = "#d0cccb"
fg = "#1d2027"
fg_soft = "#5a5b5f"
fg_bright = "#131519"
grey = "#78787b"
