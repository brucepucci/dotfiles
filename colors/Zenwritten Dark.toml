# Zenwritten Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#191919"
foreground = "#bbbbbb"
cursor-color = "#c9c9c9"
cursor-text = "#191919"
selection-background = "#404040"
selection-foreground = "#bbbbbb"
palette_0 = "#191919"
palette_1 = "#de6e7c"
palette_2 = "#819b69"
palette_3 = "#b77e64"
palette_4 = "#6099c0"
palette_5 = "#b279a7"
palette_6 = "#66a5ad"
palette_7 = "#bbbbbb"
palette_8 = "#4a4546"
palette_9 = "#e8838f"
palette_10 = "#8bae68"
palette_11 = "#d68c67"
palette_12 = "#61abda"
palette_13 = "#cf86c1"
palette_14 = "#65b8c1"
palette_15 = "#8e8e8e"

[roles]
bg = "#191919"
bg_deep = "#131313"
surface = "#2c2c2c"
fg = "#bbbbbb"
fg_soft = "#8a8a8a"
fg_bright = "#8e8e8e"
grey = "#727272"
grey_dim = "#525252"
grey_neutral = "#828282"
grey_soft = "#626262"
red = "#de6e7c"
