# ENCOM
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#00a595"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#00a48c"
selection-foreground = "#3de1c9"
palette_0 = "#000000"
palette_1 = "#9f0000"
palette_2 = "#008b00"
palette_3 = "#ffd000"
palette_4 = "#0081ff"
palette_5 = "#bc00ca"
palette_6 = "#008b8b"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff0000"
palette_10 = "#00ee00"
palette_11 = "#ffff00"
palette_12 = "#0000ff"
palette_13 = "#ff00ff"
palette_14 = "#00cdcd"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#001412"
fg = "#00a595"
fg_soft = "#007468"
fg_bright = "#ffffff"
grey = "#005b52"
grey_dim = "#003a34"
grey_neutral = "#006b61"
grey_soft = "#004a43"
red = "#9f0000"
orange = "#cf6800"
yellow = "#ffd000"
green = "#008b00"
aqua = "#008b8b"
blue = "#0081ff"
purple = "#bc00ca"
tint_green = "#001900"
tint_red = "#1d0000"
statusline = "#000d0c"
statusline_accent = "#001e1b"
statusline_fg = "#00a595"
on_accent = "#000000"
mode_red = "#9f0000"
mode_green = "#008b00"
mode_yellow = "#ffd000"
mode_blue = "#0081ff"
mode_purple = "#bc00ca"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
