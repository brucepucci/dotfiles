# Blazer
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d1926"
foreground = "#d9e6f2"
cursor-color = "#d9e6f2"
cursor-text = "#0d1926"
selection-background = "#c1ddff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#b87a7a"
palette_2 = "#7ab87a"
palette_3 = "#b8b87a"
palette_4 = "#7a7ab8"
palette_5 = "#b87ab8"
palette_6 = "#7ab8b8"
palette_7 = "#d9d9d9"
palette_8 = "#4c4c4c"
palette_9 = "#dbbdbd"
palette_10 = "#bddbbd"
palette_11 = "#dbdbbd"
palette_12 = "#bdbddb"
palette_13 = "#dbbddb"
palette_14 = "#bddbdb"
palette_15 = "#ffffff"

[roles]
bg = "#0d1926"
bg_deep = "#0a131c"
surface = "#25323e"
fg = "#d9e6f2"
fg_soft = "#9ca8b5"
fg_bright = "#ffffff"
grey = "#7d8a96"
grey_dim = "#54616d"
grey_neutral = "#929eab"
grey_soft = "#697582"
red = "#b87a7a"
orange = "#b8997a"
yellow = "#b8b87a"
green = "#7ab87a"
aqua = "#7ab8b8"
blue = "#7a7ab8"
purple = "#b87ab8"
tint_green = "#213635"
tint_red = "#2c2a35"
statusline = "#1d2936"
