# Monokai Soda
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#c4c5b5"
cursor-color = "#f6f7ec"
cursor-text = "#b7b8a8"
selection-background = "#343434"
selection-foreground = "#c4c5b5"
palette_0 = "#1a1a1a"
palette_1 = "#f4005f"
palette_2 = "#98e024"
palette_3 = "#fa8419"
palette_4 = "#9d65ff"
palette_5 = "#f4005f"
palette_6 = "#58d1eb"
palette_7 = "#c4c5b5"
palette_8 = "#625e4c"
palette_9 = "#f4005f"
palette_10 = "#98e024"
palette_11 = "#e0d561"
palette_12 = "#9d65ff"
palette_13 = "#f4005f"
palette_14 = "#58d1eb"
palette_15 = "#f6f6ef"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#2e2f2d"
fg = "#c4c5b5"
