# Andromeda
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#262a33"
foreground = "#e5e5e5"
cursor-color = "#f8f8f0"
cursor-text = "#b5b5a8"
selection-background = "#5a5c62"
selection-foreground = "#ece7e7"
palette_0 = "#000000"
palette_1 = "#cd3131"
palette_2 = "#05bc79"
palette_3 = "#e5e512"
palette_4 = "#2472c8"
palette_5 = "#bc3fbc"
palette_6 = "#0fa8cd"
palette_7 = "#e5e5e5"
palette_8 = "#666666"
palette_9 = "#cd3131"
palette_10 = "#05bc79"
palette_11 = "#e5e512"
palette_12 = "#2472c8"
palette_13 = "#bc3fbc"
palette_14 = "#0fa8cd"
palette_15 = "#e5e5e5"

[roles]
bg = "#262a33"
bg_deep = "#1c2026"
surface = "#3d4048"
fg = "#e5e5e5"
fg_soft = "#acadb0"
fg_bright = "#e5e5e5"
grey = "#8f9195"
grey_dim = "#696b71"
grey_neutral = "#a2a4a7"
grey_soft = "#7c7e83"
red = "#cd3131"
orange = "#d98b22"
yellow = "#e5e512"
green = "#05bc79"
aqua = "#0fa8cd"
blue = "#2472c8"
purple = "#bc3fbc"
tint_green = "#204440"
