# Espresso
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#323232"
foreground = "#ffffff"
cursor-color = "#d6d6d6"
cursor-text = "#999999"
selection-background = "#5b5b5b"
selection-foreground = "#ffffff"
palette_0 = "#353535"
palette_1 = "#d25252"
palette_2 = "#a5c261"
palette_3 = "#ffc66d"
palette_4 = "#6c99bb"
palette_5 = "#d197d9"
palette_6 = "#bed6ff"
palette_7 = "#eeeeec"
palette_8 = "#606060"
palette_9 = "#f00c0c"
palette_10 = "#c2e075"
palette_11 = "#e1e48b"
palette_12 = "#8ab7d9"
palette_13 = "#efb5f7"
palette_14 = "#dcf4ff"
palette_15 = "#ffffff"

[roles]
bg = "#323232"
bg_deep = "#262626"
surface = "#4b4b4b"
fg = "#ffffff"
fg_soft = "#c2c2c2"
fg_bright = "#ffffff"
grey = "#a3a3a3"
grey_dim = "#7a7a7a"
grey_neutral = "#b7b7b7"
grey_soft = "#8e8e8e"
red = "#d25252"
orange = "#e88c60"
yellow = "#ffc66d"
green = "#a5c261"
aqua = "#bed6ff"
blue = "#6c99bb"
purple = "#d197d9"
tint_green = "#474c3a"
tint_red = "#4f3838"
statusline = "#424242"
statusline_accent = "#575757"
statusline_fg = "#ffffff"
on_accent = "#323232"
mode_red = "#d25252"
mode_green = "#a5c261"
mode_yellow = "#ffc66d"
mode_blue = "#6c99bb"
mode_purple = "#d197d9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
