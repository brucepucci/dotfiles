# GitHub Light High Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#0e1116"
cursor-color = "#0349b4"
cursor-text = "#367ce7"
selection-background = "#0e1116"
selection-foreground = "#ffffff"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e2e2e3"
fg = "#0e1116"
fg_soft = "#56585c"
fg_bright = "#090b0e"
grey = "#7a7c7f"
grey_dim = "#abacad"
grey_neutral = "#626468"
grey_soft = "#939496"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
blue = "#ffffff"
purple = "#ffffff"
