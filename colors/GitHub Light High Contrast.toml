# GitHub Light High Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#0e1116"
cursor-color = "#0349b4"
cursor-text = "#367ce7"
selection-background = "#0e1116"
selection-foreground = "#ffffff"
palette_0 = "#0e1116"
palette_1 = "#a0111f"
palette_2 = "#024c1a"
palette_3 = "#3f2200"
palette_4 = "#0349b4"
palette_5 = "#622cbc"
palette_6 = "#1b7c83"
palette_7 = "#66707b"
palette_8 = "#4b535d"
palette_9 = "#86061d"
palette_10 = "#055d20"
palette_11 = "#4e2c00"
palette_12 = "#1168e3"
palette_13 = "#844ae7"
palette_14 = "#3192aa"
palette_15 = "#88929d"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e2e2e3"
fg = "#0e1116"
fg_soft = "#56585c"
fg_bright = "#090b0e"
grey = "#7a7c7f"
grey_dim = "#abacad"
grey_neutral = "#626468"
grey_soft = "#939496"
red = "#a0111f"
orange = "#701a10"
yellow = "#3f2200"
green = "#024c1a"
aqua = "#1b7c83"
blue = "#0349b4"
purple = "#622cbc"
tint_green = "#d1dfd6"
tint_red = "#eed4d7"
statusline = "#ececec"
statusline_accent = "#d4d4d5"
statusline_fg = "#0e1116"
on_accent = "#ffffff"
mode_red = "#a0111f"
mode_green = "#024c1a"
mode_yellow = "#3f2200"
mode_blue = "#0349b4"
