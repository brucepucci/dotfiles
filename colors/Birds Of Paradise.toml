# Birds Of Paradise
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2a1f1d"
foreground = "#e0dbb7"
cursor-color = "#644a33"
cursor-text = "#8a7059"
selection-background = "#563c27"
selection-foreground = "#e0dbbb"
palette_0 = "#573d26"
palette_1 = "#be2d26"
palette_2 = "#6ba18a"
palette_3 = "#e99d2a"
palette_4 = "#5a86ad"
palette_5 = "#ac80a6"
palette_6 = "#74a6ad"
palette_7 = "#e0dbb7"
palette_8 = "#9b6c4a"
palette_9 = "#e84627"
palette_10 = "#95d8ba"
palette_11 = "#d0d150"
palette_12 = "#b8d3ed"
palette_13 = "#d19ecb"
palette_14 = "#93cfd7"
palette_15 = "#fff9d5"

[roles]
bg = "#2a1f1d"
bg_deep = "#201716"
surface = "#40362f"
fg = "#e0dbb7"
fg_soft = "#a9a389"
