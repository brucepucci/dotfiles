# Galizur
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#071317"
foreground = "#ddeeff"
cursor-color = "#ddeeff"
cursor-text = "#071317"
selection-background = "#071317"
selection-foreground = "#ddeeff"
palette_0 = "#223344"
palette_1 = "#aa1122"
palette_2 = "#33aa11"
palette_3 = "#ccaa22"
palette_4 = "#2255cc"
palette_5 = "#7755aa"
palette_6 = "#22bbdd"
palette_7 = "#8899aa"
palette_8 = "#556677"
palette_9 = "#ff1133"
palette_10 = "#33ff11"
palette_11 = "#ffdd33"
palette_12 = "#3377ff"
palette_13 = "#aa77ff"
palette_14 = "#33ddff"
palette_15 = "#bbccdd"

[roles]
bg = "#071317"
bg_deep = "#050e11"
surface = "#212d33"
fg = "#ddeeff"
fg_soft = "#9dacb9"
fg_bright = "#bbccdd"
grey = "#7d8b97"
grey_dim = "#526068"
grey_neutral = "#92a1ae"
grey_soft = "#67767f"
red = "#aa1122"
orange = "#bb5e22"
yellow = "#ccaa22"
green = "#33aa11"
aqua = "#22bbdd"
blue = "#2255cc"
