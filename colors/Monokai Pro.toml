# Monokai Pro
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2d2a2e"
foreground = "#fcfcfa"
cursor-color = "#c1c0c0"
cursor-text = "#8e8d8d"
selection-background = "#5b595c"
selection-foreground = "#fcfcfa"
palette_0 = "#2d2a2e"
palette_1 = "#ff6188"
palette_2 = "#a9dc76"
palette_3 = "#ffd866"
palette_4 = "#fc9867"
palette_5 = "#ab9df2"
palette_6 = "#78dce8"
palette_7 = "#fcfcfa"
palette_8 = "#727072"
palette_9 = "#ff6188"
palette_10 = "#a9dc76"
palette_11 = "#ffd866"
palette_12 = "#fc9867"
palette_13 = "#ab9df2"
palette_14 = "#78dce8"
palette_15 = "#fcfcfa"

[roles]
bg = "#2d2a2e"
bg_deep = "#222022"
surface = "#464346"
fg = "#fcfcfa"
fg_soft = "#bebdbd"
fg_bright = "#fcfcfa"
grey = "#9f9e9e"
grey_dim = "#757475"
grey_neutral = "#b4b2b3"
grey_soft = "#8a888a"
red = "#ff6188"
orange = "#ff9c77"
yellow = "#ffd866"
green = "#a9dc76"
aqua = "#78dce8"
blue = "#fc9867"
purple = "#ab9df2"
tint_green = "#434a3b"
tint_red = "#53343e"
statusline = "#3e3b3e"
statusline_accent = "#525053"
statusline_fg = "#fcfcfa"
on_accent = "#2d2a2e"
mode_red = "#ff6188"
mode_green = "#a9dc76"
mode_yellow = "#ffd866"
mode_blue = "#fc9867"
mode_purple = "#ab9df2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
