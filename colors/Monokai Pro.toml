# Monokai Pro
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2d2a2e"
foreground = "#fcfcfa"
cursor-color = "#c1c0c0"
cursor-text = "#8e8d8d"
selection-background = "#5b595c"
selection-foreground = "#fcfcfa"
palette_0 = "#2d2a2e"
palette_1 = "#2d2a2e"
palette_2 = "#2d2a2e"
palette_3 = "#2d2a2e"
palette_4 = "#2d2a2e"
palette_5 = "#2d2a2e"
palette_6 = "#2d2a2e"
palette_7 = "#2d2a2e"
palette_8 = "#2d2a2e"
palette_9 = "#2d2a2e"
palette_10 = "#2d2a2e"
palette_11 = "#2d2a2e"
palette_12 = "#2d2a2e"
palette_13 = "#2d2a2e"
palette_14 = "#2d2a2e"
palette_15 = "#2d2a2e"

[roles]
bg = "#2d2a2e"
bg_deep = "#222022"
surface = "#464346"
fg = "#fcfcfa"
fg_soft = "#bebdbd"
