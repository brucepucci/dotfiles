# Firefly Traditional
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#f5f5f5"
cursor-color = "#00f900"
cursor-text = "#999999"
selection-background = "#cfeac6"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c23720"
palette_2 = "#33bc26"
palette_3 = "#afad24"
palette_4 = "#5a63ff"
palette_5 = "#d53ad2"
palette_6 = "#33bbc7"
palette_7 = "#cccccc"
palette_8 = "#828282"
palette_9 = "#ff3b1e"
palette_10 = "#2ee720"
palette_11 = "#ecec16"
palette_12 = "#838dff"
palette_13 = "#ff5cfe"
palette_14 = "#29f0f0"
palette_15 = "#ebebeb"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1d1d1d"
fg = "#f5f5f5"
fg_soft = "#acacac"
fg_bright = "#ebebeb"
grey = "#878787"
grey_dim = "#565656"
grey_neutral = "#9f9f9f"
grey_soft = "#6e6e6e"
red = "#c23720"
orange = "#b87222"
yellow = "#afad24"
green = "#33bc26"
aqua = "#33bbc7"
blue = "#5a63ff"
purple = "#d53ad2"
tint_green = "#092207"
tint_red = "#230a06"
statusline = "#141414"
statusline_accent = "#2c2c2c"
statusline_fg = "#f5f5f5"
on_accent = "#f5f5f5"
mode_red = "#c23720"
mode_green = "#33bc26"
mode_yellow = "#afad24"
mode_blue = "#5a63ff"
mode_purple = "#d53ad2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
