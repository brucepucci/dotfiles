# Lab Fox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e2e2e"
foreground = "#ffffff"
cursor-color = "#7f7f7f"
cursor-text = "#b2b2b2"
selection-background = "#cb392e"
selection-foreground = "#ffffff"
palette_0 = "#2e2e2e"
palette_1 = "#2e2e2e"
palette_2 = "#2e2e2e"
palette_3 = "#2e2e2e"
palette_4 = "#2e2e2e"
palette_5 = "#2e2e2e"
palette_6 = "#2e2e2e"
palette_7 = "#2e2e2e"
palette_8 = "#2e2e2e"
palette_9 = "#2e2e2e"
palette_10 = "#2e2e2e"
palette_11 = "#2e2e2e"
palette_12 = "#2e2e2e"
palette_13 = "#2e2e2e"
palette_14 = "#2e2e2e"
palette_15 = "#2e2e2e"

[roles]
bg = "#2e2e2e"
bg_deep = "#222222"
surface = "#474747"
fg = "#ffffff"
fg_soft = "#c0c0c0"
fg_bright = "#2e2e2e"
grey = "#a1a1a1"
grey_dim = "#777777"
grey_neutral = "#b6b6b6"
grey_soft = "#8c8c8c"
red = "#2e2e2e"
orange = "#2e2e2e"
yellow = "#2e2e2e"
green = "#2e2e2e"
aqua = "#2e2e2e"
blue = "#2e2e2e"
purple = "#2e2e2e"
