# Lab Fox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e2e2e"
foreground = "#ffffff"
cursor-color = "#7f7f7f"
cursor-text = "#b2b2b2"
selection-background = "#cb392e"
selection-foreground = "#ffffff"
palette_0 = "#2e2e2e"
palette_1 = "#fc6d26"
palette_2 = "#3eb383"
palette_3 = "#fca121"
palette_4 = "#db3b21"
palette_5 = "#6b40a8"
palette_6 = "#6e49cb"
palette_7 = "#ffffff"
palette_8 = "#535353"
palette_9 = "#ff6517"
palette_10 = "#53eaa8"
palette_11 = "#fca013"
palette_12 = "#db501f"
palette_13 = "#6a36b6"
palette_14 = "#7d53e7"
palette_15 = "#ffffff"

[roles]
bg = "#2e2e2e"
bg_deep = "#222222"
surface = "#474747"
fg = "#ffffff"
fg_soft = "#c0c0c0"
fg_bright = "#ffffff"
grey = "#a1a1a1"
grey_dim = "#777777"
grey_neutral = "#b6b6b6"
grey_soft = "#8c8c8c"
red = "#fc6d26"
orange = "#fc8724"
yellow = "#fca121"
green = "#3eb383"
aqua = "#6e49cb"
blue = "#db3b21"
purple = "#6b40a8"
tint_green = "#31463d"
tint_red = "#53392d"
statusline = "#3f3f3f"
statusline_accent = "#545454"
statusline_fg = "#ffffff"
on_accent = "#2e2e2e"
mode_red = "#fc6d26"
mode_green = "#3eb383"
mode_yellow = "#fca121"
mode_blue = "#db3b21"
mode_purple = "#6b40a8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
