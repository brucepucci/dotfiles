# Cobalt Next
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#162c35"
foreground = "#d7deea"
cursor-color = "#ffc64c"
cursor-text = "#8a919d"
selection-background = "#4c5b67"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ff527b"
palette_2 = "#8cc98f"
palette_3 = "#ffc64c"
palette_4 = "#409dd4"
palette_5 = "#cba3c7"
palette_6 = "#37b5b4"
palette_7 = "#d7deea"
palette_8 = "#62747f"
palette_9 = "#e47e8b"
palette_10 = "#baddbb"
palette_11 = "#ffdc91"
palette_12 = "#7ac0eb"
palette_13 = "#f3ccef"
palette_14 = "#84e4e3"
palette_15 = "#ffffff"

[roles]
bg = "#162c35"
bg_deep = "#102128"
surface = "#2d414b"
fg = "#d7deea"
