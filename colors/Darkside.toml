palette_2 = "#222324"
palette_3 = "#222324"
palette_4 = "#222324"
palette_5 = "#222324"
palette_6 = "#222324"
palette_7 = "#222324"
palette_8 = "#222324"
palette_9 = "#222324"
palette_10 = "#222324"
palette_11 = "#222324"
palette_12 = "#222324"
palette_13 = "#222324"
palette_14 = "#222324"
palette_15 = "#222324"

[roles]
