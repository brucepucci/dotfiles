# Darkside
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222324"
foreground = "#bababa"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#303333"
selection-foreground = "#bababa"
palette_0 = "#000000"
palette_1 = "#e8341c"
palette_2 = "#68c256"
palette_3 = "#f2d42c"
palette_4 = "#1c98e8"
palette_5 = "#8e69c9"
palette_6 = "#1c98e8"
palette_7 = "#bababa"
palette_8 = "#4c4c4c"
palette_9 = "#e05a4f"
palette_10 = "#77b869"
palette_11 = "#efd64b"
palette_12 = "#387cd3"
palette_13 = "#957bbe"
palette_14 = "#3d97e2"
palette_15 = "#bababa"

[roles]
bg = "#222324"
bg_deep = "#1a1a1b"
surface = "#343536"
fg = "#bababa"
fg_soft = "#8c8d8d"
fg_bright = "#bababa"
grey = "#767676"
grey_dim = "#575858"
grey_neutral = "#858586"
grey_soft = "#666768"
red = "#e8341c"
orange = "#ed8424"
yellow = "#f2d42c"
green = "#68c256"
aqua = "#1c98e8"
blue = "#1c98e8"
purple = "#8e69c9"
tint_green = "#2f402d"
tint_red = "#462623"
statusline = "#2e2f30"
statusline_accent = "#3d3e3f"
statusline_fg = "#bababa"
on_accent = "#222324"
mode_red = "#e8341c"
mode_green = "#68c256"
mode_yellow = "#f2d42c"
mode_blue = "#1c98e8"
mode_purple = "#8e69c9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
