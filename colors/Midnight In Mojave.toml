# Midnight In Mojave
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#ffffff"
cursor-color = "#32d74b"
cursor-text = "#1c1c1c"
selection-background = "#4a504d"
selection-foreground = "#ffffff"
palette_0 = "#1e1e1e"
palette_1 = "#1e1e1e"
palette_2 = "#1e1e1e"
palette_3 = "#1e1e1e"
palette_4 = "#1e1e1e"
palette_5 = "#1e1e1e"
palette_6 = "#1e1e1e"
palette_7 = "#1e1e1e"
palette_8 = "#1e1e1e"
palette_9 = "#1e1e1e"
palette_10 = "#1e1e1e"
palette_11 = "#1e1e1e"
palette_12 = "#1e1e1e"
palette_13 = "#1e1e1e"
palette_14 = "#1e1e1e"
palette_15 = "#1e1e1e"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#393939"
fg = "#ffffff"
fg_soft = "#bcbcbc"
fg_bright = "#1e1e1e"
grey = "#9a9a9a"
grey_dim = "#6d6d6d"
grey_neutral = "#b0b0b0"
grey_soft = "#838383"
red = "#1e1e1e"
orange = "#1e1e1e"
yellow = "#1e1e1e"
green = "#1e1e1e"
aqua = "#1e1e1e"
blue = "#1e1e1e"
purple = "#1e1e1e"
tint_green = "#1e1e1e"
