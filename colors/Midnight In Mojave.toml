# Midnight In Mojave
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#ffffff"
cursor-color = "#32d74b"
cursor-text = "#1c1c1c"
selection-background = "#4a504d"
selection-foreground = "#ffffff"
palette_0 = "#1e1e1e"
palette_1 = "#ff453a"
palette_2 = "#32d74b"
palette_3 = "#ffd60a"
palette_4 = "#0a84ff"
palette_5 = "#bf5af2"
palette_6 = "#5ac8fa"
palette_7 = "#ffffff"
palette_8 = "#515151"
palette_9 = "#ff453a"
palette_10 = "#32d74b"
palette_11 = "#ffd60a"
palette_12 = "#0a84ff"
palette_13 = "#bf5af2"
palette_14 = "#5ac8fa"
palette_15 = "#ffffff"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#393939"
fg = "#ffffff"
fg_soft = "#bcbcbc"
fg_bright = "#ffffff"
grey = "#9a9a9a"
grey_dim = "#6d6d6d"
grey_neutral = "#b0b0b0"
grey_soft = "#838383"
red = "#ff453a"
orange = "#ff8e22"
yellow = "#ffd60a"
green = "#32d74b"
aqua = "#5ac8fa"
blue = "#0a84ff"
purple = "#bf5af2"
tint_green = "#223f26"
tint_red = "#462523"
statusline = "#303030"
statusline_accent = "#464646"
statusline_fg = "#ffffff"
on_accent = "#1e1e1e"
mode_red = "#ff453a"
mode_green = "#32d74b"
mode_yellow = "#ffd60a"
mode_blue = "#0a84ff"
mode_purple = "#bf5af2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
