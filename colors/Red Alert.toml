# Red Alert
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#762423"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#762423"
selection-background = "#073642"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#d62e4e"
palette_2 = "#71be6b"
palette_3 = "#beb86b"
palette_4 = "#489bee"
palette_5 = "#e979d7"
palette_6 = "#6bbeb8"
palette_7 = "#d6d6d6"
palette_8 = "#666666"
palette_9 = "#e02553"
palette_10 = "#aff08c"
palette_11 = "#dfddb7"
palette_12 = "#65aaf1"
palette_13 = "#ddb7df"
palette_14 = "#b7dfdd"
palette_15 = "#ffffff"

[roles]
bg = "#762423"
bg_deep = "#581b1a"
surface = "#863e3d"
fg = "#ffffff"
fg_soft = "#d6bdbd"
fg_bright = "#ffffff"
grey = "#c19c9c"
grey_dim = "#a67170"
grey_neutral = "#cfb2b2"
grey_soft = "#b48786"
red = "#d62e4e"
orange = "#ca735c"
yellow = "#beb86b"
