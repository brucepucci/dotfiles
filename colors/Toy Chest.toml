palette_9 = "#dd5944"
palette_10 = "#31d07b"
palette_11 = "#e7d84b"
palette_12 = "#34a6da"
palette_13 = "#ae6bdc"
palette_14 = "#42c3ae"
palette_15 = "#d5d5d5"

