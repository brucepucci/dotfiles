# Sakura
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#18131e"
foreground = "#dd7bdc"
cursor-color = "#ff65fd"
cursor-text = "#24242e"
selection-background = "#c05cbf"
selection-foreground = "#24242e"
palette_0 = "#000000"
palette_1 = "#d52370"
palette_2 = "#41af1a"
palette_3 = "#bc7053"
palette_4 = "#6964ab"
palette_5 = "#c71fbf"
palette_6 = "#939393"
palette_7 = "#998eac"
palette_8 = "#786d69"
palette_9 = "#f41d99"
palette_10 = "#22e529"
palette_11 = "#f59574"
palette_12 = "#9892f1"
palette_13 = "#e90cdd"
palette_14 = "#eeeeee"
palette_15 = "#cbb6ff"

[roles]
bg = "#18131e"
bg_deep = "#120e16"
surface = "#301f35"
fg = "#dd7bdc"
fg_soft = "#a25ca3"
fg_bright = "#cbb6ff"
grey = "#844c86"
grey_dim = "#5d3760"
grey_neutral = "#98579a"
grey_soft = "#714273"
red = "#d52370"
orange = "#c84a62"
yellow = "#bc7053"
green = "#41af1a"
aqua = "#939393"
blue = "#6964ab"
purple = "#c71fbf"
tint_green = "#1f2f1d"
tint_red = "#3a162d"
statusline = "#281b2d"
statusline_accent = "#3b2640"
