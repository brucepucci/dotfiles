palette_7 = "#18131e"
palette_8 = "#18131e"
palette_9 = "#18131e"
palette_10 = "#18131e"
palette_11 = "#18131e"
palette_12 = "#18131e"
palette_13 = "#18131e"
palette_14 = "#18131e"
palette_15 = "#18131e"

