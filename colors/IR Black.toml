# IR Black
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#f1f1f1"
cursor-color = "#808080"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#4f4f4f"
palette_1 = "#fa6c60"
palette_2 = "#a8ff60"
palette_3 = "#fffeb7"
palette_4 = "#96cafe"
palette_5 = "#fa73fd"
palette_6 = "#c6c5fe"
palette_7 = "#efedef"
palette_8 = "#7b7b7b"
palette_9 = "#fcb6b0"
palette_10 = "#cfffab"
palette_11 = "#ffffcc"
palette_12 = "#b5dcff"
palette_13 = "#fb9cfe"
palette_14 = "#e0e0fe"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1d1d1d"
fg = "#f1f1f1"
fg_soft = "#a9a9a9"
fg_bright = "#ffffff"
grey = "#858585"
grey_dim = "#545454"
grey_neutral = "#9d9d9d"
grey_soft = "#6c6c6c"
red = "#fa6c60"
orange = "#fcb58c"
yellow = "#fffeb7"
green = "#a8ff60"
aqua = "#c6c5fe"
blue = "#96cafe"
purple = "#fa73fd"
tint_green = "#1e2e11"
tint_red = "#2d1311"
statusline = "#131313"
statusline_accent = "#2b2b2b"
statusline_fg = "#f1f1f1"
on_accent = "#000000"
mode_red = "#fa6c60"
mode_green = "#a8ff60"
mode_yellow = "#fffeb7"
mode_blue = "#96cafe"
mode_purple = "#fa73fd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
