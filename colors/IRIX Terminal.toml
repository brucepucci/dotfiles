# IRIX Terminal
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000043"
foreground = "#f2f2f2"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#c2deff"
selection-foreground = "#000000"
palette_0 = "#1a1919"
palette_1 = "#ff2b1e"
palette_2 = "#57ff3d"
palette_3 = "#ffff44"
palette_4 = "#0004ff"
palette_5 = "#ff2cff"
palette_6 = "#56ffff"
palette_7 = "#ffffff"
palette_8 = "#ffff44"
palette_9 = "#ffff44"
palette_10 = "#ffff44"
palette_11 = "#fffc72"
palette_12 = "#ffff44"
palette_13 = "#ffff44"
palette_14 = "#ffff44"
palette_15 = "#ffff44"

[roles]
bg = "#000043"
bg_deep = "#000032"
surface = "#1d1d58"
fg = "#f2f2f2"
fg_soft = "#a9a9be"
fg_bright = "#ffff44"
grey = "#8585a3"
grey_dim = "#555580"
grey_neutral = "#9d9db5"
grey_soft = "#6d6d92"
red = "#ff2b1e"
orange = "#ff9531"
yellow = "#ffff44"
green = "#57ff3d"
aqua = "#56ffff"
blue = "#0004ff"
purple = "#ff2cff"
tint_green = "#102e42"
tint_red = "#2e083c"
statusline = "#131351"
statusline_accent = "#2c2c62"
statusline_fg = "#f2f2f2"
on_accent = "#000043"
mode_red = "#ff2b1e"
mode_green = "#57ff3d"
mode_yellow = "#ffff44"
mode_blue = "#0004ff"
mode_purple = "#ff2cff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
