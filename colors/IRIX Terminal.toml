# IRIX Terminal
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000043"
foreground = "#f2f2f2"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#c2deff"
selection-foreground = "#000000"
palette_0 = "#000043"
palette_1 = "#000043"
palette_2 = "#000043"
palette_3 = "#000043"
palette_4 = "#000043"
palette_5 = "#000043"
palette_6 = "#000043"
palette_7 = "#000043"
palette_8 = "#000043"
palette_9 = "#000043"
palette_10 = "#000043"
palette_11 = "#000043"
palette_12 = "#000043"
palette_13 = "#000043"
palette_14 = "#000043"
palette_15 = "#000043"

[roles]
bg = "#000043"
bg_deep = "#000032"
surface = "#1d1d58"
fg = "#f2f2f2"
fg_soft = "#a9a9be"
fg_bright = "#000043"
grey = "#8585a3"
grey_dim = "#555580"
grey_neutral = "#9d9db5"
grey_soft = "#6d6d92"
red = "#000043"
orange = "#000043"
yellow = "#000043"
green = "#000043"
aqua = "#000043"
blue = "#000043"
purple = "#000043"
tint_green = "#000043"
tint_red = "#000043"
statusline = "#131351"
statusline_accent = "#2c2c62"
statusline_fg = "#f2f2f2"
on_accent = "#f2f2f2"
mode_red = "#000043"
mode_green = "#000043"
mode_yellow = "#000043"
mode_blue = "#000043"
mode_purple = "#000043"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
