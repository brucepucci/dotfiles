palette_2 = "#010515"
palette_3 = "#010515"
palette_4 = "#010515"
palette_5 = "#010515"
palette_6 = "#010515"
palette_7 = "#010515"
palette_8 = "#010515"
palette_9 = "#010515"
palette_10 = "#010515"
palette_11 = "#010515"
palette_12 = "#010515"
palette_13 = "#010515"
palette_14 = "#010515"
palette_15 = "#010515"

[roles]
bg = "#010515"
bg_deep = "#010410"
surface = "#031a31"
fg = "#11b7ff"
fg_soft = "#0c82b9"
fg_bright = "#010515"
grey = "#0a6796"
