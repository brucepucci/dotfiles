# Purplepeter
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2a1a4a"
foreground = "#ece7fa"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#8689c2"
selection-foreground = "#271c50"
palette_0 = "#0a0520"
palette_1 = "#ff796d"
palette_2 = "#99b481"
palette_3 = "#efdfac"
palette_4 = "#66d9ef"
palette_5 = "#e78fcd"
palette_6 = "#ba8cff"
palette_7 = "#ffba81"
palette_8 = "#504b63"
palette_9 = "#f99f92"
palette_10 = "#b4be8f"
palette_11 = "#f2e9bf"
palette_12 = "#79daed"
palette_13 = "#ba91d4"
palette_14 = "#a0a0d6"
palette_15 = "#b9aed3"

[roles]
bg = "#2a1a4a"
bg_deep = "#201438"
surface = "#41335f"
fg = "#ece7fa"
fg_soft = "#b2aac5"
fg_bright = "#b9aed3"
grey = "#958bab"
grey_dim = "#6e6288"
grey_neutral = "#a89fbc"
grey_soft = "#817699"
red = "#ff796d"
orange = "#f7ac8c"
yellow = "#efdfac"
green = "#99b481"
aqua = "#ba8cff"
blue = "#66d9ef"
purple = "#e78fcd"
tint_green = "#3e3654"
tint_red = "#502b50"
statusline = "#3a2a58"
statusline_accent = "#4d3f6a"
statusline_fg = "#ece7fa"
on_accent = "#2a1a4a"
mode_red = "#ff796d"
mode_green = "#99b481"
mode_yellow = "#efdfac"
mode_blue = "#66d9ef"
mode_purple = "#e78fcd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
