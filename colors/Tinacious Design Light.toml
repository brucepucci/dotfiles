# Tinacious Design Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f8f8ff"
foreground = "#1d1d26"
cursor-color = "#b1b1d6"
cursor-text = "#ffffff"
selection-background = "#ff3399"
selection-foreground = "#ffffff"
palette_0 = "#1d1d26"
palette_1 = "#ff3399"
palette_2 = "#00d364"
palette_3 = "#e5b24d"
palette_4 = "#00cbff"
palette_5 = "#cc66ff"
palette_6 = "#00ceca"
palette_7 = "#b1b1d6"
palette_8 = "#636667"
palette_9 = "#ff2f92"
palette_10 = "#00d364"
palette_11 = "#d9ae53"
palette_12 = "#00cbff"
palette_13 = "#d783ff"
palette_14 = "#00c8c7"
palette_15 = "#d5d6f3"

[roles]
bg = "#f8f8ff"
bg_deep = "#fafaff"
surface = "#dedee5"
fg = "#1d1d26"
fg_soft = "#5f5f67"
fg_bright = "#131319"
grey = "#808088"
grey_dim = "#ababb3"
grey_neutral = "#6a6a72"
grey_soft = "#95959d"
red = "#ff3399"
orange = "#f27273"
yellow = "#e5b24d"
green = "#00d364"
aqua = "#00ceca"
blue = "#00cbff"
purple = "#cc66ff"
tint_green = "#cbf1e3"
tint_red = "#f9d5ed"
statusline = "#e6e6ee"
statusline_accent = "#d1d1d8"
statusline_fg = "#1d1d26"
on_accent = "#1d1d26"
mode_red = "#ff3399"
mode_green = "#00d364"
mode_yellow = "#e5b24d"
mode_blue = "#00cbff"
mode_purple = "#cc66ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
