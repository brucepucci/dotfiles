palette_6 = "#f8f8ff"
palette_7 = "#f8f8ff"
palette_8 = "#f8f8ff"
palette_9 = "#f8f8ff"
palette_10 = "#f8f8ff"
palette_11 = "#f8f8ff"
palette_12 = "#f8f8ff"
palette_13 = "#f8f8ff"
palette_14 = "#f8f8ff"
palette_15 = "#f8f8ff"

[roles]
