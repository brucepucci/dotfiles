# GitLab Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#28262b"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#bfbfbf"
selection-background = "#ad95e9"
selection-foreground = "#28262b"
palette_0 = "#28262b"
palette_1 = "#28262b"
palette_2 = "#28262b"
palette_3 = "#28262b"
palette_4 = "#28262b"
palette_5 = "#28262b"
palette_6 = "#28262b"
palette_7 = "#28262b"
palette_8 = "#28262b"
palette_9 = "#28262b"
palette_10 = "#28262b"
palette_11 = "#28262b"
palette_12 = "#28262b"
palette_13 = "#28262b"
palette_14 = "#28262b"
palette_15 = "#28262b"

[roles]
bg = "#28262b"
bg_deep = "#1e1c20"
surface = "#424044"
fg = "#ffffff"
fg_soft = "#bebebf"
fg_bright = "#28262b"
grey = "#9e9da0"
grey_dim = "#737275"
grey_neutral = "#b4b3b5"
grey_soft = "#89888a"
red = "#28262b"
orange = "#28262b"
yellow = "#28262b"
green = "#28262b"
aqua = "#28262b"
blue = "#28262b"
purple = "#28262b"
tint_green = "#28262b"
tint_red = "#28262b"
statusline = "#39373c"
statusline_accent = "#4f4d51"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#28262b"
mode_green = "#28262b"
mode_yellow = "#28262b"
mode_blue = "#28262b"
mode_purple = "#28262b"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
