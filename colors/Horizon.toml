# Horizon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1e26"
foreground = "#d5d8da"
cursor-color = "#6c6f93"
cursor-text = "#9fa2c6"
selection-background = "#6c6f93"
selection-foreground = "#1c1e26"
palette_0 = "#000000"
palette_1 = "#e95678"
palette_2 = "#29d398"
palette_3 = "#fab795"
palette_4 = "#26bbd9"
palette_5 = "#ee64ac"
palette_6 = "#59e1e3"
palette_7 = "#e5e5e5"
palette_8 = "#666666"
palette_9 = "#ec6a88"
palette_10 = "#3fdaa4"
palette_11 = "#fbc3a7"
palette_12 = "#3fc4de"
palette_13 = "#f075b5"
palette_14 = "#6be4e6"
palette_15 = "#e5e5e5"

[roles]
bg = "#1c1e26"
bg_deep = "#15161c"
surface = "#32343c"
fg = "#d5d8da"
fg_soft = "#9ea0a4"
fg_bright = "#e5e5e5"
grey = "#828489"
grey_dim = "#5d5f65"
grey_neutral = "#94979b"
grey_soft = "#6f7277"
red = "#e95678"
orange = "#f28686"
yellow = "#fab795"
green = "#29d398"
aqua = "#59e1e3"
blue = "#26bbd9"
purple = "#ee64ac"
tint_green = "#1e3f3b"
tint_red = "#412835"
statusline = "#2b2d34"
