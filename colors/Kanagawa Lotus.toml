palette_5 = "#b35b79"
palette_6 = "#597b75"
palette_7 = "#545464"
palette_8 = "#8a8980"
palette_9 = "#d7474b"
palette_10 = "#6e915f"
palette_11 = "#836f4a"
palette_12 = "#6693bf"
palette_13 = "#624c83"
palette_14 = "#5e857a"
palette_15 = "#43436c"

[roles]
