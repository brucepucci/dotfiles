# Scarlet Protocol
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c153d"
foreground = "#e41951"
cursor-color = "#76ff9f"
cursor-text = "#a6a6a6"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#1c153d"
palette_1 = "#1c153d"
palette_2 = "#1c153d"
palette_3 = "#1c153d"
palette_4 = "#1c153d"
palette_5 = "#1c153d"
palette_6 = "#1c153d"
palette_7 = "#1c153d"
palette_8 = "#1c153d"
palette_9 = "#1c153d"
palette_10 = "#1c153d"
palette_11 = "#1c153d"
palette_12 = "#1c153d"
palette_13 = "#1c153d"
palette_14 = "#1c153d"
palette_15 = "#1c153d"

[roles]
bg = "#1c153d"
bg_deep = "#15102e"
surface = "#34153f"
fg = "#e41951"
fg_soft = "#a8184b"
fg_bright = "#1c153d"
grey = "#8a1748"
grey_dim = "#621644"
grey_neutral = "#9e184a"
grey_soft = "#761746"
red = "#1c153d"
orange = "#1c153d"
yellow = "#1c153d"
