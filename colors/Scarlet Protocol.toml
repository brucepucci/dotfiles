# Scarlet Protocol
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c153d"
foreground = "#e41951"
cursor-color = "#76ff9f"
cursor-text = "#a6a6a6"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#101116"
palette_1 = "#ff0051"
palette_2 = "#00dc84"
palette_3 = "#faf945"
palette_4 = "#0271b6"
palette_5 = "#ca30c7"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#5ffa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#bd35ec"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#1c153d"
bg_deep = "#15102e"
surface = "#34153f"
fg = "#e41951"
fg_soft = "#a8184b"
fg_bright = "#ffffff"
grey = "#8a1748"
grey_dim = "#621644"
grey_neutral = "#9e184a"
grey_soft = "#761746"
red = "#ff0051"
orange = "#fc7c4b"
yellow = "#faf945"
green = "#00dc84"
aqua = "#00c5c7"
blue = "#0271b6"
purple = "#ca30c7"
tint_green = "#17394a"
tint_red = "#451141"
statusline = "#2c153f"
statusline_accent = "#401641"
statusline_fg = "#e41951"
on_accent = "#1c153d"
mode_red = "#ff0051"
mode_green = "#00dc84"
