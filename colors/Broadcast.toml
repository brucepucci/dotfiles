palette_2 = "#2b2b2b"
palette_3 = "#2b2b2b"
palette_4 = "#2b2b2b"
palette_5 = "#2b2b2b"
palette_6 = "#2b2b2b"
palette_7 = "#2b2b2b"
palette_8 = "#2b2b2b"
palette_9 = "#2b2b2b"
palette_10 = "#2b2b2b"
palette_11 = "#2b2b2b"
palette_12 = "#2b2b2b"
palette_13 = "#2b2b2b"
palette_14 = "#2b2b2b"
palette_15 = "#2b2b2b"

[roles]
bg = "#2b2b2b"
bg_deep = "#202020"
