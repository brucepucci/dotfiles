# Broadcast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2b2b2b"
foreground = "#e6e1dc"
cursor-color = "#ffffff"
cursor-text = "#c0bbb6"
selection-background = "#5a647e"
selection-foreground = "#e6e1dc"
palette_0 = "#000000"
palette_1 = "#da4939"
palette_2 = "#519f50"
palette_3 = "#ffd24a"
palette_4 = "#6d9cbe"
palette_5 = "#d0d0ff"
palette_6 = "#6e9cbe"
palette_7 = "#ffffff"
palette_8 = "#585858"
palette_9 = "#ff7b6b"
palette_10 = "#83d182"
palette_11 = "#ffff7c"
palette_12 = "#9fcef0"
palette_13 = "#ffffff"
palette_14 = "#a0cef0"
palette_15 = "#ffffff"

[roles]
bg = "#2b2b2b"
bg_deep = "#202020"
surface = "#414140"
fg = "#e6e1dc"
fg_soft = "#aeaaa7"
fg_bright = "#ffffff"
grey = "#928f8c"
grey_dim = "#6c6b69"
grey_neutral = "#a5a19e"
grey_soft = "#7f7d7b"
red = "#da4939"
orange = "#ec8e42"
yellow = "#ffd24a"
green = "#519f50"
aqua = "#6e9cbe"
blue = "#6d9cbe"
purple = "#d0d0ff"
tint_green = "#324032"
tint_red = "#4a302e"
statusline = "#3a3a39"
statusline_accent = "#4d4c4b"
statusline_fg = "#e6e1dc"
on_accent = "#2b2b2b"
mode_red = "#da4939"
mode_green = "#519f50"
mode_yellow = "#ffd24a"
mode_blue = "#6d9cbe"
mode_purple = "#d0d0ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
