# Carbonfox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161616"
foreground = "#f2f4f8"
cursor-color = "#f2f4f8"
cursor-text = "#161616"
selection-background = "#2a2a2a"
selection-foreground = "#f2f4f8"
palette_0 = "#282828"
palette_1 = "#ee5396"
palette_2 = "#25be6a"
palette_3 = "#08bdba"
palette_4 = "#78a9ff"
palette_5 = "#be95ff"
palette_6 = "#33b1ff"
palette_7 = "#dfdfe0"
palette_8 = "#484848"
palette_9 = "#f16da6"
palette_10 = "#46c880"
palette_11 = "#2dc7c4"
palette_12 = "#8cb6ff"
palette_13 = "#c8a5ff"
palette_14 = "#52bdff"
palette_15 = "#e4e4e5"

[roles]
bg = "#161616"
bg_deep = "#101010"
surface = "#303131"
fg = "#f2f4f8"
fg_soft = "#b0b1b4"
fg_bright = "#e4e4e5"
grey = "#8f9092"
grey_dim = "#636465"
grey_neutral = "#a5a6a9"
grey_soft = "#797a7c"
red = "#ee5396"
orange = "#7b88a8"
yellow = "#08bdba"
green = "#25be6a"
aqua = "#33b1ff"
blue = "#78a9ff"
purple = "#be95ff"
tint_green = "#193425"
tint_red = "#3d212d"
statusline = "#282828"
