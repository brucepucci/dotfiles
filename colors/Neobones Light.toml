palette_2 = "#567a30"
palette_3 = "#944927"
palette_4 = "#286486"
palette_5 = "#88507d"
palette_6 = "#3b8992"
palette_7 = "#202e18"
palette_8 = "#99ac9c"
palette_9 = "#94253e"
palette_10 = "#3f5a22"
palette_11 = "#803d1c"
palette_12 = "#1d5573"
palette_13 = "#7b3b70"
palette_14 = "#2b747c"
palette_15 = "#415934"

[roles]
bg = "#e5ede6"
bg_deep = "#ecf2ec"
surface = "#cdd6cd"
fg = "#202e18"
fg_soft = "#5b6756"
