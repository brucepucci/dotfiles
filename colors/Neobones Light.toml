palette_2 = "#e5ede6"
palette_3 = "#e5ede6"
palette_4 = "#e5ede6"
palette_5 = "#e5ede6"
palette_6 = "#e5ede6"
palette_7 = "#e5ede6"
palette_8 = "#e5ede6"
palette_9 = "#e5ede6"
palette_10 = "#e5ede6"
palette_11 = "#e5ede6"
palette_12 = "#e5ede6"
palette_13 = "#e5ede6"
palette_14 = "#e5ede6"
palette_15 = "#e5ede6"

[roles]
