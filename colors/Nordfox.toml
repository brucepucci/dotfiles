palette_2 = "#2e3440"
palette_3 = "#2e3440"
palette_4 = "#2e3440"
palette_5 = "#2e3440"
palette_6 = "#2e3440"
palette_7 = "#2e3440"
palette_8 = "#2e3440"
palette_9 = "#2e3440"
palette_10 = "#2e3440"
palette_11 = "#2e3440"
palette_12 = "#2e3440"
palette_13 = "#2e3440"
palette_14 = "#2e3440"
palette_15 = "#2e3440"

[roles]
