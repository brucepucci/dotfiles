# Nordfox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e3440"
foreground = "#cdcecf"
cursor-color = "#cdcecf"
cursor-text = "#2e3440"
selection-background = "#3e4a5b"
selection-foreground = "#cdcecf"
palette_0 = "#3b4252"
palette_1 = "#bf616a"
palette_2 = "#a3be8c"
palette_3 = "#ebcb8b"
palette_4 = "#81a1c1"
palette_5 = "#b48ead"
palette_6 = "#88c0d0"
palette_7 = "#e5e9f0"
palette_8 = "#53648d"
palette_9 = "#d06f79"
palette_10 = "#b1d196"
palette_11 = "#f0d399"
palette_12 = "#8cafd2"
palette_13 = "#c895bf"
palette_14 = "#93ccdc"
palette_15 = "#e7ecf4"

[roles]
bg = "#2e3440"
bg_deep = "#222730"
surface = "#414651"
fg = "#cdcecf"
fg_soft = "#9da0a4"
fg_bright = "#e7ecf4"
grey = "#85898f"
grey_dim = "#666a72"
grey_neutral = "#95989d"
grey_soft = "#767980"
red = "#bf616a"
orange = "#d5967a"
yellow = "#ebcb8b"
green = "#a3be8c"
aqua = "#88c0d0"
blue = "#81a1c1"
purple = "#b48ead"
tint_green = "#434d4e"
tint_red = "#483c48"
statusline = "#3b404b"
statusline_accent = "#4b505a"
statusline_fg = "#cdcecf"
