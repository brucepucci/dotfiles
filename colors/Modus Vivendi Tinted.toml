# Modus Vivendi Tinted
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d0e1c"
foreground = "#ffffff"
cursor-color = "#ff66ff"
cursor-text = "#0d0e1c"
selection-background = "#555a66"
selection-foreground = "#ffffff"
palette_0 = "#0d0e1c"
palette_1 = "#ff5f59"
palette_2 = "#44bc44"
palette_3 = "#d0bc00"
palette_4 = "#2fafff"
palette_5 = "#feacd0"
palette_6 = "#00d3d0"
palette_7 = "#a6a6a6"
palette_8 = "#595959"
palette_9 = "#ff6b55"
palette_10 = "#00c06f"
palette_11 = "#fec43f"
palette_12 = "#79a8ff"
palette_13 = "#b6a0ff"
palette_14 = "#6ae4b9"
palette_15 = "#ffffff"

[roles]
bg = "#0d0e1c"
bg_deep = "#0a0a15"
surface = "#2a2b37"
fg = "#ffffff"
fg_soft = "#b6b7bb"
fg_bright = "#ffffff"
grey = "#929399"
grey_dim = "#62626b"
grey_neutral = "#aaabb0"
grey_soft = "#7a7a82"
red = "#ff5f59"
orange = "#e88e2c"
yellow = "#d0bc00"
green = "#44bc44"
aqua = "#00d3d0"
blue = "#2fafff"
purple = "#feacd0"
tint_green = "#172d23"
tint_red = "#391d27"
statusline = "#20212e"
statusline_accent = "#393945"
statusline_fg = "#ffffff"
on_accent = "#0d0e1c"
mode_red = "#ff5f59"
mode_green = "#44bc44"
mode_yellow = "#d0bc00"
mode_blue = "#2fafff"
mode_purple = "#feacd0"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
