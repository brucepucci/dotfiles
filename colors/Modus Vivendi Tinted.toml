# Modus Vivendi Tinted
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d0e1c"
foreground = "#ffffff"
cursor-color = "#ff66ff"
cursor-text = "#0d0e1c"
selection-background = "#555a66"
selection-foreground = "#ffffff"
palette_0 = "#0d0e1c"
palette_1 = "#0d0e1c"
palette_2 = "#0d0e1c"
palette_3 = "#0d0e1c"
palette_4 = "#0d0e1c"
palette_5 = "#0d0e1c"
palette_6 = "#0d0e1c"
palette_7 = "#0d0e1c"
palette_8 = "#0d0e1c"
palette_9 = "#0d0e1c"
palette_10 = "#0d0e1c"
palette_11 = "#0d0e1c"
palette_12 = "#0d0e1c"
palette_13 = "#0d0e1c"
palette_14 = "#0d0e1c"
palette_15 = "#0d0e1c"

[roles]
bg = "#0d0e1c"
bg_deep = "#0a0a15"
surface = "#2a2b37"
fg = "#ffffff"
fg_soft = "#b6b7bb"
