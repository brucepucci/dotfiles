# Terminal Basic
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#7f7f7f"
cursor-text = "#000000"
selection-background = "#a4c9ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#990000"
palette_2 = "#00a600"
palette_3 = "#999900"
palette_4 = "#0000b2"
palette_5 = "#b200b2"
palette_6 = "#00a6b2"
palette_7 = "#bfbfbf"
palette_8 = "#666666"
palette_9 = "#e50000"
palette_10 = "#00d900"
palette_11 = "#bfbf00"
palette_12 = "#0000ff"
palette_13 = "#e500e5"
palette_14 = "#00d8d8"
palette_15 = "#e5e5e5"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#990000"
orange = "#994c00"
yellow = "#999900"
green = "#00a600"
aqua = "#00a6b2"
blue = "#0000b2"
purple = "#b200b2"
tint_green = "#d1efd1"
tint_red = "#edd1d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#990000"
mode_green = "#00a600"
mode_yellow = "#999900"
mode_blue = "#0000b2"
mode_purple = "#b200b2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
