# Iceberg Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161821"
foreground = "#c6c8d1"
cursor-color = "#c6c8d1"
cursor-text = "#161821"
selection-background = "#c6c8d1"
selection-foreground = "#161821"
palette_0 = "#1e2132"
palette_1 = "#e27878"
palette_2 = "#b4be82"
palette_3 = "#e2a478"
palette_4 = "#84a0c6"
palette_5 = "#a093c7"
palette_6 = "#89b8c2"
palette_7 = "#c6c8d1"
palette_8 = "#6b7089"
palette_9 = "#e98989"
palette_10 = "#c0ca8e"
palette_11 = "#e9b189"
palette_12 = "#91acd1"
palette_13 = "#ada0d3"
palette_14 = "#95c4ce"
palette_15 = "#d2d4de"

[roles]
bg = "#161821"
bg_deep = "#101219"
surface = "#2b2d36"
fg = "#c6c8d1"
fg_soft = "#91939c"
fg_bright = "#d2d4de"
grey = "#777982"
grey_dim = "#54565f"
grey_neutral = "#888a93"
grey_soft = "#656770"
red = "#e27878"
orange = "#e28e78"
