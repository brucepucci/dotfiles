# Ayu Mirage
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f2430"
foreground = "#cccac2"
cursor-color = "#ffcc66"
cursor-text = "#1f2430"
selection-background = "#409fff"
selection-foreground = "#1f2430"
palette_0 = "#171b24"
palette_1 = "#ed8274"
palette_2 = "#87d96c"
palette_3 = "#facc6e"
palette_4 = "#6dcbfa"
palette_5 = "#dabafa"
palette_6 = "#90e1c6"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#f28779"
palette_10 = "#d5ff80"
palette_11 = "#ffd173"
palette_12 = "#73d0ff"
palette_13 = "#dfbfff"
palette_14 = "#95e6cb"
palette_15 = "#ffffff"

[roles]
bg = "#1f2430"
bg_deep = "#171b24"
surface = "#343842"
fg = "#cccac2"
fg_soft = "#989896"
fg_bright = "#ffffff"
grey = "#7e7f80"
grey_dim = "#5c5e63"
grey_neutral = "#8f908f"
grey_soft = "#6d6f72"
red = "#ed8274"
orange = "#f4a771"
yellow = "#facc6e"
green = "#87d96c"
aqua = "#90e1c6"
blue = "#6dcbfa"
purple = "#dabafa"
tint_green = "#32453b"
tint_red = "#44353c"
statusline = "#2d313c"
statusline_accent = "#3e424a"
statusline_fg = "#cccac2"
on_accent = "#1f2430"
mode_red = "#ed8274"
mode_green = "#87d96c"
mode_yellow = "#facc6e"
mode_blue = "#6dcbfa"
mode_purple = "#dabafa"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
