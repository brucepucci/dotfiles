# Rose Pine Moon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#232136"
foreground = "#e0def4"
cursor-color = "#e0def4"
cursor-text = "#232136"
selection-background = "#44415a"
selection-foreground = "#e0def4"
palette_0 = "#232136"
palette_1 = "#232136"
palette_2 = "#232136"
palette_3 = "#232136"
palette_4 = "#232136"
palette_5 = "#232136"
palette_6 = "#232136"
palette_7 = "#232136"
palette_8 = "#232136"
palette_9 = "#232136"
palette_10 = "#232136"
palette_11 = "#232136"
palette_12 = "#232136"
palette_13 = "#232136"
palette_14 = "#232136"
palette_15 = "#232136"

[roles]
