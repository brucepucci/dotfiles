palette_2 = "#3e8fb0"
palette_3 = "#f6c177"
palette_4 = "#9ccfd8"
palette_5 = "#c4a7e7"
palette_6 = "#ea9a97"
palette_7 = "#e0def4"
palette_8 = "#6e6a86"
palette_9 = "#eb6f92"
palette_10 = "#3e8fb0"
palette_11 = "#f6c177"
palette_12 = "#9ccfd8"
palette_13 = "#c4a7e7"
palette_14 = "#ea9a97"
palette_15 = "#e0def4"

[roles]
bg = "#232136"
bg_deep = "#1a1928"
surface = "#3a384d"
fg = "#e0def4"
