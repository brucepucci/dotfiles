# Poimandres Darker
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#16161e"
foreground = "#a6accd"
cursor-color = "#ffffff"
cursor-text = "#16161e"
selection-background = "#a6accd"
selection-foreground = "#ffffff"
palette_0 = "#16161e"
palette_1 = "#d0679d"
palette_2 = "#5de4c7"
palette_3 = "#fffac2"
palette_4 = "#89ddff"
palette_5 = "#fcc5e9"
palette_6 = "#add7ff"
palette_7 = "#ffffff"
palette_8 = "#a6accd"
palette_9 = "#d0679d"
palette_10 = "#5de4c7"
palette_11 = "#fffac2"
palette_12 = "#add7ff"
palette_13 = "#fae4fc"
palette_14 = "#89ddff"
palette_15 = "#ffffff"

[roles]
bg = "#16161e"
bg_deep = "#101016"
surface = "#272833"
fg = "#a6accd"
fg_soft = "#7b7f98"
fg_bright = "#ffffff"
grey = "#65687e"
grey_dim = "#484a5b"
grey_neutral = "#747890"
grey_soft = "#575a6d"
red = "#d0679d"
orange = "#e8b0b0"
yellow = "#fffac2"
green = "#5de4c7"
aqua = "#add7ff"
blue = "#89ddff"
purple = "#fcc5e9"
tint_green = "#233b3c"
tint_red = "#372535"
statusline = "#22222c"
statusline_accent = "#30313e"
statusline_fg = "#a6accd"
on_accent = "#16161e"
mode_red = "#d0679d"
mode_green = "#5de4c7"
mode_yellow = "#fffac2"
mode_blue = "#89ddff"
mode_purple = "#fcc5e9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
