# Django
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0b2f20"
foreground = "#f8f8f8"
cursor-color = "#336442"
cursor-text = "#f8f8f8"
selection-background = "#245032"
selection-foreground = "#f8f8f8"
palette_0 = "#000000"
palette_1 = "#fd6209"
palette_2 = "#41a83e"
palette_3 = "#ffe862"
palette_4 = "#315d3f"
palette_5 = "#f8f8f8"
palette_6 = "#9df39f"
palette_7 = "#ffffff"
palette_8 = "#585858"
palette_9 = "#ff943b"
palette_10 = "#73da70"
palette_11 = "#ffff94"
palette_12 = "#568264"
palette_13 = "#ffffff"
palette_14 = "#cfffd1"
palette_15 = "#ffffff"

[roles]
bg = "#0b2f20"
bg_deep = "#082318"
surface = "#27473a"
fg = "#f8f8f8"
fg_soft = "#b1bcb7"
fg_bright = "#ffffff"
grey = "#8d9e97"
grey_dim = "#5e756c"
grey_neutral = "#a5b2ac"
grey_soft = "#768981"
red = "#fd6209"
orange = "#fea536"
yellow = "#ffe862"
green = "#41a83e"
aqua = "#9df39f"
blue = "#315d3f"
purple = "#f8f8f8"
tint_green = "#154525"
tint_red = "#37381c"
statusline = "#1e3f31"
