# Spacegray Bright
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2a2e3a"
foreground = "#f3f3f3"
cursor-color = "#c6c6c6"
cursor-text = "#8c8c8c"
selection-background = "#cacaca"
selection-foreground = "#000000"
palette_0 = "#080808"
palette_1 = "#bc5553"
palette_2 = "#a0b56c"
palette_3 = "#f6c987"
palette_4 = "#7baec1"
palette_5 = "#b98aae"
palette_6 = "#85c9b8"
palette_7 = "#d8d8d8"
palette_8 = "#626262"
palette_9 = "#bc5553"
palette_10 = "#a0b56c"
palette_11 = "#f6c987"
palette_12 = "#7baec1"
palette_13 = "#b98aae"
palette_14 = "#85c9b8"
palette_15 = "#f7f7f7"

[roles]
bg = "#2a2e3a"
bg_deep = "#20222c"
surface = "#424650"
fg = "#f3f3f3"
fg_soft = "#b7b8bc"
fg_bright = "#f7f7f7"
grey = "#999aa0"
grey_dim = "#70737b"
grey_neutral = "#adaeb2"
grey_soft = "#84878d"
red = "#bc5553"
orange = "#d98f6d"
yellow = "#f6c987"
green = "#a0b56c"
aqua = "#85c9b8"
blue = "#7baec1"
purple = "#b98aae"
tint_green = "#3f4643"
tint_red = "#44353e"
statusline = "#3a3e49"
statusline_accent = "#4e515b"
statusline_fg = "#f3f3f3"
on_accent = "#2a2e3a"
mode_red = "#bc5553"
mode_green = "#a0b56c"
mode_yellow = "#f6c987"
mode_blue = "#7baec1"
