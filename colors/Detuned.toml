# Detuned
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c7c7c7"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#171717"
palette_1 = "#fe4386"
palette_2 = "#a6e32d"
palette_3 = "#e6da73"
palette_4 = "#0094d9"
palette_5 = "#9b37ff"
palette_6 = "#50b7d9"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#fa80ac"
palette_10 = "#bde371"
palette_11 = "#fff27f"
palette_12 = "#00beff"
palette_13 = "#be9eff"
palette_14 = "#5ed7ff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#181818"
fg = "#c7c7c7"
fg_soft = "#8b8b8b"
fg_bright = "#ffffff"
grey = "#6d6d6d"
grey_dim = "#464646"
grey_neutral = "#818181"
grey_soft = "#5a5a5a"
red = "#fe4386"
