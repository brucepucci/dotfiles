palette_2 = "#3ba5ff"
palette_3 = "#e9e75c"
palette_4 = "#8ff586"
palette_5 = "#781aa0"
palette_6 = "#8ff586"
palette_7 = "#ba46b2"
palette_8 = "#fff688"
palette_9 = "#d4312e"
palette_10 = "#8ff586"
palette_11 = "#e9f06d"
palette_12 = "#3c7dd2"
palette_13 = "#8230a7"
palette_14 = "#6cbc67"
palette_15 = "#8ff586"

[roles]
bg = "#142838"
bg_deep = "#0f1e2a"
surface = "#234141"
fg = "#8ff586"
fg_soft = "#6ab86f"
