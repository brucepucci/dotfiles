# Ardoise
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#eaeaea"
cursor-color = "#f7f7f7"
cursor-text = "#000000"
selection-background = "#46515e"
selection-foreground = "#f1f3f5"
palette_0 = "#2c2c2c"
palette_1 = "#d3322d"
palette_2 = "#588b35"
palette_3 = "#fca93a"
palette_4 = "#2465c2"
palette_5 = "#7332b4"
palette_6 = "#64e1b8"
palette_7 = "#f7f7f7"
palette_8 = "#535353"
palette_9 = "#fa5852"
palette_10 = "#8dc252"
palette_11 = "#ffea51"
palette_12 = "#6ab5f8"
palette_13 = "#be68ca"
palette_14 = "#89ffdb"
palette_15 = "#fefefe"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#363636"
fg = "#eaeaea"
fg_soft = "#adadad"
fg_bright = "#fefefe"
grey = "#8e8e8e"
grey_dim = "#656565"
grey_neutral = "#a3a3a3"
grey_soft = "#7a7a7a"
red = "#d3322d"
orange = "#e86e34"
yellow = "#fca93a"
green = "#588b35"
aqua = "#64e1b8"
blue = "#2465c2"
purple = "#7332b4"
tint_green = "#283222"
tint_red = "#3f2221"
statusline = "#2e2e2e"
statusline_accent = "#434343"
statusline_fg = "#eaeaea"
on_accent = "#eaeaea"
mode_red = "#d3322d"
mode_green = "#588b35"
mode_yellow = "#fca93a"
mode_blue = "#2465c2"
mode_purple = "#7332b4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
