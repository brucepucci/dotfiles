# Ardoise
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#eaeaea"
cursor-color = "#f7f7f7"
cursor-text = "#000000"
selection-background = "#46515e"
selection-foreground = "#f1f3f5"
palette_0 = "#1e1e1e"
palette_1 = "#1e1e1e"
palette_2 = "#1e1e1e"
palette_3 = "#1e1e1e"
palette_4 = "#1e1e1e"
palette_5 = "#1e1e1e"
palette_6 = "#1e1e1e"
palette_7 = "#1e1e1e"
palette_8 = "#1e1e1e"
palette_9 = "#1e1e1e"
palette_10 = "#1e1e1e"
palette_11 = "#1e1e1e"
palette_12 = "#1e1e1e"
palette_13 = "#1e1e1e"
palette_14 = "#1e1e1e"
palette_15 = "#1e1e1e"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#363636"
fg = "#eaeaea"
fg_soft = "#adadad"
fg_bright = "#1e1e1e"
grey = "#8e8e8e"
grey_dim = "#656565"
grey_neutral = "#a3a3a3"
grey_soft = "#7a7a7a"
red = "#1e1e1e"
orange = "#1e1e1e"
yellow = "#1e1e1e"
green = "#1e1e1e"
aqua = "#1e1e1e"
blue = "#1e1e1e"
purple = "#1e1e1e"
tint_green = "#1e1e1e"
tint_red = "#1e1e1e"
statusline = "#2e2e2e"
statusline_accent = "#434343"
statusline_fg = "#eaeaea"
on_accent = "#eaeaea"
mode_red = "#1e1e1e"
mode_green = "#1e1e1e"
mode_yellow = "#1e1e1e"
mode_blue = "#1e1e1e"
