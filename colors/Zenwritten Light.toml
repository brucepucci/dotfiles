# Zenwritten Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#eeeeee"
foreground = "#353535"
cursor-color = "#353535"
cursor-text = "#eeeeee"
selection-background = "#d7d7d7"
selection-foreground = "#353535"
palette_0 = "#eeeeee"
palette_1 = "#eeeeee"
palette_2 = "#eeeeee"
palette_3 = "#eeeeee"
palette_4 = "#eeeeee"
palette_5 = "#eeeeee"
palette_6 = "#eeeeee"
palette_7 = "#eeeeee"
palette_8 = "#eeeeee"
palette_9 = "#eeeeee"
palette_10 = "#eeeeee"
palette_11 = "#eeeeee"
palette_12 = "#eeeeee"
palette_13 = "#eeeeee"
palette_14 = "#eeeeee"
palette_15 = "#eeeeee"

[roles]
bg = "#eeeeee"
bg_deep = "#f2f2f2"
surface = "#d8d8d8"
fg = "#353535"
fg_soft = "#6c6c6c"
fg_bright = "#222222"
grey = "#888888"
grey_dim = "#adadad"
grey_neutral = "#767676"
