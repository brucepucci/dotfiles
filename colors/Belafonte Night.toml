palette_2 = "#858162"
palette_3 = "#eaa549"
palette_4 = "#426a79"
palette_5 = "#97522c"
palette_6 = "#989a9c"
palette_7 = "#968c83"
palette_8 = "#5e5252"
palette_9 = "#be100e"
palette_10 = "#858162"
palette_11 = "#eaa549"
palette_12 = "#426a79"
palette_13 = "#97522c"
palette_14 = "#989a9c"
palette_15 = "#d5ccba"

[roles]
