# Hot Dog Stand (Mustard)
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffff54"
foreground = "#000000"
cursor-color = "#ea3323"
cursor-text = "#ffff54"
selection-background = "#ea3323"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ea3323"
palette_2 = "#ea3323"
palette_3 = "#ea3323"
palette_4 = "#000000"
palette_5 = "#ea3323"
palette_6 = "#000000"
palette_7 = "#b9b9b9"
palette_8 = "#000000"
palette_9 = "#ea3323"
palette_10 = "#ea3323"
palette_11 = "#ea3323"
palette_12 = "#000000"
palette_13 = "#ea3323"
palette_14 = "#000000"
palette_15 = "#c6c6c6"

[roles]
bg = "#ffff54"
bg_deep = "#ffff7f"
surface = "#e0e04a"
fg = "#000000"
fg_soft = "#4c4c19"
fg_bright = "#000000"
grey = "#737326"
grey_dim = "#a6a637"
grey_neutral = "#59591d"
grey_soft = "#8c8c2e"
red = "#ea3323"
orange = "#ea3323"
yellow = "#ea3323"
green = "#ea3323"
aqua = "#000000"
