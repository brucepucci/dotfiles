# Catppuccin Frappe
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#303446"
foreground = "#c6d0f5"
cursor-color = "#f2d5cf"
cursor-text = "#303446"
selection-background = "#626880"
selection-foreground = "#c6d0f5"
palette_0 = "#51576d"
palette_1 = "#e78284"
palette_2 = "#a6d189"
palette_3 = "#e5c890"
palette_4 = "#8caaee"
palette_5 = "#f4b8e4"
palette_6 = "#81c8be"
palette_7 = "#a5adce"
palette_8 = "#626880"
palette_9 = "#e67172"
palette_10 = "#8ec772"
palette_11 = "#d9ba73"
palette_12 = "#7b9ef0"
palette_13 = "#f2a4db"
palette_14 = "#5abfb5"
palette_15 = "#b5bfe2"

[roles]
bg = "#303446"
bg_deep = "#242734"
surface = "#42475b"
fg = "#c6d0f5"
fg_soft = "#99a1c0"
fg_bright = "#b5bfe2"
grey = "#828aa6"
