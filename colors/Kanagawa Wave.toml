# Kanagawa Wave
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1f28"
foreground = "#dcd7ba"
cursor-color = "#dcd7ba"
cursor-text = "#1f1f28"
selection-background = "#dcd7ba"
selection-foreground = "#1f1f28"
palette_0 = "#090618"
palette_1 = "#c34043"
palette_2 = "#76946a"
palette_3 = "#c0a36e"
palette_4 = "#7e9cd8"
palette_5 = "#957fb8"
palette_6 = "#6a9589"
palette_7 = "#c8c093"
palette_8 = "#727169"
palette_9 = "#e82424"
palette_10 = "#98bb6c"
palette_11 = "#e6c384"
palette_12 = "#7fb4ca"
palette_13 = "#938aa9"
palette_14 = "#7aa89f"
palette_15 = "#dcd7ba"

[roles]
bg = "#1f1f28"
bg_deep = "#17171e"
surface = "#36353a"
fg = "#dcd7ba"
