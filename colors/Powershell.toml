# Powershell
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#052454"
foreground = "#f6f6f7"
cursor-color = "#f6f6f7"
cursor-text = "#052454"
selection-background = "#f6f6f7"
selection-foreground = "#052454"
palette_0 = "#000000"
palette_1 = "#981a22"
palette_2 = "#098003"
palette_3 = "#c4a000"
palette_4 = "#4140c3"
palette_5 = "#d33682"
palette_6 = "#0e807f"
palette_7 = "#7f7c7f"
palette_8 = "#808080"
palette_9 = "#ef2929"
palette_10 = "#1cfe3c"
palette_11 = "#fefe45"
palette_12 = "#268ad2"
palette_13 = "#fe13fa"
palette_14 = "#29fffe"
palette_15 = "#c2c1c3"

[roles]
bg = "#052454"
bg_deep = "#041b3f"
surface = "#223d68"
fg = "#f6f6f7"
fg_soft = "#aeb7c6"
fg_bright = "#c2c1c3"
