# Framer
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#111111"
foreground = "#777777"
cursor-color = "#fcdc08"
cursor-text = "#161616"
selection-background = "#666666"
selection-foreground = "#ffffff"
palette_0 = "#141414"
palette_1 = "#ff5555"
palette_2 = "#98ec65"
palette_3 = "#ffcc33"
palette_4 = "#00aaff"
palette_5 = "#aa88ff"
palette_6 = "#88ddff"
palette_7 = "#cccccc"
palette_8 = "#414141"
palette_9 = "#ff8888"
palette_10 = "#b6f292"
palette_11 = "#ffd966"
palette_12 = "#33bbff"
palette_13 = "#cebbff"
palette_14 = "#bbecff"
palette_15 = "#ffffff"

[roles]
bg = "#111111"
bg_deep = "#0d0d0d"
surface = "#1d1d1d"
fg = "#777777"
fg_soft = "#585858"
fg_bright = "#ffffff"
grey = "#494949"
grey_dim = "#353535"
grey_neutral = "#535353"
grey_soft = "#3f3f3f"
red = "#ff5555"
orange = "#ff9044"
yellow = "#ffcc33"
green = "#98ec65"
aqua = "#88ddff"
blue = "#00aaff"
purple = "#aa88ff"
tint_green = "#293820"
tint_red = "#3c1d1d"
statusline = "#191919"
statusline_accent = "#232323"
statusline_fg = "#777777"
on_accent = "#111111"
mode_red = "#ff5555"
mode_green = "#98ec65"
mode_yellow = "#ffcc33"
mode_blue = "#00aaff"
mode_purple = "#aa88ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
