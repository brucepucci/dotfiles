# Banana Blueberry
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#191323"
foreground = "#cccccc"
cursor-color = "#e07d13"
cursor-text = "#ffffff"
selection-background = "#220525"
selection-foreground = "#f4f4f4"
palette_0 = "#17141f"
palette_1 = "#ff6b7f"
palette_2 = "#00bd9c"
palette_3 = "#e6c62f"
palette_4 = "#22e8df"
palette_5 = "#dc396a"
palette_6 = "#56b6c2"
palette_7 = "#f1f1f1"
palette_8 = "#495162"
palette_9 = "#fe9ea1"
palette_10 = "#98c379"
palette_11 = "#f9e46b"
palette_12 = "#91fff4"
palette_13 = "#da70d6"
palette_14 = "#bcf3ff"
palette_15 = "#ffffff"

[roles]
bg = "#191323"
bg_deep = "#130e1a"
surface = "#2e2937"
fg = "#cccccc"
fg_soft = "#969499"
fg_bright = "#ffffff"
grey = "#7b7980"
grey_dim = "#58545e"
grey_neutral = "#8d8b91"
grey_soft = "#6a666f"
red = "#ff6b7f"
orange = "#f29857"
yellow = "#e6c62f"
green = "#00bd9c"
aqua = "#56b6c2"
blue = "#22e8df"
purple = "#dc396a"
tint_green = "#143239"
tint_red = "#422334"
statusline = "#272231"
statusline_accent = "#393441"
