# Pencil Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f1f1f1"
foreground = "#424242"
cursor-color = "#20bbfc"
cursor-text = "#424242"
selection-background = "#b6d6fd"
selection-foreground = "#424242"
palette_0 = "#f1f1f1"
palette_1 = "#f1f1f1"
palette_2 = "#f1f1f1"
palette_3 = "#f1f1f1"
palette_4 = "#f1f1f1"
palette_5 = "#f1f1f1"
palette_6 = "#f1f1f1"
palette_7 = "#f1f1f1"
palette_8 = "#f1f1f1"
palette_9 = "#f1f1f1"
palette_10 = "#f1f1f1"
palette_11 = "#f1f1f1"
palette_12 = "#f1f1f1"
palette_13 = "#f1f1f1"
palette_14 = "#f1f1f1"
palette_15 = "#f1f1f1"

[roles]
bg = "#f1f1f1"
bg_deep = "#f4f4f4"
surface = "#dcdcdc"
fg = "#424242"
fg_soft = "#767676"
fg_bright = "#2b2b2b"
