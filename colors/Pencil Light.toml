# Pencil Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f1f1f1"
foreground = "#424242"
cursor-color = "#20bbfc"
cursor-text = "#424242"
selection-background = "#b6d6fd"
selection-foreground = "#424242"
palette_0 = "#212121"
palette_1 = "#c30771"
palette_2 = "#10a778"
palette_3 = "#a89c14"
palette_4 = "#008ec4"
palette_5 = "#523c79"
palette_6 = "#20a5ba"
palette_7 = "#b3b3b3"
palette_8 = "#424242"
palette_9 = "#fb007a"
palette_10 = "#52caa2"
palette_11 = "#c0b100"
palette_12 = "#20bbfc"
palette_13 = "#6855de"
palette_14 = "#4fb8cc"
palette_15 = "#f1f1f1"

[roles]
bg = "#f1f1f1"
bg_deep = "#f4f4f4"
surface = "#dcdcdc"
fg = "#424242"
fg_soft = "#767676"
fg_bright = "#2b2b2b"
grey = "#919191"
grey_dim = "#b4b4b4"
grey_neutral = "#7f7f7f"
grey_soft = "#a2a2a2"
red = "#c30771"
orange = "#b65242"
yellow = "#a89c14"
green = "#10a778"
aqua = "#20a5ba"
blue = "#008ec4"
purple = "#523c79"
tint_green = "#c8e4db"
tint_red = "#e9c7da"
statusline = "#e3e3e3"
statusline_accent = "#d2d2d2"
statusline_fg = "#424242"
on_accent = "#f1f1f1"
mode_red = "#c30771"
mode_green = "#10a778"
mode_yellow = "#a89c14"
mode_blue = "#008ec4"
mode_purple = "#523c79"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
