# Liquid Carbon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#303030"
foreground = "#afc2c2"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#7dbeff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff3030"
palette_2 = "#559a70"
palette_3 = "#ccac00"
palette_4 = "#0099cc"
palette_5 = "#cc69c8"
palette_6 = "#7ac4cc"
palette_7 = "#bccccc"
palette_8 = "#595959"
palette_9 = "#ff3030"
palette_10 = "#559a70"
palette_11 = "#ccac00"
palette_12 = "#0099cc"
palette_13 = "#cc69c8"
palette_14 = "#7ac4cc"
palette_15 = "#bccccc"

[roles]
bg = "#303030"
bg_deep = "#242424"
surface = "#3f4242"
fg = "#afc2c2"
fg_soft = "#899696"
fg_bright = "#bccccc"
grey = "#768080"
grey_dim = "#5c6363"
grey_neutral = "#838f8f"
grey_soft = "#697272"
red = "#ff3030"
orange = "#e66e18"
yellow = "#ccac00"
green = "#559a70"
aqua = "#7ac4cc"
blue = "#0099cc"
purple = "#cc69c8"
tint_green = "#37433c"
tint_red = "#553030"
statusline = "#3a3c3c"
statusline_accent = "#474a4a"
statusline_fg = "#afc2c2"
on_accent = "#303030"
mode_red = "#ff3030"
mode_green = "#559a70"
