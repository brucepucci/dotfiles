# GitHub Dark Dimmed
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#22272e"
foreground = "#adbac7"
cursor-color = "#539bf5"
cursor-text = "#93dbff"
selection-background = "#adbac7"
selection-foreground = "#22272e"
palette_0 = "#545d68"
palette_1 = "#f47067"
palette_2 = "#57ab5a"
palette_3 = "#c69026"
palette_4 = "#539bf5"
palette_5 = "#b083f0"
palette_6 = "#39c5cf"
palette_7 = "#909dab"
palette_8 = "#636e7b"
palette_9 = "#ff938a"
palette_10 = "#6bc46d"
palette_11 = "#daaa3f"
palette_12 = "#6cb6ff"
palette_13 = "#dcbdfb"
palette_14 = "#56d4dd"
palette_15 = "#cdd9e5"

[roles]
bg = "#22272e"
bg_deep = "#1a1d22"
surface = "#333940"
fg = "#adbac7"
fg_soft = "#838e99"
