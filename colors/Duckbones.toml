palette_2 = "#0e101a"
palette_3 = "#0e101a"
palette_4 = "#0e101a"
palette_5 = "#0e101a"
palette_6 = "#0e101a"
palette_7 = "#0e101a"
palette_8 = "#0e101a"
palette_9 = "#0e101a"
palette_10 = "#0e101a"
palette_11 = "#0e101a"
palette_12 = "#0e101a"
palette_13 = "#0e101a"
palette_14 = "#0e101a"
palette_15 = "#0e101a"

[roles]
