# Duckbones
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e101a"
foreground = "#ebefc0"
cursor-color = "#edf2c2"
cursor-text = "#0e101a"
selection-background = "#37382d"
selection-foreground = "#ebefc0"
palette_0 = "#0e101a"
palette_1 = "#e03600"
palette_2 = "#5dcd97"
palette_3 = "#e39500"
palette_4 = "#00a3cb"
palette_5 = "#795ccc"
palette_6 = "#00a3cb"
palette_7 = "#ebefc0"
palette_8 = "#444860"
palette_9 = "#ff4821"
palette_10 = "#58db9e"
palette_11 = "#f6a100"
palette_12 = "#00b4e0"
palette_13 = "#b3a1e6"
palette_14 = "#00b4e0"
palette_15 = "#b3b692"

[roles]
bg = "#0e101a"
bg_deep = "#0a0c14"
surface = "#292b2e"
fg = "#ebefc0"
fg_soft = "#a9ac8e"
fg_bright = "#b3b692"
grey = "#888b75"
grey_dim = "#5b5e54"
grey_neutral = "#9ea186"
grey_soft = "#717465"
red = "#e03600"
orange = "#e26600"
yellow = "#e39500"
green = "#5dcd97"
aqua = "#00a3cb"
blue = "#00a3cb"
purple = "#795ccc"
tint_green = "#1c3230"
tint_red = "#341715"
statusline = "#202227"
