# Builtin Tango Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0000"
palette_2 = "#4e9a06"
palette_3 = "#c4a000"
palette_4 = "#3465a4"
palette_5 = "#75507b"
palette_6 = "#06989a"
palette_7 = "#b9bdb5"
palette_8 = "#555753"
palette_9 = "#ef2929"
palette_10 = "#7dd527"
palette_11 = "#d6c329"
palette_12 = "#729fcf"
palette_13 = "#ad7fa8"
palette_14 = "#27d5d5"
palette_15 = "#eeeeec"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#cc0000"
orange = "#c85000"
yellow = "#c4a000"
green = "#4e9a06"
aqua = "#06989a"
blue = "#3465a4"
purple = "#75507b"
tint_green = "#dfedd2"
tint_red = "#f6d1d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#cc0000"
mode_green = "#4e9a06"
mode_yellow = "#c4a000"
mode_blue = "#3465a4"
mode_purple = "#75507b"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
