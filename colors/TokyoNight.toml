# TokyoNight
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1b26"
foreground = "#c0caf5"
cursor-color = "#c0caf5"
cursor-text = "#15161e"
selection-background = "#33467c"
selection-foreground = "#c0caf5"
palette_0 = "#15161e"
palette_1 = "#f7768e"
palette_2 = "#9ece6a"
palette_3 = "#e0af68"
palette_4 = "#7aa2f7"
palette_5 = "#bb9af7"
palette_6 = "#7dcfff"
palette_7 = "#a9b1d6"
palette_8 = "#414868"
palette_9 = "#f7768e"
palette_10 = "#9ece6a"
palette_11 = "#e0af68"
palette_12 = "#7aa2f7"
palette_13 = "#bb9af7"
palette_14 = "#7dcfff"
palette_15 = "#c0caf5"

[roles]
bg = "#1a1b26"
bg_deep = "#14141c"
surface = "#2e303f"
fg = "#c0caf5"
fg_soft = "#8e96b7"
fg_bright = "#c0caf5"
grey = "#757b98"
grey_dim = "#54586e"
