# Monokai Pro Spectrum
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#f7f1ff"
cursor-color = "#bab6c0"
cursor-text = "#faf6ff"
selection-background = "#525053"
selection-foreground = "#f7f1ff"
palette_0 = "#222222"
palette_1 = "#fc618d"
palette_2 = "#7bd88f"
palette_3 = "#fce566"
palette_4 = "#fd9353"
palette_5 = "#948ae3"
palette_6 = "#5ad4e6"
palette_7 = "#f7f1ff"
palette_8 = "#69676c"
palette_9 = "#fc618d"
palette_10 = "#7bd88f"
palette_11 = "#fce566"
palette_12 = "#fd9353"
palette_13 = "#948ae3"
palette_14 = "#5ad4e6"
palette_15 = "#f7f1ff"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#3c3b3d"
fg = "#f7f1ff"
fg_soft = "#b7b3bd"
fg_bright = "#f7f1ff"
grey = "#97949c"
grey_dim = "#6d6a6f"
