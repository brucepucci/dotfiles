# Cursor Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141414"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#141414"
selection-background = "#303030"
selection-foreground = "#ffffff"
palette_0 = "#2a2a2a"
palette_1 = "#bf616a"
palette_2 = "#a3be8c"
palette_3 = "#ebcb8b"
palette_4 = "#81a1c1"
palette_5 = "#b48ead"
palette_6 = "#88c0d0"
palette_7 = "#d8dee9"
palette_8 = "#505050"
palette_9 = "#bf616a"
palette_10 = "#a3be8c"
palette_11 = "#ebcb8b"
palette_12 = "#81a1c1"
palette_13 = "#b48ead"
palette_14 = "#88c0d0"
palette_15 = "#ffffff"

[roles]
bg = "#141414"
bg_deep = "#0f0f0f"
surface = "#303030"
fg = "#ffffff"
fg_soft = "#b8b8b8"
fg_bright = "#ffffff"
grey = "#959595"
grey_dim = "#666666"
grey_neutral = "#adadad"
grey_soft = "#7e7e7e"
red = "#bf616a"
orange = "#d5967a"
yellow = "#ebcb8b"
green = "#a3be8c"
aqua = "#88c0d0"
blue = "#81a1c1"
purple = "#b48ead"
tint_green = "#2e332a"
tint_red = "#332223"
statusline = "#272727"
statusline_accent = "#3e3e3e"
statusline_fg = "#ffffff"
on_accent = "#141414"
mode_red = "#bf616a"
mode_green = "#a3be8c"
