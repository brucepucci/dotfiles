# Glacier
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0c1115"
foreground = "#ffffff"
cursor-color = "#6c6c6c"
cursor-text = "#9f9f9f"
selection-background = "#bd2523"
selection-foreground = "#ffffff"
palette_0 = "#0c1115"
palette_1 = "#0c1115"
palette_2 = "#0c1115"
palette_3 = "#0c1115"
palette_4 = "#0c1115"
palette_5 = "#0c1115"
palette_6 = "#0c1115"
palette_7 = "#0c1115"
palette_8 = "#0c1115"
palette_9 = "#0c1115"
palette_10 = "#0c1115"
palette_11 = "#0c1115"
palette_12 = "#0c1115"
palette_13 = "#0c1115"
palette_14 = "#0c1115"
palette_15 = "#0c1115"

[roles]
bg = "#0c1115"
bg_deep = "#090d10"
surface = "#292e31"
fg = "#ffffff"
fg_soft = "#b6b8b9"
fg_bright = "#0c1115"
grey = "#929496"
grey_dim = "#616467"
grey_neutral = "#aaacad"
