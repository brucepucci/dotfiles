# Glacier
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0c1115"
foreground = "#ffffff"
cursor-color = "#6c6c6c"
cursor-text = "#9f9f9f"
selection-background = "#bd2523"
selection-foreground = "#ffffff"
palette_0 = "#2e343c"
palette_1 = "#bd0f2f"
palette_2 = "#35a770"
palette_3 = "#fb9435"
palette_4 = "#1f5872"
palette_5 = "#bd2523"
palette_6 = "#778397"
palette_7 = "#ffffff"
palette_8 = "#404a55"
palette_9 = "#bd0f2f"
palette_10 = "#49e998"
palette_11 = "#fddf6e"
palette_12 = "#2a8bc1"
palette_13 = "#ea4727"
palette_14 = "#a0b6d3"
palette_15 = "#ffffff"

[roles]
bg = "#0c1115"
bg_deep = "#090d10"
surface = "#292e31"
fg = "#ffffff"
fg_soft = "#b6b8b9"
fg_bright = "#ffffff"
grey = "#929496"
grey_dim = "#616467"
grey_neutral = "#aaacad"
grey_soft = "#797c7e"
red = "#bd0f2f"
orange = "#dc5232"
yellow = "#fb9435"
green = "#35a770"
aqua = "#778397"
blue = "#1f5872"
purple = "#bd2523"
tint_green = "#132c25"
tint_red = "#2c111a"
statusline = "#1f2428"
statusline_accent = "#383c3f"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#bd0f2f"
mode_green = "#35a770"
mode_yellow = "#fb9435"
mode_blue = "#1f5872"
mode_purple = "#bd2523"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
