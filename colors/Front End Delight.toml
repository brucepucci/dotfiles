# Front End Delight
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1c1d"
foreground = "#adadad"
cursor-color = "#cdcdcd"
cursor-text = "#1b1c1d"
selection-background = "#ea6154"
selection-foreground = "#1b1c1d"
palette_0 = "#1b1c1d"
palette_1 = "#1b1c1d"
palette_2 = "#1b1c1d"
palette_3 = "#1b1c1d"
palette_4 = "#1b1c1d"
palette_5 = "#1b1c1d"
palette_6 = "#1b1c1d"
palette_7 = "#1b1c1d"
palette_8 = "#1b1c1d"
palette_9 = "#1b1c1d"
palette_10 = "#1b1c1d"
palette_11 = "#1b1c1d"
palette_12 = "#1b1c1d"
palette_13 = "#1b1c1d"
palette_14 = "#1b1c1d"
palette_15 = "#1b1c1d"

[roles]
bg = "#1b1c1d"
bg_deep = "#141516"
surface = "#2d2d2e"
fg = "#adadad"
fg_soft = "#818282"
