# Front End Delight
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1c1d"
foreground = "#adadad"
cursor-color = "#cdcdcd"
cursor-text = "#1b1c1d"
selection-background = "#ea6154"
selection-foreground = "#1b1c1d"
palette_0 = "#242526"
palette_1 = "#f8511b"
palette_2 = "#565747"
palette_3 = "#fa771d"
palette_4 = "#2c70b7"
palette_5 = "#f02e4f"
palette_6 = "#3ca1a6"
palette_7 = "#adadad"
palette_8 = "#5fac6d"
palette_9 = "#f74319"
palette_10 = "#74ec4c"
palette_11 = "#fdc325"
palette_12 = "#3393ca"
palette_13 = "#e75e4f"
palette_14 = "#4fbce6"
palette_15 = "#8c735b"

[roles]
bg = "#1b1c1d"
bg_deep = "#141516"
surface = "#2d2d2e"
fg = "#adadad"
fg_soft = "#818282"
fg_bright = "#8c735b"
grey = "#6b6c6c"
grey_dim = "#4e4f4f"
grey_neutral = "#7a7a7b"
grey_soft = "#5d5d5e"
red = "#f8511b"
orange = "#f9641c"
yellow = "#fa771d"
green = "#565747"
aqua = "#3ca1a6"
blue = "#2c70b7"
purple = "#f02e4f"
tint_green = "#262725"
tint_red = "#43261d"
statusline = "#272829"
statusline_accent = "#353637"
statusline_fg = "#adadad"
on_accent = "#1b1c1d"
mode_red = "#f8511b"
mode_green = "#565747"
mode_yellow = "#fa771d"
mode_blue = "#2c70b7"
mode_purple = "#f02e4f"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
