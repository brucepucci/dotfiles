# Black Metal (Mayhem)
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c1c1c1"
cursor-color = "#c1c1c1"
cursor-text = "#8e8e8e"
selection-background = "#c1c1c1"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#5f8787"
palette_2 = "#f3ecd4"
palette_3 = "#eecc6c"
palette_4 = "#888888"
palette_5 = "#999999"
palette_6 = "#aaaaaa"
palette_7 = "#c1c1c1"
palette_8 = "#404040"
palette_9 = "#5f8787"
palette_10 = "#f3ecd4"
palette_11 = "#eecc6c"
palette_12 = "#888888"
palette_13 = "#999999"
palette_14 = "#aaaaaa"
palette_15 = "#c1c1c1"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#171717"
fg = "#c1c1c1"
fg_soft = "#878787"
fg_bright = "#c1c1c1"
grey = "#6a6a6a"
grey_dim = "#444444"
grey_neutral = "#7d7d7d"
grey_soft = "#575757"
red = "#5f8787"
orange = "#a6aa7a"
yellow = "#eecc6c"
green = "#f3ecd4"
aqua = "#aaaaaa"
blue = "#888888"
purple = "#999999"
tint_green = "#2c2a26"
tint_red = "#111818"
statusline = "#0f0f0f"
statusline_accent = "#232323"
statusline_fg = "#c1c1c1"
on_accent = "#000000"
mode_red = "#5f8787"
mode_green = "#f3ecd4"
mode_yellow = "#eecc6c"
mode_blue = "#888888"
mode_purple = "#999999"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
