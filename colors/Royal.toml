palette_2 = "#23801c"
palette_3 = "#b49d27"
palette_4 = "#6580b0"
palette_5 = "#674d96"
palette_6 = "#8aaabe"
palette_7 = "#524966"
palette_8 = "#3e3a4a"
palette_9 = "#d5356c"
palette_10 = "#2cd946"
palette_11 = "#fde83b"
palette_12 = "#90baf9"
palette_13 = "#a479e3"
palette_14 = "#acd4eb"
palette_15 = "#9e8cbd"

[roles]
bg = "#100815"
bg_deep = "#0c0610"
