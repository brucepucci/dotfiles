# Cobalt2
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#132738"
foreground = "#ffffff"
cursor-color = "#f0cc09"
cursor-text = "#98998c"
selection-background = "#18354f"
selection-foreground = "#b5b5b5"
palette_0 = "#000000"
palette_1 = "#ff0000"
palette_2 = "#38de21"
palette_3 = "#ffe50a"
palette_4 = "#1460d2"
palette_5 = "#ff005d"
palette_6 = "#00bbbb"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#f40e17"
palette_10 = "#3bd01d"
palette_11 = "#edc809"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#6ae3fa"
palette_15 = "#ffffff"

[roles]
bg = "#132738"
bg_deep = "#0e1d2a"
surface = "#2f4150"
fg = "#ffffff"
fg_soft = "#b8bec3"
fg_bright = "#ffffff"
grey = "#959ea5"
grey_dim = "#66737e"
grey_neutral = "#acb3b9"
grey_soft = "#7d8892"
red = "#ff0000"
orange = "#ff7205"
yellow = "#ffe50a"
green = "#38de21"
aqua = "#00bbbb"
blue = "#1460d2"
purple = "#ff005d"
tint_green = "#1a4834"
tint_red = "#3d202e"
statusline = "#263848"
statusline_accent = "#3d4e5c"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#ff0000"
mode_green = "#38de21"
mode_yellow = "#ffe50a"
mode_blue = "#1460d2"
mode_purple = "#ff005d"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
