# Red Planet
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#c2b790"
cursor-color = "#c2b790"
cursor-text = "#202020"
selection-background = "#1b324a"
selection-foreground = "#bcb291"
palette_0 = "#222222"
palette_1 = "#222222"
palette_2 = "#222222"
palette_3 = "#222222"
palette_4 = "#222222"
palette_5 = "#222222"
palette_6 = "#222222"
palette_7 = "#222222"
palette_8 = "#222222"
palette_9 = "#222222"
palette_10 = "#222222"
palette_11 = "#222222"
palette_12 = "#222222"
palette_13 = "#222222"
palette_14 = "#222222"
palette_15 = "#222222"

[roles]
