# Red Planet
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#c2b790"
cursor-color = "#c2b790"
cursor-text = "#202020"
selection-background = "#1b324a"
selection-foreground = "#bcb291"
palette_0 = "#202020"
palette_1 = "#8c3432"
palette_2 = "#728271"
palette_3 = "#e8bf6a"
palette_4 = "#69819e"
palette_5 = "#896492"
palette_6 = "#5b8390"
palette_7 = "#b9aa99"
palette_8 = "#676767"
palette_9 = "#b55242"
palette_10 = "#869985"
palette_11 = "#ebeb91"
palette_12 = "#60827e"
palette_13 = "#de4974"
palette_14 = "#38add8"
palette_15 = "#d6bfb8"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#35342f"
fg = "#c2b790"
fg_soft = "#928a6f"
fg_bright = "#d6bfb8"
