bg_deep = "#1a1a1a"
surface = "#35342f"
fg = "#c2b790"
fg_soft = "#928a6f"
fg_bright = "#222222"
grey = "#7a745e"
grey_dim = "#5a5648"
grey_neutral = "#8a836a"
grey_soft = "#6a6554"
red = "#222222"
orange = "#222222"
