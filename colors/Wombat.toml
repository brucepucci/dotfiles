# Wombat
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#171717"
foreground = "#dedacf"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#453b39"
selection-foreground = "#b6bbc0"
palette_0 = "#000000"
palette_1 = "#ff615a"
palette_2 = "#b1e969"
palette_3 = "#ebd99c"
palette_4 = "#5da9f6"
palette_5 = "#e86aff"
palette_6 = "#82fff7"
palette_7 = "#dedacf"
palette_8 = "#4a4a4a"
palette_9 = "#f58c80"
palette_10 = "#ddf88f"
palette_11 = "#eee5b2"
palette_12 = "#a5c7ff"
palette_13 = "#ddaaff"
palette_14 = "#b7fff9"
palette_15 = "#ffffff"

[roles]
bg = "#171717"
bg_deep = "#111111"
surface = "#2f2e2d"
fg = "#dedacf"
fg_soft = "#a2a098"
fg_bright = "#ffffff"
grey = "#84827c"
grey_dim = "#5d5b57"
grey_neutral = "#98968f"
grey_soft = "#716f6a"
red = "#ff615a"
orange = "#f59d7b"
yellow = "#ebd99c"
green = "#b1e969"
aqua = "#82fff7"
blue = "#5da9f6"
purple = "#e86aff"
tint_green = "#333d26"
tint_red = "#412423"
statusline = "#272726"
statusline_accent = "#3b3a38"
statusline_fg = "#dedacf"
on_accent = "#171717"
mode_red = "#ff615a"
mode_green = "#b1e969"
mode_yellow = "#ebd99c"
mode_blue = "#5da9f6"
mode_purple = "#e86aff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
