# Atom
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161719"
foreground = "#c5c8c6"
cursor-color = "#d0d0d0"
cursor-text = "#151515"
selection-background = "#444444"
selection-foreground = "#c5c8c6"
palette_0 = "#000000"
palette_1 = "#fd5ff1"
palette_2 = "#87c38a"
palette_3 = "#ffd7b1"
palette_4 = "#85befd"
palette_5 = "#b9b6fc"
palette_6 = "#85befd"
palette_7 = "#e0e0e0"
palette_8 = "#4c4c4c"
palette_9 = "#fd5ff1"
palette_10 = "#94fa36"
palette_11 = "#f5ffa8"
palette_12 = "#96cbfe"
palette_13 = "#b9b6fc"
palette_14 = "#85befd"
palette_15 = "#e0e0e0"

[roles]
bg = "#161719"
bg_deep = "#101113"
surface = "#2b2c2e"
fg = "#c5c8c6"
fg_soft = "#909392"
fg_bright = "#e0e0e0"
grey = "#767878"
grey_dim = "#535556"
grey_neutral = "#888a89"
grey_soft = "#656767"
red = "#fd5ff1"
orange = "#fe9bd1"
yellow = "#ffd7b1"
green = "#87c38a"
aqua = "#85befd"
blue = "#85befd"
purple = "#b9b6fc"
tint_green = "#2a362d"
tint_red = "#402440"
statusline = "#242527"
