# Heeler
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#211f46"
foreground = "#fdfdfd"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#2b2c41"
selection-foreground = "#2eff58"
palette_0 = "#000000"
palette_1 = "#e44c2e"
palette_2 = "#bdd100"
palette_3 = "#f4ce65"
palette_4 = "#5ba5f2"
palette_5 = "#ff95c2"
palette_6 = "#ff9763"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#e44c2e"
palette_10 = "#bdd100"
palette_11 = "#f4ce65"
palette_12 = "#0088ff"
palette_13 = "#ff95c2"
palette_14 = "#8da6e4"
palette_15 = "#ffffff"

[roles]
bg = "#211f46"
bg_deep = "#191734"
surface = "#3b3a5c"
fg = "#fdfdfd"
fg_soft = "#bbbac6"
fg_bright = "#ffffff"
grey = "#9a99ab"
grey_dim = "#6e6d86"
grey_neutral = "#b0afbd"
grey_soft = "#848398"
red = "#e44c2e"
orange = "#ec8d4a"
yellow = "#f4ce65"
green = "#bdd100"
aqua = "#ff9763"
blue = "#5ba5f2"
purple = "#ff95c2"
tint_green = "#3d3f39"
tint_red = "#442742"
statusline = "#333155"
statusline_accent = "#494767"
statusline_fg = "#fdfdfd"
on_accent = "#211f46"
mode_red = "#e44c2e"
mode_green = "#bdd100"
mode_yellow = "#f4ce65"
mode_blue = "#5ba5f2"
