palette_2 = "#211f46"
palette_3 = "#211f46"
palette_4 = "#211f46"
palette_5 = "#211f46"
palette_6 = "#211f46"
palette_7 = "#211f46"
palette_8 = "#211f46"
palette_9 = "#211f46"
palette_10 = "#211f46"
palette_11 = "#211f46"
palette_12 = "#211f46"
palette_13 = "#211f46"
palette_14 = "#211f46"
palette_15 = "#211f46"

[roles]
bg = "#211f46"
bg_deep = "#191734"
surface = "#3b3a5c"
fg = "#fdfdfd"
fg_soft = "#bbbac6"
fg_bright = "#211f46"
grey = "#9a99ab"
grey_dim = "#6e6d86"
grey_neutral = "#b0afbd"
