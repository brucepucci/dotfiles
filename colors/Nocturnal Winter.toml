# Nocturnal Winter
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d0d17"
foreground = "#e6e5e5"
cursor-color = "#e6e5e5"
cursor-text = "#a6a6a6"
selection-background = "#adbdd0"
selection-foreground = "#000000"
palette_0 = "#4d4d4d"
palette_1 = "#f12d52"
palette_2 = "#09cd7e"
palette_3 = "#f5f17a"
palette_4 = "#3182e0"
palette_5 = "#ff2b6d"
palette_6 = "#09c87a"
palette_7 = "#fcfcfc"
palette_8 = "#808080"
palette_9 = "#f16d86"
palette_10 = "#0ae78d"
palette_11 = "#fffc67"
palette_12 = "#6096ff"
palette_13 = "#ff78a2"
palette_14 = "#0ae78d"
palette_15 = "#ffffff"

[roles]
bg = "#0d0d17"
bg_deep = "#0a0a11"
surface = "#272730"
fg = "#e6e5e5"
fg_soft = "#a5a4a7"
fg_bright = "#ffffff"
grey = "#848488"
grey_dim = "#59595f"
grey_neutral = "#9a999d"
grey_soft = "#6f6e74"
red = "#f12d52"
orange = "#f38f66"
yellow = "#f5f17a"
green = "#09cd7e"
aqua = "#09c87a"
blue = "#3182e0"
purple = "#ff2b6d"
tint_green = "#0c302a"
tint_red = "#361322"
statusline = "#1e1e27"
statusline_accent = "#34343c"
statusline_fg = "#e6e5e5"
on_accent = "#0d0d17"
mode_red = "#f12d52"
mode_green = "#09cd7e"
mode_yellow = "#f5f17a"
mode_blue = "#3182e0"
mode_purple = "#ff2b6d"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
