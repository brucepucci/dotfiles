palette_9 = "#0d0d17"
palette_10 = "#0d0d17"
palette_11 = "#0d0d17"
palette_12 = "#0d0d17"
palette_13 = "#0d0d17"
palette_14 = "#0d0d17"
palette_15 = "#0d0d17"

