# Everforest Dark Hard
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e2326"
foreground = "#d3c6aa"
cursor-color = "#e69875"
cursor-text = "#4c3743"
selection-background = "#4c3743"
selection-foreground = "#d3c6aa"
palette_0 = "#7a8478"
palette_1 = "#e67e80"
palette_2 = "#a7c080"
palette_3 = "#dbbc7f"
palette_4 = "#7fbbb3"
palette_5 = "#d699b6"
palette_6 = "#83c092"
palette_7 = "#f2efdf"
palette_8 = "#a6b0a0"
palette_9 = "#f85552"
palette_10 = "#8da101"
palette_11 = "#dfa000"
palette_12 = "#3a94c5"
palette_13 = "#df69ba"
palette_14 = "#35a77c"
palette_15 = "#fffbef"

[roles]
bg = "#1e2326"
bg_deep = "#161a1c"
surface = "#343736"
fg = "#d3c6aa"
fg_soft = "#9d9582"
