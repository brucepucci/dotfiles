palette_9 = "#1e2326"
palette_10 = "#1e2326"
palette_11 = "#1e2326"
palette_12 = "#1e2326"
palette_13 = "#1e2326"
palette_14 = "#1e2326"
palette_15 = "#1e2326"

[roles]
