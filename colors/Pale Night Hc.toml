# Pale Night Hc
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#3e4251"
foreground = "#cccccc"
cursor-color = "#ffcb6b"
cursor-text = "#323232"
selection-background = "#717cb4"
selection-foreground = "#80cbc4"
palette_0 = "#000000"
palette_1 = "#f07178"
palette_2 = "#c3e88d"
palette_3 = "#ffcb6b"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#89ddff"
palette_7 = "#ffffff"
palette_8 = "#737373"
palette_9 = "#f6a9ae"
palette_10 = "#dbf1ba"
palette_11 = "#ffdfa6"
palette_12 = "#b4ccff"
palette_13 = "#ddbdf2"
palette_14 = "#b8eaff"
palette_15 = "#999999"

[roles]
bg = "#3e4251"
bg_deep = "#2e323d"
surface = "#4f5360"
fg = "#cccccc"
fg_soft = "#a1a3a7"
fg_bright = "#999999"
grey = "#8c8e95"
grey_dim = "#70727c"
grey_neutral = "#9a9ca1"
grey_soft = "#7e8088"
red = "#f07178"
orange = "#f89e72"
yellow = "#ffcb6b"
green = "#c3e88d"
aqua = "#89ddff"
blue = "#82aaff"
purple = "#c792ea"
tint_green = "#56605c"
tint_red = "#5e4a58"
statusline = "#494d5b"
statusline_accent = "#585b67"
statusline_fg = "#cccccc"
on_accent = "#3e4251"
mode_red = "#f07178"
mode_green = "#c3e88d"
mode_yellow = "#ffcb6b"
mode_blue = "#82aaff"
mode_purple = "#c792ea"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
