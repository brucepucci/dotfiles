palette_2 = "#6fa64c"
palette_3 = "#7e8000"
palette_4 = "#2c9a84"
palette_5 = "#523a60"
palette_6 = "#114d53"
palette_7 = "#006536"
palette_8 = "#404040"
palette_9 = "#00733d"
palette_10 = "#90d762"
palette_11 = "#e2e500"
palette_12 = "#46d8b8"
palette_13 = "#573d66"
palette_14 = "#12545a"
palette_15 = "#006536"

[roles]
bg = "#070c0e"
bg_deep = "#05090a"
surface = "#0e150f"
fg = "#3e5715"
