palette_2 = "#a1efd3"
palette_3 = "#ffe9aa"
palette_4 = "#57c7ff"
palette_5 = "#c792ea"
palette_6 = "#87dfeb"
palette_7 = "#f8f8f2"
palette_8 = "#585273"
palette_9 = "#f02e6e"
palette_10 = "#2ce592"
palette_11 = "#ffb378"
palette_12 = "#1da0e2"
palette_13 = "#a742ea"
palette_14 = "#63f2f1"
palette_15 = "#a6b3cc"

[roles]
