# Django Smooth
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#245032"
foreground = "#f8f8f8"
cursor-color = "#4c7e5c"
cursor-text = "#f8f8f8"
selection-background = "#336442"
selection-foreground = "#f8f8f8"
palette_0 = "#000000"
palette_1 = "#fd6209"
palette_2 = "#41a83e"
palette_3 = "#ffe862"
palette_4 = "#989898"
palette_5 = "#f8f8f8"
palette_6 = "#9df39f"
palette_7 = "#e8e8e7"
palette_8 = "#727272"
palette_9 = "#ff943b"
palette_10 = "#73da70"
palette_11 = "#ffff94"
palette_12 = "#cacaca"
palette_13 = "#ffffff"
palette_14 = "#cfffd1"
palette_15 = "#ffffff"

[roles]
bg = "#245032"
bg_deep = "#1b3c26"
surface = "#3d644a"
fg = "#f8f8f8"
fg_soft = "#b8c6bd"
fg_bright = "#ffffff"
grey = "#99ac9f"
grey_dim = "#6e8b77"
grey_neutral = "#aebdb3"
grey_soft = "#839c8b"
red = "#fd6209"
orange = "#fea536"
yellow = "#ffe862"
green = "#41a83e"
aqua = "#9df39f"
blue = "#989898"
purple = "#f8f8f8"
tint_green = "#296034"
tint_red = "#4b532b"
statusline = "#355d42"
statusline_accent = "#4a6e56"
statusline_fg = "#f8f8f8"
on_accent = "#245032"
mode_red = "#fd6209"
mode_green = "#41a83e"
mode_yellow = "#ffe862"
mode_blue = "#989898"
mode_purple = "#f8f8f8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
