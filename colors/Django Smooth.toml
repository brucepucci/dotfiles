palette_2 = "#245032"
palette_3 = "#245032"
palette_4 = "#245032"
palette_5 = "#245032"
palette_6 = "#245032"
palette_7 = "#245032"
palette_8 = "#245032"
palette_9 = "#245032"
palette_10 = "#245032"
palette_11 = "#245032"
palette_12 = "#245032"
palette_13 = "#245032"
palette_14 = "#245032"
palette_15 = "#245032"

[roles]
