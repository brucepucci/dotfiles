# GitHub Light Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#1f2328"
cursor-color = "#0969da"
cursor-text = "#3c9cff"
selection-background = "#1f2328"
selection-foreground = "#ffffff"
palette_0 = "#24292f"
palette_1 = "#cf222e"
palette_2 = "#116329"
palette_3 = "#4d2d00"
palette_4 = "#0969da"
palette_5 = "#8250df"
palette_6 = "#1b7c83"
palette_7 = "#6e7781"
palette_8 = "#57606a"
palette_9 = "#a40e26"
palette_10 = "#1a7f37"
palette_11 = "#633c01"
palette_12 = "#218bff"
palette_13 = "#a475f9"
palette_14 = "#3192aa"
palette_15 = "#8c959f"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e4e5e5"
fg = "#1f2328"
fg_soft = "#626568"
fg_bright = "#14171a"
grey = "#848689"
grey_dim = "#b1b2b4"
grey_neutral = "#6d7073"
grey_soft = "#9a9c9e"
red = "#cf222e"
orange = "#8e2817"
yellow = "#4d2d00"
green = "#116329"
aqua = "#1b7c83"
blue = "#0969da"
purple = "#8250df"
tint_green = "#d4e3d8"
tint_red = "#f6d7d9"
statusline = "#ededee"
statusline_accent = "#d7d7d8"
statusline_fg = "#1f2328"
on_accent = "#ffffff"
mode_red = "#cf222e"
mode_green = "#116329"
mode_yellow = "#4d2d00"
mode_blue = "#0969da"
mode_purple = "#8250df"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
