# GitHub Light Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#1f2328"
cursor-color = "#0969da"
cursor-text = "#3c9cff"
selection-background = "#1f2328"
selection-foreground = "#ffffff"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e4e5e5"
fg = "#1f2328"
fg_soft = "#626568"
fg_bright = "#14171a"
grey = "#848689"
grey_dim = "#b1b2b4"
grey_neutral = "#6d7073"
grey_soft = "#9a9c9e"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
blue = "#ffffff"
purple = "#ffffff"
tint_green = "#ffffff"
tint_red = "#ffffff"
statusline = "#ededee"
statusline_accent = "#d7d7d8"
statusline_fg = "#1f2328"
on_accent = "#1f2328"
mode_red = "#ffffff"
mode_green = "#ffffff"
mode_yellow = "#ffffff"
mode_blue = "#ffffff"
mode_purple = "#ffffff"

[apps]
