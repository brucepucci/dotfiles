# Ollie
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222125"
foreground = "#8a8dae"
cursor-color = "#5b6ea7"
cursor-text = "#2a292d"
selection-background = "#1e3a66"
selection-foreground = "#8a8eac"
palette_0 = "#000000"
palette_1 = "#ac2e31"
palette_2 = "#31ac61"
palette_3 = "#ac4300"
palette_4 = "#2d57ac"
palette_5 = "#b08528"
palette_6 = "#1fa6ac"
palette_7 = "#8a8eac"
palette_8 = "#684432"
palette_9 = "#ff3d48"
palette_10 = "#3bff99"
palette_11 = "#ff5e1e"
palette_12 = "#4488ff"
palette_13 = "#ffc21d"
palette_14 = "#1ffaff"
palette_15 = "#5b6ea7"

[roles]
bg = "#222125"
bg_deep = "#1a191c"
surface = "#2e2e35"
fg = "#8a8dae"
fg_soft = "#6b6d85"
fg_bright = "#5b6ea7"
grey = "#5b5c70"
grey_dim = "#464755"
grey_neutral = "#66677e"
grey_soft = "#515263"
red = "#ac2e31"
orange = "#ac3818"
yellow = "#ac4300"
green = "#31ac61"
aqua = "#1fa6ac"
blue = "#2d57ac"
purple = "#b08528"
tint_green = "#253a30"
tint_red = "#3b2327"
statusline = "#2a2a30"
statusline_accent = "#35343e"
statusline_fg = "#8a8dae"
on_accent = "#8a8dae"
mode_red = "#ac2e31"
mode_green = "#31ac61"
mode_yellow = "#ac4300"
mode_blue = "#2d57ac"
mode_purple = "#b08528"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
