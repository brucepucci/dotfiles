# iTerm2 Smoooooth
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#15191f"
foreground = "#dcdcdc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#b3d7ff"
selection-foreground = "#000000"
palette_0 = "#14191e"
palette_1 = "#b43c2a"
palette_2 = "#00c200"
palette_3 = "#c7c400"
palette_4 = "#2744c7"
palette_5 = "#c040be"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#dd7975"
palette_10 = "#58e790"
palette_11 = "#ece100"
palette_12 = "#a7abf2"
palette_13 = "#e17ee1"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#15191f"
bg_deep = "#101317"
surface = "#2d3036"
fg = "#dcdcdc"
fg_soft = "#a0a2a3"
fg_bright = "#ffffff"
grey = "#828487"
grey_dim = "#5b5d61"
grey_neutral = "#96989a"
grey_soft = "#6f7174"
red = "#b43c2a"
orange = "#be8015"
yellow = "#c7c400"
green = "#00c200"
aqua = "#00c5c7"
blue = "#2744c7"
purple = "#c040be"
tint_green = "#113719"
tint_red = "#321f21"
statusline = "#25292e"
statusline_accent = "#393c41"
statusline_fg = "#dcdcdc"
on_accent = "#dcdcdc"
mode_red = "#b43c2a"
mode_green = "#00c200"
mode_yellow = "#c7c400"
mode_blue = "#2744c7"
mode_purple = "#c040be"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
