# iTerm2 Smoooooth
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#15191f"
foreground = "#dcdcdc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#b3d7ff"
selection-foreground = "#000000"
palette_0 = "#15191f"
palette_1 = "#15191f"
palette_2 = "#15191f"
palette_3 = "#15191f"
palette_4 = "#15191f"
palette_5 = "#15191f"
palette_6 = "#15191f"
palette_7 = "#15191f"
palette_8 = "#15191f"
palette_9 = "#15191f"
palette_10 = "#15191f"
palette_11 = "#15191f"
palette_12 = "#15191f"
palette_13 = "#15191f"
palette_14 = "#15191f"
palette_15 = "#15191f"

[roles]
bg = "#15191f"
bg_deep = "#101317"
surface = "#2d3036"
fg = "#dcdcdc"
fg_soft = "#a0a2a3"
fg_bright = "#15191f"
grey = "#828487"
grey_dim = "#5b5d61"
grey_neutral = "#96989a"
grey_soft = "#6f7174"
red = "#15191f"
orange = "#15191f"
yellow = "#15191f"
green = "#15191f"
aqua = "#15191f"
blue = "#15191f"
purple = "#15191f"
tint_green = "#15191f"
tint_red = "#15191f"
statusline = "#25292e"
