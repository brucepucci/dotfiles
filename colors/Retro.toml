# Retro
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#13a10e"
cursor-color = "#13a10e"
cursor-text = "#000000"
selection-background = "#ffffff"
selection-foreground = "#000000"
palette_0 = "#13a10e"
palette_1 = "#13a10e"
palette_2 = "#13a10e"
palette_3 = "#13a10e"
palette_4 = "#13a10e"
palette_5 = "#13a10e"
palette_6 = "#13a10e"
palette_7 = "#13a10e"
palette_8 = "#16ba10"
palette_9 = "#16ba10"
palette_10 = "#16ba10"
palette_11 = "#16ba10"
palette_12 = "#16ba10"
palette_13 = "#16ba10"
palette_14 = "#16ba10"
palette_15 = "#16ba10"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#021302"
fg = "#13a10e"
fg_soft = "#0d710a"
fg_bright = "#16ba10"
grey = "#0a5908"
grey_dim = "#073805"
grey_neutral = "#0c6909"
grey_soft = "#094806"
red = "#13a10e"
orange = "#13a10e"
yellow = "#13a10e"
green = "#13a10e"
aqua = "#13a10e"
blue = "#13a10e"
purple = "#13a10e"
