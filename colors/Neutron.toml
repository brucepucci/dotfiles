palette_6 = "#1c1e22"
palette_7 = "#1c1e22"
palette_8 = "#1c1e22"
palette_9 = "#1c1e22"
palette_10 = "#1c1e22"
palette_11 = "#1c1e22"
palette_12 = "#1c1e22"
palette_13 = "#1c1e22"
palette_14 = "#1c1e22"
palette_15 = "#1c1e22"

[roles]
