# Neutron
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1e22"
foreground = "#e6e8ef"
cursor-color = "#f6f7ec"
cursor-text = "#b7b8a8"
selection-background = "#2f363e"
selection-foreground = "#7d8fa4"
palette_0 = "#23252b"
palette_1 = "#b54036"
palette_2 = "#5ab977"
palette_3 = "#deb566"
palette_4 = "#6a7c93"
palette_5 = "#a4799d"
palette_6 = "#3f94a8"
palette_7 = "#e6e8ef"
palette_8 = "#494b51"
palette_9 = "#b54036"
palette_10 = "#5ab977"
palette_11 = "#deb566"
palette_12 = "#6a7c93"
palette_13 = "#a4799d"
palette_14 = "#3f94a8"
palette_15 = "#ebedf2"

[roles]
bg = "#1c1e22"
bg_deep = "#15161a"
surface = "#34363b"
fg = "#e6e8ef"
fg_soft = "#a9abb2"
fg_bright = "#ebedf2"
grey = "#8b8d93"
grey_dim = "#63656a"
grey_neutral = "#9fa1a7"
grey_soft = "#77797e"
red = "#b54036"
orange = "#ca7a4e"
yellow = "#deb566"
green = "#5ab977"
aqua = "#3f94a8"
blue = "#6a7c93"
purple = "#a4799d"
tint_green = "#273a31"
tint_red = "#382426"
statusline = "#2c2e32"
