# Zenbones Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f0edec"
foreground = "#2c363c"
cursor-color = "#2c363c"
cursor-text = "#f0edec"
selection-background = "#cbd9e3"
selection-foreground = "#2c363c"
palette_0 = "#f0edec"
palette_1 = "#a8334c"
palette_2 = "#4f6c31"
palette_3 = "#944927"
palette_4 = "#286486"
palette_5 = "#88507d"
palette_6 = "#3b8992"
palette_7 = "#2c363c"
palette_8 = "#b5a7a0"
palette_9 = "#94253e"
palette_10 = "#3f5a22"
palette_11 = "#803d1c"
palette_12 = "#1d5573"
palette_13 = "#7b3b70"
palette_14 = "#2b747c"
palette_15 = "#4f5e68"

[roles]
bg = "#f0edec"
bg_deep = "#f4f2f1"
surface = "#d8d7d7"
fg = "#2c363c"
fg_soft = "#676d71"
fg_bright = "#1d2327"
grey = "#84888b"
grey_dim = "#abadae"
grey_neutral = "#71767a"
grey_soft = "#989b9d"
red = "#a8334c"
orange = "#9e3e3a"
yellow = "#944927"
green = "#4f6c31"
aqua = "#3b8992"
blue = "#286486"
purple = "#88507d"
tint_green = "#d3d6ca"
tint_red = "#e3cccf"
