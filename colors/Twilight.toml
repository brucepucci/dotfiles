# Twilight
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141414"
foreground = "#ffffd4"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#313131"
selection-foreground = "#ffffd4"
palette_0 = "#141414"
palette_1 = "#c06d44"
palette_2 = "#afb97a"
palette_3 = "#c2a86c"
palette_4 = "#44474a"
palette_5 = "#b4be7c"
palette_6 = "#778385"
palette_7 = "#ffffd4"
palette_8 = "#404040"
palette_9 = "#de7c4c"
palette_10 = "#ccd88c"
palette_11 = "#e2c47e"
palette_12 = "#5a5e62"
palette_13 = "#d0dc8e"
palette_14 = "#8a989b"
palette_15 = "#ffffd4"

[roles]
bg = "#141414"
bg_deep = "#0f0f0f"
surface = "#30302b"
fg = "#ffffd4"
fg_soft = "#b8b89a"
fg_bright = "#ffffd4"
grey = "#95957e"
grey_dim = "#666657"
grey_neutral = "#adad91"
grey_soft = "#7e7e6a"
red = "#c06d44"
orange = "#c18a58"
yellow = "#c2a86c"
green = "#afb97a"
aqua = "#778385"
blue = "#44474a"
purple = "#b4be7c"
tint_green = "#303226"
tint_red = "#33241d"
statusline = "#272723"
