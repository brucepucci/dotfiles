# Square
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#acacab"
cursor-color = "#fcfbcc"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#050505"
palette_1 = "#e9897c"
palette_2 = "#b6377d"
palette_3 = "#ecebbe"
palette_4 = "#a9cdeb"
palette_5 = "#75507b"
palette_6 = "#c9caec"
palette_7 = "#f2f2f2"
palette_8 = "#474747"
palette_9 = "#f99286"
palette_10 = "#c3f786"
palette_11 = "#fcfbcc"
palette_12 = "#b6defb"
palette_13 = "#ad7fa8"
palette_14 = "#d7d9fc"
palette_15 = "#e2e2e2"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#2c2c2b"
fg = "#acacab"
fg_soft = "#808080"
fg_bright = "#e2e2e2"
grey = "#6a6a6a"
grey_dim = "#4d4d4d"
grey_neutral = "#797978"
grey_soft = "#5c5c5b"
red = "#e9897c"
orange = "#eaba9d"
yellow = "#ecebbe"
green = "#b6377d"
aqua = "#c9caec"
blue = "#a9cdeb"
purple = "#75507b"
tint_green = "#361f2c"
tint_red = "#3f2e2c"
statusline = "#262626"
statusline_accent = "#343434"
statusline_fg = "#acacab"
on_accent = "#1a1a1a"
mode_red = "#e9897c"
mode_green = "#b6377d"
mode_yellow = "#ecebbe"
mode_blue = "#a9cdeb"
mode_purple = "#75507b"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
