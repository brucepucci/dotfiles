# 12-bit Rainbow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#040404"
foreground = "#feffff"
cursor-color = "#e0d000"
cursor-text = "#000000"
selection-background = "#606060"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#a03050"
palette_2 = "#40d080"
palette_3 = "#e09040"
palette_4 = "#3060b0"
palette_5 = "#603090"
palette_6 = "#0090c0"
palette_7 = "#dbded8"
palette_8 = "#685656"
palette_9 = "#c06060"
palette_10 = "#90d050"
palette_11 = "#e0d000"
palette_12 = "#00b0c0"
palette_13 = "#801070"
palette_14 = "#20b0c0"
palette_15 = "#ffffff"

[roles]
bg = "#040404"
bg_deep = "#030303"
surface = "#222222"
fg = "#feffff"
fg_soft = "#b3b4b4"
fg_bright = "#ffffff"
grey = "#8e8e8e"
grey_dim = "#5c5c5c"
grey_neutral = "#a6a7a7"
grey_soft = "#747575"
red = "#a03050"
orange = "#c06048"
yellow = "#e09040"
green = "#40d080"
aqua = "#0090c0"
blue = "#3060b0"
purple = "#603090"
tint_green = "#0f291a"
tint_red = "#200c12"
statusline = "#181818"
statusline_accent = "#313131"
statusline_fg = "#feffff"
on_accent = "#feffff"
mode_red = "#a03050"
mode_green = "#40d080"
mode_yellow = "#e09040"
mode_blue = "#3060b0"
mode_purple = "#603090"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
