# Blue Berry Pie
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c0c28"
foreground = "#babab9"
cursor-color = "#fcfad6"
cursor-text = "#000000"
selection-background = "#606060"
selection-foreground = "#ffffff"
palette_0 = "#0a4c62"
palette_1 = "#99246e"
palette_2 = "#5cb1b3"
palette_3 = "#eab9a8"
palette_4 = "#90a5bd"
palette_5 = "#9d54a7"
palette_6 = "#7e83cc"
palette_7 = "#f0e8d6"
palette_8 = "#463c5d"
palette_9 = "#c87272"
palette_10 = "#0a6c7e"
palette_11 = "#7a3188"
palette_12 = "#5f3d63"
palette_13 = "#bc94b7"
palette_14 = "#5e6071"
palette_15 = "#0a6c7e"

[roles]
bg = "#1c0c28"
bg_deep = "#15091e"
surface = "#2f2139"
fg = "#babab9"
fg_soft = "#8b868e"
fg_bright = "#0a6c7e"
