# Warm Neon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#404040"
foreground = "#afdab6"
cursor-color = "#30ff24"
cursor-text = "#0bbc04"
selection-background = "#b0ad21"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#e24346"
palette_2 = "#39b13a"
palette_3 = "#dae145"
palette_4 = "#4261c5"
palette_5 = "#f920fb"
palette_6 = "#2abbd4"
palette_7 = "#d0b8a3"
palette_8 = "#fefcfc"
palette_9 = "#e97071"
palette_10 = "#9cc090"
palette_11 = "#ddda7a"
palette_12 = "#7b91d6"
palette_13 = "#f674ba"
palette_14 = "#5ed1e5"
palette_15 = "#d8c8bb"

[roles]
bg = "#404040"
bg_deep = "#303030"
surface = "#4d524e"
fg = "#afdab6"
fg_soft = "#8eac93"
fg_bright = "#d8c8bb"
grey = "#7d9581"
grey_dim = "#677669"
grey_neutral = "#88a48d"
grey_soft = "#728575"
red = "#e24346"
orange = "#de9246"
yellow = "#dae145"
green = "#39b13a"
aqua = "#2abbd4"
blue = "#4261c5"
purple = "#f920fb"
tint_green = "#3f543f"
tint_red = "#5d4141"
statusline = "#494c49"
statusline_accent = "#545c55"
statusline_fg = "#afdab6"
on_accent = "#404040"
mode_red = "#e24346"
mode_green = "#39b13a"
mode_yellow = "#dae145"
mode_blue = "#4261c5"
mode_purple = "#f920fb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
