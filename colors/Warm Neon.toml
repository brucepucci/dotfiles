# Warm Neon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#404040"
foreground = "#afdab6"
cursor-color = "#30ff24"
cursor-text = "#0bbc04"
selection-background = "#b0ad21"
selection-foreground = "#ffffff"
palette_0 = "#404040"
palette_1 = "#404040"
palette_2 = "#404040"
palette_3 = "#404040"
palette_4 = "#404040"
palette_5 = "#404040"
palette_6 = "#404040"
palette_7 = "#404040"
palette_8 = "#404040"
palette_9 = "#404040"
palette_10 = "#404040"
palette_11 = "#404040"
palette_12 = "#404040"
palette_13 = "#404040"
palette_14 = "#404040"
palette_15 = "#404040"

[roles]
bg = "#404040"
bg_deep = "#303030"
surface = "#4d524e"
fg = "#afdab6"
fg_soft = "#8eac93"
fg_bright = "#404040"
grey = "#7d9581"
grey_dim = "#677669"
grey_neutral = "#88a48d"
grey_soft = "#728575"
red = "#404040"
orange = "#404040"
yellow = "#404040"
green = "#404040"
aqua = "#404040"
blue = "#404040"
purple = "#404040"
