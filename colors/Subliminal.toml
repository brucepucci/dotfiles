palette_2 = "#a9cfa4"
palette_3 = "#ffe2a9"
palette_4 = "#6699cc"
palette_5 = "#f1a5ab"
palette_6 = "#5fb3b3"
palette_7 = "#d4d4d4"
palette_8 = "#7f7f7f"
palette_9 = "#e15a60"
palette_10 = "#a9cfa4"
palette_11 = "#ffe2a9"
palette_12 = "#6699cc"
palette_13 = "#f1a5ab"
palette_14 = "#5fb3b3"
palette_15 = "#d4d4d4"

[roles]
bg = "#282c35"
bg_deep = "#1e2128"
