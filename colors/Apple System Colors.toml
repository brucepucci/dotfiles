# Apple System Colors
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#ffffff"
cursor-color = "#98989d"
cursor-text = "#ffffff"
selection-background = "#3f638b"
selection-foreground = "#ffffff"
palette_0 = "#1a1a1a"
palette_1 = "#cc372e"
palette_2 = "#26a439"
palette_3 = "#cdac08"
palette_4 = "#0869cb"
palette_5 = "#9647bf"
palette_6 = "#479ec2"
palette_7 = "#98989d"
palette_8 = "#464646"
palette_9 = "#ff453a"
palette_10 = "#32d74b"
palette_11 = "#ffd60a"
palette_12 = "#0a84ff"
palette_13 = "#bf5af2"
palette_14 = "#76d6ff"
palette_15 = "#ffffff"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#393939"
fg = "#ffffff"
fg_soft = "#bcbcbc"
fg_bright = "#ffffff"
grey = "#9a9a9a"
grey_dim = "#6d6d6d"
grey_neutral = "#b0b0b0"
grey_soft = "#838383"
red = "#cc372e"
orange = "#cc721b"
yellow = "#cdac08"
green = "#26a439"
aqua = "#479ec2"
blue = "#0869cb"
purple = "#9647bf"
tint_green = "#1f3623"
tint_red = "#3d2221"
statusline = "#303030"
statusline_accent = "#464646"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#cc372e"
mode_green = "#26a439"
mode_yellow = "#cdac08"
mode_blue = "#0869cb"
mode_purple = "#9647bf"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
