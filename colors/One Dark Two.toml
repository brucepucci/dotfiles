palette_6 = "#21252b"
palette_7 = "#21252b"
palette_8 = "#21252b"
palette_9 = "#21252b"
palette_10 = "#21252b"
palette_11 = "#21252b"
palette_12 = "#21252b"
palette_13 = "#21252b"
palette_14 = "#21252b"
palette_15 = "#21252b"

[roles]
