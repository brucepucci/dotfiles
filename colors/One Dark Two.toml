# One Dark Two
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#21252b"
foreground = "#e6e6e6"
cursor-color = "#e6e6e6"
cursor-text = "#1d1f23"
selection-background = "#393e47"
selection-foreground = "#e6e6e6"
palette_0 = "#1d1f23"
palette_1 = "#e27881"
palette_2 = "#98c379"
palette_3 = "#eac786"
palette_4 = "#71b9f4"
palette_5 = "#c88bda"
palette_6 = "#62bac6"
palette_7 = "#c9ccd3"
palette_8 = "#4a505a"
palette_9 = "#e68991"
palette_10 = "#a8cc8e"
palette_11 = "#edcf97"
palette_12 = "#8dc7f6"
palette_13 = "#d3a2e2"
palette_14 = "#78c4ce"
palette_15 = "#e6e6e6"

[roles]
bg = "#21252b"
bg_deep = "#191c20"
surface = "#393c41"
fg = "#e6e6e6"
