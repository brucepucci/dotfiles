# Coffee Theme
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f5deb3"
foreground = "#000000"
cursor-color = "#a1a1a1"
cursor-text = "#fffc67"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c91b00"
palette_2 = "#00c200"
palette_3 = "#adaa00"
palette_4 = "#0225c7"
palette_5 = "#ca30c7"
palette_6 = "#00b8ba"
palette_7 = "#a1a1a1"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#1fba28"
palette_11 = "#b2af1b"
palette_12 = "#6871ff"
palette_13 = "#f26af2"
palette_14 = "#20bdbf"
palette_15 = "#ffffff"

[roles]
bg = "#f5deb3"
bg_deep = "#f8e6c6"
surface = "#d8c39e"
fg = "#000000"
fg_soft = "#4a4336"
fg_bright = "#000000"
grey = "#6e6451"
grey_dim = "#9f9074"
grey_neutral = "#564e3f"
grey_soft = "#877a62"
red = "#c91b00"
orange = "#bb6200"
yellow = "#adaa00"
green = "#00c200"
aqua = "#00b8ba"
blue = "#0225c7"
purple = "#ca30c7"
tint_green = "#c9d993"
tint_red = "#edbb93"
statusline = "#e1cca5"
statusline_accent = "#c9b693"
statusline_fg = "#000000"
on_accent = "#f5deb3"
mode_red = "#c91b00"
mode_green = "#00c200"
mode_yellow = "#adaa00"
mode_blue = "#0225c7"
mode_purple = "#ca30c7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
