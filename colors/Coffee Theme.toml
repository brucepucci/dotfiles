palette_2 = "#f5deb3"
palette_3 = "#f5deb3"
palette_4 = "#f5deb3"
palette_5 = "#f5deb3"
palette_6 = "#f5deb3"
palette_7 = "#f5deb3"
palette_8 = "#f5deb3"
palette_9 = "#f5deb3"
palette_10 = "#f5deb3"
palette_11 = "#f5deb3"
palette_12 = "#f5deb3"
palette_13 = "#f5deb3"
palette_14 = "#f5deb3"
palette_15 = "#f5deb3"

[roles]
