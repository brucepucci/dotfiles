palette_2 = "#001e27"
palette_3 = "#001e27"
palette_4 = "#001e27"
palette_5 = "#001e27"
palette_6 = "#001e27"
palette_7 = "#001e27"
palette_8 = "#001e27"
palette_9 = "#001e27"
palette_10 = "#001e27"
palette_11 = "#001e27"
palette_12 = "#001e27"
palette_13 = "#001e27"
palette_14 = "#001e27"
palette_15 = "#001e27"

[roles]
bg = "#001e27"
bg_deep = "#00161d"
surface = "#13323a"
fg = "#9cc2c3"
fg_soft = "#6d9194"
fg_bright = "#001e27"
grey = "#56787d"
