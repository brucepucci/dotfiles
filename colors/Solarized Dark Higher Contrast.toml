# Solarized Dark Higher Contrast
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#001e27"
foreground = "#9cc2c3"
cursor-color = "#f34b00"
cursor-text = "#002831"
selection-background = "#003748"
selection-foreground = "#7a8f8e"
palette_0 = "#002831"
palette_1 = "#d11c24"
palette_2 = "#6cbe6c"
palette_3 = "#a57706"
palette_4 = "#2176c7"
palette_5 = "#c61c6f"
palette_6 = "#259286"
palette_7 = "#eae3cb"
palette_8 = "#006488"
palette_9 = "#f5163b"
palette_10 = "#51ef84"
palette_11 = "#b27e28"
palette_12 = "#178ec8"
palette_13 = "#e24d8e"
palette_14 = "#00b39e"
palette_15 = "#fcf4dc"

[roles]
bg = "#001e27"
bg_deep = "#00161d"
surface = "#13323a"
fg = "#9cc2c3"
fg_soft = "#6d9194"
fg_bright = "#fcf4dc"
grey = "#56787d"
