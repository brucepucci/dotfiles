palette_2 = "#44a900"
palette_3 = "#aa820c"
palette_4 = "#58859a"
palette_5 = "#97363d"
palette_6 = "#b25a1e"
palette_7 = "#786b53"
palette_8 = "#504333"
palette_9 = "#ed5d20"
palette_10 = "#55f238"
palette_11 = "#f2b732"
palette_12 = "#85cfed"
palette_13 = "#e14c5a"
palette_14 = "#f07d14"
palette_15 = "#ffc800"

[roles]
bg = "#191919"
bg_deep = "#131313"
surface = "#242320"
fg = "#786b53"
