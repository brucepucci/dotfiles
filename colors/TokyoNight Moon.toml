# TokyoNight Moon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222436"
foreground = "#c8d3f5"
cursor-color = "#c8d3f5"
cursor-text = "#222436"
selection-background = "#2d3f76"
selection-foreground = "#c8d3f5"
palette_0 = "#1b1d2b"
palette_1 = "#ff757f"
palette_2 = "#c3e88d"
palette_3 = "#ffc777"
palette_4 = "#82aaff"
palette_5 = "#c099ff"
palette_6 = "#86e1fc"
palette_7 = "#828bb8"
palette_8 = "#444a73"
palette_9 = "#ff757f"
palette_10 = "#c3e88d"
palette_11 = "#ffc777"
palette_12 = "#82aaff"
palette_13 = "#c099ff"
palette_14 = "#86e1fc"
palette_15 = "#c8d3f5"

[roles]
bg = "#222436"
bg_deep = "#1a1b28"
surface = "#36394d"
fg = "#c8d3f5"
fg_soft = "#969ebc"
fg_bright = "#c8d3f5"
grey = "#7d849f"
