# Desert
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#333333"
foreground = "#ffffff"
cursor-color = "#00ff00"
cursor-text = "#000000"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#4d4d4d"
palette_1 = "#ff2b2b"
palette_2 = "#98fb98"
palette_3 = "#f0e68c"
palette_4 = "#cd853f"
palette_5 = "#ffdead"
palette_6 = "#ffa0a0"
palette_7 = "#f5deb3"
palette_8 = "#626262"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#87ceff"
palette_13 = "#ff55ff"
palette_14 = "#ffd700"
palette_15 = "#ffffff"

[roles]
bg = "#333333"
bg_deep = "#262626"
surface = "#4b4b4b"
fg = "#ffffff"
fg_soft = "#c2c2c2"
fg_bright = "#ffffff"
grey = "#a3a3a3"
grey_dim = "#7a7a7a"
grey_neutral = "#b8b8b8"
grey_soft = "#8f8f8f"
red = "#ff2b2b"
orange = "#f8885c"
yellow = "#f0e68c"
green = "#98fb98"
aqua = "#ffa0a0"
blue = "#cd853f"
purple = "#ffdead"
tint_green = "#455745"
tint_red = "#583232"
statusline = "#434343"
statusline_accent = "#585858"
statusline_fg = "#ffffff"
on_accent = "#333333"
mode_red = "#ff2b2b"
mode_green = "#98fb98"
mode_yellow = "#f0e68c"
mode_blue = "#cd853f"
mode_purple = "#ffdead"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
