# Fairyfloss
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#5a5475"
foreground = "#f8f8f2"
cursor-color = "#f8f8f0"
cursor-text = "#060709"
selection-background = "#8077a8"
selection-foreground = "#f6e1ce"
palette_0 = "#040303"
palette_1 = "#f92672"
palette_2 = "#c2ffdf"
palette_3 = "#e6c000"
palette_4 = "#c2ffdf"
palette_5 = "#ffb8d1"
palette_6 = "#c5a3ff"
palette_7 = "#f8f8f0"
palette_8 = "#6090cb"
palette_9 = "#ff857f"
palette_10 = "#c2ffdf"
palette_11 = "#ffea00"
palette_12 = "#c2ffdf"
palette_13 = "#ffb8d1"
palette_14 = "#c5a3ff"
palette_15 = "#f8f8f0"

[roles]
bg = "#5a5475"
bg_deep = "#443f58"
surface = "#6d6884"
fg = "#f8f8f2"
fg_soft = "#c9c7cc"
fg_bright = "#f8f8f0"
grey = "#b1aeba"
grey_dim = "#918da1"
grey_neutral = "#c1bfc6"
grey_soft = "#a19ead"
red = "#f92672"
orange = "#f07339"
yellow = "#e6c000"
green = "#c2ffdf"
aqua = "#c5a3ff"
blue = "#c2ffdf"
purple = "#ffb8d1"
