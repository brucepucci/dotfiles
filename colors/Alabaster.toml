palette_9 = "#f7f7f7"
palette_10 = "#f7f7f7"
palette_11 = "#f7f7f7"
palette_12 = "#f7f7f7"
palette_13 = "#f7f7f7"
palette_14 = "#f7f7f7"
palette_15 = "#f7f7f7"

[roles]
