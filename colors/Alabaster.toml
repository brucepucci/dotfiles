# Alabaster
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f7f7f7"
foreground = "#000000"
cursor-color = "#007acc"
cursor-text = "#bfdbfe"
selection-background = "#bfdbfe"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#aa3731"
palette_2 = "#448c27"
palette_3 = "#cb9000"
palette_4 = "#325cc0"
palette_5 = "#7a3e9d"
palette_6 = "#0083b2"
palette_7 = "#b7b7b7"
palette_8 = "#777777"
palette_9 = "#f05050"
palette_10 = "#60cb00"
palette_11 = "#f2af50"
palette_12 = "#007acc"
palette_13 = "#e64ce6"
palette_14 = "#00aacb"
palette_15 = "#f7f7f7"

[roles]
bg = "#f7f7f7"
bg_deep = "#f9f9f9"
surface = "#d9d9d9"
fg = "#000000"
fg_soft = "#4a4a4a"
fg_bright = "#000000"
grey = "#6f6f6f"
grey_dim = "#a1a1a1"
grey_neutral = "#565656"
grey_soft = "#888888"
red = "#aa3731"
orange = "#ba6418"
yellow = "#cb9000"
green = "#448c27"
aqua = "#0083b2"
blue = "#325cc0"
purple = "#7a3e9d"
tint_green = "#d7e4d2"
tint_red = "#e9d4d3"
statusline = "#e3e3e3"
statusline_accent = "#cbcbcb"
statusline_fg = "#000000"
on_accent = "#f7f7f7"
mode_red = "#aa3731"
mode_green = "#448c27"
mode_yellow = "#cb9000"
mode_blue = "#325cc0"
mode_purple = "#7a3e9d"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
