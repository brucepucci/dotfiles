# Firefox Dev
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e1011"
foreground = "#7c8fa4"
cursor-color = "#708284"
cursor-text = "#002831"
selection-background = "#163c61"
selection-foreground = "#f2f5f9"
palette_0 = "#002831"
palette_1 = "#e63853"
palette_2 = "#5eb83c"
palette_3 = "#a57706"
palette_4 = "#359ddf"
palette_5 = "#d75cff"
palette_6 = "#4b73a2"
palette_7 = "#dcdcdc"
palette_8 = "#26444d"
palette_9 = "#e1003f"
palette_10 = "#1d9000"
palette_11 = "#cd9409"
palette_12 = "#006fc0"
palette_13 = "#a200da"
palette_14 = "#005794"
palette_15 = "#e2e2e2"

[roles]
bg = "#0e1011"
bg_deep = "#0a0c0d"
surface = "#1b1f23"
fg = "#7c8fa4"
fg_soft = "#5b6978"
fg_bright = "#e2e2e2"
grey = "#4a5662"
