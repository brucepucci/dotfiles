# JetBrains Darcula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#202020"
foreground = "#adadad"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#1a3272"
selection-foreground = "#adadad"
palette_0 = "#202020"
palette_1 = "#202020"
palette_2 = "#202020"
palette_3 = "#202020"
palette_4 = "#202020"
palette_5 = "#202020"
palette_6 = "#202020"
palette_7 = "#202020"
palette_8 = "#202020"
palette_9 = "#202020"
palette_10 = "#202020"
palette_11 = "#202020"
palette_12 = "#202020"
palette_13 = "#202020"
palette_14 = "#202020"
palette_15 = "#202020"

[roles]
bg = "#202020"
bg_deep = "#181818"
surface = "#313131"
fg = "#adadad"
fg_soft = "#838383"
fg_bright = "#202020"
grey = "#6e6e6e"
grey_dim = "#515151"
grey_neutral = "#7c7c7c"
grey_soft = "#5f5f5f"
red = "#202020"
orange = "#202020"
yellow = "#202020"
green = "#202020"
aqua = "#202020"
blue = "#202020"
purple = "#202020"
