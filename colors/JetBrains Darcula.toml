# JetBrains Darcula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#202020"
foreground = "#adadad"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#1a3272"
selection-foreground = "#adadad"
palette_0 = "#000000"
palette_1 = "#fa5355"
palette_2 = "#126e00"
palette_3 = "#c2c300"
palette_4 = "#4581eb"
palette_5 = "#fa54ff"
palette_6 = "#33c2c1"
palette_7 = "#adadad"
palette_8 = "#555555"
palette_9 = "#fb7172"
palette_10 = "#67ff4f"
palette_11 = "#ffff00"
palette_12 = "#6d9df1"
palette_13 = "#fb82ff"
palette_14 = "#60d3d1"
palette_15 = "#eeeeee"

[roles]
bg = "#202020"
bg_deep = "#181818"
surface = "#313131"
fg = "#adadad"
fg_soft = "#838383"
fg_bright = "#eeeeee"
grey = "#6e6e6e"
grey_dim = "#515151"
grey_neutral = "#7c7c7c"
grey_soft = "#5f5f5f"
red = "#fa5355"
orange = "#de8b2a"
yellow = "#c2c300"
green = "#126e00"
aqua = "#33c2c1"
blue = "#4581eb"
purple = "#fa54ff"
tint_green = "#1d2e1a"
tint_red = "#47292a"
statusline = "#2b2b2b"
statusline_accent = "#393939"
statusline_fg = "#adadad"
on_accent = "#202020"
mode_red = "#fa5355"
mode_green = "#126e00"
mode_yellow = "#c2c300"
mode_blue = "#4581eb"
mode_purple = "#fa54ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
