# Lavandula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#050014"
foreground = "#736e7d"
cursor-color = "#8c91fa"
cursor-text = "#050014"
selection-background = "#37323c"
selection-foreground = "#8c91fa"
palette_0 = "#230046"
palette_1 = "#7d1625"
palette_2 = "#337e6f"
palette_3 = "#7f6f49"
palette_4 = "#4f4a7f"
palette_5 = "#5a3f7f"
palette_6 = "#58777f"
palette_7 = "#736e7d"
palette_8 = "#443a53"
palette_9 = "#e05167"
palette_10 = "#52e0c4"
palette_11 = "#e0c386"
palette_12 = "#8e87e0"
palette_13 = "#a776e0"
palette_14 = "#9ad4e0"
palette_15 = "#8c91fa"

[roles]
bg = "#050014"
bg_deep = "#04000f"
surface = "#120d21"
fg = "#736e7d"
fg_soft = "#524d5e"
fg_bright = "#8c91fa"
grey = "#423c4e"
grey_dim = "#2c2639"
