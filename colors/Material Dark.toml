# Material Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#232322"
foreground = "#e5e5e5"
cursor-color = "#16afca"
cursor-text = "#dfdfdf"
selection-background = "#dfdfdf"
selection-foreground = "#3d3d3d"
palette_0 = "#212121"
palette_1 = "#b7141f"
palette_2 = "#457b24"
palette_3 = "#f6981e"
palette_4 = "#134eb2"
palette_5 = "#701aa2"
palette_6 = "#0e717c"
palette_7 = "#efefef"
palette_8 = "#4f4f4f"
palette_9 = "#e83b3f"
palette_10 = "#7aba3a"
palette_11 = "#ffea2e"
palette_12 = "#54a4f3"
palette_13 = "#aa4dbc"
palette_14 = "#26bbd1"
palette_15 = "#d9d9d9"

[roles]
bg = "#232322"
bg_deep = "#1a1a1a"
surface = "#3a3a39"
fg = "#e5e5e5"
fg_soft = "#ababaa"
fg_bright = "#d9d9d9"
grey = "#8e8e8d"
grey_dim = "#676766"
grey_neutral = "#a1a1a1"
grey_soft = "#7a7a7a"
red = "#b7141f"
orange = "#d6561e"
yellow = "#f6981e"
green = "#457b24"
aqua = "#0e717c"
blue = "#134eb2"
purple = "#701aa2"
tint_green = "#293322"
tint_red = "#3e2021"
statusline = "#333332"
statusline_accent = "#464645"
statusline_fg = "#e5e5e5"
