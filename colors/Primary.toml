# Primary
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#656565"
selection-foreground = "#eeeeee"
palette_0 = "#000000"
palette_1 = "#db4437"
palette_2 = "#0f9d58"
palette_3 = "#f4b400"
palette_4 = "#4285f4"
palette_5 = "#db4437"
palette_6 = "#4285f4"
palette_7 = "#bfbfbf"
palette_8 = "#000000"
palette_9 = "#db4437"
palette_10 = "#0f9d58"
palette_11 = "#f4b400"
palette_12 = "#4285f4"
palette_13 = "#4285f4"
palette_14 = "#0f9d58"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#db4437"
orange = "#e87c1c"
yellow = "#f4b400"
green = "#0f9d58"
aqua = "#4285f4"
blue = "#4285f4"
purple = "#db4437"
tint_green = "#d4ede1"
tint_red = "#f9dddb"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#000000"
mode_red = "#db4437"
mode_green = "#0f9d58"
mode_yellow = "#f4b400"
mode_blue = "#4285f4"
mode_purple = "#db4437"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
