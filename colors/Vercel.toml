# Vercel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101010"
foreground = "#fafafa"
cursor-color = "#f32882"
cursor-text = "#fafafa"
selection-background = "#005be7"
selection-foreground = "#fafafa"
palette_0 = "#000000"
palette_1 = "#fc0036"
palette_2 = "#29a948"
palette_3 = "#ffae00"
palette_4 = "#006aff"
palette_5 = "#f32882"
palette_6 = "#00ac96"
palette_7 = "#feffff"
palette_8 = "#a8a8a8"
palette_9 = "#ff8080"
palette_10 = "#4be15d"
palette_11 = "#ffae00"
palette_12 = "#49aeff"
palette_13 = "#f97ea8"
palette_14 = "#00e4c4"
palette_15 = "#fefefe"

[roles]
bg = "#101010"
bg_deep = "#0c0c0c"
surface = "#2c2c2c"
fg = "#fafafa"
fg_soft = "#b4b4b4"
fg_bright = "#fefefe"
grey = "#919191"
grey_dim = "#626262"
grey_neutral = "#a8a8a8"
grey_soft = "#797979"
red = "#fc0036"
orange = "#fe571b"
yellow = "#ffae00"
green = "#29a948"
aqua = "#00ac96"
blue = "#006aff"
purple = "#f32882"
tint_green = "#142c1a"
tint_red = "#3a0d17"
statusline = "#232323"
statusline_accent = "#3a3a3a"
statusline_fg = "#fafafa"
on_accent = "#fafafa"
mode_red = "#fc0036"
mode_green = "#29a948"
mode_yellow = "#ffae00"
mode_blue = "#006aff"
mode_purple = "#f32882"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
