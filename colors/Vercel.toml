# Vercel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101010"
foreground = "#fafafa"
cursor-color = "#f32882"
cursor-text = "#fafafa"
selection-background = "#005be7"
selection-foreground = "#fafafa"
palette_0 = "#101010"
palette_1 = "#101010"
palette_2 = "#101010"
palette_3 = "#101010"
palette_4 = "#101010"
palette_5 = "#101010"
palette_6 = "#101010"
palette_7 = "#101010"
palette_8 = "#101010"
palette_9 = "#101010"
palette_10 = "#101010"
palette_11 = "#101010"
palette_12 = "#101010"
palette_13 = "#101010"
palette_14 = "#101010"
palette_15 = "#101010"

[roles]
bg = "#101010"
bg_deep = "#0c0c0c"
surface = "#2c2c2c"
fg = "#fafafa"
fg_soft = "#b4b4b4"
fg_bright = "#101010"
grey = "#919191"
grey_dim = "#626262"
grey_neutral = "#a8a8a8"
grey_soft = "#797979"
red = "#101010"
orange = "#101010"
yellow = "#101010"
green = "#101010"
aqua = "#101010"
blue = "#101010"
purple = "#101010"
tint_green = "#101010"
tint_red = "#101010"
statusline = "#232323"
statusline_accent = "#3a3a3a"
statusline_fg = "#fafafa"
on_accent = "#fafafa"
mode_red = "#101010"
