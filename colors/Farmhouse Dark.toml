# Farmhouse Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d2027"
foreground = "#e8e4e1"
cursor-color = "#006efe"
cursor-text = "#e8e4e1"
selection-background = "#4d5658"
selection-foreground = "#b3b1aa"
palette_0 = "#1d2027"
palette_1 = "#ba0004"
palette_2 = "#549d00"
palette_3 = "#c87300"
palette_4 = "#0049e6"
palette_5 = "#9f1b61"
palette_6 = "#1fb65c"
palette_7 = "#e8e4e1"
palette_8 = "#464d54"
palette_9 = "#eb0009"
palette_10 = "#7ac100"
palette_11 = "#ea9a00"
palette_12 = "#006efe"
palette_13 = "#bf3b7f"
palette_14 = "#19e062"
palette_15 = "#f4eef0"

[roles]
bg = "#1d2027"
bg_deep = "#16181d"
surface = "#35383d"
fg = "#e8e4e1"
fg_soft = "#aba9a9"
fg_bright = "#f4eef0"
grey = "#8d8c8d"
grey_dim = "#646568"
grey_neutral = "#a19fa0"
grey_soft = "#78787b"
red = "#ba0004"
orange = "#c13a02"
yellow = "#c87300"
green = "#549d00"
aqua = "#1fb65c"
blue = "#0049e6"
purple = "#9f1b61"
tint_green = "#273620"
tint_red = "#391a21"
statusline = "#2d3036"
