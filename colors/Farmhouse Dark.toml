palette_2 = "#1d2027"
palette_3 = "#1d2027"
palette_4 = "#1d2027"
palette_5 = "#1d2027"
palette_6 = "#1d2027"
palette_7 = "#1d2027"
palette_8 = "#1d2027"
palette_9 = "#1d2027"
palette_10 = "#1d2027"
palette_11 = "#1d2027"
palette_12 = "#1d2027"
palette_13 = "#1d2027"
palette_14 = "#1d2027"
palette_15 = "#1d2027"

[roles]
bg = "#1d2027"
bg_deep = "#16181d"
surface = "#35383d"
fg = "#e8e4e1"
