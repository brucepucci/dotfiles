# Japanesque
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#f7f6ec"
cursor-color = "#edcf4f"
cursor-text = "#343935"
selection-background = "#175877"
selection-foreground = "#f7f6ec"
palette_0 = "#343935"
palette_1 = "#cf3f61"
palette_2 = "#7bb75b"
palette_3 = "#e9b32a"
palette_4 = "#4c9ad4"
palette_5 = "#a57fc4"
palette_6 = "#389aad"
palette_7 = "#fafaf6"
palette_8 = "#595b59"
palette_9 = "#d18fa6"
palette_10 = "#767f2c"
palette_11 = "#78592f"
palette_12 = "#135979"
palette_13 = "#604291"
palette_14 = "#76bbca"
palette_15 = "#b2b5ae"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#383837"
fg = "#f7f6ec"
fg_soft = "#b6b5ae"
fg_bright = "#b2b5ae"
grey = "#95958f"
grey_dim = "#6a6a66"
grey_neutral = "#abaaa4"
grey_soft = "#807f7b"
red = "#cf3f61"
orange = "#dc7946"
yellow = "#e9b32a"
green = "#7bb75b"
aqua = "#389aad"
blue = "#4c9ad4"
purple = "#a57fc4"
tint_green = "#2f3a29"
tint_red = "#3e242a"
statusline = "#2f2f2e"
statusline_accent = "#454543"
statusline_fg = "#f7f6ec"
on_accent = "#1e1e1e"
mode_red = "#cf3f61"
mode_green = "#7bb75b"
mode_yellow = "#e9b32a"
mode_blue = "#4c9ad4"
mode_purple = "#a57fc4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
