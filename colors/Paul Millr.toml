# Paul Millr
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#f2f2f2"
cursor-color = "#4d4d4d"
cursor-text = "#ffffff"
selection-background = "#414141"
selection-foreground = "#ffffff"
palette_0 = "#2a2a2a"
palette_1 = "#ff0000"
palette_2 = "#79ff0f"
palette_3 = "#e7bf00"
palette_4 = "#396bd7"
palette_5 = "#b449be"
palette_6 = "#66ccff"
palette_7 = "#bbbbbb"
palette_8 = "#666666"
palette_9 = "#ff0080"
palette_10 = "#66ff66"
palette_11 = "#f3d64e"
palette_12 = "#709aed"
palette_13 = "#db67e6"
palette_14 = "#7adff2"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1d1d1d"
fg = "#f2f2f2"
fg_soft = "#a9a9a9"
fg_bright = "#ffffff"
grey = "#858585"
grey_dim = "#555555"
grey_neutral = "#9d9d9d"
grey_soft = "#6d6d6d"
red = "#ff0000"
orange = "#f36000"
yellow = "#e7bf00"
green = "#79ff0f"
aqua = "#66ccff"
blue = "#396bd7"
purple = "#b449be"
tint_green = "#162e03"
tint_red = "#2e0000"
statusline = "#131313"
statusline_accent = "#2c2c2c"
statusline_fg = "#f2f2f2"
on_accent = "#000000"
mode_red = "#ff0000"
mode_green = "#79ff0f"
mode_yellow = "#e7bf00"
mode_blue = "#396bd7"
mode_purple = "#b449be"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
