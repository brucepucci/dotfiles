# Matte Black
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#bebebe"
cursor-color = "#eaeaea"
cursor-text = "#121212"
selection-background = "#333333"
selection-foreground = "#eaeaea"
palette_0 = "#121212"
palette_1 = "#121212"
palette_2 = "#121212"
palette_3 = "#121212"
palette_4 = "#121212"
palette_5 = "#121212"
palette_6 = "#121212"
palette_7 = "#121212"
palette_8 = "#121212"
palette_9 = "#121212"
palette_10 = "#121212"
palette_11 = "#121212"
palette_12 = "#121212"
palette_13 = "#121212"
palette_14 = "#121212"
palette_15 = "#121212"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#272727"
fg = "#bebebe"
fg_soft = "#8a8a8a"
fg_bright = "#121212"
grey = "#717171"
grey_dim = "#4e4e4e"
grey_neutral = "#828282"
grey_soft = "#5f5f5f"
red = "#121212"
orange = "#121212"
