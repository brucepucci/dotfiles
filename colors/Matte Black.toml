# Matte Black
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#bebebe"
cursor-color = "#eaeaea"
cursor-text = "#121212"
selection-background = "#333333"
selection-foreground = "#eaeaea"
palette_0 = "#333333"
palette_1 = "#d35f5f"
palette_2 = "#ffc107"
palette_3 = "#b91c1c"
palette_4 = "#e68e0d"
palette_5 = "#d35f5f"
palette_6 = "#bebebe"
palette_7 = "#bebebe"
palette_8 = "#8a8a8d"
palette_9 = "#891c1c"
palette_10 = "#ffc107"
palette_11 = "#b90a0a"
palette_12 = "#f59e0b"
palette_13 = "#b91c1c"
palette_14 = "#eaeaea"
palette_15 = "#ffffff"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#272727"
fg = "#bebebe"
fg_soft = "#8a8a8a"
fg_bright = "#ffffff"
grey = "#717171"
grey_dim = "#4e4e4e"
grey_neutral = "#828282"
grey_soft = "#5f5f5f"
red = "#d35f5f"
orange = "#c63e3e"
yellow = "#b91c1c"
green = "#ffc107"
aqua = "#bebebe"
blue = "#e68e0d"
purple = "#d35f5f"
tint_green = "#3d3210"
tint_red = "#352020"
statusline = "#202020"
statusline_accent = "#313131"
statusline_fg = "#bebebe"
on_accent = "#121212"
mode_red = "#d35f5f"
mode_green = "#ffc107"
mode_yellow = "#b91c1c"
mode_blue = "#e68e0d"
mode_purple = "#d35f5f"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
