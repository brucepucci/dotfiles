# Argonaut
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e1019"
foreground = "#fffaf4"
cursor-color = "#ff0018"
cursor-text = "#ff8ca4"
selection-background = "#002a3b"
selection-foreground = "#ffffff"
palette_0 = "#232323"
palette_1 = "#ff000f"
palette_2 = "#8ce10b"
palette_3 = "#ffb900"
palette_4 = "#008df8"
palette_5 = "#6d43a6"
palette_6 = "#00d8eb"
palette_7 = "#ffffff"
palette_8 = "#444444"
palette_9 = "#ff2740"
palette_10 = "#abe15b"
palette_11 = "#ffd242"
palette_12 = "#0092ff"
palette_13 = "#9a5feb"
palette_14 = "#67fff0"
palette_15 = "#ffffff"

[roles]
bg = "#0e1019"
bg_deep = "#0a0c13"
surface = "#2b2c33"
fg = "#fffaf4"
fg_soft = "#b7b4b2"
fg_bright = "#ffffff"
grey = "#939191"
grey_dim = "#626266"
grey_neutral = "#aba8a7"
grey_soft = "#7a797c"
red = "#ff000f"
orange = "#ff5c08"
yellow = "#ffb900"
green = "#8ce10b"
aqua = "#00d8eb"
blue = "#008df8"
purple = "#6d43a6"
tint_green = "#253616"
tint_red = "#390d17"
statusline = "#21232b"
statusline_accent = "#393a40"
statusline_fg = "#fffaf4"
on_accent = "#fffaf4"
mode_red = "#ff000f"
mode_green = "#8ce10b"
mode_yellow = "#ffb900"
mode_blue = "#008df8"
mode_purple = "#6d43a6"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
