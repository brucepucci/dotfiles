palette_2 = "#212121"
palette_3 = "#212121"
palette_4 = "#212121"
palette_5 = "#212121"
palette_6 = "#212121"
palette_7 = "#212121"
palette_8 = "#212121"
palette_9 = "#212121"
palette_10 = "#212121"
palette_11 = "#212121"
palette_12 = "#212121"
palette_13 = "#212121"
palette_14 = "#212121"
palette_15 = "#212121"

[roles]
