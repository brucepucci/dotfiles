# Dracula+
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#f8f8f2"
cursor-color = "#eceff4"
cursor-text = "#282828"
selection-background = "#f8f8f2"
selection-foreground = "#545454"
palette_0 = "#21222c"
palette_1 = "#ff5555"
palette_2 = "#50fa7b"
palette_3 = "#ffcb6b"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#8be9fd"
palette_7 = "#f8f8f2"
palette_8 = "#545454"
palette_9 = "#ff6e6e"
palette_10 = "#69ff94"
palette_11 = "#ffcb6b"
palette_12 = "#d6acff"
palette_13 = "#ff92df"
palette_14 = "#a4ffff"
palette_15 = "#f8f8f2"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#3b3b3a"
fg = "#f8f8f2"
fg_soft = "#b8b8b3"
fg_bright = "#f8f8f2"
grey = "#979794"
grey_dim = "#6c6c6a"
grey_neutral = "#adada9"
grey_soft = "#82827f"
red = "#ff5555"
orange = "#ff9060"
yellow = "#ffcb6b"
green = "#50fa7b"
aqua = "#8be9fd"
blue = "#82aaff"
purple = "#c792ea"
tint_green = "#294831"
tint_red = "#492a2a"
statusline = "#323232"
statusline_accent = "#484847"
statusline_fg = "#f8f8f2"
on_accent = "#212121"
mode_red = "#ff5555"
mode_green = "#50fa7b"
