bg_deep = "#191919"
surface = "#3b3b3a"
fg = "#f8f8f2"
fg_soft = "#b8b8b3"
fg_bright = "#212121"
grey = "#979794"
grey_dim = "#6c6c6a"
grey_neutral = "#adada9"
grey_soft = "#82827f"
red = "#212121"
