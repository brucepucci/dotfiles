# Cobalt Next Minimal
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0b1c24"
foreground = "#d7deea"
cursor-color = "#37b5b4"
cursor-text = "#ffffff"
selection-background = "#37b5b4"
selection-foreground = "#ffffff"
palette_0 = "#323d47"
palette_1 = "#ff657a"
palette_2 = "#8cc98f"
palette_3 = "#ffc64c"
palette_4 = "#409dd4"
palette_5 = "#cba3c7"
palette_6 = "#37b5b4"
palette_7 = "#d7deea"
palette_8 = "#62747f"
palette_9 = "#e47e8b"
palette_10 = "#baddbb"
palette_11 = "#ffdc91"
palette_12 = "#7ac0eb"
palette_13 = "#f3ccef"
palette_14 = "#84e4e3"
palette_15 = "#ffffff"

[roles]
bg = "#0b1c24"
bg_deep = "#08151b"
surface = "#23333c"
fg = "#d7deea"
fg_soft = "#9aa4af"
fg_bright = "#ffffff"
grey = "#7b8791"
grey_dim = "#526069"
grey_neutral = "#909aa5"
grey_soft = "#67737d"
red = "#ff657a"
orange = "#ff9663"
yellow = "#ffc64c"
green = "#8cc98f"
aqua = "#37b5b4"
