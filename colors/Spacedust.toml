palette_6 = "#0a1e24"
palette_7 = "#0a1e24"
palette_8 = "#0a1e24"
palette_9 = "#0a1e24"
palette_10 = "#0a1e24"
palette_11 = "#0a1e24"
palette_12 = "#0a1e24"
palette_13 = "#0a1e24"
palette_14 = "#0a1e24"
palette_15 = "#0a1e24"

[roles]
