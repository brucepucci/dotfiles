# Spacedust
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0a1e24"
foreground = "#ecf0c1"
cursor-color = "#708284"
cursor-text = "#002831"
selection-background = "#0a385c"
selection-foreground = "#ffffff"
palette_0 = "#6e5346"
palette_1 = "#e35b00"
palette_2 = "#5cab96"
palette_3 = "#e3cd7b"
palette_4 = "#0f548b"
palette_5 = "#e35b00"
palette_6 = "#06afc7"
palette_7 = "#f0f1ce"
palette_8 = "#684c31"
palette_9 = "#ff8a3a"
palette_10 = "#aecab8"
palette_11 = "#ffc878"
palette_12 = "#67a0ce"
palette_13 = "#ff8a3a"
palette_14 = "#83a7b4"
palette_15 = "#fefff1"

[roles]
bg = "#0a1e24"
bg_deep = "#08161b"
surface = "#253737"
fg = "#ecf0c1"
fg_soft = "#a8b192"
fg_bright = "#fefff1"
grey = "#86927a"
grey_dim = "#59685b"
grey_neutral = "#9da68a"
grey_soft = "#707c6b"
red = "#e35b00"
orange = "#e3943e"
yellow = "#e3cd7b"
green = "#5cab96"
aqua = "#06afc7"
blue = "#0f548b"
purple = "#e35b00"
tint_green = "#193739"
tint_red = "#31291e"
statusline = "#1c2f31"
statusline_accent = "#334440"
statusline_fg = "#ecf0c1"
on_accent = "#0a1e24"
mode_red = "#e35b00"
mode_green = "#5cab96"
mode_yellow = "#e3cd7b"
mode_blue = "#0f548b"
mode_purple = "#e35b00"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
