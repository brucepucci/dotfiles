palette_9 = "#aa000c"
palette_10 = "#128c21"
palette_11 = "#fc6a21"
palette_12 = "#7999f7"
palette_13 = "#fd8aa1"
palette_14 = "#fad484"
palette_15 = "#ffffff"

[roles]
