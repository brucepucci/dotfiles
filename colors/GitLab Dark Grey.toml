# GitLab Dark Grey
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#bfbfbf"
selection-background = "#ad95e9"
selection-foreground = "#222222"
palette_0 = "#000000"
palette_1 = "#f57f6c"
palette_2 = "#52b87a"
palette_3 = "#d99530"
palette_4 = "#7fb6ed"
palette_5 = "#f88aaf"
palette_6 = "#32c5d2"
palette_7 = "#ffffff"
palette_8 = "#666666"
palette_9 = "#fcb5aa"
palette_10 = "#91d4a8"
palette_11 = "#e9be74"
palette_12 = "#498dd1"
palette_13 = "#fcacc5"
palette_14 = "#5edee3"
palette_15 = "#ffffff"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#3d3d3d"
fg = "#ffffff"
fg_soft = "#bdbdbd"
fg_bright = "#ffffff"
grey = "#9c9c9c"
grey_dim = "#6f6f6f"
grey_neutral = "#b2b2b2"
grey_soft = "#858585"
red = "#f57f6c"
orange = "#e78a4e"
yellow = "#d99530"
green = "#52b87a"
aqua = "#32c5d2"
blue = "#7fb6ed"
purple = "#f88aaf"
tint_green = "#2b3d32"
tint_red = "#48332f"
statusline = "#343434"
statusline_accent = "#4a4a4a"
statusline_fg = "#ffffff"
on_accent = "#222222"
mode_red = "#f57f6c"
mode_green = "#52b87a"
mode_yellow = "#d99530"
mode_blue = "#7fb6ed"
mode_purple = "#f88aaf"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
