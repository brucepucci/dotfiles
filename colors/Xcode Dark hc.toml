palette_2 = "#83c9bc"
palette_3 = "#d9c668"
palette_4 = "#4ec4e6"
palette_5 = "#ff85b8"
palette_6 = "#cda1ff"
palette_7 = "#ffffff"
palette_8 = "#838991"
palette_9 = "#ff8a7a"
palette_10 = "#b1faeb"
palette_11 = "#ffa14f"
palette_12 = "#6bdfff"
palette_13 = "#ff85b8"
palette_14 = "#e5cfff"
palette_15 = "#ffffff"

[roles]
