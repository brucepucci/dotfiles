# Shaman
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#001015"
foreground = "#405555"
cursor-color = "#4afcd6"
cursor-text = "#031413"
selection-background = "#415555"
selection-foreground = "#5afad6"
palette_0 = "#012026"
palette_1 = "#b2302d"
palette_2 = "#00a941"
palette_3 = "#5e8baa"
palette_4 = "#449a86"
palette_5 = "#00599d"
palette_6 = "#5d7e19"
palette_7 = "#405555"
palette_8 = "#384451"
palette_9 = "#ff4242"
palette_10 = "#2aea5e"
palette_11 = "#8ed4fd"
palette_12 = "#61d5ba"
palette_13 = "#1298ff"
palette_14 = "#98d028"
palette_15 = "#58fbd6"

[roles]
bg = "#001015"
bg_deep = "#000c10"
surface = "#08181d"
fg = "#405555"
fg_soft = "#2d4042"
fg_bright = "#58fbd6"
grey = "#233638"
grey_dim = "#16282b"
grey_neutral = "#2a3d3f"
grey_soft = "#1d2f32"
red = "#b2302d"
orange = "#885e6c"
yellow = "#5e8baa"
green = "#00a941"
aqua = "#5d7e19"
blue = "#449a86"
purple = "#00599d"
tint_green = "#002c1d"
tint_red = "#201619"
statusline = "#05161a"
statusline_accent = "#0c1c21"
statusline_fg = "#405555"
on_accent = "#001015"
mode_red = "#b2302d"
