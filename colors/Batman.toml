# Batman
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1d1e"
foreground = "#6f6f6f"
cursor-color = "#fcef0c"
cursor-text = "#000000"
selection-background = "#4d504c"
selection-foreground = "#f0e04a"
palette_0 = "#1b1d1e"
palette_1 = "#e6dc44"
palette_2 = "#c8be46"
palette_3 = "#f4fd22"
palette_4 = "#737174"
palette_5 = "#747271"
palette_6 = "#62605f"
palette_7 = "#c6c5bf"
palette_8 = "#505354"
palette_9 = "#fff78e"
palette_10 = "#fff27d"
palette_11 = "#feed6c"
palette_12 = "#919495"
palette_13 = "#9a9a9d"
palette_14 = "#a3a3a6"
palette_15 = "#dadbd6"

[roles]
bg = "#1b1d1e"
bg_deep = "#141616"
surface = "#252728"
fg = "#6f6f6f"
fg_soft = "#565657"
fg_bright = "#dadbd6"
grey = "#494a4b"
