# Spring
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#4d4d4c"
cursor-color = "#4d4d4c"
cursor-text = "#ffffff"
selection-background = "#d6d6d6"
selection-foreground = "#4d4d4c"
palette_0 = "#000000"
palette_1 = "#ff4d83"
palette_2 = "#1f8c3b"
palette_3 = "#1fc95b"
palette_4 = "#1dd3ee"
palette_5 = "#8959a8"
palette_6 = "#3e999f"
palette_7 = "#bfbfbf"
palette_8 = "#000000"
palette_9 = "#ff0021"
palette_10 = "#1fc231"
palette_11 = "#d5b807"
palette_12 = "#15a9fd"
palette_13 = "#8959a8"
palette_14 = "#3e999f"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#eaeaea"
fg = "#4d4d4c"
fg_soft = "#828282"
fg_bright = "#323231"
grey = "#9d9d9d"
grey_dim = "#c1c1c0"
grey_neutral = "#8b8b8b"
grey_soft = "#afafae"
red = "#ff4d83"
orange = "#8f8b6f"
yellow = "#1fc95b"
green = "#1f8c3b"
aqua = "#3e999f"
blue = "#1dd3ee"
purple = "#8959a8"
tint_green = "#d7eadc"
tint_red = "#ffdfe9"
statusline = "#f1f1f1"
statusline_accent = "#dfdfdf"
statusline_fg = "#4d4d4c"
on_accent = "#ffffff"
mode_red = "#ff4d83"
mode_green = "#1f8c3b"
mode_yellow = "#1fc95b"
mode_blue = "#1dd3ee"
mode_purple = "#8959a8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
