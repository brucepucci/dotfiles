# Adwaita
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#c0bfbc"
selection-foreground = "#000000"
palette_0 = "#241f31"
palette_1 = "#c01c28"
palette_2 = "#2ec27e"
palette_3 = "#e8b504"
palette_4 = "#1e78e4"
palette_5 = "#9841bb"
palette_6 = "#0ab9dc"
palette_7 = "#c0bfbc"
palette_8 = "#5e5c64"
palette_9 = "#ed333b"
palette_10 = "#4ad67c"
palette_11 = "#d2be36"
palette_12 = "#51a1ff"
palette_13 = "#c061cb"
palette_14 = "#4fd2fd"
palette_15 = "#f6f5f4"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#c01c28"
orange = "#d46816"
yellow = "#e8b504"
green = "#2ec27e"
aqua = "#0ab9dc"
blue = "#1e78e4"
purple = "#9841bb"
tint_green = "#d9f4e8"
tint_red = "#f4d6d8"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#c01c28"
mode_green = "#2ec27e"
mode_yellow = "#e8b504"
mode_blue = "#1e78e4"
mode_purple = "#9841bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
