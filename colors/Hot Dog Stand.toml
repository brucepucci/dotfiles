# Hot Dog Stand
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ea3323"
foreground = "#ffffff"
cursor-color = "#ffff54"
cursor-text = "#ea3323"
selection-background = "#ffff54"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ffff54"
palette_2 = "#ffff54"
palette_3 = "#ffff54"
palette_4 = "#000000"
palette_5 = "#ffff54"
palette_6 = "#ffffff"
palette_7 = "#c6c6c6"
palette_8 = "#000000"
palette_9 = "#ffff54"
palette_10 = "#ffff54"
palette_11 = "#ffff54"
palette_12 = "#000000"
palette_13 = "#ffff54"
palette_14 = "#ffffff"
palette_15 = "#c6c6c6"

[roles]
bg = "#ea3323"
bg_deep = "#b0261a"
surface = "#ed4b3d"
fg = "#ffffff"
fg_soft = "#f9c2bd"
fg_bright = "#c6c6c6"
grey = "#f6a39c"
grey_dim = "#f17a70"
grey_neutral = "#f8b8b2"
grey_soft = "#f38f86"
red = "#ffff54"
orange = "#ffff54"
yellow = "#ffff54"
green = "#ffff54"
aqua = "#ffffff"
blue = "#000000"
purple = "#ffff54"
tint_green = "#ee582c"
tint_red = "#ee582c"
statusline = "#ec4335"
