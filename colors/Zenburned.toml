# Zenburned
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#404040"
foreground = "#f0e4cf"
cursor-color = "#f3eadb"
cursor-text = "#404040"
selection-background = "#746956"
selection-foreground = "#f0e4cf"
palette_0 = "#404040"
palette_1 = "#e3716e"
palette_2 = "#819b69"
palette_3 = "#b77e64"
palette_4 = "#6099c0"
palette_5 = "#b279a7"
palette_6 = "#66a5ad"
palette_7 = "#f0e4cf"
palette_8 = "#6f6768"
palette_9 = "#ec8685"
palette_10 = "#8bae68"
palette_11 = "#d68c67"
palette_12 = "#61abda"
palette_13 = "#cf86c1"
palette_14 = "#65b8c1"
palette_15 = "#c0ab86"

[roles]
bg = "#404040"
bg_deep = "#303030"
surface = "#555451"
fg = "#f0e4cf"
fg_soft = "#bbb3a4"
fg_bright = "#c0ab86"
grey = "#a19a8f"
grey_dim = "#7e7972"
grey_neutral = "#b2ab9d"
grey_soft = "#8f8a80"
red = "#e3716e"
orange = "#cd7869"
yellow = "#b77e64"
green = "#819b69"
aqua = "#66a5ad"
blue = "#6099c0"
purple = "#b279a7"
tint_green = "#4c5047"
tint_red = "#5d4948"
statusline = "#4e4d4b"
