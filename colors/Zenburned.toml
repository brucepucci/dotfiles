palette_2 = "#404040"
palette_3 = "#404040"
palette_4 = "#404040"
palette_5 = "#404040"
palette_6 = "#404040"
palette_7 = "#404040"
palette_8 = "#404040"
palette_9 = "#404040"
palette_10 = "#404040"
palette_11 = "#404040"
palette_12 = "#404040"
palette_13 = "#404040"
palette_14 = "#404040"
palette_15 = "#404040"

[roles]
bg = "#404040"
bg_deep = "#303030"
surface = "#555451"
fg = "#f0e4cf"
fg_soft = "#bbb3a4"
fg_bright = "#404040"
grey = "#a19a8f"
grey_dim = "#7e7972"
grey_neutral = "#b2ab9d"
grey_soft = "#8f8a80"
red = "#404040"
orange = "#404040"
