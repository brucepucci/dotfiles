# Ayu Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f8f9fa"
foreground = "#5c6166"
cursor-color = "#ffaa33"
cursor-text = "#f8f9fa"
selection-background = "#035bd6"
selection-foreground = "#f8f9fa"
palette_0 = "#000000"
palette_1 = "#ea6c6d"
palette_2 = "#6cbf43"
palette_3 = "#eca944"
palette_4 = "#3199e1"
palette_5 = "#9e75c7"
palette_6 = "#46ba94"
palette_7 = "#bababa"
palette_8 = "#686868"
palette_9 = "#f07171"
palette_10 = "#86b300"
palette_11 = "#f2ae49"
palette_12 = "#399ee6"
palette_13 = "#a37acc"
palette_14 = "#4cbf99"
palette_15 = "#d1d1d1"

[roles]
bg = "#f8f9fa"
bg_deep = "#fafafb"
surface = "#e5e7e8"
fg = "#5c6166"
fg_soft = "#8b8f92"
fg_bright = "#3c3f42"
grey = "#a2a5a9"
grey_dim = "#c1c4c6"
grey_neutral = "#93969a"
grey_soft = "#b2b5b7"
red = "#ea6c6d"
orange = "#eb8a58"
yellow = "#eca944"
green = "#6cbf43"
aqua = "#46ba94"
blue = "#3199e1"
purple = "#9e75c7"
tint_green = "#dfefd9"
