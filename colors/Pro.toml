# Pro
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#f2f2f2"
cursor-color = "#4d4d4d"
cursor-text = "#ffffff"
selection-background = "#414141"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#990000"
palette_2 = "#00a600"
palette_3 = "#999900"
palette_4 = "#2009db"
palette_5 = "#b200b2"
palette_6 = "#00a6b2"
palette_7 = "#bfbfbf"
palette_8 = "#666666"
palette_9 = "#e50000"
palette_10 = "#00d900"
palette_11 = "#e5e500"
palette_12 = "#0000ff"
palette_13 = "#e500e5"
palette_14 = "#00e5e5"
palette_15 = "#e5e5e5"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1d1d1d"
fg = "#f2f2f2"
fg_soft = "#a9a9a9"
fg_bright = "#e5e5e5"
grey = "#858585"
grey_dim = "#555555"
grey_neutral = "#9d9d9d"
grey_soft = "#6d6d6d"
red = "#990000"
orange = "#994c00"
yellow = "#999900"
green = "#00a600"
aqua = "#00a6b2"
blue = "#2009db"
purple = "#b200b2"
tint_green = "#001e00"
tint_red = "#1c0000"
statusline = "#131313"
statusline_accent = "#2c2c2c"
statusline_fg = "#f2f2f2"
on_accent = "#f2f2f2"
mode_red = "#990000"
mode_green = "#00a600"
mode_yellow = "#999900"
mode_blue = "#2009db"
mode_purple = "#b200b2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
