palette_5 = "#d3869b"
palette_6 = "#89b482"
palette_7 = "#d4be98"
palette_8 = "#7c6f64"
palette_9 = "#ea6962"
palette_10 = "#a9b665"
palette_11 = "#d8a657"
palette_12 = "#7daea3"
palette_13 = "#d3869b"
palette_14 = "#89b482"
palette_15 = "#ddc7a1"

[roles]
bg = "#32302f"
