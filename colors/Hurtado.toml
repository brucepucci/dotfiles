# Hurtado
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#dbdbdb"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#575757"
palette_1 = "#ff1b00"
palette_2 = "#a5e055"
palette_3 = "#fbe74a"
palette_4 = "#496487"
palette_5 = "#fd5ff1"
palette_6 = "#86e9fe"
palette_7 = "#cbcccb"
palette_8 = "#404040"
palette_9 = "#d51d00"
palette_10 = "#a5df55"
palette_11 = "#fbe84a"
palette_12 = "#89beff"
palette_13 = "#c001c1"
palette_14 = "#86eafe"
palette_15 = "#dbdbdb"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1a1a1a"
fg = "#dbdbdb"
fg_soft = "#999999"
fg_bright = "#dbdbdb"
grey = "#787878"
grey_dim = "#4d4d4d"
grey_neutral = "#8e8e8e"
grey_soft = "#636363"
red = "#ff1b00"
orange = "#fd8125"
yellow = "#fbe74a"
green = "#a5e055"
aqua = "#86e9fe"
blue = "#496487"
purple = "#fd5ff1"
tint_green = "#1e280f"
tint_red = "#2e0500"
statusline = "#121212"
statusline_accent = "#272727"
statusline_fg = "#dbdbdb"
on_accent = "#000000"
mode_red = "#ff1b00"
mode_green = "#a5e055"
mode_yellow = "#fbe74a"
mode_blue = "#496487"
mode_purple = "#fd5ff1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
