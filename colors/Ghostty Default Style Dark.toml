# Ghostty Default Style Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#353a44"
selection-background = "#ffffff"
selection-foreground = "#282c34"
palette_0 = "#282c34"
palette_1 = "#282c34"
palette_2 = "#282c34"
palette_3 = "#282c34"
palette_4 = "#282c34"
palette_5 = "#282c34"
palette_6 = "#282c34"
palette_7 = "#282c34"
palette_8 = "#282c34"
palette_9 = "#282c34"
palette_10 = "#282c34"
palette_11 = "#282c34"
palette_12 = "#282c34"
palette_13 = "#282c34"
palette_14 = "#282c34"
palette_15 = "#282c34"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#42454c"
fg = "#ffffff"
fg_soft = "#bec0c2"
fg_bright = "#282c34"
grey = "#9ea0a4"
grey_dim = "#73767b"
grey_neutral = "#b4b5b8"
grey_soft = "#898b8f"
red = "#282c34"
orange = "#282c34"
yellow = "#282c34"
green = "#282c34"
aqua = "#282c34"
blue = "#282c34"
purple = "#282c34"
tint_green = "#282c34"
tint_red = "#282c34"
statusline = "#393d44"
statusline_accent = "#4f5259"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#282c34"
mode_green = "#282c34"
