# Ghostty Default Style Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#353a44"
selection-background = "#ffffff"
selection-foreground = "#282c34"
palette_0 = "#1d1f21"
palette_1 = "#cc6566"
palette_2 = "#b6bd68"
palette_3 = "#f0c674"
palette_4 = "#82a2be"
palette_5 = "#b294bb"
palette_6 = "#8abeb7"
palette_7 = "#c4c8c6"
palette_8 = "#666666"
palette_9 = "#d54e53"
palette_10 = "#b9ca4b"
palette_11 = "#e7c547"
palette_12 = "#7aa6da"
palette_13 = "#c397d8"
palette_14 = "#70c0b1"
palette_15 = "#eaeaea"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#42454c"
fg = "#ffffff"
fg_soft = "#bec0c2"
fg_bright = "#eaeaea"
grey = "#9ea0a4"
grey_dim = "#73767b"
grey_neutral = "#b4b5b8"
grey_soft = "#898b8f"
red = "#cc6566"
orange = "#de966d"
yellow = "#f0c674"
green = "#b6bd68"
aqua = "#8abeb7"
blue = "#82a2be"
purple = "#b294bb"
tint_green = "#42463d"
tint_red = "#46363d"
statusline = "#393d44"
statusline_accent = "#4f5259"
statusline_fg = "#ffffff"
on_accent = "#282c34"
mode_red = "#cc6566"
mode_green = "#b6bd68"
mode_yellow = "#f0c674"
mode_blue = "#82a2be"
mode_purple = "#b294bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
