# Seafoam Pastel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#243435"
foreground = "#d4e7d4"
cursor-color = "#57647a"
cursor-text = "#323232"
selection-background = "#ffffff"
selection-foreground = "#9e8b13"
palette_0 = "#757575"
palette_1 = "#825d4d"
palette_2 = "#728c62"
palette_3 = "#ada16d"
palette_4 = "#4d7b82"
palette_5 = "#8a7267"
palette_6 = "#729494"
palette_7 = "#e0e0e0"
palette_8 = "#8a8a8a"
palette_9 = "#cf937a"
palette_10 = "#98d9aa"
palette_11 = "#fae79d"
palette_12 = "#7ac3cf"
palette_13 = "#d6b2a1"
palette_14 = "#ade0e0"
palette_15 = "#e0e0e0"

[roles]
bg = "#243435"
bg_deep = "#1b2728"
surface = "#394948"
fg = "#d4e7d4"
fg_soft = "#9fb1a4"
fg_bright = "#e0e0e0"
grey = "#85968c"
grey_dim = "#62736d"
grey_neutral = "#96a89c"
grey_soft = "#73857d"
red = "#825d4d"
orange = "#987f5d"
yellow = "#ada16d"
green = "#728c62"
aqua = "#729494"
blue = "#4d7b82"
purple = "#8a7267"
tint_green = "#32443d"
tint_red = "#353b39"
statusline = "#324242"
statusline_accent = "#445452"
