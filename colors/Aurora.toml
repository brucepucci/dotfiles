# Aurora
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#23262e"
foreground = "#ffca28"
cursor-color = "#ee5d43"
cursor-text = "#ffd29c"
selection-background = "#292e38"
selection-foreground = "#00e8c6"
palette_0 = "#23262e"
palette_1 = "#f0266f"
palette_2 = "#8fd46d"
palette_3 = "#ffe66d"
palette_4 = "#102ee4"
palette_5 = "#ee5d43"
palette_6 = "#03d6b8"
palette_7 = "#c74ded"
palette_8 = "#4f545e"
palette_9 = "#f92672"
palette_10 = "#8fd46d"
palette_11 = "#ffe66d"
palette_12 = "#03d6b8"
palette_13 = "#ee5d43"
palette_14 = "#03d6b8"
palette_15 = "#c74ded"

[roles]
bg = "#23262e"
bg_deep = "#1a1c22"
surface = "#3d3a2d"
fg = "#ffca28"
fg_soft = "#bd992a"
fg_bright = "#c74ded"
grey = "#9c802b"
grey_dim = "#705f2c"
