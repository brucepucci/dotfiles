# Hardcore
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#a0a0a0"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#453b39"
selection-foreground = "#b6bbc0"
palette_0 = "#1b1d1e"
palette_1 = "#f92672"
palette_2 = "#a6e22e"
palette_3 = "#fd971f"
palette_4 = "#66d9ef"
palette_5 = "#9e6ffe"
palette_6 = "#5e7175"
palette_7 = "#ccccc6"
palette_8 = "#505354"
palette_9 = "#ff669d"
palette_10 = "#beed5f"
palette_11 = "#e6db74"
palette_12 = "#66d9ef"
palette_13 = "#9e6ffe"
palette_14 = "#a3babf"
palette_15 = "#f8f8f2"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#232323"
fg = "#a0a0a0"
fg_soft = "#757575"
fg_bright = "#f8f8f2"
grey = "#606060"
grey_dim = "#444444"
grey_neutral = "#6e6e6e"
grey_soft = "#525252"
red = "#f92672"
orange = "#fb5e48"
yellow = "#fd971f"
green = "#a6e22e"
aqua = "#5e7175"
blue = "#66d9ef"
purple = "#9e6ffe"
tint_green = "#2d3717"
tint_red = "#3c1623"
statusline = "#1d1d1d"
statusline_accent = "#2c2c2c"
statusline_fg = "#a0a0a0"
on_accent = "#121212"
mode_red = "#f92672"
mode_green = "#a6e22e"
mode_yellow = "#fd971f"
mode_blue = "#66d9ef"
mode_purple = "#9e6ffe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
