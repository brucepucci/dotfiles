# Hardcore
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#a0a0a0"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#453b39"
selection-foreground = "#b6bbc0"
palette_0 = "#121212"
palette_1 = "#121212"
palette_2 = "#121212"
palette_3 = "#121212"
palette_4 = "#121212"
palette_5 = "#121212"
palette_6 = "#121212"
palette_7 = "#121212"
palette_8 = "#121212"
palette_9 = "#121212"
palette_10 = "#121212"
palette_11 = "#121212"
palette_12 = "#121212"
palette_13 = "#121212"
palette_14 = "#121212"
palette_15 = "#121212"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#232323"
fg = "#a0a0a0"
fg_soft = "#757575"
fg_bright = "#121212"
grey = "#606060"
grey_dim = "#444444"
grey_neutral = "#6e6e6e"
grey_soft = "#525252"
red = "#121212"
orange = "#121212"
yellow = "#121212"
green = "#121212"
aqua = "#121212"
blue = "#121212"
purple = "#121212"
