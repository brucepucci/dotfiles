# iTerm2 Dark Background
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c7c7c7"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c91b00"
palette_2 = "#00c200"
palette_3 = "#c7c400"
palette_4 = "#0225c7"
palette_5 = "#ca30c7"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#5ffa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#ff77ff"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#181818"
fg = "#c7c7c7"
fg_soft = "#8b8b8b"
fg_bright = "#ffffff"
grey = "#6d6d6d"
grey_dim = "#464646"
grey_neutral = "#818181"
grey_soft = "#5a5a5a"
red = "#c91b00"
orange = "#c87000"
yellow = "#c7c400"
green = "#00c200"
aqua = "#00c5c7"
blue = "#0225c7"
purple = "#ca30c7"
tint_green = "#002300"
tint_red = "#240500"
statusline = "#101010"
statusline_accent = "#242424"
statusline_fg = "#c7c7c7"
on_accent = "#c7c7c7"
mode_red = "#c91b00"
mode_green = "#00c200"
mode_yellow = "#c7c400"
mode_blue = "#0225c7"
mode_purple = "#ca30c7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
