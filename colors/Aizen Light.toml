# Aizen Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f0f2f6"
foreground = "#4a4d66"
cursor-color = "#fc6008"
cursor-text = "#f0f2f6"
selection-background = "#bdc2cc"
selection-foreground = "#4a4d66"
palette_0 = "#f0f2f6"
palette_1 = "#d00c36"
palette_2 = "#3e9e28"
palette_3 = "#dd8c1a"
palette_4 = "#1c64f2"
palette_5 = "#8636ec"
palette_6 = "#159096"
palette_7 = "#4a4d66"
palette_8 = "#adb2bc"
palette_9 = "#d00c36"
palette_10 = "#3e9e28"
palette_11 = "#dd8c1a"
palette_12 = "#1c64f2"
palette_13 = "#8636ec"
palette_14 = "#159096"
palette_15 = "#4a4d66"

[roles]
bg = "#f0f2f6"
bg_deep = "#f4f5f8"
surface = "#dcdee5"
fg = "#4a4d66"
fg_soft = "#7c7e91"
fg_bright = "#303242"
grey = "#9597a7"
grey_dim = "#b6b8c4"
grey_neutral = "#848798"
grey_soft = "#a5a8b5"
red = "#d00c36"
orange = "#d64c28"
yellow = "#dd8c1a"
green = "#3e9e28"
aqua = "#159096"
