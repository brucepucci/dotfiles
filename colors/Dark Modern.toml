# Dark Modern
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1f1f"
foreground = "#cccccc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#3a3d41"
selection-foreground = "#e0e0e0"
palette_0 = "#272727"
palette_1 = "#f74949"
palette_2 = "#2ea043"
palette_3 = "#9e6a03"
palette_4 = "#0078d4"
palette_5 = "#d01273"
palette_6 = "#1db4d6"
palette_7 = "#cccccc"
palette_8 = "#5d5d5d"
palette_9 = "#dc5452"
palette_10 = "#23d18b"
palette_11 = "#f5f543"
palette_12 = "#3b8eea"
palette_13 = "#d670d6"
palette_14 = "#29b8db"
palette_15 = "#e5e5e5"

[roles]
bg = "#1f1f1f"
bg_deep = "#171717"
surface = "#343434"
fg = "#cccccc"
fg_soft = "#989898"
fg_bright = "#e5e5e5"
grey = "#7e7e7e"
grey_dim = "#5c5c5c"
grey_neutral = "#8f8f8f"
grey_soft = "#6d6d6d"
red = "#f74949"
orange = "#ca5a26"
yellow = "#9e6a03"
green = "#2ea043"
aqua = "#1db4d6"
blue = "#0078d4"
purple = "#d01273"
tint_green = "#223625"
tint_red = "#462727"
statusline = "#2d2d2d"
statusline_accent = "#3e3e3e"
statusline_fg = "#cccccc"
on_accent = "#1f1f1f"
mode_red = "#f74949"
mode_green = "#2ea043"
mode_yellow = "#9e6a03"
mode_blue = "#0078d4"
mode_purple = "#d01273"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
