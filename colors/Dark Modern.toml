# Dark Modern
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1f1f"
foreground = "#cccccc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#3a3d41"
selection-foreground = "#e0e0e0"
palette_0 = "#1f1f1f"
palette_1 = "#1f1f1f"
palette_2 = "#1f1f1f"
palette_3 = "#1f1f1f"
palette_4 = "#1f1f1f"
palette_5 = "#1f1f1f"
palette_6 = "#1f1f1f"
palette_7 = "#1f1f1f"
palette_8 = "#1f1f1f"
palette_9 = "#1f1f1f"
palette_10 = "#1f1f1f"
palette_11 = "#1f1f1f"
palette_12 = "#1f1f1f"
palette_13 = "#1f1f1f"
palette_14 = "#1f1f1f"
palette_15 = "#1f1f1f"

[roles]
bg = "#1f1f1f"
bg_deep = "#171717"
surface = "#343434"
fg = "#cccccc"
fg_soft = "#989898"
fg_bright = "#1f1f1f"
grey = "#7e7e7e"
grey_dim = "#5c5c5c"
grey_neutral = "#8f8f8f"
grey_soft = "#6d6d6d"
red = "#1f1f1f"
orange = "#1f1f1f"
yellow = "#1f1f1f"
green = "#1f1f1f"
aqua = "#1f1f1f"
blue = "#1f1f1f"
purple = "#1f1f1f"
tint_green = "#1f1f1f"
tint_red = "#1f1f1f"
statusline = "#2d2d2d"
statusline_accent = "#3e3e3e"
statusline_fg = "#cccccc"
on_accent = "#cccccc"
mode_red = "#1f1f1f"
mode_green = "#1f1f1f"
mode_yellow = "#1f1f1f"
mode_blue = "#1f1f1f"
