# Vaughn
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#25234f"
foreground = "#dcdccc"
cursor-color = "#ff5555"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#25234f"
palette_1 = "#705050"
palette_2 = "#60b48a"
palette_3 = "#dfaf8f"
palette_4 = "#5555ff"
palette_5 = "#f08cc3"
palette_6 = "#8cd0d3"
palette_7 = "#709080"
palette_8 = "#709080"
palette_9 = "#dca3a3"
palette_10 = "#60b48a"
palette_11 = "#f0dfaf"
palette_12 = "#5555ff"
palette_13 = "#ec93d3"
palette_14 = "#93e0e3"
palette_15 = "#ffffff"

[roles]
bg = "#25234f"
bg_deep = "#1c1a3b"
surface = "#3b395e"
fg = "#dcdccc"
fg_soft = "#a5a4a6"
fg_bright = "#ffffff"
grey = "#8a8994"
grey_dim = "#65647b"
grey_neutral = "#9c9ba0"
grey_soft = "#777687"
red = "#705050"
orange = "#a88070"
yellow = "#dfaf8f"
green = "#60b48a"
aqua = "#8cd0d3"
blue = "#5555ff"
purple = "#f08cc3"
tint_green = "#303d5a"
tint_red = "#322b4f"
statusline = "#343259"
statusline_accent = "#464466"
statusline_fg = "#dcdccc"
on_accent = "#dcdccc"
mode_red = "#705050"
mode_green = "#60b48a"
mode_yellow = "#dfaf8f"
mode_blue = "#5555ff"
mode_purple = "#f08cc3"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
