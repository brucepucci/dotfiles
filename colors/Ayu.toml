# Ayu
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0b0e14"
foreground = "#bfbdb6"
cursor-color = "#e6b450"
cursor-text = "#0b0e14"
selection-background = "#409fff"
selection-foreground = "#0b0e14"
palette_0 = "#11151c"
palette_1 = "#ea6c73"
palette_2 = "#7fd962"
palette_3 = "#f9af4f"
palette_4 = "#53bdfa"
palette_5 = "#cda1fa"
palette_6 = "#90e1c6"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#f07178"
palette_10 = "#aad94c"
palette_11 = "#ffb454"
palette_12 = "#59c2ff"
palette_13 = "#d2a6ff"
palette_14 = "#95e6cb"
palette_15 = "#ffffff"

[roles]
bg = "#0b0e14"
bg_deep = "#080a0f"
surface = "#212327"
fg = "#bfbdb6"
fg_soft = "#898885"
fg_bright = "#ffffff"
grey = "#6e6e6d"
grey_dim = "#4a4b4d"
grey_neutral = "#80807d"
grey_soft = "#5c5d5d"
red = "#ea6c73"
orange = "#f28e61"
yellow = "#f9af4f"
green = "#7fd962"
aqua = "#90e1c6"
blue = "#53bdfa"
purple = "#cda1fa"
tint_green = "#203322"
