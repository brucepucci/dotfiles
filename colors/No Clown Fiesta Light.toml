# No Clown Fiesta Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e1e1e1"
foreground = "#151515"
cursor-color = "#151515"
cursor-text = "#d0d0d0"
selection-background = "#c6d5de"
selection-foreground = "#151515"
palette_0 = "#d6d6d6"
palette_1 = "#874e42"
palette_2 = "#677940"
palette_3 = "#b89058"
palette_4 = "#8ba1bf"
palette_5 = "#aa759f"
palette_6 = "#3e5f66"
palette_7 = "#151515"
palette_8 = "#2b2b2b"
palette_9 = "#637786"
palette_10 = "#677940"
palette_11 = "#b89058"
palette_12 = "#93a2ab"
palette_13 = "#aa759f"
palette_14 = "#99ab93"
palette_15 = "#373737"

[roles]
bg = "#e1e1e1"
bg_deep = "#e8e8e8"
surface = "#c9c9c9"
fg = "#151515"
fg_soft = "#525252"
fg_bright = "#0e0e0e"
grey = "#717171"
grey_dim = "#9a9a9a"
grey_neutral = "#5c5c5c"
grey_soft = "#858585"
red = "#874e42"
orange = "#a06f4d"
yellow = "#b89058"
green = "#677940"
aqua = "#3e5f66"
blue = "#8ba1bf"
purple = "#aa759f"
tint_green = "#cbcec4"
tint_red = "#d1c7c4"
statusline = "#d1d1d1"
statusline_accent = "#bcbcbc"
statusline_fg = "#151515"
on_accent = "#151515"
mode_red = "#874e42"
mode_green = "#677940"
mode_yellow = "#b89058"
mode_blue = "#8ba1bf"
