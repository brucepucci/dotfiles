# No Clown Fiesta Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e1e1e1"
foreground = "#151515"
cursor-color = "#151515"
cursor-text = "#d0d0d0"
selection-background = "#c6d5de"
selection-foreground = "#151515"
palette_0 = "#e1e1e1"
palette_1 = "#e1e1e1"
palette_2 = "#e1e1e1"
palette_3 = "#e1e1e1"
palette_4 = "#e1e1e1"
palette_5 = "#e1e1e1"
palette_6 = "#e1e1e1"
palette_7 = "#e1e1e1"
palette_8 = "#e1e1e1"
palette_9 = "#e1e1e1"
palette_10 = "#e1e1e1"
palette_11 = "#e1e1e1"
palette_12 = "#e1e1e1"
palette_13 = "#e1e1e1"
palette_14 = "#e1e1e1"
palette_15 = "#e1e1e1"

[roles]
bg = "#e1e1e1"
bg_deep = "#e8e8e8"
surface = "#c9c9c9"
fg = "#151515"
fg_soft = "#525252"
fg_bright = "#0e0e0e"
grey = "#717171"
grey_dim = "#9a9a9a"
