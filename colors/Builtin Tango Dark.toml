# Builtin Tango Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0000"
palette_2 = "#4e9a06"
palette_3 = "#c4a000"
palette_4 = "#3465a4"
palette_5 = "#75507b"
palette_6 = "#06989a"
palette_7 = "#d3d7cf"
palette_8 = "#555753"
palette_9 = "#ef2929"
palette_10 = "#8ae234"
palette_11 = "#fce94f"
palette_12 = "#729fcf"
palette_13 = "#ad7fa8"
palette_14 = "#34e2e2"
palette_15 = "#eeeeec"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#eeeeec"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#cc0000"
orange = "#c85000"
yellow = "#c4a000"
green = "#4e9a06"
aqua = "#06989a"
blue = "#3465a4"
purple = "#75507b"
tint_green = "#0e1c01"
tint_red = "#250000"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#cc0000"
mode_green = "#4e9a06"
mode_yellow = "#c4a000"
mode_blue = "#3465a4"
mode_purple = "#75507b"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
