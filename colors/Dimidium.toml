# Dimidium
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141414"
foreground = "#bab7b6"
cursor-color = "#37e57b"
cursor-text = "#141414"
selection-background = "#8db8e5"
selection-foreground = "#141414"
palette_0 = "#000000"
palette_1 = "#cf494c"
palette_2 = "#60b442"
palette_3 = "#db9c11"
palette_4 = "#0575d8"
palette_5 = "#af5ed2"
palette_6 = "#1db6bb"
palette_7 = "#bab7b6"
palette_8 = "#817e7e"
palette_9 = "#ff643b"
palette_10 = "#37e57b"
palette_11 = "#fccd1a"
palette_12 = "#688dfd"
palette_13 = "#ed6fe9"
palette_14 = "#32e0fb"
palette_15 = "#dee3e4"

[roles]
