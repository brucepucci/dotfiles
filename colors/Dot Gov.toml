palette_2 = "#262c35"
palette_3 = "#262c35"
palette_4 = "#262c35"
palette_5 = "#262c35"
palette_6 = "#262c35"
palette_7 = "#262c35"
palette_8 = "#262c35"
palette_9 = "#262c35"
palette_10 = "#262c35"
palette_11 = "#262c35"
palette_12 = "#262c35"
palette_13 = "#262c35"
palette_14 = "#262c35"
palette_15 = "#262c35"

[roles]
