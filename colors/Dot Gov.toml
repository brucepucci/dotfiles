# Dot Gov
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#262c35"
foreground = "#ebebeb"
cursor-color = "#d9002f"
cursor-text = "#ffffff"
selection-background = "#1a4080"
selection-foreground = "#ffffff"
palette_0 = "#191919"
palette_1 = "#bf091d"
palette_2 = "#3d9751"
palette_3 = "#f6bb34"
palette_4 = "#17b2e0"
palette_5 = "#7830b0"
palette_6 = "#8bd2ed"
palette_7 = "#ffffff"
palette_8 = "#595959"
palette_9 = "#bf091d"
palette_10 = "#3d9751"
palette_11 = "#f6bb34"
palette_12 = "#17b2e0"
palette_13 = "#7830b0"
palette_14 = "#8bd2ed"
palette_15 = "#ffffff"

[roles]
bg = "#262c35"
bg_deep = "#1c2128"
surface = "#3e434b"
fg = "#ebebeb"
fg_soft = "#b0b2b4"
fg_bright = "#ffffff"
grey = "#929599"
grey_dim = "#6b6f75"
grey_neutral = "#a6a8ab"
grey_soft = "#7f8287"
red = "#bf091d"
orange = "#da6228"
yellow = "#f6bb34"
green = "#3d9751"
aqua = "#8bd2ed"
