# Horizon Bright
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fdf0ed"
foreground = "#16161d"
cursor-color = "#d3a89d"
cursor-text = "#ffe8dc"
selection-background = "#f9cec3"
selection-foreground = "#16161d"
palette_0 = "#16161d"
palette_1 = "#fc4777"
palette_2 = "#00ca86"
palette_3 = "#f2a682"
palette_4 = "#00bedd"
palette_5 = "#ff58b1"
palette_6 = "#00cdcb"
palette_7 = "#bfafac"
palette_8 = "#1a1c24"
palette_9 = "#fe5f87"
palette_10 = "#00d193"
palette_11 = "#e5a688"
palette_12 = "#00c9e2"
palette_13 = "#ff6cba"
palette_14 = "#00c3c2"
palette_15 = "#fff2ef"

[roles]
bg = "#fdf0ed"
bg_deep = "#fef4f2"
surface = "#e1d6d4"
fg = "#16161d"
fg_soft = "#5b575b"
fg_bright = "#0e0e13"
grey = "#7e787b"
grey_dim = "#aca4a4"
grey_neutral = "#676266"
grey_soft = "#958e8f"
red = "#fc4777"
orange = "#f7767c"
yellow = "#f2a682"
green = "#00ca86"
aqua = "#00cdcb"
blue = "#00bedd"
purple = "#ff58b1"
tint_green = "#cfe9da"
tint_red = "#fdd2d8"
statusline = "#ebdfdc"
statusline_accent = "#d3c9c8"
statusline_fg = "#16161d"
on_accent = "#16161d"
mode_red = "#fc4777"
mode_green = "#00ca86"
mode_yellow = "#f2a682"
mode_blue = "#00bedd"
mode_purple = "#ff58b1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
