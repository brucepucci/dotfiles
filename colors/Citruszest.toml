# Citruszest
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#bfbfbf"
cursor-color = "#666666"
cursor-text = "#f9f9f9"
selection-background = "#ff8c00"
selection-foreground = "#f4f4f4"
palette_0 = "#404040"
palette_1 = "#ff5454"
palette_2 = "#00cc7a"
palette_3 = "#ffd400"
palette_4 = "#00bfff"
palette_5 = "#ff90fe"
palette_6 = "#48d1cc"
palette_7 = "#bfbfbf"
palette_8 = "#808080"
palette_9 = "#ff1a75"
palette_10 = "#1affa3"
palette_11 = "#ffff00"
palette_12 = "#33cfff"
palette_13 = "#ffb2fe"
palette_14 = "#00fff2"
palette_15 = "#f9f9f9"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#272727"
fg = "#bfbfbf"
fg_soft = "#8b8b8b"
fg_bright = "#f9f9f9"
grey = "#717171"
grey_dim = "#4f4f4f"
grey_neutral = "#828282"
grey_soft = "#606060"
red = "#ff5454"
orange = "#ff942a"
yellow = "#ffd400"
green = "#00cc7a"
aqua = "#48d1cc"
blue = "#00bfff"
purple = "#ff90fe"
tint_green = "#0f3325"
tint_red = "#3d1e1e"
statusline = "#202020"
statusline_accent = "#313131"
statusline_fg = "#bfbfbf"
on_accent = "#121212"
mode_red = "#ff5454"
mode_green = "#00cc7a"
mode_yellow = "#ffd400"
mode_blue = "#00bfff"
mode_purple = "#ff90fe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
