palette_2 = "#98c379"
palette_3 = "#e5c07b"
palette_4 = "#61afef"
palette_5 = "#c678dd"
palette_6 = "#56b6c2"
palette_7 = "#abb2bf"
palette_8 = "#767676"
palette_9 = "#e06c75"
palette_10 = "#98c379"
palette_11 = "#e5c07b"
palette_12 = "#61afef"
palette_13 = "#c678dd"
palette_14 = "#56b6c2"
palette_15 = "#abb2bf"

[roles]
