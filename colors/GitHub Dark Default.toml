# GitHub Dark Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d1117"
foreground = "#e6edf3"
cursor-color = "#2f81f7"
cursor-text = "#6fc1ff"
selection-background = "#e6edf3"
selection-foreground = "#0d1117"
palette_0 = "#0d1117"
palette_1 = "#0d1117"
palette_2 = "#0d1117"
palette_3 = "#0d1117"
palette_4 = "#0d1117"
palette_5 = "#0d1117"
palette_6 = "#0d1117"
palette_7 = "#0d1117"
palette_8 = "#0d1117"
palette_9 = "#0d1117"
palette_10 = "#0d1117"
palette_11 = "#0d1117"
palette_12 = "#0d1117"
palette_13 = "#0d1117"
palette_14 = "#0d1117"
palette_15 = "#0d1117"

[roles]
bg = "#0d1117"
bg_deep = "#0a0d11"
surface = "#272b31"
fg = "#e6edf3"
fg_soft = "#a5abb1"
fg_bright = "#0d1117"
grey = "#848a90"
