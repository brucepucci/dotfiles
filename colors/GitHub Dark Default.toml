# GitHub Dark Default
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d1117"
foreground = "#e6edf3"
cursor-color = "#2f81f7"
cursor-text = "#6fc1ff"
selection-background = "#e6edf3"
selection-foreground = "#0d1117"
palette_0 = "#484f58"
palette_1 = "#ff7b72"
palette_2 = "#3fb950"
palette_3 = "#d29922"
palette_4 = "#58a6ff"
palette_5 = "#bc8cff"
palette_6 = "#39c5cf"
palette_7 = "#b1bac4"
palette_8 = "#6e7681"
palette_9 = "#ffa198"
palette_10 = "#56d364"
palette_11 = "#e3b341"
palette_12 = "#79c0ff"
palette_13 = "#d2a8ff"
palette_14 = "#56d4dd"
palette_15 = "#ffffff"

[roles]
bg = "#0d1117"
bg_deep = "#0a0d11"
surface = "#272b31"
fg = "#e6edf3"
fg_soft = "#a5abb1"
fg_bright = "#ffffff"
grey = "#848a90"
grey_dim = "#595e64"
grey_neutral = "#9aa0a6"
grey_soft = "#6f747a"
red = "#ff7b72"
orange = "#e88a4a"
yellow = "#d29922"
green = "#3fb950"
aqua = "#39c5cf"
blue = "#58a6ff"
purple = "#bc8cff"
tint_green = "#162f21"
tint_red = "#392427"
statusline = "#1e2329"
statusline_accent = "#34393f"
statusline_fg = "#e6edf3"
on_accent = "#0d1117"
mode_red = "#ff7b72"
mode_green = "#3fb950"
mode_yellow = "#d29922"
mode_blue = "#58a6ff"
mode_purple = "#bc8cff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
