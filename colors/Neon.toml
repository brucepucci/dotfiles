# Neon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#14161a"
foreground = "#00fffc"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#0013ff"
selection-foreground = "#08d2cf"
palette_0 = "#14161a"
palette_1 = "#14161a"
palette_2 = "#14161a"
palette_3 = "#14161a"
palette_4 = "#14161a"
palette_5 = "#14161a"
palette_6 = "#14161a"
palette_7 = "#14161a"
palette_8 = "#14161a"
palette_9 = "#14161a"
palette_10 = "#14161a"
palette_11 = "#14161a"
palette_12 = "#14161a"
palette_13 = "#14161a"
palette_14 = "#14161a"
palette_15 = "#14161a"

[roles]
bg = "#14161a"
bg_deep = "#0f1014"
surface = "#123235"
fg = "#00fffc"
fg_soft = "#06b9b8"
fg_bright = "#14161a"
grey = "#099696"
grey_dim = "#0d6869"
grey_neutral = "#07adad"
grey_soft = "#0b7f80"
red = "#14161a"
