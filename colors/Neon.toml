# Neon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#14161a"
foreground = "#00fffc"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#0013ff"
selection-foreground = "#08d2cf"
palette_0 = "#000000"
palette_1 = "#ff3045"
palette_2 = "#5ffa74"
palette_3 = "#fffc7e"
palette_4 = "#0f15d8"
palette_5 = "#f924e7"
palette_6 = "#00fffc"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff5a5a"
palette_10 = "#75ff88"
palette_11 = "#fffd96"
palette_12 = "#3c40cb"
palette_13 = "#f15be5"
palette_14 = "#88fffe"
palette_15 = "#ffffff"

[roles]
bg = "#14161a"
bg_deep = "#0f1014"
surface = "#123235"
fg = "#00fffc"
fg_soft = "#06b9b8"
fg_bright = "#ffffff"
grey = "#099696"
grey_dim = "#0d6869"
grey_neutral = "#07adad"
grey_soft = "#0b7f80"
red = "#ff3045"
orange = "#ff9662"
yellow = "#fffc7e"
green = "#5ffa74"
aqua = "#00fffc"
blue = "#0f15d8"
purple = "#f924e7"
tint_green = "#223f2a"
tint_red = "#3e1b22"
statusline = "#12292c"
statusline_accent = "#104043"
statusline_fg = "#00fffc"
on_accent = "#14161a"
mode_red = "#ff3045"
mode_green = "#5ffa74"
mode_yellow = "#fffc7e"
mode_blue = "#0f15d8"
mode_purple = "#f924e7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
