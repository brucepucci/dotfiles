# Forest Blue
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#051519"
foreground = "#e2d8cd"
cursor-color = "#9e9ecb"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#333333"
palette_1 = "#f8818e"
palette_2 = "#92d3a2"
palette_3 = "#1a8e63"
palette_4 = "#8ed0ce"
palette_5 = "#5e468c"
palette_6 = "#31658c"
palette_7 = "#e2d8cd"
palette_8 = "#4a4a4a"
palette_9 = "#fb3d66"
palette_10 = "#6bb48d"
palette_11 = "#30c85a"
palette_12 = "#39a7a2"
palette_13 = "#7e62b3"
palette_14 = "#6096bf"
palette_15 = "#e2d8cd"

[roles]
bg = "#051519"
bg_deep = "#041013"
surface = "#202c2f"
fg = "#e2d8cd"
fg_soft = "#a09e97"
fg_bright = "#e2d8cd"
grey = "#7f807c"
grey_dim = "#525958"
grey_neutral = "#95948e"
grey_soft = "#686d6a"
red = "#f8818e"
orange = "#898878"
yellow = "#1a8e63"
green = "#92d3a2"
aqua = "#31658c"
blue = "#8ed0ce"
purple = "#5e468c"
tint_green = "#1e3732"
tint_red = "#31282e"
statusline = "#172527"
statusline_accent = "#2d3839"
