palette_8 = "#051519"
palette_9 = "#051519"
palette_10 = "#051519"
palette_11 = "#051519"
palette_12 = "#051519"
palette_13 = "#051519"
palette_14 = "#051519"
palette_15 = "#051519"

[roles]
