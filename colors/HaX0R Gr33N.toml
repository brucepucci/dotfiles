palette_2 = "#020f01"
palette_3 = "#020f01"
palette_4 = "#020f01"
palette_5 = "#020f01"
palette_6 = "#020f01"
palette_7 = "#020f01"
palette_8 = "#020f01"
palette_9 = "#020f01"
palette_10 = "#020f01"
palette_11 = "#020f01"
palette_12 = "#020f01"
palette_13 = "#020f01"
palette_14 = "#020f01"
palette_15 = "#020f01"

[roles]
