# Rapture
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#111e2a"
foreground = "#c0c9e5"
cursor-color = "#ffffff"
cursor-text = "#111e2a"
selection-background = "#304b66"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#fc644d"
palette_2 = "#7afde1"
palette_3 = "#fff09b"
palette_4 = "#6c9bf5"
palette_5 = "#ff4fa1"
palette_6 = "#64e0ff"
palette_7 = "#c0c9e5"
palette_8 = "#304b66"
palette_9 = "#fc644d"
palette_10 = "#7afde1"
palette_11 = "#fff09b"
palette_12 = "#6c9bf5"
palette_13 = "#ff4fa1"
palette_14 = "#64e0ff"
palette_15 = "#ffffff"

[roles]
bg = "#111e2a"
bg_deep = "#0d1620"
surface = "#263340"
fg = "#c0c9e5"
fg_soft = "#8c96ad"
fg_bright = "#ffffff"
grey = "#717c91"
grey_dim = "#4e5a6b"
grey_neutral = "#838da4"
grey_soft = "#606b7e"
red = "#fc644d"
orange = "#feaa74"
yellow = "#fff09b"
green = "#7afde1"
aqua = "#64e0ff"
