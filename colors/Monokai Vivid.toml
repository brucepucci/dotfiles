# Monokai Vivid
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#f9f9f9"
cursor-color = "#fb0007"
cursor-text = "#ff8c95"
selection-background = "#ffffff"
selection-foreground = "#000000"
palette_0 = "#121212"
palette_1 = "#121212"
palette_2 = "#121212"
palette_3 = "#121212"
palette_4 = "#121212"
palette_5 = "#121212"
palette_6 = "#121212"
palette_7 = "#121212"
palette_8 = "#121212"
palette_9 = "#121212"
palette_10 = "#121212"
palette_11 = "#121212"
palette_12 = "#121212"
palette_13 = "#121212"
palette_14 = "#121212"
palette_15 = "#121212"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#2e2e2e"
fg = "#f9f9f9"
fg_soft = "#b4b4b4"
fg_bright = "#121212"
grey = "#919191"
grey_dim = "#636363"
grey_neutral = "#a8a8a8"
grey_soft = "#7a7a7a"
red = "#121212"
orange = "#121212"
