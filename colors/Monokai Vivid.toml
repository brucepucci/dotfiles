# Monokai Vivid
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#f9f9f9"
cursor-color = "#fb0007"
cursor-text = "#ff8c95"
selection-background = "#ffffff"
selection-foreground = "#000000"
palette_0 = "#121212"
palette_1 = "#fa2934"
palette_2 = "#98e123"
palette_3 = "#fff30a"
palette_4 = "#0443ff"
palette_5 = "#f800f8"
palette_6 = "#01b6ed"
palette_7 = "#ffffff"
palette_8 = "#838383"
palette_9 = "#f6669d"
palette_10 = "#b1e05f"
palette_11 = "#fff26d"
palette_12 = "#0443ff"
palette_13 = "#f200f6"
palette_14 = "#51ceff"
palette_15 = "#ffffff"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#2e2e2e"
fg = "#f9f9f9"
fg_soft = "#b4b4b4"
fg_bright = "#ffffff"
grey = "#919191"
grey_dim = "#636363"
grey_neutral = "#a8a8a8"
grey_soft = "#7a7a7a"
red = "#fa2934"
orange = "#fc8e1f"
yellow = "#fff30a"
green = "#98e123"
aqua = "#01b6ed"
blue = "#0443ff"
purple = "#f800f8"
tint_green = "#2a3715"
tint_red = "#3c1618"
statusline = "#242424"
statusline_accent = "#3c3c3c"
statusline_fg = "#f9f9f9"
on_accent = "#121212"
mode_red = "#fa2934"
mode_green = "#98e123"
mode_yellow = "#fff30a"
mode_blue = "#0443ff"
mode_purple = "#f800f8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
