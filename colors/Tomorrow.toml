# Tomorrow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#4d4d4c"
cursor-color = "#4d4d4c"
cursor-text = "#ffffff"
selection-background = "#d6d6d6"
selection-foreground = "#4d4d4c"
palette_0 = "#000000"
palette_1 = "#c82829"
palette_2 = "#718c00"
palette_3 = "#eab700"
palette_4 = "#4271ae"
palette_5 = "#8959a8"
palette_6 = "#3e999f"
palette_7 = "#bfbfbf"
palette_8 = "#000000"
palette_9 = "#c82829"
palette_10 = "#718c00"
palette_11 = "#eab700"
palette_12 = "#4271ae"
palette_13 = "#8959a8"
palette_14 = "#3e999f"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#eaeaea"
fg = "#4d4d4c"
fg_soft = "#828282"
fg_bright = "#323231"
grey = "#9d9d9d"
grey_dim = "#c1c1c0"
grey_neutral = "#8b8b8b"
grey_soft = "#afafae"
red = "#c82829"
orange = "#d97014"
yellow = "#eab700"
green = "#718c00"
aqua = "#3e999f"
blue = "#4271ae"
purple = "#8959a8"
tint_green = "#e5ead1"
tint_red = "#f5d8d8"
statusline = "#f1f1f1"
