# Afterglow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#d0d0d0"
cursor-color = "#d0d0d0"
cursor-text = "#151515"
selection-background = "#303030"
selection-foreground = "#d0d0d0"
palette_0 = "#212121"
palette_1 = "#212121"
palette_2 = "#212121"
palette_3 = "#212121"
palette_4 = "#212121"
palette_5 = "#212121"
palette_6 = "#212121"
palette_7 = "#212121"
palette_8 = "#212121"
palette_9 = "#212121"
palette_10 = "#212121"
palette_11 = "#212121"
palette_12 = "#212121"
palette_13 = "#212121"
palette_14 = "#212121"
palette_15 = "#212121"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#363636"
fg = "#d0d0d0"
fg_soft = "#9c9c9c"
fg_bright = "#212121"
grey = "#818181"
grey_dim = "#5e5e5e"
grey_neutral = "#939393"
grey_soft = "#707070"
red = "#212121"
orange = "#212121"
yellow = "#212121"
green = "#212121"
aqua = "#212121"
blue = "#212121"
purple = "#212121"
tint_green = "#212121"
tint_red = "#212121"
statusline = "#2f2f2f"
statusline_accent = "#404040"
statusline_fg = "#d0d0d0"
on_accent = "#d0d0d0"
mode_red = "#212121"
mode_green = "#212121"
mode_yellow = "#212121"
