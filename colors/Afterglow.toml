# Afterglow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#212121"
foreground = "#d0d0d0"
cursor-color = "#d0d0d0"
cursor-text = "#151515"
selection-background = "#303030"
selection-foreground = "#d0d0d0"
palette_0 = "#151515"
palette_1 = "#ac4142"
palette_2 = "#7e8e50"
palette_3 = "#e5b567"
palette_4 = "#6c99bb"
palette_5 = "#9f4e85"
palette_6 = "#7dd6cf"
palette_7 = "#d0d0d0"
palette_8 = "#505050"
palette_9 = "#ac4142"
palette_10 = "#7e8e50"
palette_11 = "#e5b567"
palette_12 = "#6c99bb"
palette_13 = "#9f4e85"
palette_14 = "#7dd6cf"
palette_15 = "#f5f5f5"

[roles]
bg = "#212121"
bg_deep = "#191919"
surface = "#363636"
fg = "#d0d0d0"
fg_soft = "#9c9c9c"
fg_bright = "#f5f5f5"
grey = "#818181"
grey_dim = "#5e5e5e"
grey_neutral = "#939393"
grey_soft = "#707070"
red = "#ac4142"
orange = "#c87b54"
yellow = "#e5b567"
green = "#7e8e50"
aqua = "#7dd6cf"
blue = "#6c99bb"
purple = "#9f4e85"
tint_green = "#323529"
tint_red = "#3a2727"
statusline = "#2f2f2f"
