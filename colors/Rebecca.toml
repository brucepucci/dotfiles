# Rebecca
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#292a44"
foreground = "#e8e6ed"
cursor-color = "#b89bf9"
cursor-text = "#292a44"
selection-background = "#663399"
selection-foreground = "#f4f2f9"
palette_0 = "#12131e"
palette_1 = "#dd7755"
palette_2 = "#04dbb5"
palette_3 = "#f2e7b7"
palette_4 = "#7aa5ff"
palette_5 = "#bf9cf9"
palette_6 = "#56d3c2"
palette_7 = "#e4e3e9"
palette_8 = "#666699"
palette_9 = "#ff92cd"
palette_10 = "#01eac0"
palette_11 = "#fffca8"
palette_12 = "#69c0fa"
palette_13 = "#c17ff8"
palette_14 = "#8bfde1"
palette_15 = "#f4f2f9"

[roles]
bg = "#292a44"
bg_deep = "#1f2033"
surface = "#404158"
fg = "#e8e6ed"
fg_soft = "#afaeba"
