# Ubuntu
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#300a24"
foreground = "#eeeeec"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#2e3436"
palette_1 = "#cc0000"
palette_2 = "#4e9a06"
palette_3 = "#c4a000"
palette_4 = "#3465a4"
palette_5 = "#75507b"
palette_6 = "#06989a"
palette_7 = "#d3d7cf"
palette_8 = "#555753"
palette_9 = "#ef2929"
palette_10 = "#8ae234"
palette_11 = "#fce94f"
palette_12 = "#729fcf"
palette_13 = "#ad7fa8"
palette_14 = "#34e2e2"
palette_15 = "#eeeeec"

[roles]
bg = "#300a24"
bg_deep = "#24081b"
surface = "#47253c"
fg = "#eeeeec"
fg_soft = "#b5aab0"
fg_bright = "#eeeeec"
grey = "#988792"
grey_dim = "#725a6a"
grey_neutral = "#ac9ea6"
grey_soft = "#86717e"
red = "#cc0000"
orange = "#c85000"
yellow = "#c4a000"
green = "#4e9a06"
aqua = "#06989a"
blue = "#3465a4"
purple = "#75507b"
tint_green = "#35241f"
tint_red = "#4c081e"
statusline = "#3f1c34"
statusline_accent = "#523348"
statusline_fg = "#eeeeec"
on_accent = "#eeeeec"
mode_red = "#cc0000"
mode_green = "#4e9a06"
