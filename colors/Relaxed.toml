# Relaxed
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#353a44"
foreground = "#d9d9d9"
cursor-color = "#d9d9d9"
cursor-text = "#1b1b1b"
selection-background = "#6a7985"
selection-foreground = "#d9d9d9"
palette_0 = "#151515"
palette_1 = "#bc5653"
palette_2 = "#909d63"
palette_3 = "#ebc17a"
palette_4 = "#6a8799"
palette_5 = "#b06698"
palette_6 = "#c9dfff"
palette_7 = "#d9d9d9"
palette_8 = "#636363"
palette_9 = "#bc5653"
palette_10 = "#a0ac77"
palette_11 = "#ebc17a"
palette_12 = "#7eaac7"
palette_13 = "#b06698"
palette_14 = "#acbbd0"
palette_15 = "#f7f7f7"

[roles]
bg = "#353a44"
bg_deep = "#282c33"
surface = "#494d56"
fg = "#d9d9d9"
fg_soft = "#a8a9ac"
fg_bright = "#f7f7f7"
