# Obsidian
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#283033"
foreground = "#cdcdcd"
cursor-color = "#c0cad0"
cursor-text = "#8d8d8d"
selection-background = "#3e4c4f"
selection-foreground = "#dfe1e2"
palette_0 = "#000000"
palette_1 = "#b30d0e"
palette_2 = "#00bb00"
palette_3 = "#fecd22"
palette_4 = "#3a9bdb"
palette_5 = "#bb00bb"
palette_6 = "#00bbbb"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff0003"
palette_10 = "#93c863"
palette_11 = "#fef874"
palette_12 = "#a1d7ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#283033"
bg_deep = "#1e2426"
surface = "#3c4345"
fg = "#cdcdcd"
fg_soft = "#9c9e9f"
fg_bright = "#ffffff"
grey = "#838688"
grey_dim = "#626769"
grey_neutral = "#939697"
grey_soft = "#727778"
red = "#b30d0e"
orange = "#d86d18"
yellow = "#fecd22"
green = "#00bb00"
aqua = "#00bbbb"
blue = "#3a9bdb"
purple = "#bb00bb"
tint_green = "#21492a"
tint_red = "#412a2c"
statusline = "#353d3f"
statusline_accent = "#464c4f"
statusline_fg = "#cdcdcd"
on_accent = "#cdcdcd"
mode_red = "#b30d0e"
mode_green = "#00bb00"
mode_yellow = "#fecd22"
mode_blue = "#3a9bdb"
mode_purple = "#bb00bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
