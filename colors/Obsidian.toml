palette_6 = "#283033"
palette_7 = "#283033"
palette_8 = "#283033"
palette_9 = "#283033"
palette_10 = "#283033"
palette_11 = "#283033"
palette_12 = "#283033"
palette_13 = "#283033"
palette_14 = "#283033"
palette_15 = "#283033"

[roles]
