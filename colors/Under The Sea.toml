palette_8 = "#011116"
palette_9 = "#011116"
palette_10 = "#011116"
palette_11 = "#011116"
palette_12 = "#011116"
palette_13 = "#011116"
palette_14 = "#011116"
palette_15 = "#011116"

[roles]
