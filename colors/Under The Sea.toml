# Under The Sea
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#011116"
foreground = "#ffffff"
cursor-color = "#4afcd6"
cursor-text = "#031413"
selection-background = "#415555"
selection-foreground = "#4dffda"
palette_0 = "#022026"
palette_1 = "#b2302d"
palette_2 = "#00a941"
palette_3 = "#59819c"
palette_4 = "#459a86"
palette_5 = "#00599d"
palette_6 = "#5d7e19"
palette_7 = "#405555"
palette_8 = "#384451"
palette_9 = "#ff4242"
palette_10 = "#2aea5e"
palette_11 = "#8ed4fd"
palette_12 = "#61d5ba"
palette_13 = "#1298ff"
palette_14 = "#98d028"
palette_15 = "#58fbd6"

[roles]
bg = "#011116"
bg_deep = "#010d10"
surface = "#1f2e32"
fg = "#ffffff"
fg_soft = "#b3b8b9"
fg_bright = "#58fbd6"
grey = "#8d9496"
grey_dim = "#5a6468"
grey_neutral = "#a6acad"
grey_soft = "#737c7f"
red = "#b2302d"
orange = "#865864"
yellow = "#59819c"
green = "#00a941"
aqua = "#5d7e19"
blue = "#459a86"
purple = "#00599d"
tint_green = "#012c1e"
tint_red = "#21171a"
statusline = "#152429"
statusline_accent = "#2f3c40"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#b2302d"
mode_green = "#00a941"
