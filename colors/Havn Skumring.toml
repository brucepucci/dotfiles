palette_2 = "#6ead7b"
palette_3 = "#f8b330"
palette_4 = "#596cf7"
palette_5 = "#7c719e"
palette_6 = "#d588c1"
palette_7 = "#dce0ee"
palette_8 = "#38425c"
palette_9 = "#d17264"
palette_10 = "#8c9e8f"
palette_11 = "#eac58c"
palette_12 = "#5186cb"
palette_13 = "#9b7cee"
palette_14 = "#d17ab6"
palette_15 = "#fff6e1"

[roles]
bg = "#111522"
bg_deep = "#0d101a"
