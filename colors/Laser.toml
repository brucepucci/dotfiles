# Laser
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#030d18"
foreground = "#f106e3"
cursor-color = "#00ff9c"
cursor-text = "#a6a6a6"
selection-background = "#2e206a"
selection-foreground = "#f4f4f4"
palette_0 = "#626262"
palette_1 = "#ff8373"
palette_2 = "#b4fb73"
palette_3 = "#09b4bd"
palette_4 = "#fed300"
palette_5 = "#ff90fe"
palette_6 = "#d1d1fe"
palette_7 = "#f1f1f1"
palette_8 = "#8f8f8f"
palette_9 = "#ffc4be"
palette_10 = "#d6fcba"
palette_11 = "#fffed5"
palette_12 = "#f92883"
palette_13 = "#ffb2fe"
palette_14 = "#e6e7fe"
palette_15 = "#ffffff"

[roles]
bg = "#030d18"
bg_deep = "#020a12"
surface = "#200c30"
fg = "#f106e3"
fg_soft = "#aa08a6"
fg_bright = "#ffffff"
grey = "#860988"
grey_dim = "#560b5f"
grey_neutral = "#9e089c"
grey_soft = "#6e0a73"
red = "#ff8373"
orange = "#849c98"
yellow = "#09b4bd"
green = "#b4fb73"
aqua = "#d1d1fe"
blue = "#fed300"
purple = "#ff90fe"
tint_green = "#233828"
tint_red = "#302228"
statusline = "#160c28"
statusline_accent = "#2e0c3d"
statusline_fg = "#f106e3"
on_accent = "#030d18"
mode_red = "#ff8373"
mode_green = "#b4fb73"
mode_yellow = "#09b4bd"
mode_blue = "#fed300"
mode_purple = "#ff90fe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
