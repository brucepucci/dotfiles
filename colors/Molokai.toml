# Molokai
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#bbbbbb"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#121212"
palette_1 = "#fa2573"
palette_2 = "#98e123"
palette_3 = "#dfd460"
palette_4 = "#1080d0"
palette_5 = "#8700ff"
palette_6 = "#43a8d0"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#f6669d"
palette_10 = "#b1e05f"
palette_11 = "#fff26d"
palette_12 = "#00afff"
palette_13 = "#af87ff"
palette_14 = "#51ceff"
palette_15 = "#ffffff"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#262626"
fg = "#bbbbbb"
fg_soft = "#888888"
fg_bright = "#ffffff"
grey = "#6f6f6f"
grey_dim = "#4d4d4d"
grey_neutral = "#808080"
grey_soft = "#5e5e5e"
red = "#fa2573"
orange = "#ec7c6a"
yellow = "#dfd460"
green = "#98e123"
aqua = "#43a8d0"
blue = "#1080d0"
purple = "#8700ff"
tint_green = "#2a3715"
tint_red = "#3c1523"
statusline = "#202020"
statusline_accent = "#303030"
statusline_fg = "#bbbbbb"
on_accent = "#121212"
mode_red = "#fa2573"
mode_green = "#98e123"
mode_yellow = "#dfd460"
mode_blue = "#1080d0"
mode_purple = "#8700ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
