# Builtin Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#bb0000"
palette_2 = "#00bb00"
palette_3 = "#bbbb00"
palette_4 = "#0000bb"
palette_5 = "#bb00bb"
palette_6 = "#00bbbb"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#2fd92f"
palette_11 = "#bfbf15"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#22cccc"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#bb0000"
orange = "#bb5e00"
yellow = "#bbbb00"
green = "#00bb00"
aqua = "#00bbbb"
blue = "#0000bb"
purple = "#bb00bb"
tint_green = "#d1f3d1"
tint_red = "#f3d1d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#bb0000"
mode_green = "#00bb00"
mode_yellow = "#bbbb00"
mode_blue = "#0000bb"
mode_purple = "#bb00bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
