# Soft Server
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#242626"
foreground = "#99a3a2"
cursor-color = "#d2e0de"
cursor-text = "#000000"
selection-background = "#7f8786"
selection-foreground = "#effffe"
palette_0 = "#000000"
palette_1 = "#a2686a"
palette_2 = "#9aa56a"
palette_3 = "#a3906a"
palette_4 = "#6b8fa3"
palette_5 = "#6a71a3"
palette_6 = "#6ba58f"
palette_7 = "#99a3a2"
palette_8 = "#666c6c"
palette_9 = "#dd5c60"
palette_10 = "#bfdf55"
palette_11 = "#deb360"
palette_12 = "#62b1df"
palette_13 = "#606edf"
palette_14 = "#64e39c"
palette_15 = "#d2e0de"

[roles]
bg = "#242626"
bg_deep = "#1b1c1c"
surface = "#323535"
fg = "#99a3a2"
fg_soft = "#767e7d"
fg_bright = "#d2e0de"
