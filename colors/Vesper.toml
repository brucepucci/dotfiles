# Vesper
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101010"
foreground = "#ffffff"
cursor-color = "#acb1ab"
cursor-text = "#ffffff"
selection-background = "#988049"
selection-foreground = "#b9beb8"
palette_0 = "#101010"
palette_1 = "#f5a191"
palette_2 = "#90b99f"
palette_3 = "#e6b99d"
palette_4 = "#aca1cf"
palette_5 = "#e29eca"
palette_6 = "#ea83a5"
palette_7 = "#a0a0a0"
palette_8 = "#7e7e7e"
palette_9 = "#ff8080"
palette_10 = "#99ffe4"
palette_11 = "#ffc799"
palette_12 = "#b9aeda"
palette_13 = "#ecaad6"
palette_14 = "#f591b2"
palette_15 = "#ffffff"

[roles]
bg = "#101010"
bg_deep = "#0c0c0c"
surface = "#2d2d2d"
fg = "#ffffff"
fg_soft = "#b7b7b7"
fg_bright = "#ffffff"
grey = "#939393"
grey_dim = "#646464"
grey_neutral = "#ababab"
grey_soft = "#7c7c7c"
red = "#f5a191"
orange = "#eead97"
yellow = "#e6b99d"
green = "#90b99f"
aqua = "#ea83a5"
blue = "#aca1cf"
purple = "#e29eca"
tint_green = "#272e2a"
tint_red = "#392a27"
statusline = "#232323"
statusline_accent = "#3b3b3b"
statusline_fg = "#ffffff"
on_accent = "#101010"
mode_red = "#f5a191"
mode_green = "#90b99f"
mode_yellow = "#e6b99d"
mode_blue = "#aca1cf"
mode_purple = "#e29eca"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
