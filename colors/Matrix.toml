# Matrix
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0f191c"
foreground = "#426644"
cursor-color = "#384545"
cursor-text = "#00ff00"
selection-background = "#18282e"
selection-foreground = "#00ff87"
palette_0 = "#0f191c"
palette_1 = "#23755a"
palette_2 = "#82d967"
palette_3 = "#ffd700"
palette_4 = "#3f5242"
palette_5 = "#409931"
palette_6 = "#50b45a"
palette_7 = "#507350"
palette_8 = "#688060"
palette_9 = "#2fc079"
palette_10 = "#90d762"
palette_11 = "#faff00"
palette_12 = "#4f7e7e"
palette_13 = "#11ff25"
palette_14 = "#c1ff8a"
palette_15 = "#678c61"

[roles]
bg = "#0f191c"
bg_deep = "#0b1315"
surface = "#152221"
fg = "#426644"
fg_soft = "#334f38"
fg_bright = "#678c61"
grey = "#2b4332"
