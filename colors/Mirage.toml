# Mirage
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b2738"
foreground = "#a6b2c0"
cursor-color = "#ddb3ff"
cursor-text = "#ffffff"
selection-background = "#273951"
selection-foreground = "#d3dbe5"
palette_0 = "#011627"
palette_1 = "#ff9999"
palette_2 = "#85cc95"
palette_3 = "#ffd700"
palette_4 = "#7fb5ff"
palette_5 = "#ddb3ff"
palette_6 = "#21c7a8"
palette_7 = "#ffffff"
palette_8 = "#575656"
palette_9 = "#ff9999"
palette_10 = "#85cc95"
palette_11 = "#ffd700"
palette_12 = "#7fb5ff"
palette_13 = "#ddb3ff"
palette_14 = "#85cc95"
palette_15 = "#ffffff"

[roles]
bg = "#1b2738"
bg_deep = "#141d2a"
surface = "#2c3848"
fg = "#a6b2c0"
fg_soft = "#7c8897"
fg_bright = "#ffffff"
grey = "#677383"
grey_dim = "#4c5868"
grey_neutral = "#758190"
grey_soft = "#5a6675"
red = "#ff9999"
orange = "#ffb84c"
yellow = "#ffd700"
green = "#85cc95"
aqua = "#21c7a8"
blue = "#7fb5ff"
purple = "#ddb3ff"
tint_green = "#2e4549"
tint_red = "#443c49"
statusline = "#263243"
statusline_accent = "#344050"
statusline_fg = "#a6b2c0"
on_accent = "#1b2738"
mode_red = "#ff9999"
mode_green = "#85cc95"
