# Liquid Carbon Transparent
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#afc2c2"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#7dbeff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff3030"
palette_2 = "#559a70"
palette_3 = "#ccac00"
palette_4 = "#0099cc"
palette_5 = "#cc69c8"
palette_6 = "#7ac4cc"
palette_7 = "#bccccc"
palette_8 = "#404040"
palette_9 = "#ff3030"
palette_10 = "#559a70"
palette_11 = "#ccac00"
palette_12 = "#0099cc"
palette_13 = "#cc69c8"
palette_14 = "#7ac4cc"
palette_15 = "#bccccc"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#151717"
fg = "#afc2c2"
fg_soft = "#7a8888"
fg_bright = "#bccccc"
grey = "#606b6b"
grey_dim = "#3d4444"
grey_neutral = "#727e7e"
grey_soft = "#4f5757"
red = "#ff3030"
orange = "#e66e18"
yellow = "#ccac00"
green = "#559a70"
aqua = "#7ac4cc"
blue = "#0099cc"
purple = "#cc69c8"
tint_green = "#0f1c14"
tint_red = "#2e0909"
statusline = "#0e1010"
