# Monokai Pro Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#faf4f2"
foreground = "#29242a"
cursor-color = "#706b6e"
cursor-text = "#a39ea1"
selection-background = "#bfb9ba"
selection-foreground = "#29242a"
palette_0 = "#faf4f2"
palette_1 = "#e14775"
palette_2 = "#269d69"
palette_3 = "#cc7a0a"
palette_4 = "#e16032"
palette_5 = "#7058be"
palette_6 = "#1c8ca8"
palette_7 = "#29242a"
palette_8 = "#a59fa0"
palette_9 = "#e14775"
palette_10 = "#269d69"
palette_11 = "#cc7a0a"
palette_12 = "#e16032"
palette_13 = "#7058be"
palette_14 = "#1c8ca8"
palette_15 = "#29242a"

[roles]
bg = "#faf4f2"
bg_deep = "#fbf7f5"
surface = "#e1dbda"
fg = "#29242a"
fg_soft = "#686266"
fg_bright = "#1b171b"
grey = "#878284"
grey_dim = "#b1abac"
grey_neutral = "#726d70"
