# GitLab Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fafaff"
foreground = "#303030"
cursor-color = "#303030"
cursor-text = "#565656"
selection-background = "#ad95e9"
selection-foreground = "#fafaff"
palette_0 = "#303030"
palette_1 = "#a31700"
palette_2 = "#0a7f3d"
palette_3 = "#af551d"
palette_4 = "#006cd8"
palette_5 = "#583cac"
palette_6 = "#00798a"
palette_7 = "#303030"
palette_8 = "#303030"
palette_9 = "#a31700"
palette_10 = "#0a7f3d"
palette_11 = "#af551d"
palette_12 = "#006cd8"
palette_13 = "#583cac"
palette_14 = "#00798a"
palette_15 = "#303030"

[roles]
bg = "#fafaff"
bg_deep = "#fbfbff"
surface = "#e2e2e6"
fg = "#303030"
fg_soft = "#6d6d6e"
fg_bright = "#1f1f1f"
grey = "#8b8b8d"
grey_dim = "#b3b3b7"
grey_neutral = "#777778"
grey_soft = "#9f9fa2"
red = "#a31700"
orange = "#a9360e"
yellow = "#af551d"
green = "#0a7f3d"
aqua = "#00798a"
blue = "#006cd8"
purple = "#583cac"
tint_green = "#cfe4dc"
tint_red = "#ead1d1"
statusline = "#eaeaee"
statusline_accent = "#d6d6da"
statusline_fg = "#303030"
on_accent = "#fafaff"
mode_red = "#a31700"
mode_green = "#0a7f3d"
mode_yellow = "#af551d"
mode_blue = "#006cd8"
mode_purple = "#583cac"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
