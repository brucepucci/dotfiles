# GitLab Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fafaff"
foreground = "#303030"
cursor-color = "#303030"
cursor-text = "#565656"
selection-background = "#ad95e9"
selection-foreground = "#fafaff"
palette_0 = "#fafaff"
palette_1 = "#fafaff"
palette_2 = "#fafaff"
palette_3 = "#fafaff"
palette_4 = "#fafaff"
palette_5 = "#fafaff"
palette_6 = "#fafaff"
palette_7 = "#fafaff"
palette_8 = "#fafaff"
palette_9 = "#fafaff"
palette_10 = "#fafaff"
palette_11 = "#fafaff"
palette_12 = "#fafaff"
palette_13 = "#fafaff"
palette_14 = "#fafaff"
palette_15 = "#fafaff"

[roles]
bg = "#fafaff"
bg_deep = "#fbfbff"
surface = "#e2e2e6"
fg = "#303030"
fg_soft = "#6d6d6e"
fg_bright = "#1f1f1f"
grey = "#8b8b8d"
grey_dim = "#b3b3b7"
grey_neutral = "#777778"
grey_soft = "#9f9fa2"
red = "#fafaff"
orange = "#fafaff"
yellow = "#fafaff"
green = "#fafaff"
aqua = "#fafaff"
blue = "#fafaff"
purple = "#fafaff"
tint_green = "#fafaff"
tint_red = "#fafaff"
statusline = "#eaeaee"
statusline_accent = "#d6d6da"
statusline_fg = "#303030"
on_accent = "#303030"
mode_red = "#fafaff"
mode_green = "#fafaff"
mode_yellow = "#fafaff"
mode_blue = "#fafaff"
mode_purple = "#fafaff"

[apps]
