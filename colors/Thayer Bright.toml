# Thayer Bright
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1d1e"
foreground = "#f8f8f8"
cursor-color = "#fc971f"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#1b1d1e"
palette_1 = "#f92672"
palette_2 = "#4df840"
palette_3 = "#f4fd22"
palette_4 = "#2757d6"
palette_5 = "#8c54fe"
palette_6 = "#38c8b5"
palette_7 = "#ccccc6"
palette_8 = "#505354"
palette_9 = "#ff5995"
palette_10 = "#b6e354"
palette_11 = "#feed6c"
palette_12 = "#3f78ff"
palette_13 = "#9e6ffe"
palette_14 = "#23cfd5"
palette_15 = "#f8f8f2"

[roles]
bg = "#1b1d1e"
bg_deep = "#141616"
surface = "#363738"
fg = "#f8f8f8"
fg_soft = "#b6b6b7"
fg_bright = "#f8f8f2"
grey = "#959596"
grey_dim = "#686a6a"
grey_neutral = "#ababac"
grey_soft = "#7e8080"
red = "#f92672"
orange = "#f6924a"
yellow = "#f4fd22"
green = "#4df840"
aqua = "#38c8b5"
blue = "#2757d6"
purple = "#8c54fe"
tint_green = "#244424"
tint_red = "#431f2d"
statusline = "#2d2f2f"
statusline_accent = "#434445"
statusline_fg = "#f8f8f8"
on_accent = "#1b1d1e"
mode_red = "#f92672"
mode_green = "#4df840"
mode_yellow = "#f4fd22"
mode_blue = "#2757d6"
mode_purple = "#8c54fe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
