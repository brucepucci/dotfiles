# One Half Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fafafa"
foreground = "#383a42"
cursor-color = "#a5b4e5"
cursor-text = "#383a42"
selection-background = "#bfceff"
selection-foreground = "#383a42"
palette_0 = "#383a42"
palette_1 = "#e45649"
palette_2 = "#50a14f"
palette_3 = "#c18401"
palette_4 = "#0184bc"
palette_5 = "#a626a4"
palette_6 = "#0997b3"
palette_7 = "#bababa"
palette_8 = "#4f525e"
palette_9 = "#e06c75"
palette_10 = "#98c379"
palette_11 = "#d8b36e"
palette_12 = "#61afef"
palette_13 = "#c678dd"
palette_14 = "#56b6c2"
palette_15 = "#ffffff"

[roles]
bg = "#fafafa"
bg_deep = "#fbfbfb"
surface = "#e3e3e4"
fg = "#383a42"
fg_soft = "#727479"
fg_bright = "#24262b"
grey = "#8f9095"
grey_dim = "#b6b7ba"
grey_neutral = "#7c7d82"
grey_soft = "#a3a4a7"
red = "#e45649"
orange = "#d26d25"
yellow = "#c18401"
green = "#50a14f"
aqua = "#0997b3"
blue = "#0184bc"
purple = "#a626a4"
tint_green = "#dbeadb"
tint_red = "#f6dcda"
statusline = "#eaebeb"
statusline_accent = "#d7d7d9"
statusline_fg = "#383a42"
on_accent = "#fafafa"
mode_red = "#e45649"
mode_green = "#50a14f"
mode_yellow = "#c18401"
mode_blue = "#0184bc"
