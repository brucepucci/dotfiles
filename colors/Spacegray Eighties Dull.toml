# Spacegray Eighties Dull
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#c9c6bc"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#272e36"
selection-foreground = "#ffffff"
palette_0 = "#15171c"
palette_1 = "#b24a56"
palette_2 = "#92b477"
palette_3 = "#c6735a"
palette_4 = "#7c8fa5"
palette_5 = "#a5789e"
palette_6 = "#80cdcb"
palette_7 = "#b3b8c3"
palette_8 = "#555555"
palette_9 = "#ec5f67"
palette_10 = "#89e986"
palette_11 = "#fec254"
palette_12 = "#5486c0"
palette_13 = "#bf83c1"
palette_14 = "#58c2c1"
palette_15 = "#ffffff"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#363634"
fg = "#c9c6bc"
fg_soft = "#97958e"
fg_bright = "#ffffff"
grey = "#7e7c77"
grey_dim = "#5c5b58"
grey_neutral = "#8f8d86"
grey_soft = "#6d6c67"
red = "#b24a56"
orange = "#bc5e58"
yellow = "#c6735a"
green = "#92b477"
aqua = "#80cdcb"
blue = "#7c8fa5"
purple = "#a5789e"
tint_green = "#363c31"
tint_red = "#3c292b"
statusline = "#2f2f2e"
