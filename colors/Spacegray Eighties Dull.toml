# Spacegray Eighties Dull
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#c9c6bc"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#272e36"
selection-foreground = "#ffffff"
palette_0 = "#222222"
palette_1 = "#222222"
palette_2 = "#222222"
palette_3 = "#222222"
palette_4 = "#222222"
palette_5 = "#222222"
palette_6 = "#222222"
palette_7 = "#222222"
palette_8 = "#222222"
palette_9 = "#222222"
palette_10 = "#222222"
palette_11 = "#222222"
palette_12 = "#222222"
palette_13 = "#222222"
palette_14 = "#222222"
palette_15 = "#222222"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#363634"
fg = "#c9c6bc"
fg_soft = "#97958e"
fg_bright = "#222222"
grey = "#7e7c77"
grey_dim = "#5c5b58"
grey_neutral = "#8f8d86"
grey_soft = "#6d6c67"
red = "#222222"
orange = "#222222"
yellow = "#222222"
green = "#222222"
aqua = "#222222"
blue = "#222222"
purple = "#222222"
tint_green = "#222222"
