# IRIX Console
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0c0c0c"
foreground = "#f2f2f2"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#c2deff"
selection-foreground = "#000000"
palette_0 = "#1a1919"
palette_1 = "#d42426"
palette_2 = "#37a327"
palette_3 = "#c29d28"
palette_4 = "#0739e2"
palette_5 = "#911f9c"
palette_6 = "#4497df"
palette_7 = "#cccccc"
palette_8 = "#767676"
palette_9 = "#f34f59"
palette_10 = "#45c731"
palette_11 = "#f9f2a7"
palette_12 = "#4079ff"
palette_13 = "#c31ba2"
palette_14 = "#6ed7d7"
palette_15 = "#f2f2f2"

[roles]
bg = "#0c0c0c"
bg_deep = "#090909"
surface = "#282828"
fg = "#f2f2f2"
fg_soft = "#adadad"
fg_bright = "#f2f2f2"
grey = "#8a8a8a"
grey_dim = "#5c5c5c"
grey_neutral = "#a2a2a2"
grey_soft = "#737373"
red = "#d42426"
orange = "#cb6027"
yellow = "#c29d28"
green = "#37a327"
aqua = "#4497df"
blue = "#0739e2"
purple = "#911f9c"
tint_green = "#142711"
tint_red = "#301011"
statusline = "#1e1e1e"
statusline_accent = "#353535"
statusline_fg = "#f2f2f2"
on_accent = "#f2f2f2"
mode_red = "#d42426"
mode_green = "#37a327"
mode_yellow = "#c29d28"
mode_blue = "#0739e2"
mode_purple = "#911f9c"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
