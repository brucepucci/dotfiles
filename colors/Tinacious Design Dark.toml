# Tinacious Design Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1d26"
foreground = "#cbcbf0"
cursor-color = "#cbcbf0"
cursor-text = "#999999"
selection-background = "#ff3399"
selection-foreground = "#ffffff"
palette_0 = "#1d1d26"
palette_1 = "#ff3399"
palette_2 = "#00d364"
palette_3 = "#ffcc66"
palette_4 = "#00cbff"
palette_5 = "#cc66ff"
palette_6 = "#00ceca"
palette_7 = "#cbcbf0"
palette_8 = "#636667"
palette_9 = "#ff2f92"
palette_10 = "#00d364"
palette_11 = "#ffd479"
palette_12 = "#00cbff"
palette_13 = "#d783ff"
palette_14 = "#00d5d4"
palette_15 = "#d5d6f3"

[roles]
bg = "#1d1d26"
bg_deep = "#16161c"
surface = "#32323e"
fg = "#cbcbf0"
fg_soft = "#9797b3"
fg_bright = "#d5d6f3"
grey = "#7d7d95"
grey_dim = "#5a5a6d"
grey_neutral = "#8e8ea9"
grey_soft = "#6b6b81"
red = "#ff3399"
orange = "#ff8080"
yellow = "#ffcc66"
green = "#00d364"
aqua = "#00ceca"
blue = "#00cbff"
purple = "#cc66ff"
tint_green = "#183e31"
tint_red = "#46213b"
statusline = "#2b2b36"
statusline_accent = "#3c3c4a"
statusline_fg = "#cbcbf0"
on_accent = "#1d1d26"
mode_red = "#ff3399"
mode_green = "#00d364"
mode_yellow = "#ffcc66"
mode_blue = "#00cbff"
mode_purple = "#cc66ff"

[apps]
