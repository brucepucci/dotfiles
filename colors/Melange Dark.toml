palette_2 = "#78997a"
palette_3 = "#e49b5d"
palette_4 = "#7f91b2"
palette_5 = "#b380b0"
palette_6 = "#7b9695"
palette_7 = "#c1a78e"
palette_8 = "#867462"
palette_9 = "#d47766"
palette_10 = "#85b695"
palette_11 = "#ebc06d"
palette_12 = "#a3a9ce"
palette_13 = "#cf9bc2"
palette_14 = "#89b3b6"
palette_15 = "#ece1d7"

[roles]
