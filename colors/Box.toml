# Box
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141d2b"
foreground = "#9fef00"
cursor-color = "#9fef00"
cursor-text = "#111111"
selection-background = "#a4b1cd"
selection-foreground = "#141d2b"
palette_0 = "#000000"
palette_1 = "#cc0403"
palette_2 = "#19cb00"
palette_3 = "#cecb00"
palette_4 = "#0d73cc"
palette_5 = "#cb1ed1"
palette_6 = "#0dcdcd"
palette_7 = "#dddddd"
palette_8 = "#767676"
palette_9 = "#f2201f"
palette_10 = "#23fd00"
palette_11 = "#fffd00"
palette_12 = "#1a8fff"
palette_13 = "#fd28ff"
palette_14 = "#14ffff"
palette_15 = "#ffffff"

[roles]
bg = "#141d2b"
bg_deep = "#0f1620"
surface = "#253626"
fg = "#9fef00"
fg_soft = "#75b00d"
fg_bright = "#ffffff"
grey = "#609013"
grey_dim = "#45661c"
grey_neutral = "#6ea60f"
grey_soft = "#537b18"
red = "#cc0403"
orange = "#cd6802"
yellow = "#cecb00"
green = "#19cb00"
aqua = "#0dcdcd"
blue = "#0d73cc"
purple = "#cb1ed1"
tint_green = "#153c23"
tint_red = "#351824"
statusline = "#1f2e28"
statusline_accent = "#2d4323"
statusline_fg = "#9fef00"
on_accent = "#9fef00"
mode_red = "#cc0403"
mode_green = "#19cb00"
mode_yellow = "#cecb00"
mode_blue = "#0d73cc"
mode_purple = "#cb1ed1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
