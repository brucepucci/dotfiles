# Grass
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#13773d"
foreground = "#fff0a5"
cursor-color = "#d9744c"
cursor-text = "#ffffff"
selection-background = "#b64926"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ff5959"
palette_2 = "#00bb00"
palette_3 = "#e7b000"
palette_4 = "#0000a3"
palette_5 = "#ee59bb"
palette_6 = "#00bbbb"
palette_7 = "#bbbbbb"
palette_8 = "#959595"
palette_9 = "#ff5959"
palette_10 = "#00bb00"
palette_11 = "#e7b000"
palette_12 = "#0000bb"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#13773d"
bg_deep = "#0e592e"
surface = "#2f8649"
fg = "#fff0a5"
fg_soft = "#b8cc86"
fg_bright = "#ffffff"
grey = "#95ba76"
grey_dim = "#66a161"
grey_neutral = "#acc681"
grey_soft = "#7dad6c"
red = "#ff5959"
orange = "#f3842c"
yellow = "#e7b000"
green = "#00bb00"
aqua = "#00bbbb"
blue = "#0000a3"
purple = "#ee59bb"
tint_green = "#108332"
tint_red = "#3d7242"
statusline = "#268145"
statusline_accent = "#3d8d50"
statusline_fg = "#fff0a5"
on_accent = "#fff0a5"
mode_red = "#ff5959"
mode_green = "#00bb00"
mode_yellow = "#e7b000"
mode_blue = "#0000a3"
mode_purple = "#ee59bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
