# Brogrammer
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#131313"
foreground = "#d6dbe5"
cursor-color = "#b9b9b9"
cursor-text = "#101010"
selection-background = "#1f1f1f"
selection-foreground = "#d6dbe5"
palette_0 = "#1f1f1f"
palette_1 = "#f81118"
palette_2 = "#2dc55e"
palette_3 = "#ecba0f"
palette_4 = "#2a84d2"
palette_5 = "#4e5ab7"
palette_6 = "#1081d6"
palette_7 = "#d6dbe5"
palette_8 = "#d6dbe5"
palette_9 = "#de352e"
palette_10 = "#1dd361"
palette_11 = "#f3bd09"
palette_12 = "#1081d6"
palette_13 = "#5350b9"
palette_14 = "#0f7ddb"
palette_15 = "#ffffff"

[roles]
bg = "#131313"
bg_deep = "#0e0e0e"
surface = "#2a2b2c"
fg = "#d6dbe5"
fg_soft = "#9c9fa6"
fg_bright = "#ffffff"
grey = "#7e8186"
grey_dim = "#57595c"
grey_neutral = "#92959c"
grey_soft = "#6b6d71"
red = "#f81118"
orange = "#f26614"
yellow = "#ecba0f"
green = "#2dc55e"
aqua = "#1081d6"
blue = "#2a84d2"
purple = "#4e5ab7"
tint_green = "#183320"
tint_red = "#3c1314"
statusline = "#232324"
statusline_accent = "#363739"
statusline_fg = "#d6dbe5"
on_accent = "#131313"
mode_red = "#f81118"
mode_green = "#2dc55e"
mode_yellow = "#ecba0f"
mode_blue = "#2a84d2"
mode_purple = "#4e5ab7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
