# Adventure
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#040404"
foreground = "#feffff"
cursor-color = "#feffff"
cursor-text = "#000000"
selection-background = "#606060"
selection-foreground = "#ffffff"
palette_0 = "#040404"
palette_1 = "#d84a33"
palette_2 = "#5da602"
palette_3 = "#eebb6e"
palette_4 = "#417ab3"
palette_5 = "#e5c499"
palette_6 = "#bdcfe5"
palette_7 = "#dbded8"
palette_8 = "#685656"
palette_9 = "#d76b42"
palette_10 = "#99b52c"
palette_11 = "#ffb670"
palette_12 = "#97d7ef"
palette_13 = "#aa7900"
palette_14 = "#bdcfe5"
palette_15 = "#e4d5c7"

[roles]
bg = "#040404"
bg_deep = "#030303"
surface = "#222222"
fg = "#feffff"
fg_soft = "#b3b4b4"
fg_bright = "#e4d5c7"
grey = "#8e8e8e"
grey_dim = "#5c5c5c"
grey_neutral = "#a6a7a7"
grey_soft = "#747575"
red = "#d84a33"
orange = "#e38250"
yellow = "#eebb6e"
green = "#5da602"
aqua = "#bdcfe5"
blue = "#417ab3"
purple = "#e5c499"
