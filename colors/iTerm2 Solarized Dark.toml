# iTerm2 Solarized Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002b36"
foreground = "#839496"
cursor-color = "#839496"
cursor-text = "#073642"
selection-background = "#073642"
selection-foreground = "#93a1a1"
palette_0 = "#073642"
palette_1 = "#dc322f"
palette_2 = "#859900"
palette_3 = "#b58900"
palette_4 = "#268bd2"
palette_5 = "#d33682"
palette_6 = "#2aa198"
palette_7 = "#eee8d5"
palette_8 = "#335e69"
palette_9 = "#cb4b16"
palette_10 = "#586e75"
palette_11 = "#657b83"
palette_12 = "#839496"
palette_13 = "#6c71c4"
palette_14 = "#93a1a1"
palette_15 = "#fdf6e3"

[roles]
bg = "#002b36"
bg_deep = "#002028"
surface = "#103842"
fg = "#839496"
fg_soft = "#5c7479"
fg_bright = "#fdf6e3"
grey = "#48656b"
grey_dim = "#2e5058"
grey_neutral = "#556f74"
grey_soft = "#3b5a61"
red = "#dc322f"
orange = "#c85e18"
yellow = "#b58900"
green = "#859900"
aqua = "#2aa198"
blue = "#268bd2"
purple = "#d33682"
tint_green = "#183f2c"
tint_red = "#282c35"
statusline = "#0a333e"
