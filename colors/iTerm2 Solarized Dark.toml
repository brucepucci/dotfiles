# iTerm2 Solarized Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002b36"
foreground = "#839496"
cursor-color = "#839496"
cursor-text = "#073642"
selection-background = "#073642"
selection-foreground = "#93a1a1"
palette_0 = "#002b36"
palette_1 = "#002b36"
palette_2 = "#002b36"
palette_3 = "#002b36"
palette_4 = "#002b36"
palette_5 = "#002b36"
palette_6 = "#002b36"
palette_7 = "#002b36"
palette_8 = "#002b36"
palette_9 = "#002b36"
palette_10 = "#002b36"
palette_11 = "#002b36"
palette_12 = "#002b36"
palette_13 = "#002b36"
palette_14 = "#002b36"
palette_15 = "#002b36"

[roles]
bg = "#002b36"
bg_deep = "#002028"
surface = "#103842"
fg = "#839496"
fg_soft = "#5c7479"
fg_bright = "#002b36"
grey = "#48656b"
grey_dim = "#2e5058"
grey_neutral = "#556f74"
grey_soft = "#3b5a61"
red = "#002b36"
orange = "#002b36"
yellow = "#002b36"
green = "#002b36"
aqua = "#002b36"
blue = "#002b36"
purple = "#002b36"
