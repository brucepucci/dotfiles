# Jackie Brown
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c1d16"
foreground = "#ffcc2f"
cursor-color = "#23ff18"
cursor-text = "#ff0018"
selection-background = "#af8d21"
selection-foreground = "#ffffff"
palette_0 = "#2c1d16"
palette_1 = "#ef5734"
palette_2 = "#2baf2b"
palette_3 = "#bebf00"
palette_4 = "#246eb2"
palette_5 = "#d05ec1"
palette_6 = "#00acee"
palette_7 = "#bfbfbf"
palette_8 = "#666666"
palette_9 = "#e50000"
palette_10 = "#86a93e"
palette_11 = "#e5e500"
palette_12 = "#0000ff"
palette_13 = "#e500e5"
palette_14 = "#00e5e5"
palette_15 = "#e5e5e5"

[roles]
bg = "#2c1d16"
bg_deep = "#211610"
surface = "#453219"
fg = "#ffcc2f"
fg_soft = "#c09828"
fg_bright = "#e5e5e5"
grey = "#a07d24"
grey_dim = "#765a1f"
grey_neutral = "#b58f26"
grey_soft = "#8b6c21"
red = "#ef5734"
orange = "#d68b1a"
yellow = "#bebf00"
green = "#2baf2b"
aqua = "#00acee"
blue = "#246eb2"
purple = "#d05ec1"
tint_green = "#2c371a"
tint_red = "#4f271b"
statusline = "#3d2b18"
statusline_accent = "#523c1a"
statusline_fg = "#ffcc2f"
on_accent = "#2c1d16"
mode_red = "#ef5734"
mode_green = "#2baf2b"
mode_yellow = "#bebf00"
mode_blue = "#246eb2"
