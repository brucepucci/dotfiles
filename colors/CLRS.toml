# CLRS
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#262626"
cursor-color = "#62c6ef"
cursor-text = "#ffffff"
selection-background = "#6fd3fc"
selection-foreground = "#041730"
palette_0 = "#000000"
palette_1 = "#f8282a"
palette_2 = "#328a5d"
palette_3 = "#fa701d"
palette_4 = "#135cd0"
palette_5 = "#9f00bd"
palette_6 = "#33c3c1"
palette_7 = "#b3b3b3"
palette_8 = "#555753"
palette_9 = "#fb0416"
palette_10 = "#2cc631"
palette_11 = "#e3bd0e"
palette_12 = "#1670ff"
palette_13 = "#e900b0"
palette_14 = "#3ad5ce"
palette_15 = "#eeeeec"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e5e5e5"
fg = "#262626"
fg_soft = "#676767"
fg_bright = "#191919"
grey = "#888888"
grey_dim = "#b3b3b3"
grey_neutral = "#727272"
grey_soft = "#9d9d9d"
red = "#f8282a"
orange = "#f94c24"
yellow = "#fa701d"
green = "#328a5d"
aqua = "#33c3c1"
blue = "#135cd0"
purple = "#9f00bd"
tint_green = "#daeae2"
tint_red = "#fed8d9"
statusline = "#eeeeee"
statusline_accent = "#d8d8d8"
statusline_fg = "#262626"
on_accent = "#ffffff"
mode_red = "#f8282a"
mode_green = "#328a5d"
