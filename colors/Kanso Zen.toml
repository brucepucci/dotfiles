palette_6 = "#8ea4a2"
palette_7 = "#c8c093"
palette_8 = "#a4a7a4"
palette_9 = "#e46876"
palette_10 = "#87a987"
palette_11 = "#e6c384"
palette_12 = "#7fb4ca"
palette_13 = "#938aa9"
palette_14 = "#7aa89f"
palette_15 = "#c5c9c7"

[roles]
