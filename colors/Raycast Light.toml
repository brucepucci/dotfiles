# Raycast Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#404040"
selection-background = "#e5e5e5"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#b12424"
palette_2 = "#006b4f"
palette_3 = "#f8a300"
palette_4 = "#138af2"
palette_5 = "#9a1b6e"
palette_6 = "#3eb8bf"
palette_7 = "#bfbfbf"
palette_8 = "#000000"
palette_9 = "#b12424"
palette_10 = "#006b4f"
palette_11 = "#f8a300"
palette_12 = "#138af2"
palette_13 = "#9a1b6e"
palette_14 = "#3eb8bf"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#b12424"
orange = "#d46412"
yellow = "#f8a300"
green = "#006b4f"
aqua = "#3eb8bf"
blue = "#138af2"
purple = "#9a1b6e"
tint_green = "#d1e4df"
tint_red = "#f1d8d8"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#b12424"
mode_green = "#006b4f"
mode_yellow = "#f8a300"
mode_blue = "#138af2"
mode_purple = "#9a1b6e"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
