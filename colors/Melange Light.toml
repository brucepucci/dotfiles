# Melange Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f1f1f1"
foreground = "#54433a"
cursor-color = "#54433a"
cursor-text = "#f1f1f1"
selection-background = "#54433a"
selection-foreground = "#d9d3ce"
palette_0 = "#e9e1db"
palette_1 = "#c77b8b"
palette_2 = "#6e9b72"
palette_3 = "#bc5c00"
palette_4 = "#7892bd"
palette_5 = "#be79bb"
palette_6 = "#739797"
palette_7 = "#7d6658"
palette_8 = "#a98a78"
palette_9 = "#bf0021"
palette_10 = "#3a684a"
palette_11 = "#a06d00"
palette_12 = "#465aa4"
palette_13 = "#904180"
palette_14 = "#3d6568"
palette_15 = "#54433a"

[roles]
bg = "#f1f1f1"
bg_deep = "#f4f4f4"
surface = "#dedcdb"
fg = "#54433a"
fg_soft = "#837771"
fg_bright = "#372c26"
grey = "#9b918c"
grey_dim = "#bab4b1"
grey_neutral = "#8b807a"
grey_soft = "#aaa39f"
red = "#c77b8b"
orange = "#c26c46"
yellow = "#bc5c00"
green = "#6e9b72"
aqua = "#739797"
blue = "#7892bd"
purple = "#be79bb"
tint_green = "#d9e2da"
tint_red = "#e9dcdf"
statusline = "#e4e3e2"
statusline_accent = "#d5d2d0"
statusline_fg = "#54433a"
on_accent = "#f1f1f1"
mode_red = "#c77b8b"
mode_green = "#6e9b72"
mode_yellow = "#bc5c00"
mode_blue = "#7892bd"
