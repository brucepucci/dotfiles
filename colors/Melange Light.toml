palette_2 = "#f1f1f1"
palette_3 = "#f1f1f1"
palette_4 = "#f1f1f1"
palette_5 = "#f1f1f1"
palette_6 = "#f1f1f1"
palette_7 = "#f1f1f1"
palette_8 = "#f1f1f1"
palette_9 = "#f1f1f1"
palette_10 = "#f1f1f1"
palette_11 = "#f1f1f1"
palette_12 = "#f1f1f1"
palette_13 = "#f1f1f1"
palette_14 = "#f1f1f1"
palette_15 = "#f1f1f1"

[roles]
bg = "#f1f1f1"
bg_deep = "#f4f4f4"
