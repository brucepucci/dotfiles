# Duskfox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#232136"
foreground = "#e0def4"
cursor-color = "#e0def4"
cursor-text = "#232136"
selection-background = "#433c59"
selection-foreground = "#e0def4"
palette_0 = "#393552"
palette_1 = "#eb6f92"
palette_2 = "#a3be8c"
palette_3 = "#f6c177"
palette_4 = "#569fba"
palette_5 = "#c4a7e7"
palette_6 = "#9ccfd8"
palette_7 = "#e0def4"
palette_8 = "#544d8a"
palette_9 = "#f083a2"
palette_10 = "#b1d196"
palette_11 = "#f9cb8c"
palette_12 = "#65b1cd"
palette_13 = "#ccb1ed"
palette_14 = "#a6dae3"
palette_15 = "#e2e0f7"

[roles]
bg = "#232136"
bg_deep = "#1a1928"
surface = "#3a384d"
fg = "#e0def4"
fg_soft = "#a7a5bb"
fg_bright = "#e2e0f7"
grey = "#8b899e"
grey_dim = "#656378"
grey_neutral = "#9e9cb2"
grey_soft = "#78768c"
red = "#eb6f92"
orange = "#f09884"
yellow = "#f6c177"
green = "#a3be8c"
aqua = "#9ccfd8"
blue = "#569fba"
purple = "#c4a7e7"
tint_green = "#3a3d45"
tint_red = "#472f47"
statusline = "#323045"
