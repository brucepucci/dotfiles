# Blue Dolphin
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#006984"
foreground = "#c5f2ff"
cursor-color = "#ffcc00"
cursor-text = "#292d3e"
selection-background = "#2baeca"
selection-foreground = "#eceff1"
palette_0 = "#292d3e"
palette_1 = "#ff8288"
palette_2 = "#b4e88d"
palette_3 = "#f4d69f"
palette_4 = "#82aaff"
palette_5 = "#e9c1ff"
palette_6 = "#89ebff"
palette_7 = "#d0d0d0"
palette_8 = "#9094a4"
palette_9 = "#ff8b92"
palette_10 = "#ddffa7"
palette_11 = "#ffe585"
palette_12 = "#9cc4ff"
palette_13 = "#ddb0f6"
palette_14 = "#a3f7ff"
palette_15 = "#ffffff"

[roles]
bg = "#006984"
bg_deep = "#004f63"
surface = "#187993"
fg = "#c5f2ff"
fg_soft = "#8ac9da"
fg_bright = "#ffffff"
grey = "#6cb4c8"
grey_dim = "#4599af"
grey_neutral = "#80c2d4"
grey_soft = "#59a7bb"
red = "#ff8288"
orange = "#faac94"
yellow = "#f4d69f"
green = "#b4e88d"
aqua = "#89ebff"
blue = "#82aaff"
purple = "#e9c1ff"
tint_green = "#208086"
tint_red = "#2e6e85"
statusline = "#10748e"
statusline_accent = "#23829a"
statusline_fg = "#c5f2ff"
on_accent = "#006984"
mode_red = "#ff8288"
mode_green = "#b4e88d"
mode_yellow = "#f4d69f"
mode_blue = "#82aaff"
mode_purple = "#e9c1ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
