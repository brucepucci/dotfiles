# Flatland
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1f21"
foreground = "#b8dbef"
cursor-color = "#708284"
cursor-text = "#002831"
selection-background = "#2b2a24"
selection-foreground = "#ffffff"
palette_0 = "#1d1d19"
palette_1 = "#f18339"
palette_2 = "#9fd364"
palette_3 = "#f4ef6d"
palette_4 = "#5096be"
palette_5 = "#695abc"
palette_6 = "#d63865"
palette_7 = "#ffffff"
palette_8 = "#50504c"
palette_9 = "#d22a24"
palette_10 = "#a7d42c"
palette_11 = "#ff8949"
palette_12 = "#61b9d0"
palette_13 = "#695abc"
palette_14 = "#d63865"
palette_15 = "#ffffff"

[roles]
bg = "#1d1f21"
bg_deep = "#161719"
surface = "#30363a"
fg = "#b8dbef"
fg_soft = "#8aa3b1"
fg_bright = "#ffffff"
grey = "#728692"
grey_dim = "#536169"
grey_neutral = "#8299a7"
grey_soft = "#63747e"
red = "#f18339"
orange = "#f2b953"
yellow = "#f4ef6d"
green = "#9fd364"
aqua = "#d63865"
blue = "#5096be"
purple = "#695abc"
tint_green = "#343f2d"
tint_red = "#433125"
statusline = "#292e31"
statusline_accent = "#394146"
statusline_fg = "#b8dbef"
on_accent = "#1d1f21"
mode_red = "#f18339"
mode_green = "#9fd364"
