palette_2 = "#0000a4"
palette_3 = "#0000a4"
palette_4 = "#0000a4"
palette_5 = "#0000a4"
palette_6 = "#0000a4"
palette_7 = "#0000a4"
palette_8 = "#0000a4"
palette_9 = "#0000a4"
palette_10 = "#0000a4"
palette_11 = "#0000a4"
palette_12 = "#0000a4"
palette_13 = "#0000a4"
palette_14 = "#0000a4"
palette_15 = "#0000a4"

[roles]
