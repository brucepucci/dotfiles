# Borland
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0000a4"
foreground = "#ffff4e"
cursor-color = "#ffa560"
cursor-text = "#ffffff"
selection-background = "#a4a4a4"
selection-foreground = "#0000a4"
palette_0 = "#4f4f4f"
palette_1 = "#ff6c60"
palette_2 = "#a8ff60"
palette_3 = "#ffffb6"
palette_4 = "#96cbfe"
palette_5 = "#ff73fd"
palette_6 = "#c6c5fe"
palette_7 = "#eeeeee"
palette_8 = "#7c7c7c"
palette_9 = "#ffb6b0"
palette_10 = "#ceffac"
palette_11 = "#ffffcc"
palette_12 = "#b5dcff"
palette_13 = "#ff9cfe"
palette_14 = "#dfdffe"
palette_15 = "#ffffff"

[roles]
bg = "#0000a4"
bg_deep = "#00007b"
surface = "#1f1f9a"
fg = "#ffff4e"
fg_soft = "#b2b268"
fg_bright = "#ffffff"
grey = "#8c8c75"
grey_dim = "#595986"
grey_neutral = "#a6a66c"
grey_soft = "#73737d"
red = "#ff6c60"
orange = "#ffb68b"
yellow = "#ffffb6"
green = "#a8ff60"
aqua = "#c6c5fe"
blue = "#96cbfe"
purple = "#ff73fd"
tint_green = "#1e2e98"
tint_red = "#2e1398"
statusline = "#14149d"
statusline_accent = "#2e2e95"
statusline_fg = "#ffff4e"
on_accent = "#0000a4"
mode_red = "#ff6c60"
mode_green = "#a8ff60"
mode_yellow = "#ffffb6"
mode_blue = "#96cbfe"
