# Slate
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#35b1d2"
cursor-color = "#87d3c4"
cursor-text = "#323232"
selection-background = "#0f3754"
selection-foreground = "#2dffc0"
palette_0 = "#222222"
palette_1 = "#e2a8bf"
palette_2 = "#81d778"
palette_3 = "#c4c9c0"
palette_4 = "#335856"
palette_5 = "#a481d3"
palette_6 = "#15ab9c"
palette_7 = "#02c5e0"
palette_8 = "#ffffff"
palette_9 = "#ffcdd9"
palette_10 = "#beffa8"
palette_11 = "#d0ccca"
palette_12 = "#7ab0d2"
palette_13 = "#c5a7d9"
palette_14 = "#8cdfe0"
palette_15 = "#e0e0e0"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#243337"
fg = "#35b1d2"
fg_soft = "#2f869d"
fg_bright = "#e0e0e0"
grey = "#2c7183"
grey_dim = "#295460"
grey_neutral = "#2e7f94"
grey_soft = "#2b6271"
red = "#e2a8bf"
orange = "#d3b8c0"
yellow = "#c4c9c0"
green = "#81d778"
aqua = "#15ab9c"
blue = "#335856"
purple = "#a481d3"
tint_green = "#334331"
