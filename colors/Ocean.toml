# Ocean
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#224fbc"
foreground = "#ffffff"
cursor-color = "#7f7f7f"
cursor-text = "#ffffff"
selection-background = "#216dff"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#e64c4c"
palette_2 = "#00a600"
palette_3 = "#999900"
palette_4 = "#0000b2"
palette_5 = "#d826d8"
palette_6 = "#00a6b2"
palette_7 = "#bfbfbf"
palette_8 = "#808080"
palette_9 = "#ff1a1a"
palette_10 = "#00d900"
palette_11 = "#e5e500"
palette_12 = "#7373ff"
palette_13 = "#e500e5"
palette_14 = "#00e5e5"
palette_15 = "#e5e5e5"

[roles]
bg = "#224fbc"
bg_deep = "#1a3b8d"
surface = "#3d64c4"
fg = "#ffffff"
fg_soft = "#bdcaeb"
fg_bright = "#e5e5e5"
grey = "#9cb0e1"
grey_dim = "#6f8dd3"
grey_neutral = "#b2c1e8"
grey_soft = "#859eda"
red = "#e64c4c"
orange = "#c07226"
yellow = "#999900"
green = "#00a600"
aqua = "#00a6b2"
blue = "#0000b2"
purple = "#d826d8"
tint_green = "#1c5f9a"
tint_red = "#454ea8"
statusline = "#345dc1"
statusline_accent = "#4a6fc8"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#e64c4c"
mode_green = "#00a600"
mode_yellow = "#999900"
mode_blue = "#0000b2"
mode_purple = "#d826d8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
