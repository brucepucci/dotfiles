# Doom Peacock
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2b2a27"
foreground = "#ede0ce"
cursor-color = "#9c9c9d"
cursor-text = "#36312b"
selection-background = "#a60033"
selection-foreground = "#ffffff"
palette_0 = "#1c1f24"
palette_1 = "#cb4b16"
palette_2 = "#26a6a6"
palette_3 = "#bcd42a"
palette_4 = "#2a6cc6"
palette_5 = "#a9a1e1"
palette_6 = "#5699af"
palette_7 = "#ede0ce"
palette_8 = "#51504d"
palette_9 = "#ff5d38"
palette_10 = "#98be65"
palette_11 = "#e6f972"
palette_12 = "#51afef"
palette_13 = "#c678dd"
palette_14 = "#46d9ff"
palette_15 = "#dfdfdf"

[roles]
bg = "#2b2a27"
bg_deep = "#20201d"
surface = "#42403b"
fg = "#ede0ce"
fg_soft = "#b3a99c"
fg_bright = "#dfdfdf"
grey = "#968e83"
grey_dim = "#6f6a61"
grey_neutral = "#a9a094"
grey_soft = "#827c72"
red = "#cb4b16"
orange = "#c49020"
yellow = "#bcd42a"
green = "#26a6a6"
aqua = "#5699af"
blue = "#2a6cc6"
purple = "#a9a1e1"
tint_green = "#2a403e"
tint_red = "#483024"
statusline = "#3b3934"
statusline_accent = "#4e4b45"
statusline_fg = "#ede0ce"
on_accent = "#2b2a27"
mode_red = "#cb4b16"
mode_green = "#26a6a6"
mode_yellow = "#bcd42a"
mode_blue = "#2a6cc6"
mode_purple = "#a9a1e1"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
