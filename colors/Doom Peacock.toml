palette_6 = "#2b2a27"
palette_7 = "#2b2a27"
palette_8 = "#2b2a27"
palette_9 = "#2b2a27"
palette_10 = "#2b2a27"
palette_11 = "#2b2a27"
palette_12 = "#2b2a27"
palette_13 = "#2b2a27"
palette_14 = "#2b2a27"
palette_15 = "#2b2a27"

[roles]
