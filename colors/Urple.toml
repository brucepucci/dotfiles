# Urple
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1b23"
foreground = "#877a9b"
cursor-color = "#a063eb"
cursor-text = "#1b1b22"
selection-background = "#a063eb"
selection-foreground = "#1b1b22"
palette_0 = "#000000"
palette_1 = "#b0425b"
palette_2 = "#37a415"
palette_3 = "#ad5c42"
palette_4 = "#564d9b"
palette_5 = "#6c3ca1"
palette_6 = "#808080"
palette_7 = "#87799c"
palette_8 = "#6a3f32"
palette_9 = "#ff6388"
palette_10 = "#29e620"
palette_11 = "#f08161"
palette_12 = "#867aed"
palette_13 = "#a05eee"
palette_14 = "#eaeaea"
palette_15 = "#bfa3ff"

[roles]
bg = "#1b1b23"
bg_deep = "#14141a"
surface = "#282631"
fg = "#877a9b"
fg_soft = "#675e77"
fg_bright = "#bfa3ff"
grey = "#564f65"
grey_dim = "#413c4d"
grey_neutral = "#615971"
grey_soft = "#4c4659"
red = "#b0425b"
orange = "#ae4f4e"
yellow = "#ad5c42"
green = "#37a415"
aqua = "#808080"
blue = "#564d9b"
purple = "#6c3ca1"
tint_green = "#203420"
tint_red = "#36222d"
statusline = "#24232d"
statusline_accent = "#2e2c39"
statusline_fg = "#877a9b"
on_accent = "#1b1b23"
mode_red = "#b0425b"
mode_green = "#37a415"
mode_yellow = "#ad5c42"
mode_blue = "#564d9b"
