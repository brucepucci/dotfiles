palette_4 = "#efebd4"
palette_5 = "#efebd4"
palette_6 = "#efebd4"
palette_7 = "#efebd4"
palette_8 = "#efebd4"
palette_9 = "#efebd4"
palette_10 = "#efebd4"
palette_11 = "#efebd4"
palette_12 = "#efebd4"
palette_13 = "#efebd4"
palette_14 = "#efebd4"
palette_15 = "#efebd4"

[roles]
