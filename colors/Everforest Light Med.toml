# Everforest Light Med
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#efebd4"
foreground = "#5c6a72"
cursor-color = "#f57d26"
cursor-text = "#eaedc8"
selection-background = "#eaedc8"
selection-foreground = "#5c6a72"
palette_0 = "#7a8478"
palette_1 = "#e67e80"
palette_2 = "#9ab373"
palette_3 = "#c1a266"
palette_4 = "#7fbbb3"
palette_5 = "#d699b6"
palette_6 = "#83c092"
palette_7 = "#b2af9f"
palette_8 = "#a6b0a0"
palette_9 = "#f85552"
palette_10 = "#8da101"
palette_11 = "#dfa000"
palette_12 = "#3a94c5"
palette_13 = "#df69ba"
palette_14 = "#35a77c"
palette_15 = "#fffbef"

[roles]
bg = "#efebd4"
bg_deep = "#f3f0df"
surface = "#dddcc8"
fg = "#5c6a72"
fg_soft = "#88918f"
fg_bright = "#3c454a"
grey = "#9ea49e"
grey_dim = "#bcbeb2"
grey_neutral = "#8f9794"
grey_soft = "#adb1a8"
red = "#e67e80"
orange = "#d49073"
yellow = "#c1a266"
green = "#9ab373"
aqua = "#83c092"
