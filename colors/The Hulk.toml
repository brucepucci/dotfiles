# The Hulk
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1d1e"
foreground = "#b5b5b5"
cursor-color = "#16b61b"
cursor-text = "#000000"
selection-background = "#4d504c"
selection-foreground = "#31892f"
palette_0 = "#1b1d1e"
palette_1 = "#269d1b"
palette_2 = "#13ce30"
palette_3 = "#63e457"
palette_4 = "#2525f5"
palette_5 = "#712c81"
palette_6 = "#378ca9"
palette_7 = "#d9d8d1"
palette_8 = "#505354"
palette_9 = "#8dff2a"
palette_10 = "#48ff77"
palette_11 = "#3afe16"
palette_12 = "#506b95"
palette_13 = "#72589d"
palette_14 = "#4085a6"
palette_15 = "#e5e6e1"

[roles]
bg = "#1b1d1e"
bg_deep = "#141616"
surface = "#2d2f30"
fg = "#b5b5b5"
fg_soft = "#878788"
fg_bright = "#e5e6e1"
grey = "#707171"
grey_dim = "#515253"
grey_neutral = "#7f8080"
grey_soft = "#606162"
red = "#269d1b"
orange = "#44c039"
yellow = "#63e457"
green = "#13ce30"
aqua = "#378ca9"
