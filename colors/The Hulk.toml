palette_6 = "#1b1d1e"
palette_7 = "#1b1d1e"
palette_8 = "#1b1d1e"
palette_9 = "#1b1d1e"
palette_10 = "#1b1d1e"
palette_11 = "#1b1d1e"
palette_12 = "#1b1d1e"
palette_13 = "#1b1d1e"
palette_14 = "#1b1d1e"
palette_15 = "#1b1d1e"

[roles]
bg = "#1b1d1e"
bg_deep = "#141616"
