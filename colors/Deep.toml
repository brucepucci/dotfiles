# Deep
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#090909"
foreground = "#cdcdcd"
cursor-color = "#d0d0d0"
cursor-text = "#151515"
selection-background = "#780002"
selection-foreground = "#ececec"
palette_0 = "#000000"
palette_1 = "#d70005"
palette_2 = "#1cd915"
palette_3 = "#d9bd26"
palette_4 = "#5665ff"
palette_5 = "#b052da"
palette_6 = "#50d2da"
palette_7 = "#e0e0e0"
palette_8 = "#535353"
palette_9 = "#fb0007"
palette_10 = "#22ff18"
palette_11 = "#fedc2b"
palette_12 = "#9fa9ff"
palette_13 = "#e09aff"
palette_14 = "#8df9ff"
palette_15 = "#ffffff"

[roles]
bg = "#090909"
bg_deep = "#070707"
surface = "#212121"
fg = "#cdcdcd"
fg_soft = "#929292"
fg_bright = "#ffffff"
grey = "#757575"
grey_dim = "#4e4e4e"
grey_neutral = "#888888"
grey_soft = "#616161"
red = "#d70005"
orange = "#d85e16"
yellow = "#d9bd26"
green = "#1cd915"
aqua = "#50d2da"
blue = "#5665ff"
purple = "#b052da"
tint_green = "#0c2e0b"
tint_red = "#2e0708"
statusline = "#191919"
statusline_accent = "#2c2c2c"
statusline_fg = "#cdcdcd"
on_accent = "#090909"
mode_red = "#d70005"
mode_green = "#1cd915"
mode_yellow = "#d9bd26"
mode_blue = "#5665ff"
mode_purple = "#b052da"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
