# Seoulbones Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#4b4b4b"
foreground = "#dddddd"
cursor-color = "#e2e2e2"
cursor-text = "#4b4b4b"
selection-background = "#777777"
selection-foreground = "#dddddd"
palette_0 = "#4b4b4b"
palette_1 = "#e388a3"
palette_2 = "#98bd99"
palette_3 = "#ffdf9b"
palette_4 = "#97bdde"
palette_5 = "#a5a6c5"
palette_6 = "#6fbdbe"
palette_7 = "#dddddd"
palette_8 = "#797172"
palette_9 = "#eb99b1"
palette_10 = "#8fcd92"
palette_11 = "#ffe5b3"
palette_12 = "#a2c8e9"
palette_13 = "#b2b3da"
palette_14 = "#6bcacb"
palette_15 = "#a8a8a8"

[roles]
bg = "#4b4b4b"
bg_deep = "#383838"
surface = "#5d5d5d"
fg = "#dddddd"
fg_soft = "#b1b1b1"
fg_bright = "#a8a8a8"
grey = "#9b9b9b"
grey_dim = "#7e7e7e"
grey_neutral = "#aaaaaa"
grey_soft = "#8d8d8d"
red = "#e388a3"
orange = "#f1b49f"
yellow = "#ffdf9b"
green = "#98bd99"
aqua = "#6fbdbe"
blue = "#97bdde"
purple = "#a5a6c5"
tint_green = "#596059"
tint_red = "#66565b"
statusline = "#575757"
