# Nvim Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e0e2ea"
foreground = "#14161b"
cursor-color = "#9b9ea4"
cursor-text = "#14161b"
selection-background = "#9b9ea4"
selection-foreground = "#14161b"
palette_0 = "#07080d"
palette_1 = "#590008"
palette_2 = "#005523"
palette_3 = "#6b5300"
palette_4 = "#004c73"
palette_5 = "#470045"
palette_6 = "#007373"
palette_7 = "#a1a4ab"
palette_8 = "#4f5258"
palette_9 = "#590008"
palette_10 = "#005523"
palette_11 = "#6b5300"
palette_12 = "#004c73"
palette_13 = "#470045"
palette_14 = "#007373"
palette_15 = "#eef1f8"

[roles]
bg = "#e0e2ea"
bg_deep = "#e8e9ef"
surface = "#c8cad1"
fg = "#14161b"
fg_soft = "#515359"
fg_bright = "#0d0e12"
grey = "#707278"
grey_dim = "#999ba2"
grey_neutral = "#5b5d63"
grey_soft = "#84868d"
red = "#590008"
orange = "#622a04"
yellow = "#6b5300"
green = "#005523"
aqua = "#007373"
blue = "#004c73"
purple = "#470045"
tint_green = "#b8c9c6"
tint_red = "#c8b9c1"
statusline = "#d0d2d9"
statusline_accent = "#bbbdc5"
statusline_fg = "#14161b"
on_accent = "#e0e2ea"
mode_red = "#590008"
mode_green = "#005523"
mode_yellow = "#6b5300"
mode_blue = "#004c73"
mode_purple = "#470045"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
