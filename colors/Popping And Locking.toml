palette_2 = "#98971a"
palette_3 = "#d79921"
palette_4 = "#458588"
palette_5 = "#b16286"
palette_6 = "#689d6a"
palette_7 = "#a89984"
palette_8 = "#928374"
palette_9 = "#f42c3e"
palette_10 = "#b8bb26"
palette_11 = "#fabd2f"
palette_12 = "#99c6ca"
palette_13 = "#d3869b"
palette_14 = "#7ec16e"
palette_15 = "#ebdbb2"

[roles]
