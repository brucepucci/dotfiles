# Selenized Black
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#181818"
foreground = "#b9b9b9"
cursor-color = "#777777"
cursor-text = "#181818"
selection-background = "#3b3b3b"
selection-foreground = "#646464"
palette_0 = "#252525"
palette_1 = "#ed4a46"
palette_2 = "#70b433"
palette_3 = "#dbb32d"
palette_4 = "#368aeb"
palette_5 = "#eb6eb7"
palette_6 = "#3fc5b7"
palette_7 = "#b9b9b9"
palette_8 = "#777777"
palette_9 = "#ff5e56"
palette_10 = "#83c746"
palette_11 = "#efc541"
palette_12 = "#4f9cfe"
palette_13 = "#ff81ca"
palette_14 = "#56d8c9"
palette_15 = "#dedede"

[roles]
bg = "#181818"
bg_deep = "#121212"
surface = "#2b2b2b"
fg = "#b9b9b9"
fg_soft = "#898989"
fg_bright = "#dedede"
grey = "#717171"
grey_dim = "#505050"
grey_neutral = "#818181"
grey_soft = "#606060"
red = "#ed4a46"
orange = "#e47e3a"
yellow = "#dbb32d"
green = "#70b433"
aqua = "#3fc5b7"
blue = "#368aeb"
purple = "#eb6eb7"
tint_green = "#28341d"
