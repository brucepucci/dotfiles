palette_2 = "#0f191f"
palette_3 = "#0f191f"
palette_4 = "#0f191f"
palette_5 = "#0f191f"
palette_6 = "#0f191f"
palette_7 = "#0f191f"
palette_8 = "#0f191f"
palette_9 = "#0f191f"
palette_10 = "#0f191f"
palette_11 = "#0f191f"
palette_12 = "#0f191f"
palette_13 = "#0f191f"
palette_14 = "#0f191f"
palette_15 = "#0f191f"

[roles]
bg = "#0f191f"
bg_deep = "#0b1317"
surface = "#253034"
fg = "#c6d5cf"
fg_soft = "#8f9d9a"
fg_bright = "#0f191f"
