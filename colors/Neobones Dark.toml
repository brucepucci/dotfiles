# Neobones Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0f191f"
foreground = "#c6d5cf"
cursor-color = "#ceddd7"
cursor-text = "#0f191f"
selection-background = "#3a3e3d"
selection-foreground = "#c6d5cf"
palette_0 = "#0f191f"
palette_1 = "#de6e7c"
palette_2 = "#90ff6b"
palette_3 = "#b77e64"
palette_4 = "#8190d4"
palette_5 = "#b279a7"
palette_6 = "#66a5ad"
palette_7 = "#c6d5cf"
palette_8 = "#334652"
palette_9 = "#e8838f"
palette_10 = "#a0ff85"
palette_11 = "#d68c67"
palette_12 = "#92a0e2"
palette_13 = "#cf86c1"
palette_14 = "#65b8c1"
palette_15 = "#98a39e"

[roles]
bg = "#0f191f"
bg_deep = "#0b1317"
surface = "#253034"
fg = "#c6d5cf"
fg_soft = "#8f9d9a"
fg_bright = "#98a39e"
grey = "#748080"
grey_dim = "#4f5b5d"
grey_neutral = "#869391"
grey_soft = "#616e6e"
red = "#de6e7c"
orange = "#ca7670"
yellow = "#b77e64"
green = "#90ff6b"
aqua = "#66a5ad"
blue = "#8190d4"
purple = "#b279a7"
tint_green = "#26422d"
tint_red = "#342830"
statusline = "#1e282d"
