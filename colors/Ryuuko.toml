palette_6 = "#88b2ac"
palette_7 = "#ececec"
palette_8 = "#5d7079"
palette_9 = "#865f5b"
palette_10 = "#66907d"
palette_11 = "#b1a990"
palette_12 = "#6a8e95"
palette_13 = "#b18a73"
palette_14 = "#88b2ac"
palette_15 = "#ececec"

[roles]
