palette_2 = "#1d1f28"
palette_3 = "#1d1f28"
palette_4 = "#1d1f28"
palette_5 = "#1d1f28"
palette_6 = "#1d1f28"
palette_7 = "#1d1f28"
palette_8 = "#1d1f28"
palette_9 = "#1d1f28"
palette_10 = "#1d1f28"
palette_11 = "#1d1f28"
palette_12 = "#1d1f28"
palette_13 = "#1d1f28"
palette_14 = "#1d1f28"
palette_15 = "#1d1f28"

[roles]
bg = "#1d1f28"
bg_deep = "#16171e"
surface = "#383a42"
fg = "#fdfdfd"
fg_soft = "#bababd"
