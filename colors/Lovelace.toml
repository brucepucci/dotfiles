# Lovelace
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1f28"
foreground = "#fdfdfd"
cursor-color = "#c574dd"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#282a36"
palette_1 = "#f37f97"
palette_2 = "#5adecd"
palette_3 = "#f2a272"
palette_4 = "#8897f4"
palette_5 = "#c574dd"
palette_6 = "#79e6f3"
palette_7 = "#fdfdfd"
palette_8 = "#4e5165"
palette_9 = "#ff4971"
palette_10 = "#18e3c8"
palette_11 = "#ff8037"
palette_12 = "#556fff"
palette_13 = "#b043d1"
palette_14 = "#3fdcee"
palette_15 = "#bebec1"

[roles]
bg = "#1d1f28"
bg_deep = "#16171e"
surface = "#383a42"
fg = "#fdfdfd"
fg_soft = "#bababd"
fg_bright = "#bebec1"
grey = "#98999d"
grey_dim = "#6b6d73"
grey_neutral = "#afafb2"
grey_soft = "#828388"
red = "#f37f97"
orange = "#f29084"
yellow = "#f2a272"
green = "#5adecd"
aqua = "#79e6f3"
blue = "#8897f4"
purple = "#c574dd"
tint_green = "#284146"
tint_red = "#44303c"
statusline = "#2f3139"
statusline_accent = "#45474e"
statusline_fg = "#fdfdfd"
on_accent = "#1d1f28"
mode_red = "#f37f97"
mode_green = "#5adecd"
mode_yellow = "#f2a272"
mode_blue = "#8897f4"
mode_purple = "#c574dd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
