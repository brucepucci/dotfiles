# Nightfox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#192330"
foreground = "#cdcecf"
cursor-color = "#cdcecf"
cursor-text = "#192330"
selection-background = "#2b3b51"
selection-foreground = "#cdcecf"
palette_0 = "#393b44"
palette_1 = "#c94f6d"
palette_2 = "#81b29a"
palette_3 = "#dbc074"
palette_4 = "#719cd6"
palette_5 = "#9d79d6"
palette_6 = "#63cdcf"
palette_7 = "#dfdfe0"
palette_8 = "#575860"
palette_9 = "#d16983"
palette_10 = "#8ebaa4"
palette_11 = "#e0c989"
palette_12 = "#86abdc"
palette_13 = "#baa1e2"
palette_14 = "#7ad5d6"
palette_15 = "#e4e4e5"

[roles]
bg = "#192330"
bg_deep = "#131a24"
surface = "#2f3843"
fg = "#cdcecf"
fg_soft = "#979b9f"
fg_bright = "#e4e4e5"
grey = "#7c8187"
