# Fun Forrest
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#251200"
foreground = "#dec165"
cursor-color = "#e5591c"
cursor-text = "#000000"
selection-background = "#e5591c"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#d6262b"
palette_2 = "#919c00"
palette_3 = "#be8a13"
palette_4 = "#4699a3"
palette_5 = "#8d4331"
palette_6 = "#da8213"
palette_7 = "#ddc265"
palette_8 = "#7f6a55"
palette_9 = "#e55a1c"
palette_10 = "#bfc65a"
palette_11 = "#ffcb1b"
palette_12 = "#7cc9cf"
palette_13 = "#d26349"
palette_14 = "#e6a96b"
palette_15 = "#ffeaa3"

[roles]
bg = "#251200"
bg_deep = "#1c0e00"
surface = "#3b270c"
fg = "#dec165"
fg_soft = "#a68c47"
fg_bright = "#ffeaa3"
grey = "#8b7238"
grey_dim = "#664f23"
grey_neutral = "#9d8442"
grey_soft = "#78612d"
red = "#d6262b"
orange = "#ca581f"
yellow = "#be8a13"
green = "#919c00"
aqua = "#da8213"
