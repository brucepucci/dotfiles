palette_2 = "#636232"
palette_3 = "#c36e28"
palette_4 = "#515c5d"
palette_5 = "#9b1d29"
palette_6 = "#588056"
palette_7 = "#f7d75c"
palette_8 = "#874228"
palette_9 = "#ff4331"
palette_10 = "#b4b264"
palette_11 = "#ff9566"
palette_12 = "#9eb2b4"
palette_13 = "#ff5b6a"
palette_14 = "#8acd8f"
palette_15 = "#ffe598"

[roles]
