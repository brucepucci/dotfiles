# Sonokai
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c2e34"
foreground = "#e2e2e3"
cursor-color = "#e2e2e3"
cursor-text = "#2c2e34"
selection-background = "#414550"
selection-foreground = "#e2e2e3"
palette_0 = "#181819"
palette_1 = "#fc5d7c"
palette_2 = "#9ed072"
palette_3 = "#e7c664"
palette_4 = "#76cce0"
palette_5 = "#b39df3"
palette_6 = "#f39660"
palette_7 = "#e2e2e3"
palette_8 = "#7f8490"
palette_9 = "#fc5d7c"
palette_10 = "#9ed072"
palette_11 = "#e7c664"
palette_12 = "#76cce0"
palette_13 = "#b39df3"
palette_14 = "#f39660"
palette_15 = "#e2e2e3"

[roles]
bg = "#2c2e34"
bg_deep = "#212227"
surface = "#424449"
fg = "#e2e2e3"
fg_soft = "#abacae"
fg_bright = "#e2e2e3"
grey = "#909194"
grey_dim = "#6c6d71"
grey_neutral = "#a2a3a6"
grey_soft = "#7e7f83"
red = "#fc5d7c"
orange = "#f29270"
yellow = "#e7c664"
green = "#9ed072"
aqua = "#f39660"
blue = "#76cce0"
purple = "#b39df3"
