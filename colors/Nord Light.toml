# Nord Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#e5e9f0"
foreground = "#414858"
cursor-color = "#7bb3c3"
cursor-text = "#3b4252"
selection-background = "#d8dee9"
selection-foreground = "#4c556a"
palette_0 = "#3b4252"
palette_1 = "#bf616a"
palette_2 = "#96b17f"
palette_3 = "#c5a565"
palette_4 = "#81a1c1"
palette_5 = "#b48ead"
palette_6 = "#7bb3c3"
palette_7 = "#a5abb6"
palette_8 = "#4c566a"
palette_9 = "#bf616a"
palette_10 = "#96b17f"
palette_11 = "#c5a565"
palette_12 = "#81a1c1"
palette_13 = "#b48ead"
palette_14 = "#82afae"
palette_15 = "#eceff4"

[roles]
bg = "#e5e9f0"
bg_deep = "#eceef4"
surface = "#d1d6de"
fg = "#414858"
fg_soft = "#727886"
fg_bright = "#2a2f39"
grey = "#8b909c"
grey_dim = "#acb1bb"
grey_neutral = "#7a808d"
grey_soft = "#9ba1ac"
red = "#bf616a"
orange = "#c28368"
yellow = "#c5a565"
green = "#96b17f"
aqua = "#7bb3c3"
blue = "#81a1c1"
purple = "#b48ead"
tint_green = "#d7dfdc"
tint_red = "#ded1d8"
statusline = "#d8dce4"
