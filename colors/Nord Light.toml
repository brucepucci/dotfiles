palette_6 = "#e5e9f0"
palette_7 = "#e5e9f0"
palette_8 = "#e5e9f0"
palette_9 = "#e5e9f0"
palette_10 = "#e5e9f0"
palette_11 = "#e5e9f0"
palette_12 = "#e5e9f0"
palette_13 = "#e5e9f0"
palette_14 = "#e5e9f0"
palette_15 = "#e5e9f0"

[roles]
