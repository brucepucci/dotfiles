# Flexoki Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fffcf0"
foreground = "#100f0f"
cursor-color = "#100f0f"
cursor-text = "#fffcf0"
selection-background = "#cecdc3"
selection-foreground = "#100f0f"
palette_0 = "#100f0f"
palette_1 = "#af3029"
palette_2 = "#66800b"
palette_3 = "#ad8301"
palette_4 = "#205ea6"
palette_5 = "#a02f6f"
palette_6 = "#24837b"
palette_7 = "#6f6e69"
palette_8 = "#b7b5ac"
palette_9 = "#d14d41"
palette_10 = "#879a39"
palette_11 = "#d0a215"
palette_12 = "#4385be"
palette_13 = "#ce5d97"
palette_14 = "#3aa99f"
palette_15 = "#cecdc3"

[roles]
bg = "#fffcf0"
bg_deep = "#fffdf4"
surface = "#e2e0d5"
fg = "#100f0f"
fg_soft = "#585652"
fg_bright = "#0a0a0a"
grey = "#7c7a74"
