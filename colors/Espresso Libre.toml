# Espresso Libre
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2a211c"
foreground = "#b8a898"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#c3dcff"
selection-foreground = "#ab9b8b"
palette_0 = "#000000"
palette_1 = "#cc0000"
palette_2 = "#1a921c"
palette_3 = "#f0e53a"
palette_4 = "#0066ff"
palette_5 = "#c5656b"
palette_6 = "#06989a"
palette_7 = "#d3d7cf"
palette_8 = "#555753"
palette_9 = "#ef2929"
palette_10 = "#9aff87"
palette_11 = "#fffb5c"
palette_12 = "#43a8ed"
palette_13 = "#ff818a"
palette_14 = "#34e2e2"
palette_15 = "#eeeeec"

[roles]
bg = "#2a211c"
bg_deep = "#201915"
surface = "#3b312b"
fg = "#b8a898"
fg_soft = "#8d8073"
fg_bright = "#eeeeec"
grey = "#786b60"
grey_dim = "#5c5047"
grey_neutral = "#86796d"
grey_soft = "#6a5e54"
red = "#cc0000"
orange = "#de721d"
yellow = "#f0e53a"
green = "#1a921c"
aqua = "#06989a"
blue = "#0066ff"
purple = "#c5656b"
tint_green = "#27351c"
tint_red = "#471b17"
statusline = "#352c26"
