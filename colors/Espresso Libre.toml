palette_6 = "#2a211c"
palette_7 = "#2a211c"
palette_8 = "#2a211c"
palette_9 = "#2a211c"
palette_10 = "#2a211c"
palette_11 = "#2a211c"
palette_12 = "#2a211c"
palette_13 = "#2a211c"
palette_14 = "#2a211c"
palette_15 = "#2a211c"

[roles]
