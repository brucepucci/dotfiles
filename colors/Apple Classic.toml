# Apple Classic
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2c2b2b"
foreground = "#d5a200"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#6b5b02"
selection-foreground = "#67e000"
palette_0 = "#000000"
palette_1 = "#c91b00"
palette_2 = "#00c200"
palette_3 = "#c7c400"
palette_4 = "#1c3fe1"
palette_5 = "#ca30c7"
palette_6 = "#00c5c7"
palette_7 = "#c7c7c7"
palette_8 = "#686868"
palette_9 = "#ff6e67"
palette_10 = "#5ffa68"
palette_11 = "#fffc67"
palette_12 = "#6871ff"
palette_13 = "#ff77ff"
palette_14 = "#60fdff"
palette_15 = "#ffffff"

[roles]
bg = "#2c2b2b"
bg_deep = "#212020"
surface = "#403926"
fg = "#d5a200"
fg_soft = "#a27e0d"
fg_bright = "#ffffff"
grey = "#896c13"
grey_dim = "#67551c"
grey_neutral = "#9a780f"
grey_soft = "#786118"
red = "#c91b00"
orange = "#c87000"
yellow = "#c7c400"
green = "#00c200"
aqua = "#00c5c7"
blue = "#1c3fe1"
purple = "#ca30c7"
tint_green = "#244623"
tint_red = "#482823"
statusline = "#3a3528"
statusline_accent = "#4a4023"
statusline_fg = "#d5a200"
on_accent = "#d5a200"
mode_red = "#c91b00"
mode_green = "#00c200"
mode_yellow = "#c7c400"
mode_blue = "#1c3fe1"
mode_purple = "#ca30c7"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
