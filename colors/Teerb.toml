# Teerb
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#262626"
foreground = "#d0d0d0"
cursor-color = "#e4c9af"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#1c1c1c"
palette_1 = "#d68686"
palette_2 = "#aed686"
palette_3 = "#d7af87"
palette_4 = "#86aed6"
palette_5 = "#d6aed6"
palette_6 = "#8adbb4"
palette_7 = "#d0d0d0"
palette_8 = "#4f4f4f"
palette_9 = "#d68686"
palette_10 = "#aed686"
palette_11 = "#e4c9af"
palette_12 = "#86aed6"
palette_13 = "#d6aed6"
palette_14 = "#b1e7dd"
palette_15 = "#efefef"

[roles]
bg = "#262626"
bg_deep = "#1c1c1c"
surface = "#3a3a3a"
fg = "#d0d0d0"
fg_soft = "#9d9d9d"
fg_bright = "#efefef"
grey = "#848484"
grey_dim = "#626262"
grey_neutral = "#949494"
grey_soft = "#727272"
red = "#d68686"
orange = "#d69a86"
yellow = "#d7af87"
green = "#aed686"
aqua = "#8adbb4"
blue = "#86aed6"
purple = "#d6aed6"
tint_green = "#3e4637"
tint_red = "#463737"
statusline = "#343434"
statusline_accent = "#454545"
statusline_fg = "#d0d0d0"
on_accent = "#262626"
mode_red = "#d68686"
mode_green = "#aed686"
mode_yellow = "#d7af87"
mode_blue = "#86aed6"
mode_purple = "#d6aed6"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
