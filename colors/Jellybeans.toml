# Jellybeans
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121212"
foreground = "#dedede"
cursor-color = "#ffa560"
cursor-text = "#ffffff"
selection-background = "#474e91"
selection-foreground = "#f4f4f4"
palette_0 = "#929292"
palette_1 = "#e27373"
palette_2 = "#94b979"
palette_3 = "#ffba7b"
palette_4 = "#97bedc"
palette_5 = "#e1c0fa"
palette_6 = "#00988e"
palette_7 = "#dedede"
palette_8 = "#bdbdbd"
palette_9 = "#ffa1a1"
palette_10 = "#bddeab"
palette_11 = "#ffdca0"
palette_12 = "#b1d8f6"
palette_13 = "#fbdaff"
palette_14 = "#1ab2a8"
palette_15 = "#ffffff"

[roles]
bg = "#121212"
bg_deep = "#0e0e0e"
surface = "#2a2a2a"
fg = "#dedede"
fg_soft = "#a1a1a1"
fg_bright = "#ffffff"
grey = "#828282"
grey_dim = "#595959"
grey_neutral = "#979797"
grey_soft = "#6e6e6e"
red = "#e27373"
orange = "#f09677"
yellow = "#ffba7b"
green = "#94b979"
aqua = "#00988e"
blue = "#97bedc"
purple = "#e1c0fa"
tint_green = "#293025"
tint_red = "#372323"
statusline = "#222222"
statusline_accent = "#373737"
statusline_fg = "#dedede"
on_accent = "#121212"
mode_red = "#e27373"
mode_green = "#94b979"
mode_yellow = "#ffba7b"
mode_blue = "#97bedc"
mode_purple = "#e1c0fa"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
