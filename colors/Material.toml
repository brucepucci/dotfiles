palette_2 = "#eaeaea"
palette_3 = "#eaeaea"
palette_4 = "#eaeaea"
palette_5 = "#eaeaea"
palette_6 = "#eaeaea"
palette_7 = "#eaeaea"
palette_8 = "#eaeaea"
palette_9 = "#eaeaea"
palette_10 = "#eaeaea"
palette_11 = "#eaeaea"
palette_12 = "#eaeaea"
palette_13 = "#eaeaea"
palette_14 = "#eaeaea"
palette_15 = "#eaeaea"

[roles]
bg = "#eaeaea"
bg_deep = "#efefef"
surface = "#d2d2d2"
fg = "#232322"
fg_soft = "#5f5f5e"
fg_bright = "#171716"
grey = "#7d7d7c"
