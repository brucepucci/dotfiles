# Material
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#eaeaea"
foreground = "#232322"
cursor-color = "#16afca"
cursor-text = "#2e2e2d"
selection-background = "#c2c2c2"
selection-foreground = "#4e4e4e"
palette_0 = "#212121"
palette_1 = "#b7141f"
palette_2 = "#457b24"
palette_3 = "#f6981e"
palette_4 = "#134eb2"
palette_5 = "#560088"
palette_6 = "#0e717c"
palette_7 = "#afafaf"
palette_8 = "#424242"
palette_9 = "#e83b3f"
palette_10 = "#7aba3a"
palette_11 = "#bfaa00"
palette_12 = "#54a4f3"
palette_13 = "#aa4dbc"
palette_14 = "#26bbd1"
palette_15 = "#d9d9d9"

[roles]
bg = "#eaeaea"
bg_deep = "#efefef"
surface = "#d2d2d2"
fg = "#232322"
fg_soft = "#5f5f5e"
fg_bright = "#171716"
grey = "#7d7d7c"
grey_dim = "#a4a4a4"
grey_neutral = "#696968"
grey_soft = "#909090"
red = "#b7141f"
orange = "#d6561e"
yellow = "#f6981e"
