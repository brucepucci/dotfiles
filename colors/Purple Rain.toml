# Purple Rain
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#21084a"
foreground = "#fffbf6"
cursor-color = "#ff271d"
cursor-text = "#ff9a90"
selection-background = "#287691"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ff260e"
palette_2 = "#9be205"
palette_3 = "#ffc400"
palette_4 = "#00a2fa"
palette_5 = "#815bb5"
palette_6 = "#00deef"
palette_7 = "#ffffff"
palette_8 = "#565656"
palette_9 = "#ff4250"
palette_10 = "#b8e36e"
palette_11 = "#ffd852"
palette_12 = "#00a6ff"
palette_13 = "#ac7bf0"
palette_14 = "#74fdf3"
palette_15 = "#ffffff"

[roles]
bg = "#21084a"
bg_deep = "#190638"
surface = "#3c255f"
fg = "#fffbf6"
fg_soft = "#bcb2c2"
fg_bright = "#ffffff"
grey = "#9b8ea9"
grey_dim = "#6f5d86"
grey_neutral = "#b1a6ba"
grey_soft = "#857597"
red = "#ff260e"
orange = "#ff7507"
yellow = "#ffc400"
green = "#9be205"
aqua = "#00deef"
blue = "#00a2fa"
purple = "#815bb5"
tint_green = "#372f3e"
tint_red = "#490d3f"
statusline = "#331b58"
statusline_accent = "#493469"
statusline_fg = "#fffbf6"
on_accent = "#21084a"
mode_red = "#ff260e"
mode_green = "#9be205"
mode_yellow = "#ffc400"
mode_blue = "#00a2fa"
mode_purple = "#815bb5"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
