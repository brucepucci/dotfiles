# Hacktober
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141414"
foreground = "#c9c9c9"
cursor-color = "#c9c9c9"
cursor-text = "#141414"
selection-background = "#141414"
selection-foreground = "#c9c9c9"
palette_0 = "#191918"
palette_1 = "#b34538"
palette_2 = "#587744"
palette_3 = "#d08949"
palette_4 = "#206ec5"
palette_5 = "#864651"
palette_6 = "#ac9166"
palette_7 = "#f1eee7"
palette_8 = "#464444"
palette_9 = "#b33323"
palette_10 = "#42824a"
palette_11 = "#c75a22"
palette_12 = "#5389c5"
palette_13 = "#e795a5"
palette_14 = "#ebc587"
palette_15 = "#ffffff"

[roles]
bg = "#141414"
bg_deep = "#0f0f0f"
surface = "#2a2a2a"
fg = "#c9c9c9"
