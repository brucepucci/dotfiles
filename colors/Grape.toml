# Grape
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#171423"
foreground = "#9f9fa1"
cursor-color = "#a288f7"
cursor-text = "#171422"
selection-background = "#493d70"
selection-foreground = "#171422"
palette_0 = "#2d283f"
palette_1 = "#ed2261"
palette_2 = "#1fa91b"
palette_3 = "#8ddc20"
palette_4 = "#487df4"
palette_5 = "#8d35c9"
palette_6 = "#3bdeed"
palette_7 = "#9e9ea0"
palette_8 = "#59516a"
palette_9 = "#f0729a"
palette_10 = "#53aa5e"
palette_11 = "#b2dc87"
palette_12 = "#a9bcec"
palette_13 = "#ad81c2"
palette_14 = "#9de3eb"
palette_15 = "#a288f7"

[roles]
bg = "#171423"
bg_deep = "#110f1a"
surface = "#272532"
fg = "#9f9fa1"
fg_soft = "#76757b"
