# Niji
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141515"
foreground = "#ffffff"
cursor-color = "#ffc663"
cursor-text = "#141515"
selection-background = "#515151"
selection-foreground = "#ffc663"
palette_0 = "#333333"
palette_1 = "#d23e08"
palette_2 = "#54ca74"
palette_3 = "#fff700"
palette_4 = "#2ab9ff"
palette_5 = "#ff50da"
palette_6 = "#1ef9f5"
palette_7 = "#ddd0c4"
palette_8 = "#515151"
palette_9 = "#ffb7b7"
palette_10 = "#c1ffae"
palette_11 = "#fcffb8"
palette_12 = "#8efff3"
palette_13 = "#ffa2ed"
palette_14 = "#bcffc7"
palette_15 = "#ffffff"

[roles]
bg = "#141515"
bg_deep = "#0f1010"
surface = "#303131"
fg = "#ffffff"
fg_soft = "#b8b9b9"
fg_bright = "#ffffff"
grey = "#959696"
grey_dim = "#666767"
grey_neutral = "#adadad"
grey_soft = "#7e7e7e"
red = "#d23e08"
orange = "#e89a04"
yellow = "#fff700"
green = "#54ca74"
aqua = "#1ef9f5"
blue = "#2ab9ff"
purple = "#ff50da"
tint_green = "#203626"
tint_red = "#361c13"
statusline = "#272828"
statusline_accent = "#3e3f3f"
statusline_fg = "#ffffff"
on_accent = "#141515"
mode_red = "#d23e08"
mode_green = "#54ca74"
mode_yellow = "#fff700"
mode_blue = "#2ab9ff"
mode_purple = "#ff50da"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
