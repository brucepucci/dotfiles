# Chalk
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2b2d2e"
foreground = "#d2d8d9"
cursor-color = "#708284"
cursor-text = "#002831"
selection-background = "#e4e8ed"
selection-foreground = "#3f4041"
palette_0 = "#7d8b8f"
palette_1 = "#b23a52"
palette_2 = "#789b6a"
palette_3 = "#b9ac4a"
palette_4 = "#2a7fac"
palette_5 = "#bd4f5a"
palette_6 = "#44a799"
palette_7 = "#d2d8d9"
palette_8 = "#888888"
palette_9 = "#f24840"
palette_10 = "#80c470"
palette_11 = "#ffeb62"
palette_12 = "#4196ff"
palette_13 = "#fc5275"
palette_14 = "#53cdbd"
palette_15 = "#d2d8d9"

[roles]
bg = "#2b2d2e"
bg_deep = "#202222"
surface = "#3f4243"
fg = "#d2d8d9"
fg_soft = "#a0a5a6"
fg_bright = "#d2d8d9"
grey = "#878b8c"
grey_dim = "#65696a"
grey_neutral = "#989c9d"
grey_soft = "#767a7b"
red = "#b23a52"
orange = "#b6734e"
yellow = "#b9ac4a"
green = "#789b6a"
aqua = "#44a799"
blue = "#2a7fac"
purple = "#bd4f5a"
tint_green = "#394139"
tint_red = "#432f34"
statusline = "#383b3c"
