palette_7 = "#282b33"
palette_8 = "#282b33"
palette_9 = "#282b33"
palette_10 = "#282b33"
palette_11 = "#282b33"
palette_12 = "#282b33"
palette_13 = "#282b33"
palette_14 = "#282b33"
palette_15 = "#282b33"

