# Wilmersdorf
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282b33"
foreground = "#c6c6c6"
cursor-color = "#7ebebd"
cursor-text = "#1f2024"
selection-background = "#1f2024"
selection-foreground = "#c6c6c6"
palette_0 = "#34373e"
palette_1 = "#e06383"
palette_2 = "#7ebebd"
palette_3 = "#cccccc"
palette_4 = "#a6c1e0"
palette_5 = "#e1c1ee"
palette_6 = "#5b94ab"
palette_7 = "#ababab"
palette_8 = "#50545d"
palette_9 = "#fa7193"
palette_10 = "#8fd7d6"
palette_11 = "#d1dfff"
palette_12 = "#b2cff0"
palette_13 = "#efccfd"
palette_14 = "#69abc5"
palette_15 = "#d3d3d3"

[roles]
bg = "#282b33"
bg_deep = "#1e2026"
surface = "#3b3e45"
fg = "#c6c6c6"
fg_soft = "#97989a"
fg_bright = "#d3d3d3"
grey = "#7f8084"
grey_dim = "#5f6166"
grey_neutral = "#8f9093"
grey_soft = "#6f7175"
red = "#e06383"
orange = "#d698a8"
yellow = "#cccccc"
green = "#7ebebd"
aqua = "#5b94ab"
blue = "#a6c1e0"
purple = "#e1c1ee"
tint_green = "#37454c"
