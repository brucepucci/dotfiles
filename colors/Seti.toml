palette_2 = "#111213"
palette_3 = "#111213"
palette_4 = "#111213"
palette_5 = "#111213"
palette_6 = "#111213"
palette_7 = "#111213"
palette_8 = "#111213"
palette_9 = "#111213"
palette_10 = "#111213"
palette_11 = "#111213"
palette_12 = "#111213"
palette_13 = "#111213"
palette_14 = "#111213"
palette_15 = "#111213"

[roles]
