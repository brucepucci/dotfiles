# Seti
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#111213"
foreground = "#cacecd"
cursor-color = "#e3bf21"
cursor-text = "#ad8b00"
selection-background = "#303233"
selection-foreground = "#cacecd"
palette_0 = "#323232"
palette_1 = "#c22832"
palette_2 = "#8ec43d"
palette_3 = "#e0c64f"
palette_4 = "#43a5d5"
palette_5 = "#8b57b5"
palette_6 = "#8ec43d"
palette_7 = "#eeeeee"
palette_8 = "#3f3f3f"
palette_9 = "#c22832"
palette_10 = "#8ec43d"
palette_11 = "#e0c64f"
palette_12 = "#43a5d5"
palette_13 = "#8b57b5"
palette_14 = "#8ec43d"
palette_15 = "#ffffff"

[roles]
bg = "#111213"
bg_deep = "#0d0e0e"
surface = "#272929"
fg = "#cacecd"
fg_soft = "#929695"
fg_bright = "#ffffff"
grey = "#777979"
grey_dim = "#525454"
grey_neutral = "#898c8c"
grey_soft = "#646767"
red = "#c22832"
orange = "#d17740"
yellow = "#e0c64f"
green = "#8ec43d"
aqua = "#8ec43d"
blue = "#43a5d5"
purple = "#8b57b5"
tint_green = "#28321b"
tint_red = "#311619"
statusline = "#202122"
statusline_accent = "#323434"
statusline_fg = "#cacecd"
on_accent = "#111213"
mode_red = "#c22832"
mode_green = "#8ec43d"
