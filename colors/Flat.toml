# Flat
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002240"
foreground = "#2cc55d"
cursor-color = "#e5be0c"
cursor-text = "#ffffff"
selection-background = "#792b9c"
selection-foreground = "#ffffff"
palette_0 = "#222d3f"
palette_1 = "#a82320"
palette_2 = "#32a548"
palette_3 = "#e58d11"
palette_4 = "#3167ac"
palette_5 = "#781aa0"
palette_6 = "#2c9370"
palette_7 = "#b0b6ba"
palette_8 = "#475262"
palette_9 = "#d4312e"
palette_10 = "#2d9440"
palette_11 = "#e5be0c"
palette_12 = "#3c7dd2"
palette_13 = "#8230a7"
palette_14 = "#35b387"
palette_15 = "#e7eced"

[roles]
bg = "#002240"
bg_deep = "#001a30"
surface = "#053643"
fg = "#2cc55d"
fg_soft = "#1f9454"
fg_bright = "#e7eced"
grey = "#187c50"
grey_dim = "#0f5b4a"
grey_neutral = "#1d8c53"
grey_soft = "#146b4d"
red = "#a82320"
orange = "#c65818"
yellow = "#e58d11"
green = "#32a548"
aqua = "#2c9370"
blue = "#3167ac"
purple = "#781aa0"
tint_green = "#093a41"
tint_red = "#1e223a"
statusline = "#042f42"
statusline_accent = "#083f45"
statusline_fg = "#2cc55d"
on_accent = "#002240"
mode_red = "#a82320"
mode_green = "#32a548"
