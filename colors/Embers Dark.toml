palette_6 = "#576d82"
palette_7 = "#a39a90"
palette_8 = "#5a5047"
palette_9 = "#828257"
palette_10 = "#464039"
palette_11 = "#50483f"
palette_12 = "#8a8075"
palette_13 = "#beb6ae"
palette_14 = "#825757"
palette_15 = "#dbd6d1"

[roles]
