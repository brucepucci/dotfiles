# Nvim Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#14161b"
foreground = "#e0e2ea"
cursor-color = "#9b9ea4"
cursor-text = "#e0e2ea"
selection-background = "#4f5258"
selection-foreground = "#e0e2ea"
palette_0 = "#14161b"
palette_1 = "#14161b"
palette_2 = "#14161b"
palette_3 = "#14161b"
palette_4 = "#14161b"
palette_5 = "#14161b"
palette_6 = "#14161b"
palette_7 = "#14161b"
palette_8 = "#14161b"
palette_9 = "#14161b"
palette_10 = "#14161b"
palette_11 = "#14161b"
palette_12 = "#14161b"
palette_13 = "#14161b"
palette_14 = "#14161b"
palette_15 = "#14161b"

[roles]
bg = "#14161b"
bg_deep = "#0f1014"
surface = "#2c2e34"
fg = "#e0e2ea"
fg_soft = "#a3a5ac"
fg_bright = "#14161b"
grey = "#84868d"
grey_dim = "#5b5d63"
grey_neutral = "#999ba2"
grey_soft = "#707278"
red = "#14161b"
orange = "#14161b"
yellow = "#14161b"
green = "#14161b"
aqua = "#14161b"
blue = "#14161b"
purple = "#14161b"
tint_green = "#14161b"
tint_red = "#14161b"
