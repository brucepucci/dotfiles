# Nvim Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#14161b"
foreground = "#e0e2ea"
cursor-color = "#9b9ea4"
cursor-text = "#e0e2ea"
selection-background = "#4f5258"
selection-foreground = "#e0e2ea"
palette_0 = "#07080d"
palette_1 = "#ffc0b9"
palette_2 = "#b3f6c0"
palette_3 = "#fce094"
palette_4 = "#a6dbff"
palette_5 = "#ffcaff"
palette_6 = "#8cf8f7"
palette_7 = "#eef1f8"
palette_8 = "#4f5258"
palette_9 = "#ffc0b9"
palette_10 = "#b3f6c0"
palette_11 = "#fce094"
palette_12 = "#a6dbff"
palette_13 = "#ffcaff"
palette_14 = "#8cf8f7"
palette_15 = "#eef1f8"

[roles]
bg = "#14161b"
bg_deep = "#0f1014"
surface = "#2c2e34"
fg = "#e0e2ea"
fg_soft = "#a3a5ac"
fg_bright = "#eef1f8"
grey = "#84868d"
grey_dim = "#5b5d63"
grey_neutral = "#999ba2"
grey_soft = "#707278"
red = "#ffc0b9"
orange = "#fed0a6"
yellow = "#fce094"
green = "#b3f6c0"
aqua = "#8cf8f7"
blue = "#a6dbff"
purple = "#ffcaff"
tint_green = "#313e39"
tint_red = "#3e3537"
statusline = "#24262c"
statusline_accent = "#393b40"
statusline_fg = "#e0e2ea"
on_accent = "#14161b"
mode_red = "#ffc0b9"
mode_green = "#b3f6c0"
mode_yellow = "#fce094"
mode_blue = "#a6dbff"
mode_purple = "#ffcaff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
