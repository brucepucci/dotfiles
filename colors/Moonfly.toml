# Moonfly
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#080808"
foreground = "#bdbdbd"
cursor-color = "#9e9e9e"
cursor-text = "#080808"
selection-background = "#b2ceee"
selection-foreground = "#080808"
palette_0 = "#080808"
palette_1 = "#080808"
palette_2 = "#080808"
palette_3 = "#080808"
palette_4 = "#080808"
palette_5 = "#080808"
palette_6 = "#080808"
palette_7 = "#080808"
palette_8 = "#080808"
palette_9 = "#080808"
palette_10 = "#080808"
palette_11 = "#080808"
palette_12 = "#080808"
palette_13 = "#080808"
palette_14 = "#080808"
palette_15 = "#080808"

[roles]
