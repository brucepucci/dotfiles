# Moonfly
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#080808"
foreground = "#bdbdbd"
cursor-color = "#9e9e9e"
cursor-text = "#080808"
selection-background = "#b2ceee"
selection-foreground = "#080808"
palette_0 = "#323437"
palette_1 = "#ff5454"
palette_2 = "#8cc85f"
palette_3 = "#e3c78a"
palette_4 = "#80a0ff"
palette_5 = "#cf87e8"
palette_6 = "#79dac8"
palette_7 = "#c6c6c6"
palette_8 = "#949494"
palette_9 = "#ff5189"
palette_10 = "#36c692"
palette_11 = "#c6c684"
palette_12 = "#74b2ff"
palette_13 = "#ae81ff"
palette_14 = "#85dc85"
palette_15 = "#e4e4e4"

[roles]
bg = "#080808"
bg_deep = "#060606"
surface = "#1e1e1e"
fg = "#bdbdbd"
fg_soft = "#878787"
fg_bright = "#e4e4e4"
grey = "#6c6c6c"
grey_dim = "#474747"
grey_neutral = "#7e7e7e"
grey_soft = "#595959"
red = "#ff5454"
orange = "#f18e6f"
yellow = "#e3c78a"
green = "#8cc85f"
aqua = "#79dac8"
blue = "#80a0ff"
purple = "#cf87e8"
tint_green = "#202b18"
tint_red = "#341616"
statusline = "#161616"
statusline_accent = "#292929"
statusline_fg = "#bdbdbd"
on_accent = "#080808"
mode_red = "#ff5454"
mode_green = "#8cc85f"
mode_yellow = "#e3c78a"
mode_blue = "#80a0ff"
mode_purple = "#cf87e8"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
