# Vague
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141415"
foreground = "#cdcdcd"
cursor-color = "#cdcdcd"
cursor-text = "#141415"
selection-background = "#252530"
selection-foreground = "#cdcdcd"
palette_0 = "#252530"
palette_1 = "#d8647e"
palette_2 = "#7fa563"
palette_3 = "#f3be7c"
palette_4 = "#6e94b2"
palette_5 = "#bb9dbd"
palette_6 = "#aeaed1"
palette_7 = "#cdcdcd"
palette_8 = "#606079"
palette_9 = "#e08398"
palette_10 = "#99b782"
palette_11 = "#f5cb96"
palette_12 = "#8ba9c1"
palette_13 = "#c9b1ca"
palette_14 = "#bebeda"
palette_15 = "#d7d7d7"

[roles]
bg = "#141415"
bg_deep = "#0f0f10"
surface = "#2a2a2b"
fg = "#cdcdcd"
fg_soft = "#969696"
