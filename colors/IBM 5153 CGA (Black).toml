# IBM 5153 CGA (Black)
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c4c4c4"
cursor-color = "#c4c4c4"
cursor-text = "#000000"
selection-background = "#c4c4c4"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#c40000"
palette_2 = "#00c400"
palette_3 = "#c47e00"
palette_4 = "#0000c4"
palette_5 = "#c400c4"
palette_6 = "#00c4c4"
palette_7 = "#c4c4c4"
palette_8 = "#4e4e4e"
palette_9 = "#dc4e4e"
palette_10 = "#4edc4e"
palette_11 = "#f3f34e"
palette_12 = "#4e4edc"
palette_13 = "#f34ef3"
palette_14 = "#4ef3f3"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#181818"
fg = "#c4c4c4"
fg_soft = "#898989"
fg_bright = "#ffffff"
grey = "#6c6c6c"
grey_dim = "#454545"
grey_neutral = "#7f7f7f"
grey_soft = "#585858"
red = "#c40000"
orange = "#c43f00"
yellow = "#c47e00"
green = "#00c400"
aqua = "#00c4c4"
blue = "#0000c4"
purple = "#c400c4"
tint_green = "#002300"
tint_red = "#230000"
statusline = "#101010"
statusline_accent = "#232323"
statusline_fg = "#c4c4c4"
on_accent = "#c4c4c4"
mode_red = "#c40000"
mode_green = "#00c400"
mode_yellow = "#c47e00"
mode_blue = "#0000c4"
mode_purple = "#c400c4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
