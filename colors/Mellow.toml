# Mellow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#161617"
foreground = "#c9c7cd"
cursor-color = "#cac9dd"
cursor-text = "#161617"
selection-background = "#2a2a2d"
selection-foreground = "#c1c0d4"
palette_0 = "#27272a"
palette_1 = "#f5a191"
palette_2 = "#90b99f"
palette_3 = "#e6b99d"
palette_4 = "#aca1cf"
palette_5 = "#e29eca"
palette_6 = "#ea83a5"
palette_7 = "#c1c0d4"
palette_8 = "#424246"
palette_9 = "#ffae9f"
palette_10 = "#9dc6ac"
palette_11 = "#f0c5a9"
palette_12 = "#b9aeda"
palette_13 = "#ecaad6"
palette_14 = "#f591b2"
palette_15 = "#cac9dd"

[roles]
bg = "#161617"
bg_deep = "#101011"
surface = "#2b2b2d"
fg = "#c9c7cd"
fg_soft = "#939296"
fg_bright = "#cac9dd"
grey = "#78777b"
grey_dim = "#555457"
grey_neutral = "#8a898d"
grey_soft = "#676669"
red = "#f5a191"
orange = "#eead97"
yellow = "#e6b99d"
green = "#90b99f"
aqua = "#ea83a5"
blue = "#aca1cf"
purple = "#e29eca"
tint_green = "#2c332f"
tint_red = "#3e2f2d"
statusline = "#242426"
