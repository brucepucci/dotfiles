palette_7 = "#161617"
palette_8 = "#161617"
palette_9 = "#161617"
palette_10 = "#161617"
palette_11 = "#161617"
palette_12 = "#161617"
palette_13 = "#161617"
palette_14 = "#161617"
palette_15 = "#161617"

