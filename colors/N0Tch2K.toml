# N0Tch2K
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#a0a0a0"
cursor-color = "#aa9175"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#383838"
palette_1 = "#a95551"
palette_2 = "#666666"
palette_3 = "#a98051"
palette_4 = "#657d3e"
palette_5 = "#767676"
palette_6 = "#c9c9c9"
palette_7 = "#d0b8a3"
palette_8 = "#545454"
palette_9 = "#a97775"
palette_10 = "#8c8c8c"
palette_11 = "#a99175"
palette_12 = "#98bd5e"
palette_13 = "#a3a3a3"
palette_14 = "#dcdcdc"
palette_15 = "#d8c8bb"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#313131"
fg = "#a0a0a0"
fg_soft = "#7a7a7a"
fg_bright = "#d8c8bb"
grey = "#676767"
grey_dim = "#4e4e4e"
grey_neutral = "#747474"
