palette_7 = "#29262f"
palette_8 = "#29262f"
palette_9 = "#29262f"
palette_10 = "#29262f"
palette_11 = "#29262f"
palette_12 = "#29262f"
palette_13 = "#29262f"
palette_14 = "#29262f"
palette_15 = "#29262f"

[roles]
