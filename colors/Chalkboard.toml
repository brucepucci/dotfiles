# Chalkboard
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#29262f"
foreground = "#d9e6f2"
cursor-color = "#d9e6f2"
cursor-text = "#29262f"
selection-background = "#073642"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#c37372"
palette_2 = "#72c373"
palette_3 = "#c2c372"
palette_4 = "#7372c3"
palette_5 = "#c372c2"
palette_6 = "#72c2c3"
palette_7 = "#d9d9d9"
palette_8 = "#585858"
palette_9 = "#dbaaaa"
palette_10 = "#aadbaa"
palette_11 = "#dadbaa"
palette_12 = "#aaaadb"
palette_13 = "#dbaada"
palette_14 = "#aadadb"
palette_15 = "#ffffff"

[roles]
bg = "#29262f"
bg_deep = "#1f1c23"
surface = "#3e3d46"
fg = "#d9e6f2"
fg_soft = "#a4acb8"
fg_bright = "#ffffff"
grey = "#8a909a"
grey_dim = "#676973"
grey_neutral = "#9ba3ae"
grey_soft = "#787c87"
red = "#c37372"
orange = "#c29b72"
yellow = "#c2c372"
green = "#72c373"
aqua = "#72c2c3"
blue = "#7372c3"
purple = "#c372c2"
tint_green = "#36423b"
tint_red = "#45343b"
statusline = "#37353f"
statusline_accent = "#494952"
statusline_fg = "#d9e6f2"
on_accent = "#29262f"
mode_red = "#c37372"
mode_green = "#72c373"
mode_yellow = "#c2c372"
mode_blue = "#7372c3"
mode_purple = "#c372c2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
