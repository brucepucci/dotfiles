# GitHub Dark Colorblind
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0d1117"
foreground = "#c9d1d9"
cursor-color = "#58a6ff"
cursor-text = "#98e6ff"
selection-background = "#c9d1d9"
selection-foreground = "#0d1117"
palette_0 = "#484f58"
palette_1 = "#ec8e2c"
palette_2 = "#58a6ff"
palette_3 = "#d29922"
palette_4 = "#58a6ff"
palette_5 = "#bc8cff"
palette_6 = "#39c5cf"
palette_7 = "#b1bac4"
palette_8 = "#6e7681"
palette_9 = "#fdac54"
palette_10 = "#79c0ff"
palette_11 = "#e3b341"
palette_12 = "#79c0ff"
palette_13 = "#d2a8ff"
palette_14 = "#56d4dd"
palette_15 = "#ffffff"

[roles]
bg = "#0d1117"
bg_deep = "#0a0d11"
surface = "#24282e"
fg = "#c9d1d9"
fg_soft = "#91979f"
fg_bright = "#ffffff"
grey = "#747b82"
grey_dim = "#4f545b"
grey_neutral = "#878e95"
grey_soft = "#62676e"
red = "#ec8e2c"
orange = "#df9427"
yellow = "#d29922"
green = "#58a6ff"
aqua = "#39c5cf"
blue = "#58a6ff"
purple = "#bc8cff"
tint_green = "#1a2c41"
tint_red = "#35281b"
statusline = "#1c2027"
statusline_accent = "#2f343a"
statusline_fg = "#c9d1d9"
on_accent = "#0d1117"
mode_red = "#ec8e2c"
mode_green = "#58a6ff"
mode_yellow = "#d29922"
mode_blue = "#58a6ff"
mode_purple = "#bc8cff"

[apps]
