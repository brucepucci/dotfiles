# Novel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#dfdbc3"
foreground = "#3b2322"
cursor-color = "#73635a"
cursor-text = "#000000"
selection-background = "#a4a390"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc0000"
palette_2 = "#009600"
palette_3 = "#d06b00"
palette_4 = "#0000cc"
palette_5 = "#cc00cc"
palette_6 = "#0087cc"
palette_7 = "#a6a6a6"
palette_8 = "#808080"
palette_9 = "#cc0000"
palette_10 = "#009600"
palette_11 = "#d06b00"
palette_12 = "#0000cc"
palette_13 = "#cc00cc"
palette_14 = "#0087cc"
palette_15 = "#ffffff"

[roles]
bg = "#dfdbc3"
bg_deep = "#e7e4d2"
surface = "#cbc5b0"
fg = "#3b2322"
fg_soft = "#6c5a52"
fg_bright = "#261716"
grey = "#85766a"
grey_dim = "#a69b8b"
grey_neutral = "#74635a"
grey_soft = "#95887b"
red = "#cc0000"
orange = "#ce3600"
yellow = "#d06b00"
green = "#009600"
aqua = "#0087cc"
blue = "#0000cc"
purple = "#cc00cc"
tint_green = "#b7cfa0"
tint_red = "#dcb4a0"
statusline = "#d2ccb6"
statusline_accent = "#c1baa6"
statusline_fg = "#3b2322"
on_accent = "#dfdbc3"
mode_red = "#cc0000"
mode_green = "#009600"
mode_yellow = "#d06b00"
mode_blue = "#0000cc"
mode_purple = "#cc00cc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
