# Novel
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#dfdbc3"
foreground = "#3b2322"
cursor-color = "#73635a"
cursor-text = "#000000"
selection-background = "#a4a390"
selection-foreground = "#000000"
palette_0 = "#dfdbc3"
palette_1 = "#dfdbc3"
palette_2 = "#dfdbc3"
palette_3 = "#dfdbc3"
palette_4 = "#dfdbc3"
palette_5 = "#dfdbc3"
palette_6 = "#dfdbc3"
palette_7 = "#dfdbc3"
palette_8 = "#dfdbc3"
palette_9 = "#dfdbc3"
palette_10 = "#dfdbc3"
palette_11 = "#dfdbc3"
palette_12 = "#dfdbc3"
palette_13 = "#dfdbc3"
palette_14 = "#dfdbc3"
palette_15 = "#dfdbc3"

[roles]
bg = "#dfdbc3"
bg_deep = "#e7e4d2"
surface = "#cbc5b0"
fg = "#3b2322"
fg_soft = "#6c5a52"
fg_bright = "#261716"
grey = "#85766a"
grey_dim = "#a69b8b"
grey_neutral = "#74635a"
grey_soft = "#95887b"
red = "#dfdbc3"
orange = "#dfdbc3"
yellow = "#dfdbc3"
green = "#dfdbc3"
aqua = "#dfdbc3"
blue = "#dfdbc3"
purple = "#dfdbc3"
tint_green = "#dfdbc3"
tint_red = "#dfdbc3"
statusline = "#d2ccb6"
statusline_accent = "#c1baa6"
statusline_fg = "#3b2322"
on_accent = "#3b2322"
mode_red = "#dfdbc3"
mode_green = "#dfdbc3"
