# CGA
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#aaaaaa"
cursor-color = "#b8b8b8"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#aa0000"
palette_2 = "#00aa00"
palette_3 = "#aa5500"
palette_4 = "#0d0db7"
palette_5 = "#aa00aa"
palette_6 = "#00aaaa"
palette_7 = "#aaaaaa"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#141414"
fg = "#aaaaaa"
fg_soft = "#777777"
fg_bright = "#ffffff"
grey = "#5e5e5e"
grey_dim = "#3c3c3c"
grey_neutral = "#6e6e6e"
grey_soft = "#4c4c4c"
red = "#aa0000"
orange = "#aa2a00"
yellow = "#aa5500"
green = "#00aa00"
aqua = "#00aaaa"
blue = "#0d0db7"
purple = "#aa00aa"
tint_green = "#001f00"
tint_red = "#1f0000"
statusline = "#0e0e0e"
statusline_accent = "#1f1f1f"
statusline_fg = "#aaaaaa"
on_accent = "#aaaaaa"
mode_red = "#aa0000"
mode_green = "#00aa00"
mode_yellow = "#aa5500"
mode_blue = "#0d0db7"
mode_purple = "#aa00aa"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
