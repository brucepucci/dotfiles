palette_2 = "#587539"
palette_3 = "#8c6c3e"
palette_4 = "#2e7de9"
palette_5 = "#9854f1"
palette_6 = "#007197"
palette_7 = "#6172b0"
palette_8 = "#a1a6c5"
palette_9 = "#f52a65"
palette_10 = "#587539"
palette_11 = "#8c6c3e"
palette_12 = "#2e7de9"
palette_13 = "#9854f1"
palette_14 = "#007197"
palette_15 = "#3760bf"

[roles]
bg = "#e1e2e7"
bg_deep = "#e8e9ed"
surface = "#cdd2e2"
