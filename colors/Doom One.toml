# Doom One
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#bbc2cf"
cursor-color = "#51afef"
cursor-text = "#1b1b1b"
selection-background = "#42444b"
selection-foreground = "#bbc2cf"
palette_0 = "#000000"
palette_1 = "#ff6c6b"
palette_2 = "#98be65"
palette_3 = "#ecbe7b"
palette_4 = "#a9a1e1"
palette_5 = "#c678dd"
palette_6 = "#51afef"
palette_7 = "#bbc2cf"
palette_8 = "#595959"
palette_9 = "#ff6655"
palette_10 = "#99bb66"
palette_11 = "#ecbe7b"
palette_12 = "#a9a1e1"
palette_13 = "#c678dd"
palette_14 = "#51afef"
palette_15 = "#bfbfbf"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#3a3e47"
fg = "#bbc2cf"
fg_soft = "#8f95a0"
fg_bright = "#bfbfbf"
grey = "#797e89"
grey_dim = "#5b606a"
grey_neutral = "#888e99"
grey_soft = "#6a707a"
red = "#ff6c6b"
orange = "#f69573"
yellow = "#ecbe7b"
green = "#98be65"
aqua = "#51afef"
