palette_4 = "#45707a"
palette_5 = "#945e80"
palette_6 = "#4c7a5d"
palette_7 = "#654735"
palette_8 = "#a89984"
palette_9 = "#c14a4a"
palette_10 = "#6c782e"
palette_11 = "#b47109"
palette_12 = "#45707a"
palette_13 = "#945e80"
palette_14 = "#4c7a5d"
palette_15 = "#4f3829"

[roles]
