palette_6 = "#f0f0ca"
palette_7 = "#f0f0ca"
palette_8 = "#f0f0ca"
palette_9 = "#f0f0ca"
palette_10 = "#f0f0ca"
palette_11 = "#f0f0ca"
palette_12 = "#f0f0ca"
palette_13 = "#f0f0ca"
palette_14 = "#f0f0ca"
palette_15 = "#f0f0ca"

[roles]
