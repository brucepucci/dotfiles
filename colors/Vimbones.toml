# Vimbones
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f0f0ca"
foreground = "#353535"
cursor-color = "#353535"
cursor-text = "#f0f0ca"
selection-background = "#d7d7d7"
selection-foreground = "#353535"
palette_0 = "#f0f0ca"
palette_1 = "#a8334c"
palette_2 = "#4f6c31"
palette_3 = "#944927"
palette_4 = "#286486"
palette_5 = "#88507d"
palette_6 = "#3b8992"
palette_7 = "#353535"
palette_8 = "#acac89"
palette_9 = "#94253e"
palette_10 = "#3f5a22"
palette_11 = "#803d1c"
palette_12 = "#1d5573"
palette_13 = "#7b3b70"
palette_14 = "#2b747c"
palette_15 = "#5c5c5c"

[roles]
bg = "#f0f0ca"
bg_deep = "#f4f4d7"
surface = "#dadab8"
fg = "#353535"
fg_soft = "#6d6d62"
fg_bright = "#222222"
grey = "#898978"
grey_dim = "#afaf96"
grey_neutral = "#767669"
grey_soft = "#9c9c87"
red = "#a8334c"
orange = "#9e3e3a"
yellow = "#944927"
green = "#4f6c31"
aqua = "#3b8992"
blue = "#286486"
purple = "#88507d"
tint_green = "#d3d8ae"
