# GitHub Light Colorblind
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#24292f"
cursor-color = "#0969da"
cursor-text = "#3c9cff"
selection-background = "#24292f"
selection-foreground = "#ffffff"
palette_0 = "#24292f"
palette_1 = "#b35900"
palette_2 = "#0550ae"
palette_3 = "#4d2d00"
palette_4 = "#0969da"
palette_5 = "#8250df"
palette_6 = "#1b7c83"
palette_7 = "#6e7781"
palette_8 = "#57606a"
palette_9 = "#8a4600"
palette_10 = "#0969da"
palette_11 = "#633c01"
palette_12 = "#218bff"
palette_13 = "#a475f9"
palette_14 = "#3192aa"
palette_15 = "#8c959f"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e5e5e6"
fg = "#24292f"
fg_soft = "#66696d"
fg_bright = "#171b1f"
grey = "#87898d"
grey_dim = "#b2b4b6"
grey_neutral = "#717478"
grey_soft = "#9c9fa1"
red = "#b35900"
orange = "#804300"
yellow = "#4d2d00"
green = "#0550ae"
aqua = "#1b7c83"
blue = "#0969da"
purple = "#8250df"
tint_green = "#d2e0f0"
tint_red = "#f1e1d1"
statusline = "#edeeee"
statusline_accent = "#d8d8da"
statusline_fg = "#24292f"
on_accent = "#ffffff"
mode_red = "#b35900"
mode_green = "#0550ae"
mode_yellow = "#4d2d00"
mode_blue = "#0969da"
