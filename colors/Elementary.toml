# Elementary
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#181818"
foreground = "#efefef"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#242424"
palette_1 = "#d71c15"
palette_2 = "#5aa513"
palette_3 = "#fdb40c"
palette_4 = "#134899"
palette_5 = "#e40038"
palette_6 = "#2595e1"
palette_7 = "#efefef"
palette_8 = "#4b4b4b"
palette_9 = "#fc1c18"
palette_10 = "#6bc219"
palette_11 = "#fec80e"
palette_12 = "#0955ff"
palette_13 = "#fb0050"
palette_14 = "#3ea8fc"
palette_15 = "#8c00ec"

[roles]
bg = "#181818"
bg_deep = "#121212"
surface = "#323232"
fg = "#efefef"
fg_soft = "#aeaeae"
fg_bright = "#8c00ec"
grey = "#8e8e8e"
grey_dim = "#636363"
grey_neutral = "#a4a4a4"
grey_soft = "#797979"
red = "#d71c15"
orange = "#ea6810"
yellow = "#fdb40c"
green = "#5aa513"
aqua = "#2595e1"
blue = "#134899"
purple = "#e40038"
tint_green = "#243117"
tint_red = "#3a1917"
statusline = "#292929"
statusline_accent = "#3f3f3f"
statusline_fg = "#efefef"
on_accent = "#efefef"
mode_red = "#d71c15"
mode_green = "#5aa513"
