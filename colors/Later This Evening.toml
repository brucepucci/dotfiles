palette_3 = "#222222"
palette_4 = "#222222"
palette_5 = "#222222"
palette_6 = "#222222"
palette_7 = "#222222"
palette_8 = "#222222"
palette_9 = "#222222"
palette_10 = "#222222"
palette_11 = "#222222"
palette_12 = "#222222"
palette_13 = "#222222"
palette_14 = "#222222"
palette_15 = "#222222"

[roles]
