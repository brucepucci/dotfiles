# Later This Evening
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#222222"
foreground = "#959595"
cursor-color = "#4f4f4f"
cursor-text = "#959595"
selection-background = "#424242"
selection-foreground = "#959595"
palette_0 = "#2b2b2b"
palette_1 = "#d45a60"
palette_2 = "#afba67"
palette_3 = "#e5d289"
palette_4 = "#a0bad6"
palette_5 = "#c092d6"
palette_6 = "#91bfb7"
palette_7 = "#494a4a"
palette_8 = "#525454"
palette_9 = "#d3232f"
palette_10 = "#aabb39"
palette_11 = "#e5be39"
palette_12 = "#6699d6"
palette_13 = "#ab53d6"
palette_14 = "#5fc0ae"
palette_15 = "#c1c2c2"

[roles]
bg = "#222222"
bg_deep = "#1a1a1a"
surface = "#303030"
fg = "#959595"
fg_soft = "#727272"
fg_bright = "#c1c2c2"
grey = "#616161"
grey_dim = "#4a4a4a"
grey_neutral = "#6d6d6d"
grey_soft = "#565656"
red = "#d45a60"
orange = "#dc9674"
yellow = "#e5d289"
green = "#afba67"
aqua = "#91bfb7"
blue = "#a0bad6"
purple = "#c092d6"
tint_green = "#3b3d2e"
tint_red = "#422c2d"
statusline = "#2b2b2b"
