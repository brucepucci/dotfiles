# Poimandres White
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fefeff"
foreground = "#969cbd"
cursor-color = "#969cbd"
cursor-text = "#fefeff"
selection-background = "#969cbd"
selection-foreground = "#3b3e48"
palette_0 = "#fefeff"
palette_1 = "#ff2090"
palette_2 = "#01dab2"
palette_3 = "#e5ba4e"
palette_4 = "#8abacd"
palette_5 = "#eb8394"
palette_6 = "#8abacd"
palette_7 = "#000000"
palette_8 = "#969cbd"
palette_9 = "#ff2090"
palette_10 = "#01dab2"
palette_11 = "#e5ba4e"
palette_12 = "#0ebfff"
palette_13 = "#eb8394"
palette_14 = "#0ebfff"
palette_15 = "#000000"

[roles]
bg = "#fefeff"
bg_deep = "#fefeff"
surface = "#f2f2f7"
fg = "#969cbd"
fg_soft = "#b5b9d1"
fg_bright = "#62657b"
grey = "#c5c8db"
grey_dim = "#dadce8"
grey_neutral = "#babed4"
grey_soft = "#cfd2e1"
red = "#ff2090"
orange = "#f26d6f"
yellow = "#e5ba4e"
green = "#01dab2"
aqua = "#8abacd"
blue = "#8abacd"
purple = "#eb8394"
tint_green = "#d0f8f1"
tint_red = "#fed6eb"
statusline = "#f6f6fa"
statusline_accent = "#ebecf3"
statusline_fg = "#969cbd"
on_accent = "#fefeff"
mode_red = "#ff2090"
mode_green = "#01dab2"
mode_yellow = "#e5ba4e"
mode_blue = "#8abacd"
mode_purple = "#eb8394"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
