# Poimandres White
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fefeff"
foreground = "#969cbd"
cursor-color = "#969cbd"
cursor-text = "#fefeff"
selection-background = "#969cbd"
selection-foreground = "#3b3e48"
palette_0 = "#fefeff"
palette_1 = "#fefeff"
palette_2 = "#fefeff"
palette_3 = "#fefeff"
palette_4 = "#fefeff"
palette_5 = "#fefeff"
palette_6 = "#fefeff"
palette_7 = "#fefeff"
palette_8 = "#fefeff"
palette_9 = "#fefeff"
palette_10 = "#fefeff"
palette_11 = "#fefeff"
palette_12 = "#fefeff"
palette_13 = "#fefeff"
palette_14 = "#fefeff"
palette_15 = "#fefeff"

[roles]
bg = "#fefeff"
bg_deep = "#fefeff"
surface = "#f2f2f7"
fg = "#969cbd"
fg_soft = "#b5b9d1"
fg_bright = "#62657b"
grey = "#c5c8db"
grey_dim = "#dadce8"
grey_neutral = "#babed4"
grey_soft = "#cfd2e1"
red = "#fefeff"
orange = "#fefeff"
yellow = "#fefeff"
green = "#fefeff"
aqua = "#fefeff"
blue = "#fefeff"
purple = "#fefeff"
tint_green = "#fefeff"
tint_red = "#fefeff"
statusline = "#f6f6fa"
statusline_accent = "#ebecf3"
statusline_fg = "#969cbd"
on_accent = "#969cbd"
mode_red = "#fefeff"
mode_green = "#fefeff"
mode_yellow = "#fefeff"
mode_blue = "#fefeff"
mode_purple = "#fefeff"

[apps]
