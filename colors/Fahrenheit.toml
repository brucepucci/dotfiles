# Fahrenheit
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffce"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#4e739f"
selection-foreground = "#ffffce"
palette_0 = "#1d1d1d"
palette_1 = "#cda074"
palette_2 = "#9e744d"
palette_3 = "#fecf75"
palette_4 = "#7f0e0f"
palette_5 = "#734c4d"
palette_6 = "#979797"
palette_7 = "#ffffce"
palette_8 = "#404040"
palette_9 = "#fecea0"
palette_10 = "#cc734d"
palette_11 = "#fd9f4d"
palette_12 = "#cb4a05"
palette_13 = "#4e739f"
palette_14 = "#fed04d"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f19"
fg = "#ffffce"
fg_soft = "#b2b290"
fg_bright = "#ffffff"
grey = "#8c8c71"
grey_dim = "#595948"
grey_neutral = "#a6a686"
grey_soft = "#73735d"
red = "#cda074"
orange = "#e6b874"
yellow = "#fecf75"
green = "#9e744d"
aqua = "#979797"
blue = "#7f0e0f"
purple = "#734c4d"
tint_green = "#1c150e"
tint_red = "#251d15"
statusline = "#141410"
statusline_accent = "#2e2e25"
statusline_fg = "#ffffce"
on_accent = "#000000"
mode_red = "#cda074"
mode_green = "#9e744d"
mode_yellow = "#fecf75"
mode_blue = "#7f0e0f"
mode_purple = "#734c4d"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
