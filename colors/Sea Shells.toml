# Sea Shells
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#09141b"
foreground = "#deb88d"
cursor-color = "#fca02f"
cursor-text = "#08131a"
selection-background = "#1e4962"
selection-foreground = "#fee4ce"
palette_0 = "#17384c"
palette_1 = "#d15123"
palette_2 = "#027c9b"
palette_3 = "#fca02f"
palette_4 = "#1e4950"
palette_5 = "#68d4f1"
palette_6 = "#50a3b5"
palette_7 = "#deb88d"
palette_8 = "#434b53"
palette_9 = "#d48678"
palette_10 = "#628d98"
palette_11 = "#fdd39f"
palette_12 = "#1bbcdd"
palette_13 = "#bbe3ee"
palette_14 = "#87acb4"
palette_15 = "#fee4ce"

[roles]
bg = "#09141b"
bg_deep = "#070f14"
surface = "#232829"
fg = "#deb88d"
fg_soft = "#9e876b"
fg_bright = "#fee4ce"
grey = "#7e6e5a"
grey_dim = "#544d43"
grey_neutral = "#937f65"
grey_soft = "#695e4e"
red = "#d15123"
orange = "#e67829"
yellow = "#fca02f"
green = "#027c9b"
aqua = "#50a3b5"
