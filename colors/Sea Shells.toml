palette_2 = "#09141b"
palette_3 = "#09141b"
palette_4 = "#09141b"
palette_5 = "#09141b"
palette_6 = "#09141b"
palette_7 = "#09141b"
palette_8 = "#09141b"
palette_9 = "#09141b"
palette_10 = "#09141b"
palette_11 = "#09141b"
palette_12 = "#09141b"
palette_13 = "#09141b"
palette_14 = "#09141b"
palette_15 = "#09141b"

[roles]
