# Solarized Darcula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#3d3f41"
foreground = "#d2d8d9"
cursor-color = "#708284"
cursor-text = "#002831"
selection-background = "#214283"
selection-foreground = "#d2d8d9"
palette_0 = "#25292a"
palette_1 = "#f24840"
palette_2 = "#629655"
palette_3 = "#b68800"
palette_4 = "#2075c7"
palette_5 = "#797fd4"
palette_6 = "#15968d"
palette_7 = "#d2d8d9"
palette_8 = "#65696a"
palette_9 = "#f24840"
palette_10 = "#629655"
palette_11 = "#b68800"
palette_12 = "#2075c7"
palette_13 = "#797fd4"
palette_14 = "#15968d"
palette_15 = "#d2d8d9"

[roles]
bg = "#3d3f41"
bg_deep = "#2e2f31"
surface = "#4f5153"
fg = "#d2d8d9"
fg_soft = "#a5aaab"
fg_bright = "#d2d8d9"
grey = "#8f9395"
grey_dim = "#717576"
grey_neutral = "#9ea2a4"
