palette_9 = "#3d3f41"
palette_10 = "#3d3f41"
palette_11 = "#3d3f41"
palette_12 = "#3d3f41"
palette_13 = "#3d3f41"
palette_14 = "#3d3f41"
palette_15 = "#3d3f41"

[roles]
