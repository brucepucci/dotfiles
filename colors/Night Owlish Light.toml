# Night Owlish Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#403f53"
cursor-color = "#403f53"
cursor-text = "#fbfbfb"
selection-background = "#f2f2f2"
selection-foreground = "#403f53"
palette_0 = "#011627"
palette_1 = "#d3423e"
palette_2 = "#2aa298"
palette_3 = "#daaa01"
palette_4 = "#4876d6"
palette_5 = "#403f53"
palette_6 = "#08916a"
palette_7 = "#7a8181"
palette_8 = "#7a8181"
palette_9 = "#f76e6e"
palette_10 = "#49d0c5"
palette_11 = "#dac26b"
palette_12 = "#5ca7e4"
palette_13 = "#697098"
palette_14 = "#00c990"
palette_15 = "#989fb1"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e8e8ea"
fg = "#403f53"
fg_soft = "#797987"
fg_bright = "#2a2936"
grey = "#9695a0"
