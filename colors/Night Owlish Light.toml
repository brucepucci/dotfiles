# Night Owlish Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#403f53"
cursor-color = "#403f53"
cursor-text = "#fbfbfb"
selection-background = "#f2f2f2"
selection-foreground = "#403f53"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e8e8ea"
fg = "#403f53"
fg_soft = "#797987"
fg_bright = "#2a2936"
grey = "#9695a0"
grey_dim = "#bcbcc3"
grey_neutral = "#83828f"
grey_soft = "#a9a9b2"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
