palette_7 = "#070c0e"
palette_8 = "#070c0e"
palette_9 = "#070c0e"
palette_10 = "#070c0e"
palette_11 = "#070c0e"
palette_12 = "#070c0e"
palette_13 = "#070c0e"
palette_14 = "#070c0e"
palette_15 = "#070c0e"

