# Darkermatrix
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#070c0e"
foreground = "#35451a"
cursor-color = "#444733"
cursor-text = "#00ff87"
selection-background = "#0f191c"
selection-foreground = "#00ff87"
palette_0 = "#091013"
palette_1 = "#1a4831"
palette_2 = "#6fa64c"
palette_3 = "#595900"
palette_4 = "#00cb6b"
palette_5 = "#4e375a"
palette_6 = "#125459"
palette_7 = "#1a4833"
palette_8 = "#404040"
palette_9 = "#0d452a"
palette_10 = "#90d762"
palette_11 = "#e2e500"
palette_12 = "#00ff87"
palette_13 = "#4e375a"
palette_14 = "#176c73"
palette_15 = "#00381e"

[roles]
bg = "#070c0e"
bg_deep = "#05090a"
surface = "#0d130f"
fg = "#35451a"
fg_soft = "#273416"
fg_bright = "#00381e"
grey = "#202b15"
grey_dim = "#172012"
grey_neutral = "#253116"
grey_soft = "#1c2613"
red = "#1a4831"
orange = "#3a5018"
yellow = "#595900"
green = "#6fa64c"
aqua = "#125459"
blue = "#00cb6b"
purple = "#4e375a"
tint_green = "#1a2819"
tint_red = "#0a1714"
statusline = "#0b110f"
