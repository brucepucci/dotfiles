palette_8 = "#75644f"
palette_9 = "#cc967b"
palette_10 = "#97976d"
palette_11 = "#6c9861"
palette_12 = "#b5955e"
palette_13 = "#c9a554"
palette_14 = "#d7c483"
palette_15 = "#b5955e"

