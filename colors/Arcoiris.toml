# Arcoiris
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#201f1e"
foreground = "#eee4d9"
cursor-color = "#872929"
cursor-text = "#fffbf2"
selection-background = "#25524a"
selection-foreground = "#f3fffd"
palette_0 = "#333333"
palette_1 = "#da2700"
palette_2 = "#12c258"
palette_3 = "#ffc656"
palette_4 = "#518bfc"
palette_5 = "#e37bd9"
palette_6 = "#63fad5"
palette_7 = "#bab2b2"
palette_8 = "#777777"
palette_9 = "#ffb9b9"
palette_10 = "#e3f6aa"
palette_11 = "#ffddaa"
palette_12 = "#b3e8f3"
palette_13 = "#cbbaf9"
palette_14 = "#bcffc7"
palette_15 = "#efefef"

[roles]
bg = "#201f1e"
bg_deep = "#181716"
surface = "#393734"
fg = "#eee4d9"
fg_soft = "#b0a9a1"
fg_bright = "#efefef"
grey = "#918b85"
grey_dim = "#68645f"
grey_neutral = "#a69f98"
grey_soft = "#7d7872"
red = "#da2700"
orange = "#ec762b"
yellow = "#ffc656"
green = "#12c258"
aqua = "#63fad5"
blue = "#518bfc"
purple = "#e37bd9"
tint_green = "#1d3c28"
tint_red = "#412019"
statusline = "#302f2d"
statusline_accent = "#454240"
statusline_fg = "#eee4d9"
on_accent = "#201f1e"
mode_red = "#da2700"
mode_green = "#12c258"
mode_yellow = "#ffc656"
mode_blue = "#518bfc"
