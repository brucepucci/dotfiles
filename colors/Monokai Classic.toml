palette_2 = "#a6e22e"
palette_3 = "#e6db74"
palette_4 = "#fd971f"
palette_5 = "#ae81ff"
palette_6 = "#66d9ef"
palette_7 = "#fdfff1"
palette_8 = "#6e7066"
palette_9 = "#f92672"
palette_10 = "#a6e22e"
palette_11 = "#e6db74"
palette_12 = "#fd971f"
palette_13 = "#ae81ff"
palette_14 = "#66d9ef"
palette_15 = "#fdfff1"

[roles]
