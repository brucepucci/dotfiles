# Electron Highlighter
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#23283d"
foreground = "#a5b6d4"
cursor-color = "#a5b6d4"
cursor-text = "#1a1b27"
selection-background = "#25345a"
selection-foreground = "#a5b6d4"
palette_0 = "#15161f"
palette_1 = "#ff6c8d"
palette_2 = "#00ffc3"
palette_3 = "#ffd7a9"
palette_4 = "#77abff"
palette_5 = "#daa4f4"
palette_6 = "#00fdff"
palette_7 = "#778faf"
palette_8 = "#4a6789"
palette_9 = "#ff6c8d"
palette_10 = "#00ffc3"
palette_11 = "#ffd7a9"
palette_12 = "#77abff"
palette_13 = "#daa4f4"
palette_14 = "#00fdff"
palette_15 = "#c3cee2"

[roles]
bg = "#23283d"
bg_deep = "#1a1e2e"
surface = "#33394f"
fg = "#a5b6d4"
fg_soft = "#7e8ba7"
fg_bright = "#c3cee2"
grey = "#6a7690"
grey_dim = "#505a72"
grey_neutral = "#78849f"
grey_soft = "#5e6881"
red = "#ff6c8d"
orange = "#ffa29b"
yellow = "#ffd7a9"
green = "#00ffc3"
aqua = "#00fdff"
blue = "#77abff"
purple = "#daa4f4"
tint_green = "#1d4f55"
tint_red = "#4b344b"
statusline = "#2d3349"
statusline_accent = "#3a4258"
statusline_fg = "#a5b6d4"
on_accent = "#23283d"
mode_red = "#ff6c8d"
mode_green = "#00ffc3"
mode_yellow = "#ffd7a9"
mode_blue = "#77abff"
mode_purple = "#daa4f4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
