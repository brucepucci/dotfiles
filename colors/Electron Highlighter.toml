# Electron Highlighter
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#23283d"
foreground = "#a5b6d4"
cursor-color = "#a5b6d4"
cursor-text = "#1a1b27"
selection-background = "#25345a"
selection-foreground = "#a5b6d4"
palette_0 = "#23283d"
palette_1 = "#23283d"
palette_2 = "#23283d"
palette_3 = "#23283d"
palette_4 = "#23283d"
palette_5 = "#23283d"
palette_6 = "#23283d"
palette_7 = "#23283d"
palette_8 = "#23283d"
palette_9 = "#23283d"
palette_10 = "#23283d"
palette_11 = "#23283d"
palette_12 = "#23283d"
palette_13 = "#23283d"
palette_14 = "#23283d"
palette_15 = "#23283d"

[roles]
bg = "#23283d"
bg_deep = "#1a1e2e"
surface = "#33394f"
fg = "#a5b6d4"
fg_soft = "#7e8ba7"
fg_bright = "#23283d"
grey = "#6a7690"
grey_dim = "#505a72"
grey_neutral = "#78849f"
grey_soft = "#5e6881"
red = "#23283d"
orange = "#23283d"
yellow = "#23283d"
green = "#23283d"
aqua = "#23283d"
blue = "#23283d"
purple = "#23283d"
tint_green = "#23283d"
tint_red = "#23283d"
statusline = "#2d3349"
statusline_accent = "#3a4258"
statusline_fg = "#a5b6d4"
on_accent = "#a5b6d4"
mode_red = "#23283d"
mode_green = "#23283d"
mode_yellow = "#23283d"
mode_blue = "#23283d"
mode_purple = "#23283d"

[apps]
