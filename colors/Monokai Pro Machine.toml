palette_3 = "#273136"
palette_4 = "#273136"
palette_5 = "#273136"
palette_6 = "#273136"
palette_7 = "#273136"
palette_8 = "#273136"
palette_9 = "#273136"
palette_10 = "#273136"
palette_11 = "#273136"
palette_12 = "#273136"
palette_13 = "#273136"
palette_14 = "#273136"
palette_15 = "#273136"

[roles]
