# Monokai Pro Machine
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#273136"
foreground = "#f2fffc"
cursor-color = "#b8c4c3"
cursor-text = "#859190"
selection-background = "#545f62"
selection-foreground = "#f2fffc"
palette_0 = "#273136"
palette_1 = "#ff6d7e"
palette_2 = "#a2e57b"
palette_3 = "#ffed72"
palette_4 = "#ffb270"
palette_5 = "#baa0f8"
palette_6 = "#7cd5f1"
palette_7 = "#f2fffc"
palette_8 = "#6b7678"
palette_9 = "#ff6d7e"
palette_10 = "#a2e57b"
palette_11 = "#ffed72"
palette_12 = "#ffb270"
palette_13 = "#baa0f8"
palette_14 = "#7cd5f1"
palette_15 = "#f2fffc"

[roles]
bg = "#273136"
bg_deep = "#1d2528"
surface = "#3f4a4e"
fg = "#f2fffc"
fg_soft = "#b5c1c1"
fg_bright = "#f2fffc"
grey = "#97a2a3"
grey_dim = "#6e797b"
