palette_7 = "#111416"
palette_8 = "#111416"
palette_9 = "#111416"
palette_10 = "#111416"
palette_11 = "#111416"
palette_12 = "#111416"
palette_13 = "#111416"
palette_14 = "#111416"
palette_15 = "#111416"

