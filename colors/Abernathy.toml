# Abernathy
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#111416"
foreground = "#eeeeec"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#eeeeec"
selection-foreground = "#333333"
palette_0 = "#000000"
palette_1 = "#cd0000"
palette_2 = "#00cd00"
palette_3 = "#cdcd00"
palette_4 = "#1093f5"
palette_5 = "#cd00cd"
palette_6 = "#00cdcd"
palette_7 = "#faebd7"
palette_8 = "#404040"
palette_9 = "#ff0000"
palette_10 = "#00ff00"
palette_11 = "#ffff00"
palette_12 = "#11b5f6"
palette_13 = "#ff00ff"
palette_14 = "#00ffff"
palette_15 = "#ffffff"

[roles]
bg = "#111416"
bg_deep = "#0d0f10"
surface = "#2c2e30"
fg = "#eeeeec"
fg_soft = "#acadac"
fg_bright = "#ffffff"
grey = "#8b8c8c"
grey_dim = "#5e6061"
grey_neutral = "#a1a2a1"
grey_soft = "#747676"
red = "#cd0000"
orange = "#cd6600"
yellow = "#cdcd00"
green = "#00cd00"
aqua = "#00cdcd"
blue = "#1093f5"
purple = "#cd00cd"
tint_green = "#0e3512"
tint_red = "#331012"
statusline = "#232527"
statusline_accent = "#393b3d"
statusline_fg = "#eeeeec"
on_accent = "#eeeeec"
mode_red = "#cd0000"
mode_green = "#00cd00"
mode_yellow = "#cdcd00"
mode_blue = "#1093f5"
mode_purple = "#cd00cd"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
