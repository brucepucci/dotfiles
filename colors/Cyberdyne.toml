# Cyberdyne
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#151144"
foreground = "#00ff92"
cursor-color = "#00ff9c"
cursor-text = "#a6a6a6"
selection-background = "#454d96"
selection-foreground = "#f4f4f4"
palette_0 = "#080808"
palette_1 = "#ff8373"
palette_2 = "#00c172"
palette_3 = "#d2a700"
palette_4 = "#0071cf"
palette_5 = "#ff90fe"
palette_6 = "#6bffdd"
palette_7 = "#f1f1f1"
palette_8 = "#484848"
palette_9 = "#ffc4be"
palette_10 = "#d6fcba"
palette_11 = "#fffed5"
palette_12 = "#c2e3ff"
palette_13 = "#ffb2fe"
palette_14 = "#e6e7fe"
palette_15 = "#ffffff"

[roles]
bg = "#151144"
bg_deep = "#100d33"
surface = "#122e4d"
fg = "#00ff92"
fg_soft = "#06b87b"
fg_bright = "#ffffff"
grey = "#09946f"
grey_dim = "#0e645f"
grey_neutral = "#07ac77"
grey_soft = "#0c7c67"
red = "#ff8373"
orange = "#e8953a"
yellow = "#d2a700"
green = "#00c172"
aqua = "#6bffdd"
blue = "#0071cf"
purple = "#ff90fe"
tint_green = "#11314c"
tint_red = "#3f264c"
statusline = "#13244a"
statusline_accent = "#113c52"
statusline_fg = "#00ff92"
on_accent = "#151144"
mode_red = "#ff8373"
mode_green = "#00c172"
mode_yellow = "#d2a700"
mode_blue = "#0071cf"
mode_purple = "#ff90fe"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
