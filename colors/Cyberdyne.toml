palette_2 = "#151144"
palette_3 = "#151144"
palette_4 = "#151144"
palette_5 = "#151144"
palette_6 = "#151144"
palette_7 = "#151144"
palette_8 = "#151144"
palette_9 = "#151144"
palette_10 = "#151144"
palette_11 = "#151144"
palette_12 = "#151144"
palette_13 = "#151144"
palette_14 = "#151144"
palette_15 = "#151144"

[roles]
