# GitHub Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101216"
foreground = "#8b949e"
cursor-color = "#c9d1d9"
cursor-text = "#101216"
selection-background = "#3b5070"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#f78166"
palette_2 = "#56d364"
palette_3 = "#e3b341"
palette_4 = "#6ca4f8"
palette_5 = "#db61a2"
palette_6 = "#2b7489"
palette_7 = "#ffffff"
palette_8 = "#4d4d4d"
palette_9 = "#f78166"
palette_10 = "#56d364"
palette_11 = "#e3b341"
palette_12 = "#6ca4f8"
palette_13 = "#db61a2"
palette_14 = "#2b7489"
palette_15 = "#ffffff"

[roles]
bg = "#101216"
bg_deep = "#0c0e10"
surface = "#1f2226"
fg = "#8b949e"
fg_soft = "#666d75"
fg_bright = "#ffffff"
grey = "#545a61"
grey_dim = "#3b4046"
grey_neutral = "#60666e"
grey_soft = "#474c53"
red = "#f78166"
orange = "#ed9a54"
yellow = "#e3b341"
green = "#56d364"
aqua = "#2b7489"
blue = "#6ca4f8"
purple = "#db61a2"
tint_green = "#1d3524"
tint_red = "#3a2624"
statusline = "#1a1c21"
statusline_accent = "#26292e"
statusline_fg = "#8b949e"
on_accent = "#101216"
mode_red = "#f78166"
mode_green = "#56d364"
mode_yellow = "#e3b341"
mode_blue = "#6ca4f8"
