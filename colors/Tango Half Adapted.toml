# Tango Half Adapted
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#ff0000"
palette_2 = "#4cc300"
palette_3 = "#e2c000"
palette_4 = "#008ef6"
palette_5 = "#a96cb3"
palette_6 = "#00bdc3"
palette_7 = "#babfb5"
palette_8 = "#797d76"
palette_9 = "#ff0013"
palette_10 = "#70dc00"
palette_11 = "#d9c600"
palette_12 = "#76bfff"
palette_13 = "#d898d1"
palette_14 = "#00d0d4"
palette_15 = "#f4f4f2"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#ff0000"
orange = "#f06000"
yellow = "#e2c000"
green = "#4cc300"
aqua = "#00bdc3"
blue = "#008ef6"
purple = "#a96cb3"
tint_green = "#dff4d1"
tint_red = "#ffd1d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#ff0000"
mode_green = "#4cc300"
mode_yellow = "#e2c000"
mode_blue = "#008ef6"
mode_purple = "#a96cb3"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
