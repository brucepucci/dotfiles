# Night Owl
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#011627"
foreground = "#d6deeb"
cursor-color = "#7e57c2"
cursor-text = "#ffffff"
selection-background = "#5f7e97"
selection-foreground = "#dfe5ee"
palette_0 = "#011627"
palette_1 = "#ef5350"
palette_2 = "#22da6e"
palette_3 = "#addb67"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#21c7a8"
palette_7 = "#ffffff"
palette_8 = "#575656"
palette_9 = "#ef5350"
palette_10 = "#22da6e"
palette_11 = "#ffeb95"
palette_12 = "#82aaff"
palette_13 = "#c792ea"
palette_14 = "#7fdbca"
palette_15 = "#ffffff"

[roles]
bg = "#011627"
bg_deep = "#01101d"
surface = "#1b2e3f"
fg = "#d6deeb"
fg_soft = "#96a2b0"
fg_bright = "#ffffff"
grey = "#768493"
grey_dim = "#4c5c6c"
grey_neutral = "#8b98a6"
grey_soft = "#61707f"
red = "#ef5350"
orange = "#ce975c"
yellow = "#addb67"
green = "#22da6e"
aqua = "#21c7a8"
blue = "#82aaff"
purple = "#c792ea"
tint_green = "#073934"
tint_red = "#2c212e"
statusline = "#122637"
statusline_accent = "#273a4a"
statusline_fg = "#d6deeb"
on_accent = "#011627"
mode_red = "#ef5350"
mode_green = "#22da6e"
mode_yellow = "#addb67"
mode_blue = "#82aaff"
