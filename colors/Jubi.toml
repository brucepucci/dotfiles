# Jubi
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#262b33"
foreground = "#c3d3de"
cursor-color = "#c3d3de"
cursor-text = "#1e1b2e"
selection-background = "#5b5184"
selection-foreground = "#1e1b2e"
palette_0 = "#3b3750"
palette_1 = "#cf7b98"
palette_2 = "#90a94b"
palette_3 = "#6ebfc0"
palette_4 = "#576ea6"
palette_5 = "#bc4f68"
palette_6 = "#75a7d2"
palette_7 = "#c3d3de"
palette_8 = "#a874ce"
palette_9 = "#de90ab"
palette_10 = "#bcdd61"
palette_11 = "#87e9ea"
palette_12 = "#8c9fcd"
palette_13 = "#e16c87"
palette_14 = "#b7c9ef"
palette_15 = "#d5e5f1"

[roles]
bg = "#262b33"
bg_deep = "#1c2026"
surface = "#393f48"
fg = "#c3d3de"
fg_soft = "#94a1ab"
fg_bright = "#d5e5f1"
grey = "#7c8791"
grey_dim = "#5d666f"
grey_neutral = "#8c98a2"
grey_soft = "#6d7780"
red = "#cf7b98"
orange = "#9e9dac"
yellow = "#6ebfc0"
green = "#90a94b"
aqua = "#75a7d2"
blue = "#576ea6"
purple = "#bc4f68"
tint_green = "#394237"
tint_red = "#443945"
statusline = "#333841"
