palette_2 = "#262b33"
palette_3 = "#262b33"
palette_4 = "#262b33"
palette_5 = "#262b33"
palette_6 = "#262b33"
palette_7 = "#262b33"
palette_8 = "#262b33"
palette_9 = "#262b33"
palette_10 = "#262b33"
palette_11 = "#262b33"
palette_12 = "#262b33"
palette_13 = "#262b33"
palette_14 = "#262b33"
palette_15 = "#262b33"

[roles]
