# Pnevma
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1c1c"
foreground = "#d0d0d0"
cursor-color = "#e4c9af"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#1c1c1c"
palette_1 = "#1c1c1c"
palette_2 = "#1c1c1c"
palette_3 = "#1c1c1c"
palette_4 = "#1c1c1c"
palette_5 = "#1c1c1c"
palette_6 = "#1c1c1c"
palette_7 = "#1c1c1c"
palette_8 = "#1c1c1c"
palette_9 = "#1c1c1c"
palette_10 = "#1c1c1c"
palette_11 = "#1c1c1c"
palette_12 = "#1c1c1c"
palette_13 = "#1c1c1c"
palette_14 = "#1c1c1c"
palette_15 = "#1c1c1c"

[roles]
bg = "#1c1c1c"
bg_deep = "#151515"
surface = "#323232"
fg = "#d0d0d0"
fg_soft = "#9a9a9a"
fg_bright = "#1c1c1c"
grey = "#7f7f7f"
grey_dim = "#5b5b5b"
grey_neutral = "#919191"
grey_soft = "#6d6d6d"
red = "#1c1c1c"
orange = "#1c1c1c"
