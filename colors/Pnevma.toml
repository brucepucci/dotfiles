# Pnevma
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1c1c1c"
foreground = "#d0d0d0"
cursor-color = "#e4c9af"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#2f2e2d"
palette_1 = "#a36666"
palette_2 = "#90a57d"
palette_3 = "#d7af87"
palette_4 = "#7fa5bd"
palette_5 = "#c79ec4"
palette_6 = "#8adbb4"
palette_7 = "#d0d0d0"
palette_8 = "#4a4845"
palette_9 = "#d78787"
palette_10 = "#afbea2"
palette_11 = "#e4c9af"
palette_12 = "#a1bdce"
palette_13 = "#d7beda"
palette_14 = "#b1e7dd"
palette_15 = "#efefef"

[roles]
bg = "#1c1c1c"
bg_deep = "#151515"
surface = "#323232"
fg = "#d0d0d0"
fg_soft = "#9a9a9a"
fg_bright = "#efefef"
grey = "#7f7f7f"
grey_dim = "#5b5b5b"
grey_neutral = "#919191"
grey_soft = "#6d6d6d"
red = "#a36666"
orange = "#bd8a76"
yellow = "#d7af87"
green = "#90a57d"
aqua = "#8adbb4"
blue = "#7fa5bd"
purple = "#c79ec4"
tint_green = "#31352d"
tint_red = "#342929"
statusline = "#2a2a2a"
statusline_accent = "#3c3c3c"
statusline_fg = "#d0d0d0"
on_accent = "#1c1c1c"
mode_red = "#a36666"
mode_green = "#90a57d"
mode_yellow = "#d7af87"
mode_blue = "#7fa5bd"
mode_purple = "#c79ec4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
