# Gruvbox Material
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d2021"
foreground = "#d4be98"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#2b2c3f"
selection-foreground = "#7cfb70"
palette_0 = "#141617"
palette_1 = "#ea6926"
palette_2 = "#c1d041"
palette_3 = "#eecf75"
palette_4 = "#6da3ec"
palette_5 = "#fd9bc1"
palette_6 = "#fe9d6e"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#d3573b"
palette_10 = "#c1d041"
palette_11 = "#eecf75"
palette_12 = "#2c86ff"
palette_13 = "#fd9bc1"
palette_14 = "#92a5df"
palette_15 = "#ffffff"

[roles]
bg = "#1d2021"
bg_deep = "#161819"
surface = "#33332f"
fg = "#d4be98"
fg_soft = "#9d8f74"
fg_bright = "#ffffff"
