# Fideloper
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#292f33"
foreground = "#dbdae0"
cursor-color = "#d4605a"
cursor-text = "#fefff2"
selection-background = "#efb8ac"
selection-foreground = "#8c8c8c"
palette_0 = "#292f33"
palette_1 = "#cb1e2d"
palette_2 = "#edb8ac"
palette_3 = "#b7ab9b"
palette_4 = "#2e78c2"
palette_5 = "#c0236f"
palette_6 = "#309186"
palette_7 = "#eae3ce"
palette_8 = "#496068"
palette_9 = "#d4605a"
palette_10 = "#d4605a"
palette_11 = "#a86671"
palette_12 = "#7c85c4"
palette_13 = "#5c5db2"
palette_14 = "#819090"
palette_15 = "#fcf4df"

[roles]
bg = "#292f33"
bg_deep = "#1f2326"
surface = "#3e4448"
fg = "#dbdae0"
fg_soft = "#a6a7ac"
fg_bright = "#fcf4df"
grey = "#8b8d92"
