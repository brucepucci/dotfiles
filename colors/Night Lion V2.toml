# Night Lion V2
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#171717"
foreground = "#bbbbbb"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#b5d5ff"
selection-foreground = "#000000"
palette_0 = "#4c4c4c"
palette_1 = "#bb0000"
palette_2 = "#04f623"
palette_3 = "#f3f167"
palette_4 = "#64d0f0"
palette_5 = "#ce6fdb"
palette_6 = "#00dadf"
palette_7 = "#bbbbbb"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#7df71d"
palette_11 = "#ffff55"
palette_12 = "#62cbe8"
palette_13 = "#ff9bf5"
palette_14 = "#00ccd8"
palette_15 = "#ffffff"

[roles]
bg = "#171717"
bg_deep = "#111111"
surface = "#2b2b2b"
fg = "#bbbbbb"
fg_soft = "#8a8a8a"
fg_bright = "#ffffff"
grey = "#717171"
grey_dim = "#505050"
grey_neutral = "#828282"
grey_soft = "#616161"
red = "#bb0000"
orange = "#d77834"
yellow = "#f3f167"
green = "#04f623"
aqua = "#00dadf"
blue = "#64d0f0"
purple = "#ce6fdb"
tint_green = "#143f19"
tint_red = "#351313"
statusline = "#242424"
statusline_accent = "#353535"
statusline_fg = "#bbbbbb"
on_accent = "#171717"
mode_red = "#bb0000"
mode_green = "#04f623"
mode_yellow = "#f3f167"
mode_blue = "#64d0f0"
mode_purple = "#ce6fdb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
