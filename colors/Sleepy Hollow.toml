# Sleepy Hollow
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#121214"
foreground = "#af9a91"
cursor-color = "#af9a91"
cursor-text = "#391a02"
selection-background = "#575256"
selection-foreground = "#d2c7a9"
palette_0 = "#572100"
palette_1 = "#ba3934"
palette_2 = "#91773f"
palette_3 = "#b55600"
palette_4 = "#5f63b4"
palette_5 = "#a17c7b"
palette_6 = "#8faea9"
palette_7 = "#af9a91"
palette_8 = "#4e4b61"
palette_9 = "#d9443f"
palette_10 = "#d6b04e"
palette_11 = "#f66813"
palette_12 = "#8086ef"
palette_13 = "#e2c2bb"
palette_14 = "#a4dce7"
palette_15 = "#d2c7a9"

[roles]
bg = "#121214"
bg_deep = "#0e0e0f"
surface = "#252223"
fg = "#af9a91"
fg_soft = "#80716c"
