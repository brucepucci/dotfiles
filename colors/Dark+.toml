# Dark+
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#cccccc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#3a3d41"
selection-foreground = "#e0e0e0"
palette_0 = "#000000"
palette_1 = "#cd3131"
palette_2 = "#0dbc79"
palette_3 = "#e5e510"
palette_4 = "#2472c8"
palette_5 = "#bc3fbc"
palette_6 = "#11a8cd"
palette_7 = "#e5e5e5"
palette_8 = "#666666"
palette_9 = "#f14c4c"
palette_10 = "#23d18b"
palette_11 = "#f5f543"
palette_12 = "#3b8eea"
palette_13 = "#d670d6"
palette_14 = "#29b8db"
palette_15 = "#e5e5e5"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#333333"
fg = "#cccccc"
fg_soft = "#989898"
fg_bright = "#e5e5e5"
grey = "#7e7e7e"
grey_dim = "#5b5b5b"
grey_neutral = "#8f8f8f"
grey_soft = "#6c6c6c"
red = "#cd3131"
orange = "#d98b20"
yellow = "#e5e510"
green = "#0dbc79"
aqua = "#11a8cd"
blue = "#2472c8"
purple = "#bc3fbc"
tint_green = "#1b3a2e"
tint_red = "#3e2121"
statusline = "#2c2c2c"
statusline_accent = "#3d3d3d"
statusline_fg = "#cccccc"
on_accent = "#1e1e1e"
mode_red = "#cd3131"
mode_green = "#0dbc79"
mode_yellow = "#e5e510"
mode_blue = "#2472c8"
mode_purple = "#bc3fbc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
