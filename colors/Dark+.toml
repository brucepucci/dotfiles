# Dark+
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1e1e"
foreground = "#cccccc"
cursor-color = "#ffffff"
cursor-text = "#000000"
selection-background = "#3a3d41"
selection-foreground = "#e0e0e0"
palette_0 = "#1e1e1e"
palette_1 = "#1e1e1e"
palette_2 = "#1e1e1e"
palette_3 = "#1e1e1e"
palette_4 = "#1e1e1e"
palette_5 = "#1e1e1e"
palette_6 = "#1e1e1e"
palette_7 = "#1e1e1e"
palette_8 = "#1e1e1e"
palette_9 = "#1e1e1e"
palette_10 = "#1e1e1e"
palette_11 = "#1e1e1e"
palette_12 = "#1e1e1e"
palette_13 = "#1e1e1e"
palette_14 = "#1e1e1e"
palette_15 = "#1e1e1e"

[roles]
bg = "#1e1e1e"
bg_deep = "#161616"
surface = "#333333"
fg = "#cccccc"
fg_soft = "#989898"
fg_bright = "#1e1e1e"
grey = "#7e7e7e"
grey_dim = "#5b5b5b"
grey_neutral = "#8f8f8f"
grey_soft = "#6c6c6c"
red = "#1e1e1e"
orange = "#1e1e1e"
yellow = "#1e1e1e"
green = "#1e1e1e"
aqua = "#1e1e1e"
blue = "#1e1e1e"
purple = "#1e1e1e"
tint_green = "#1e1e1e"
tint_red = "#1e1e1e"
statusline = "#2c2c2c"
statusline_accent = "#3d3d3d"
statusline_fg = "#cccccc"
on_accent = "#cccccc"
mode_red = "#1e1e1e"
mode_green = "#1e1e1e"
mode_yellow = "#1e1e1e"
mode_blue = "#1e1e1e"
