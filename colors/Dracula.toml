# Dracula
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282a36"
foreground = "#f8f8f2"
cursor-color = "#f8f8f2"
cursor-text = "#282a36"
selection-background = "#44475a"
selection-foreground = "#ffffff"
palette_0 = "#21222c"
palette_1 = "#ff5555"
palette_2 = "#50fa7b"
palette_3 = "#f1fa8c"
palette_4 = "#bd93f9"
palette_5 = "#ff79c6"
palette_6 = "#8be9fd"
palette_7 = "#f8f8f2"
palette_8 = "#6272a4"
palette_9 = "#ff6e6e"
palette_10 = "#69ff94"
palette_11 = "#ffffa5"
palette_12 = "#d6acff"
palette_13 = "#ff92df"
palette_14 = "#a4ffff"
palette_15 = "#ffffff"

[roles]
bg = "#282a36"
bg_deep = "#1e2028"
surface = "#41434d"
fg = "#f8f8f2"
fg_soft = "#bababa"
fg_bright = "#ffffff"
grey = "#9a9b9d"
grey_dim = "#717278"
grey_neutral = "#afb0b0"
grey_soft = "#86878b"
red = "#ff5555"
orange = "#f8a870"
yellow = "#f1fa8c"
green = "#50fa7b"
aqua = "#8be9fd"
blue = "#bd93f9"
purple = "#ff79c6"
tint_green = "#2f4f42"
tint_red = "#4f323c"
statusline = "#393a45"
statusline_accent = "#4d4f58"
statusline_fg = "#f8f8f2"
on_accent = "#282a36"
mode_red = "#ff5555"
mode_green = "#50fa7b"
mode_yellow = "#f1fa8c"
mode_blue = "#bd93f9"
mode_purple = "#ff79c6"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
