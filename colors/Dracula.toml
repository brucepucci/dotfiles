palette_2 = "#282a36"
palette_3 = "#282a36"
palette_4 = "#282a36"
palette_5 = "#282a36"
palette_6 = "#282a36"
palette_7 = "#282a36"
palette_8 = "#282a36"
palette_9 = "#282a36"
palette_10 = "#282a36"
palette_11 = "#282a36"
palette_12 = "#282a36"
palette_13 = "#282a36"
palette_14 = "#282a36"
palette_15 = "#282a36"

[roles]
