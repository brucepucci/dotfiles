# iTerm2 Tango Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#000000"
cursor-color = "#000000"
cursor-text = "#ffffff"
selection-background = "#c1deff"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#d81e00"
palette_2 = "#5ea702"
palette_3 = "#cfae00"
palette_4 = "#427ab3"
palette_5 = "#89658e"
palette_6 = "#00a7aa"
palette_7 = "#c1c4be"
palette_8 = "#686a66"
palette_9 = "#f54235"
palette_10 = "#8cd636"
palette_11 = "#d7c53b"
palette_12 = "#84b0d8"
palette_13 = "#bc94b7"
palette_14 = "#1eccce"
palette_15 = "#f1f1f0"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e0e0e0"
fg = "#000000"
fg_soft = "#4c4c4c"
fg_bright = "#000000"
grey = "#737373"
grey_dim = "#a6a6a6"
grey_neutral = "#595959"
grey_soft = "#8c8c8c"
red = "#d81e00"
orange = "#d46600"
yellow = "#cfae00"
green = "#5ea702"
aqua = "#00a7aa"
blue = "#427ab3"
purple = "#89658e"
tint_green = "#e2efd1"
tint_red = "#f8d6d1"
statusline = "#ebebeb"
statusline_accent = "#d1d1d1"
statusline_fg = "#000000"
on_accent = "#ffffff"
mode_red = "#d81e00"
mode_green = "#5ea702"
mode_yellow = "#cfae00"
mode_blue = "#427ab3"
mode_purple = "#89658e"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
