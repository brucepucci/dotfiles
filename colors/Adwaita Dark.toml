palette_2 = "#1d1d20"
palette_3 = "#1d1d20"
palette_4 = "#1d1d20"
palette_5 = "#1d1d20"
palette_6 = "#1d1d20"
palette_7 = "#1d1d20"
palette_8 = "#1d1d20"
palette_9 = "#1d1d20"
palette_10 = "#1d1d20"
palette_11 = "#1d1d20"
palette_12 = "#1d1d20"
palette_13 = "#1d1d20"
palette_14 = "#1d1d20"
palette_15 = "#1d1d20"

[roles]
bg = "#1d1d20"
bg_deep = "#161618"
surface = "#38383b"
fg = "#ffffff"
fg_soft = "#bbbbbc"
fg_bright = "#1d1d20"
