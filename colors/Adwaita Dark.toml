# Adwaita Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1d20"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#1d1d20"
selection-background = "#ffffff"
selection-foreground = "#5e5c64"
palette_0 = "#241f31"
palette_1 = "#c01c28"
palette_2 = "#2ec27e"
palette_3 = "#f5c211"
palette_4 = "#1e78e4"
palette_5 = "#9841bb"
palette_6 = "#0ab9dc"
palette_7 = "#c0bfbc"
palette_8 = "#5e5c64"
palette_9 = "#ed333b"
palette_10 = "#57e389"
palette_11 = "#f8e45c"
palette_12 = "#51a1ff"
palette_13 = "#c061cb"
palette_14 = "#4fd2fd"
palette_15 = "#f6f5f4"

[roles]
bg = "#1d1d20"
bg_deep = "#161618"
surface = "#38383b"
fg = "#ffffff"
fg_soft = "#bbbbbc"
fg_bright = "#f6f5f4"
grey = "#99999b"
grey_dim = "#6c6c6e"
grey_neutral = "#b0b0b1"
grey_soft = "#838384"
red = "#c01c28"
orange = "#da6f1c"
yellow = "#f5c211"
green = "#2ec27e"
aqua = "#0ab9dc"
blue = "#1e78e4"
purple = "#9841bb"
tint_green = "#203b31"
tint_red = "#3a1d21"
statusline = "#2f2f32"
statusline_accent = "#464648"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#c01c28"
mode_green = "#2ec27e"
mode_yellow = "#f5c211"
mode_blue = "#1e78e4"
mode_purple = "#9841bb"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
