# Wez
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#b3b3b3"
cursor-color = "#53ae71"
cursor-text = "#000000"
selection-background = "#4d52f8"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#cc5555"
palette_2 = "#55cc55"
palette_3 = "#cdcd55"
palette_4 = "#5555cc"
palette_5 = "#cc55cc"
palette_6 = "#7acaca"
palette_7 = "#cccccc"
palette_8 = "#555555"
palette_9 = "#ff5555"
palette_10 = "#55ff55"
palette_11 = "#ffff55"
palette_12 = "#5555ff"
palette_13 = "#ff55ff"
palette_14 = "#55ffff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#151515"
fg = "#b3b3b3"
fg_soft = "#7d7d7d"
fg_bright = "#ffffff"
grey = "#626262"
grey_dim = "#3f3f3f"
grey_neutral = "#747474"
grey_soft = "#515151"
red = "#cc5555"
orange = "#cc9155"
yellow = "#cdcd55"
green = "#55cc55"
aqua = "#7acaca"
blue = "#5555cc"
purple = "#cc55cc"
tint_green = "#0f250f"
tint_red = "#250f0f"
statusline = "#0e0e0e"
statusline_accent = "#202020"
statusline_fg = "#b3b3b3"
on_accent = "#000000"
mode_red = "#cc5555"
mode_green = "#55cc55"
mode_yellow = "#cdcd55"
mode_blue = "#5555cc"
mode_purple = "#cc55cc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
