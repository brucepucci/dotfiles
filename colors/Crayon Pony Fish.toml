palette_2 = "#150707"
palette_3 = "#150707"
palette_4 = "#150707"
palette_5 = "#150707"
palette_6 = "#150707"
palette_7 = "#150707"
palette_8 = "#150707"
palette_9 = "#150707"
palette_10 = "#150707"
palette_11 = "#150707"
palette_12 = "#150707"
palette_13 = "#150707"
palette_14 = "#150707"
palette_15 = "#150707"

[roles]
bg = "#150707"
