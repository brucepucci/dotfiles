palette_2 = "#579524"
palette_3 = "#ab311b"
palette_4 = "#8c87b0"
palette_5 = "#692f50"
palette_6 = "#e8a866"
palette_7 = "#68525a"
palette_8 = "#4a383b"
palette_9 = "#c5255d"
palette_10 = "#8dff57"
palette_11 = "#c8381d"
palette_12 = "#cfc9ff"
palette_13 = "#fc6cba"
palette_14 = "#ffceaf"
palette_15 = "#b0949d"

[roles]
bg = "#150707"
bg_deep = "#100505"
surface = "#1f1011"
fg = "#68525a"
