# One Half Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#dcdfe4"
cursor-color = "#a3b3cc"
cursor-text = "#e9ecf1"
selection-background = "#474e5d"
selection-foreground = "#dcdfe4"
palette_0 = "#282c34"
palette_1 = "#282c34"
palette_2 = "#282c34"
palette_3 = "#282c34"
palette_4 = "#282c34"
palette_5 = "#282c34"
palette_6 = "#282c34"
palette_7 = "#282c34"
palette_8 = "#282c34"
palette_9 = "#282c34"
palette_10 = "#282c34"
palette_11 = "#282c34"
palette_12 = "#282c34"
palette_13 = "#282c34"
palette_14 = "#282c34"
palette_15 = "#282c34"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#3e4149"
fg = "#dcdfe4"
fg_soft = "#a6a9af"
fg_bright = "#282c34"
grey = "#8b8e95"
grey_dim = "#676b72"
grey_neutral = "#9da0a6"
grey_soft = "#797d83"
red = "#282c34"
orange = "#282c34"
yellow = "#282c34"
green = "#282c34"
aqua = "#282c34"
blue = "#282c34"
purple = "#282c34"
