# One Half Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#dcdfe4"
cursor-color = "#a3b3cc"
cursor-text = "#e9ecf1"
selection-background = "#474e5d"
selection-foreground = "#dcdfe4"
palette_0 = "#282c34"
palette_1 = "#e06c75"
palette_2 = "#98c379"
palette_3 = "#e5c07b"
palette_4 = "#61afef"
palette_5 = "#c678dd"
palette_6 = "#56b6c2"
palette_7 = "#dcdfe4"
palette_8 = "#5d677a"
palette_9 = "#e06c75"
palette_10 = "#98c379"
palette_11 = "#e5c07b"
palette_12 = "#61afef"
palette_13 = "#c678dd"
palette_14 = "#56b6c2"
palette_15 = "#dcdfe4"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#3e4149"
fg = "#dcdfe4"
fg_soft = "#a6a9af"
fg_bright = "#dcdfe4"
grey = "#8b8e95"
grey_dim = "#676b72"
grey_neutral = "#9da0a6"
grey_soft = "#797d83"
red = "#e06c75"
orange = "#e29678"
yellow = "#e5c07b"
green = "#98c379"
aqua = "#56b6c2"
blue = "#61afef"
purple = "#c678dd"
tint_green = "#3c4740"
tint_red = "#493840"
statusline = "#363a42"
