# Wryan
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#101010"
foreground = "#999993"
cursor-color = "#9e9ecb"
cursor-text = "#000000"
selection-background = "#4d4d4d"
selection-foreground = "#ffffff"
palette_0 = "#333333"
palette_1 = "#8c4665"
palette_2 = "#287373"
palette_3 = "#7c7c99"
palette_4 = "#395573"
palette_5 = "#5e468c"
palette_6 = "#31658c"
palette_7 = "#899ca1"
palette_8 = "#3d3d3d"
palette_9 = "#bf4d80"
palette_10 = "#53a6a6"
palette_11 = "#9e9ecb"
palette_12 = "#477ab3"
palette_13 = "#7e62b3"
palette_14 = "#6096bf"
palette_15 = "#c0c0c0"

[roles]
bg = "#101010"
bg_deep = "#0c0c0c"
surface = "#202020"
fg = "#999993"
fg_soft = "#70706c"
fg_bright = "#c0c0c0"
grey = "#5b5b58"
grey_dim = "#40403e"
grey_neutral = "#696965"
grey_soft = "#4e4e4b"
red = "#8c4665"
orange = "#84617f"
yellow = "#7c7c99"
