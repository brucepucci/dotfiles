# Kolorit
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1a1e"
foreground = "#efecec"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#e1925c"
selection-foreground = "#1d1a1e"
palette_0 = "#1d1a1e"
palette_1 = "#1d1a1e"
palette_2 = "#1d1a1e"
palette_3 = "#1d1a1e"
palette_4 = "#1d1a1e"
palette_5 = "#1d1a1e"
palette_6 = "#1d1a1e"
palette_7 = "#1d1a1e"
palette_8 = "#1d1a1e"
palette_9 = "#1d1a1e"
palette_10 = "#1d1a1e"
palette_11 = "#1d1a1e"
palette_12 = "#1d1a1e"
palette_13 = "#1d1a1e"
palette_14 = "#1d1a1e"
palette_15 = "#1d1a1e"

[roles]
bg = "#1d1a1e"
bg_deep = "#161416"
surface = "#363337"
fg = "#efecec"
fg_soft = "#b0adae"
