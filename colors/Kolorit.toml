# Kolorit
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1d1a1e"
foreground = "#efecec"
cursor-color = "#c7c7c7"
cursor-text = "#8c8c8c"
selection-background = "#e1925c"
selection-foreground = "#1d1a1e"
palette_0 = "#1d1a1e"
palette_1 = "#ff5b82"
palette_2 = "#47d7a1"
palette_3 = "#e8e562"
palette_4 = "#5db4ee"
palette_5 = "#da6cda"
palette_6 = "#57e9eb"
palette_7 = "#ededed"
palette_8 = "#504d51"
palette_9 = "#ff5b82"
palette_10 = "#47d7a1"
palette_11 = "#e8e562"
palette_12 = "#5db4ee"
palette_13 = "#da6cda"
palette_14 = "#57e9eb"
palette_15 = "#ededed"

[roles]
bg = "#1d1a1e"
bg_deep = "#161416"
surface = "#363337"
fg = "#efecec"
fg_soft = "#b0adae"
fg_bright = "#ededed"
grey = "#908e8f"
grey_dim = "#666466"
grey_neutral = "#a6a2a4"
grey_soft = "#7b787b"
red = "#ff5b82"
orange = "#f4a072"
yellow = "#e8e562"
green = "#47d7a1"
aqua = "#57e9eb"
blue = "#5db4ee"
purple = "#da6cda"
tint_green = "#253c36"
tint_red = "#462630"
statusline = "#2e2b2e"
statusline_accent = "#434043"
