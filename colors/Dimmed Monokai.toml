palette_2 = "#1f1f1f"
palette_3 = "#1f1f1f"
palette_4 = "#1f1f1f"
palette_5 = "#1f1f1f"
palette_6 = "#1f1f1f"
palette_7 = "#1f1f1f"
palette_8 = "#1f1f1f"
palette_9 = "#1f1f1f"
palette_10 = "#1f1f1f"
palette_11 = "#1f1f1f"
palette_12 = "#1f1f1f"
palette_13 = "#1f1f1f"
palette_14 = "#1f1f1f"
palette_15 = "#1f1f1f"

[roles]
bg = "#1f1f1f"
bg_deep = "#171717"
