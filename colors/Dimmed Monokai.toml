# Dimmed Monokai
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1f1f1f"
foreground = "#b9bcba"
cursor-color = "#f83e19"
cursor-text = "#171717"
selection-background = "#2a2d32"
selection-foreground = "#b9bcba"
palette_0 = "#3a3d43"
palette_1 = "#be3f48"
palette_2 = "#879a3b"
palette_3 = "#c5a635"
palette_4 = "#4f76a1"
palette_5 = "#855c8d"
palette_6 = "#578fa4"
palette_7 = "#b9bcba"
palette_8 = "#888987"
palette_9 = "#fb001f"
palette_10 = "#0f722f"
palette_11 = "#c47033"
palette_12 = "#186de3"
palette_13 = "#fb0067"
palette_14 = "#2e706d"
palette_15 = "#fdffb9"

[roles]
bg = "#1f1f1f"
bg_deep = "#171717"
surface = "#313232"
fg = "#b9bcba"
fg_soft = "#8b8d8c"
fg_bright = "#fdffb9"
grey = "#747574"
grey_dim = "#555655"
grey_neutral = "#838584"
grey_soft = "#646665"
red = "#be3f48"
orange = "#c2723e"
yellow = "#c5a635"
green = "#879a3b"
aqua = "#578fa4"
blue = "#4f76a1"
purple = "#855c8d"
tint_green = "#323524"
tint_red = "#3c2526"
statusline = "#2b2c2b"
