# Dayfox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f6f2ee"
foreground = "#3d2b5a"
cursor-color = "#3d2b5a"
cursor-text = "#f6f2ee"
selection-background = "#e7d2be"
selection-foreground = "#3d2b5a"
palette_0 = "#352c24"
palette_1 = "#a5222f"
palette_2 = "#396847"
palette_3 = "#ac5402"
palette_4 = "#2848a9"
palette_5 = "#6e33ce"
palette_6 = "#287980"
palette_7 = "#bfb6ae"
palette_8 = "#534c45"
palette_9 = "#b3434e"
palette_10 = "#577f63"
palette_11 = "#b86e28"
palette_12 = "#4863b6"
palette_13 = "#8452d5"
palette_14 = "#488d93"
palette_15 = "#f4ece6"

[roles]
bg = "#f6f2ee"
bg_deep = "#f8f5f2"
surface = "#e0dadc"
fg = "#3d2b5a"
