# Snazzy
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1e1f29"
foreground = "#ebece6"
cursor-color = "#e4e4e4"
cursor-text = "#a9a9a9"
selection-background = "#81aec6"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#fc4346"
palette_2 = "#50fb7c"
palette_3 = "#f0fb8c"
palette_4 = "#49baff"
palette_5 = "#fc4cb4"
palette_6 = "#8be9fe"
palette_7 = "#ededec"
palette_8 = "#555555"
palette_9 = "#fc4346"
palette_10 = "#50fb7c"
palette_11 = "#f0fb8c"
palette_12 = "#49baff"
palette_13 = "#fc4cb4"
palette_14 = "#8be9fe"
palette_15 = "#ededec"

[roles]
bg = "#1e1f29"
bg_deep = "#16171f"
surface = "#373840"
fg = "#ebece6"
fg_soft = "#aeaead"
fg_bright = "#ededec"
grey = "#8f9091"
grey_dim = "#66676b"
grey_neutral = "#a3a4a4"
grey_soft = "#7a7b7e"
red = "#fc4346"
orange = "#f69f69"
yellow = "#f0fb8c"
green = "#50fb7c"
aqua = "#8be9fe"
blue = "#49baff"
purple = "#fc4cb4"
tint_green = "#274738"
tint_red = "#46252e"
statusline = "#2e2f38"
statusline_accent = "#43444b"
statusline_fg = "#ebece6"
on_accent = "#1e1f29"
mode_red = "#fc4346"
mode_green = "#50fb7c"
mode_yellow = "#f0fb8c"
mode_blue = "#49baff"
mode_purple = "#fc4cb4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
