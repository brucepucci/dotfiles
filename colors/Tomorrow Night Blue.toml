# Tomorrow Night Blue
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002451"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#003f8e"
selection-background = "#003f8e"
selection-foreground = "#ffffff"
palette_0 = "#002451"
palette_1 = "#002451"
palette_2 = "#002451"
palette_3 = "#002451"
palette_4 = "#002451"
palette_5 = "#002451"
palette_6 = "#002451"
palette_7 = "#002451"
palette_8 = "#002451"
palette_9 = "#002451"
palette_10 = "#002451"
palette_11 = "#002451"
palette_12 = "#002451"
palette_13 = "#002451"
palette_14 = "#002451"
palette_15 = "#002451"

[roles]
