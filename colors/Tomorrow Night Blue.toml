# Tomorrow Night Blue
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#002451"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#003f8e"
selection-background = "#003f8e"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#ff9da4"
palette_2 = "#d1f1a9"
palette_3 = "#ffeead"
palette_4 = "#bbdaff"
palette_5 = "#ebbbff"
palette_6 = "#99ffff"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#ff9da4"
palette_10 = "#d1f1a9"
palette_11 = "#ffeead"
palette_12 = "#bbdaff"
palette_13 = "#ebbbff"
palette_14 = "#99ffff"
palette_15 = "#ffffff"

[roles]
bg = "#002451"
bg_deep = "#001b3d"
surface = "#1f3e66"
fg = "#ffffff"
fg_soft = "#b2bdcb"
fg_bright = "#ffffff"
grey = "#8c9cb1"
grey_dim = "#59718e"
grey_neutral = "#a6b2c2"
grey_soft = "#73879f"
red = "#ff9da4"
orange = "#ffc6a8"
yellow = "#ffeead"
green = "#d1f1a9"
aqua = "#99ffff"
blue = "#bbdaff"
purple = "#ebbbff"
tint_green = "#264961"
tint_red = "#2e3a60"
statusline = "#14365f"
statusline_accent = "#2e4b70"
statusline_fg = "#ffffff"
on_accent = "#002451"
mode_red = "#ff9da4"
mode_green = "#d1f1a9"
