# Modus Operandi Tinted
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fbf7f0"
foreground = "#000000"
cursor-color = "#d00000"
cursor-text = "#fbf7f0"
selection-background = "#c2bcb5"
selection-foreground = "#000000"
palette_0 = "#000000"
palette_1 = "#a60000"
palette_2 = "#006800"
palette_3 = "#6f5500"
palette_4 = "#0031a9"
palette_5 = "#721045"
palette_6 = "#005e8b"
palette_7 = "#a6a6a6"
palette_8 = "#595959"
palette_9 = "#972500"
palette_10 = "#00663f"
palette_11 = "#884900"
palette_12 = "#3548cf"
palette_13 = "#531ab6"
palette_14 = "#005f5f"
palette_15 = "#595959"

[roles]
bg = "#fbf7f0"
bg_deep = "#fcf9f4"
surface = "#ddd9d3"
fg = "#000000"
fg_soft = "#4b4a48"
fg_bright = "#000000"
grey = "#716f6c"
grey_dim = "#a3a19c"
grey_neutral = "#585654"
grey_soft = "#8a8884"
red = "#a60000"
orange = "#8a2a00"
yellow = "#6f5500"
green = "#006800"
aqua = "#005e8b"
blue = "#0031a9"
purple = "#721045"
tint_green = "#ceddc5"
tint_red = "#eccbc5"
statusline = "#e7e3dd"
statusline_accent = "#cecbc5"
statusline_fg = "#000000"
on_accent = "#fbf7f0"
mode_red = "#a60000"
mode_green = "#006800"
mode_yellow = "#6f5500"
mode_blue = "#0031a9"
mode_purple = "#721045"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
