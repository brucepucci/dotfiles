# Tomorrow Night Eighties
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2d2d2d"
foreground = "#cccccc"
cursor-color = "#cccccc"
cursor-text = "#2d2d2d"
selection-background = "#515151"
selection-foreground = "#cccccc"
palette_0 = "#000000"
palette_1 = "#f2777a"
palette_2 = "#99cc99"
palette_3 = "#ffcc66"
palette_4 = "#6699cc"
palette_5 = "#cc99cc"
palette_6 = "#66cccc"
palette_7 = "#ffffff"
palette_8 = "#595959"
palette_9 = "#f2777a"
palette_10 = "#99cc99"
palette_11 = "#ffcc66"
palette_12 = "#6699cc"
palette_13 = "#cc99cc"
palette_14 = "#66cccc"
palette_15 = "#ffffff"

[roles]
bg = "#2d2d2d"
bg_deep = "#222222"
surface = "#404040"
fg = "#cccccc"
fg_soft = "#9c9c9c"
fg_bright = "#ffffff"
grey = "#848484"
grey_dim = "#656565"
grey_neutral = "#949494"
grey_soft = "#757575"
red = "#f2777a"
orange = "#f8a270"
yellow = "#ffcc66"
green = "#99cc99"
aqua = "#66cccc"
blue = "#6699cc"
purple = "#cc99cc"
tint_green = "#404a40"
tint_red = "#503a3b"
statusline = "#3a3a3a"
statusline_accent = "#4a4a4a"
statusline_fg = "#cccccc"
on_accent = "#2d2d2d"
mode_red = "#f2777a"
mode_green = "#99cc99"
mode_yellow = "#ffcc66"
mode_blue = "#6699cc"
mode_purple = "#cc99cc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
