# Piatto Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#414141"
cursor-color = "#5e77c8"
cursor-text = "#abbee5"
selection-background = "#706b4e"
selection-foreground = "#acbcdc"
palette_0 = "#414141"
palette_1 = "#b23771"
palette_2 = "#66781e"
palette_3 = "#cd6f34"
palette_4 = "#3c5ea8"
palette_5 = "#a454b2"
palette_6 = "#66781e"
palette_7 = "#bfbfbf"
palette_8 = "#3f3f3f"
palette_9 = "#db3365"
palette_10 = "#829429"
palette_11 = "#cd6f34"
palette_12 = "#3c5ea8"
palette_13 = "#a454b2"
palette_14 = "#829429"
palette_15 = "#f2f2f2"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e8e8e8"
fg = "#414141"
fg_soft = "#7a7a7a"
fg_bright = "#2a2a2a"
grey = "#969696"
grey_dim = "#bcbcbc"
grey_neutral = "#848484"
grey_soft = "#aaaaaa"
red = "#b23771"
orange = "#c05352"
yellow = "#cd6f34"
green = "#66781e"
aqua = "#66781e"
blue = "#3c5ea8"
purple = "#a454b2"
tint_green = "#e3e7d6"
tint_red = "#f1dbe5"
statusline = "#f0f0f0"
statusline_accent = "#dddddd"
statusline_fg = "#414141"
on_accent = "#ffffff"
mode_red = "#b23771"
mode_green = "#66781e"
mode_yellow = "#cd6f34"
mode_blue = "#3c5ea8"
mode_purple = "#a454b2"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
