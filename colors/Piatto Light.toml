# Piatto Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ffffff"
foreground = "#414141"
cursor-color = "#5e77c8"
cursor-text = "#abbee5"
selection-background = "#706b4e"
selection-foreground = "#acbcdc"
palette_0 = "#ffffff"
palette_1 = "#ffffff"
palette_2 = "#ffffff"
palette_3 = "#ffffff"
palette_4 = "#ffffff"
palette_5 = "#ffffff"
palette_6 = "#ffffff"
palette_7 = "#ffffff"
palette_8 = "#ffffff"
palette_9 = "#ffffff"
palette_10 = "#ffffff"
palette_11 = "#ffffff"
palette_12 = "#ffffff"
palette_13 = "#ffffff"
palette_14 = "#ffffff"
palette_15 = "#ffffff"

[roles]
bg = "#ffffff"
bg_deep = "#ffffff"
surface = "#e8e8e8"
fg = "#414141"
fg_soft = "#7a7a7a"
fg_bright = "#2a2a2a"
grey = "#969696"
grey_dim = "#bcbcbc"
grey_neutral = "#848484"
grey_soft = "#aaaaaa"
red = "#ffffff"
orange = "#ffffff"
yellow = "#ffffff"
green = "#ffffff"
aqua = "#ffffff"
blue = "#ffffff"
purple = "#ffffff"
tint_green = "#ffffff"
tint_red = "#ffffff"
statusline = "#f0f0f0"
statusline_accent = "#dddddd"
statusline_fg = "#414141"
on_accent = "#414141"
mode_red = "#ffffff"
mode_green = "#ffffff"
mode_yellow = "#ffffff"
mode_blue = "#ffffff"
mode_purple = "#ffffff"

[apps]
