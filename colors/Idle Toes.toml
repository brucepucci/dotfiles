# Idle Toes
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#323232"
foreground = "#ffffff"
cursor-color = "#d6d6d6"
cursor-text = "#000000"
selection-background = "#5b5b5b"
selection-foreground = "#000000"
palette_0 = "#323232"
palette_1 = "#d25252"
palette_2 = "#7fe173"
palette_3 = "#ffc66d"
palette_4 = "#4099ff"
palette_5 = "#f680ff"
palette_6 = "#bed6ff"
palette_7 = "#eeeeec"
palette_8 = "#606060"
palette_9 = "#f07070"
palette_10 = "#9dff91"
palette_11 = "#ffe48b"
palette_12 = "#5eb7f7"
palette_13 = "#ff9dff"
palette_14 = "#dcf4ff"
palette_15 = "#ffffff"

[roles]
bg = "#323232"
bg_deep = "#262626"
surface = "#4b4b4b"
fg = "#ffffff"
fg_soft = "#c2c2c2"
fg_bright = "#ffffff"
grey = "#a3a3a3"
grey_dim = "#7a7a7a"
grey_neutral = "#b7b7b7"
grey_soft = "#8e8e8e"
red = "#d25252"
orange = "#e88c60"
yellow = "#ffc66d"
green = "#7fe173"
aqua = "#bed6ff"
blue = "#4099ff"
purple = "#f680ff"
tint_green = "#40523e"
tint_red = "#4f3838"
statusline = "#424242"
statusline_accent = "#575757"
statusline_fg = "#ffffff"
on_accent = "#323232"
mode_red = "#d25252"
mode_green = "#7fe173"
mode_yellow = "#ffc66d"
mode_blue = "#4099ff"
mode_purple = "#f680ff"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
