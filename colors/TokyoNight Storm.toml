# TokyoNight Storm
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#24283b"
foreground = "#c0caf5"
cursor-color = "#c0caf5"
cursor-text = "#1d202f"
selection-background = "#364a82"
selection-foreground = "#c0caf5"
palette_0 = "#1d202f"
palette_1 = "#f7768e"
palette_2 = "#9ece6a"
palette_3 = "#e0af68"
palette_4 = "#7aa2f7"
palette_5 = "#bb9af7"
palette_6 = "#7dcfff"
palette_7 = "#a9b1d6"
palette_8 = "#4e5575"
palette_9 = "#f7768e"
palette_10 = "#9ece6a"
palette_11 = "#e0af68"
palette_12 = "#7aa2f7"
palette_13 = "#bb9af7"
palette_14 = "#7dcfff"
palette_15 = "#c0caf5"

[roles]
bg = "#24283b"
bg_deep = "#1b1e2c"
surface = "#373b51"
fg = "#c0caf5"
fg_soft = "#9199bd"
fg_bright = "#c0caf5"
grey = "#7a81a1"
