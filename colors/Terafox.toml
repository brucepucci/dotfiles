# Terafox
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#152528"
foreground = "#e6eaea"
cursor-color = "#e6eaea"
cursor-text = "#152528"
selection-background = "#293e40"
selection-foreground = "#e6eaea"
palette_0 = "#2f3239"
palette_1 = "#e85c51"
palette_2 = "#7aa4a1"
palette_3 = "#fda47f"
palette_4 = "#5a93aa"
palette_5 = "#ad5c7c"
palette_6 = "#a1cdd8"
palette_7 = "#ebebeb"
palette_8 = "#4e5157"
palette_9 = "#eb746b"
palette_10 = "#8eb2af"
palette_11 = "#fdb292"
palette_12 = "#73a3b7"
palette_13 = "#b97490"
palette_14 = "#afd4de"
palette_15 = "#eeeeee"

[roles]
bg = "#152528"
bg_deep = "#101c1e"
surface = "#2e3d3f"
fg = "#e6eaea"
fg_soft = "#a7afb0"
fg_bright = "#eeeeee"
grey = "#889193"
grey_dim = "#5e6a6c"
grey_neutral = "#9da5a6"
grey_soft = "#737e7f"
red = "#e85c51"
orange = "#f28068"
yellow = "#fda47f"
green = "#7aa4a1"
aqua = "#a1cdd8"
blue = "#5a93aa"
purple = "#ad5c7c"
tint_green = "#273c3e"
tint_red = "#3b2f2f"
statusline = "#263538"
