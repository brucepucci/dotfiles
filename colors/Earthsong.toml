# Earthsong
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#292520"
foreground = "#e5c7a9"
cursor-color = "#f6f7ec"
cursor-text = "#292520"
selection-background = "#121418"
selection-foreground = "#e5c7a9"
palette_0 = "#121418"
palette_1 = "#c94234"
palette_2 = "#85c54c"
palette_3 = "#f5ae2e"
palette_4 = "#1398b9"
palette_5 = "#d0633d"
palette_6 = "#509552"
palette_7 = "#e5c6aa"
palette_8 = "#675f54"
palette_9 = "#ff645a"
palette_10 = "#98e036"
palette_11 = "#e0d561"
palette_12 = "#5fdaff"
palette_13 = "#ff9269"
palette_14 = "#84f088"
palette_15 = "#f6f7ec"

[roles]
bg = "#292520"
bg_deep = "#1f1c18"
surface = "#403830"
fg = "#e5c7a9"
