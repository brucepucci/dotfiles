# Peppermint
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#c8c8c8"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#e6e6e6"
selection-foreground = "#000000"
palette_0 = "#353535"
palette_1 = "#e74669"
palette_2 = "#89d287"
palette_3 = "#dab853"
palette_4 = "#449fd0"
palette_5 = "#da62dc"
palette_6 = "#65aaaf"
palette_7 = "#b4b4b4"
palette_8 = "#535353"
palette_9 = "#e4859b"
palette_10 = "#a3cca2"
palette_11 = "#e1e487"
palette_12 = "#6fbce2"
palette_13 = "#e586e7"
palette_14 = "#96dcdb"
palette_15 = "#dfdfdf"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#181818"
fg = "#c8c8c8"
fg_soft = "#8c8c8c"
fg_bright = "#dfdfdf"
grey = "#6e6e6e"
grey_dim = "#464646"
grey_neutral = "#828282"
grey_soft = "#5a5a5a"
red = "#e74669"
orange = "#e07f5e"
yellow = "#dab853"
green = "#89d287"
aqua = "#65aaaf"
blue = "#449fd0"
purple = "#da62dc"
tint_green = "#192618"
tint_red = "#2a0d13"
statusline = "#101010"
statusline_accent = "#242424"
statusline_fg = "#c8c8c8"
on_accent = "#000000"
mode_red = "#e74669"
mode_green = "#89d287"
mode_yellow = "#dab853"
mode_blue = "#449fd0"
mode_purple = "#da62dc"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
