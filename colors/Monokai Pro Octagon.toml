# Monokai Pro Octagon
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282a3a"
foreground = "#eaf2f1"
cursor-color = "#b2b9bd"
cursor-text = "#f2f9fd"
selection-background = "#535763"
selection-foreground = "#eaf2f1"
palette_0 = "#282a3a"
palette_1 = "#ff657a"
palette_2 = "#bad761"
palette_3 = "#ffd76d"
palette_4 = "#ff9b5e"
palette_5 = "#c39ac9"
palette_6 = "#9cd1bb"
palette_7 = "#eaf2f1"
palette_8 = "#696d77"
palette_9 = "#ff657a"
palette_10 = "#bad761"
palette_11 = "#ffd76d"
palette_12 = "#ff9b5e"
palette_13 = "#c39ac9"
palette_14 = "#9cd1bb"
palette_15 = "#eaf2f1"

[roles]
bg = "#282a3a"
bg_deep = "#1e202c"
surface = "#3f4250"
fg = "#eaf2f1"
fg_soft = "#b0b6ba"
fg_bright = "#eaf2f1"
grey = "#93989f"
grey_dim = "#6c707a"
grey_neutral = "#a6acb1"
grey_soft = "#7f848c"
red = "#ff657a"
orange = "#ff9e74"
yellow = "#ffd76d"
green = "#bad761"
aqua = "#9cd1bb"
blue = "#ff9b5e"
purple = "#c39ac9"
tint_green = "#424941"
