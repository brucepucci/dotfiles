# Symfonic
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#dc322f"
cursor-text = "#ffffff"
selection-background = "#073642"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#dc322f"
palette_2 = "#56db3a"
palette_3 = "#ff8400"
palette_4 = "#0084d4"
palette_5 = "#b729d9"
palette_6 = "#ccccff"
palette_7 = "#ffffff"
palette_8 = "#414347"
palette_9 = "#dc322f"
palette_10 = "#56db3a"
palette_11 = "#ff8400"
palette_12 = "#0084d4"
palette_13 = "#b729d9"
palette_14 = "#ccccff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#ffffff"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#dc322f"
orange = "#ee5b18"
yellow = "#ff8400"
green = "#56db3a"
aqua = "#ccccff"
blue = "#0084d4"
purple = "#b729d9"
tint_green = "#0f270a"
tint_red = "#280908"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#dc322f"
mode_green = "#56db3a"
mode_yellow = "#ff8400"
mode_blue = "#0084d4"
mode_purple = "#b729d9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
