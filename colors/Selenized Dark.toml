palette_6 = "#41c7b9"
palette_7 = "#adbcbc"
palette_8 = "#72898f"
palette_9 = "#ff665c"
palette_10 = "#84c747"
palette_11 = "#ebc13d"
palette_12 = "#58a3ff"
palette_13 = "#ff84cd"
palette_14 = "#53d6c7"
palette_15 = "#cad8d9"

[roles]
