# Spiderman
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1b1d1e"
foreground = "#e3e3e3"
cursor-color = "#2c3fff"
cursor-text = "#000000"
selection-background = "#070e50"
selection-foreground = "#f0272d"
palette_0 = "#1b1d1e"
palette_1 = "#e60813"
palette_2 = "#e22928"
palette_3 = "#e24756"
palette_4 = "#2c3fff"
palette_5 = "#2435db"
palette_6 = "#3256ff"
palette_7 = "#fffef6"
palette_8 = "#505354"
palette_9 = "#ff0325"
palette_10 = "#ff3338"
palette_11 = "#fe3a35"
palette_12 = "#1d50ff"
palette_13 = "#747cff"
palette_14 = "#6184ff"
palette_15 = "#fffff9"

[roles]
bg = "#1b1d1e"
bg_deep = "#141616"
surface = "#333536"
fg = "#e3e3e3"
fg_soft = "#a7a8a8"
fg_bright = "#fffff9"
grey = "#898a8a"
grey_dim = "#616263"
grey_neutral = "#9d9e9e"
grey_soft = "#757677"
red = "#e60813"
orange = "#e42834"
yellow = "#e24756"
green = "#e22928"
aqua = "#3256ff"
blue = "#2c3fff"
purple = "#2435db"
tint_green = "#3f1f20"
tint_red = "#40191c"
statusline = "#2b2d2e"
statusline_accent = "#3f4141"
statusline_fg = "#e3e3e3"
on_accent = "#e3e3e3"
mode_red = "#e60813"
mode_green = "#e22928"
mode_yellow = "#e24756"
mode_blue = "#2c3fff"
mode_purple = "#2435db"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
