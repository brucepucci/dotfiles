palette_6 = "#387f58"
palette_7 = "#807974"
palette_8 = "#555445"
palette_9 = "#e0502a"
palette_10 = "#61e070"
palette_11 = "#d69927"
palette_12 = "#79d9d9"
palette_13 = "#cd7c54"
palette_14 = "#59d599"
palette_15 = "#fff1e9"

[roles]
