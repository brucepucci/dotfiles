# Ultra Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#ffffff"
cursor-color = "#fefefe"
cursor-text = "#000000"
selection-background = "#222222"
selection-foreground = "#cccccc"
palette_0 = "#000000"
palette_1 = "#f07178"
palette_2 = "#c3e88d"
palette_3 = "#ffcb6b"
palette_4 = "#82aaff"
palette_5 = "#c792ea"
palette_6 = "#89ddff"
palette_7 = "#cccccc"
palette_8 = "#404040"
palette_9 = "#f6a9ae"
palette_10 = "#dbf1ba"
palette_11 = "#ffdfa6"
palette_12 = "#b4ccff"
palette_13 = "#ddbdf2"
palette_14 = "#b8eaff"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1f1f1f"
fg = "#ffffff"
fg_soft = "#b2b2b2"
fg_bright = "#ffffff"
grey = "#8c8c8c"
grey_dim = "#595959"
grey_neutral = "#a6a6a6"
grey_soft = "#737373"
red = "#f07178"
orange = "#f89e72"
yellow = "#ffcb6b"
green = "#c3e88d"
aqua = "#89ddff"
blue = "#82aaff"
purple = "#c792ea"
tint_green = "#232a19"
tint_red = "#2b1416"
statusline = "#141414"
statusline_accent = "#2e2e2e"
statusline_fg = "#ffffff"
on_accent = "#000000"
mode_red = "#f07178"
mode_green = "#c3e88d"
mode_yellow = "#ffcb6b"
mode_blue = "#82aaff"
mode_purple = "#c792ea"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
