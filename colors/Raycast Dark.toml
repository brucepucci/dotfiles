# Raycast Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#ffffff"
cursor-color = "#cccccc"
cursor-text = "#999999"
selection-background = "#333333"
selection-foreground = "#595959"
palette_0 = "#1a1a1a"
palette_1 = "#1a1a1a"
palette_2 = "#1a1a1a"
palette_3 = "#1a1a1a"
palette_4 = "#1a1a1a"
palette_5 = "#1a1a1a"
palette_6 = "#1a1a1a"
palette_7 = "#1a1a1a"
palette_8 = "#1a1a1a"
palette_9 = "#1a1a1a"
palette_10 = "#1a1a1a"
palette_11 = "#1a1a1a"
palette_12 = "#1a1a1a"
palette_13 = "#1a1a1a"
palette_14 = "#1a1a1a"
palette_15 = "#1a1a1a"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#353535"
fg = "#ffffff"
fg_soft = "#bababa"
fg_bright = "#1a1a1a"
