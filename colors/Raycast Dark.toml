# Raycast Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#ffffff"
cursor-color = "#cccccc"
cursor-text = "#999999"
selection-background = "#333333"
selection-foreground = "#595959"
palette_0 = "#000000"
palette_1 = "#ff5360"
palette_2 = "#59d499"
palette_3 = "#ffc531"
palette_4 = "#56c2ff"
palette_5 = "#cf2f98"
palette_6 = "#52eee5"
palette_7 = "#ffffff"
palette_8 = "#4c4c4c"
palette_9 = "#ff6363"
palette_10 = "#59d499"
palette_11 = "#ffc531"
palette_12 = "#56c2ff"
palette_13 = "#cf2f98"
palette_14 = "#52eee5"
palette_15 = "#ffffff"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#353535"
fg = "#ffffff"
fg_soft = "#bababa"
fg_bright = "#ffffff"
grey = "#989898"
grey_dim = "#6a6a6a"
grey_neutral = "#afafaf"
grey_soft = "#818181"
red = "#ff5360"
orange = "#ff8c48"
yellow = "#ffc531"
green = "#59d499"
aqua = "#52eee5"
blue = "#56c2ff"
purple = "#cf2f98"
tint_green = "#253b31"
tint_red = "#432427"
statusline = "#2c2c2c"
statusline_accent = "#434343"
statusline_fg = "#ffffff"
on_accent = "#1a1a1a"
mode_red = "#ff5360"
mode_green = "#59d499"
mode_yellow = "#ffc531"
mode_blue = "#56c2ff"
mode_purple = "#cf2f98"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
