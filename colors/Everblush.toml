# Everblush
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#141b1e"
foreground = "#dadada"
cursor-color = "#dadada"
cursor-text = "#141b1e"
selection-background = "#141b1e"
selection-foreground = "#dadada"
palette_0 = "#232a2d"
palette_1 = "#e57474"
palette_2 = "#8ccf7e"
palette_3 = "#e5c76b"
palette_4 = "#67b0e8"
palette_5 = "#c47fd5"
palette_6 = "#6cbfbf"
palette_7 = "#b3b9b8"
palette_8 = "#464e50"
palette_9 = "#ef7e7e"
palette_10 = "#96d988"
palette_11 = "#f4d67a"
palette_12 = "#71baf2"
palette_13 = "#ce89df"
palette_14 = "#67cbe7"
palette_15 = "#bdc3c2"

[roles]
bg = "#141b1e"
bg_deep = "#0f1416"
surface = "#2c3235"
fg = "#dadada"
fg_soft = "#9fa1a2"
fg_bright = "#bdc3c2"
grey = "#818485"
grey_dim = "#595e60"
grey_neutral = "#959798"
grey_soft = "#6d7173"
red = "#e57474"
orange = "#e59e70"
yellow = "#e5c76b"
green = "#8ccf7e"
aqua = "#6cbfbf"
