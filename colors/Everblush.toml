palette_6 = "#141b1e"
palette_7 = "#141b1e"
palette_8 = "#141b1e"
palette_9 = "#141b1e"
palette_10 = "#141b1e"
palette_11 = "#141b1e"
palette_12 = "#141b1e"
palette_13 = "#141b1e"
palette_14 = "#141b1e"
palette_15 = "#141b1e"

[roles]
