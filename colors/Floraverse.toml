# Floraverse
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#0e0d15"
foreground = "#dbd1b9"
cursor-color = "#bbbbbb"
cursor-text = "#ffffff"
selection-background = "#f3e0b8"
selection-foreground = "#08002e"
palette_0 = "#08002e"
palette_1 = "#7e1a46"
palette_2 = "#5d731a"
palette_3 = "#cd751c"
palette_4 = "#1d6da1"
palette_5 = "#b7077e"
palette_6 = "#42a38c"
palette_7 = "#f3e0b8"
palette_8 = "#4c3866"
palette_9 = "#d02063"
palette_10 = "#b4ce59"
palette_11 = "#fac357"
palette_12 = "#40a4cf"
palette_13 = "#f12aae"
palette_14 = "#62caa8"
palette_15 = "#fff5db"

[roles]
bg = "#0e0d15"
bg_deep = "#0a0a10"
surface = "#272529"
fg = "#dbd1b9"
fg_soft = "#9e9688"
fg_bright = "#fff5db"
grey = "#7f796f"
grey_dim = "#56524e"
grey_neutral = "#938c80"
grey_soft = "#6a655f"
red = "#7e1a46"
orange = "#a64831"
yellow = "#cd751c"
green = "#5d731a"
aqua = "#42a38c"
blue = "#1d6da1"
purple = "#b7077e"
tint_green = "#1c1f16"
tint_red = "#220f1e"
statusline = "#1e1d22"
statusline_accent = "#333033"
statusline_fg = "#dbd1b9"
