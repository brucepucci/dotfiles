# IC Orange PPL
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#262626"
foreground = "#ffcb83"
cursor-color = "#fc531d"
cursor-text = "#ffc88a"
selection-background = "#c14020"
selection-foreground = "#ffc88a"
palette_0 = "#000000"
palette_1 = "#c13900"
palette_2 = "#a4a900"
palette_3 = "#caaf00"
palette_4 = "#bd6d00"
palette_5 = "#fc5e00"
palette_6 = "#f79500"
palette_7 = "#ffc88a"
palette_8 = "#6a4f2a"
palette_9 = "#ff8c68"
palette_10 = "#f6ff40"
palette_11 = "#ffe36e"
palette_12 = "#ffbe55"
palette_13 = "#fc874f"
palette_14 = "#c69752"
palette_15 = "#fafaff"

[roles]
bg = "#262626"
bg_deep = "#1c1c1c"
surface = "#403a31"
fg = "#ffcb83"
fg_soft = "#be9a67"
fg_bright = "#fafaff"
grey = "#9d8159"
grey_dim = "#726047"
grey_neutral = "#b39162"
grey_soft = "#887050"
red = "#c13900"
orange = "#c67400"
yellow = "#caaf00"
green = "#a4a900"
aqua = "#f79500"
blue = "#bd6d00"
purple = "#fc5e00"
tint_green = "#3d3e1f"
tint_red = "#42291f"
statusline = "#37332d"
statusline_accent = "#4d4437"
statusline_fg = "#ffcb83"
on_accent = "#262626"
mode_red = "#c13900"
mode_green = "#a4a900"
mode_yellow = "#caaf00"
mode_blue = "#bd6d00"
mode_purple = "#fc5e00"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
