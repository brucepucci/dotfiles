# Unikitty
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#ff8cd9"
foreground = "#0b0b0b"
cursor-color = "#c7ff98"
cursor-text = "#202020"
selection-background = "#3ea9fe"
selection-foreground = "#ffffff"
palette_0 = "#0c0c0c"
palette_1 = "#a80f20"
palette_2 = "#c7ff98"
palette_3 = "#fff964"
palette_4 = "#145fcd"
palette_5 = "#ffe9ff"
palette_6 = "#9effef"
palette_7 = "#fcf1fb"
palette_8 = "#434343"
palette_9 = "#d91329"
palette_10 = "#d3ffaf"
palette_11 = "#ffef50"
palette_12 = "#0075ea"
palette_13 = "#ffefff"
palette_14 = "#93ffef"
palette_15 = "#fff3fe"

[roles]
bg = "#ff8cd9"
bg_deep = "#ffa9e2"
surface = "#e27dc0"
fg = "#0b0b0b"
fg_soft = "#543249"
fg_bright = "#070707"
grey = "#794568"
grey_dim = "#aa5f91"
grey_neutral = "#603853"
grey_soft = "#91527c"
red = "#a80f20"
orange = "#d48442"
yellow = "#fff964"
green = "#c7ff98"
aqua = "#9effef"
blue = "#145fcd"
purple = "#ffe9ff"
tint_green = "#f5a1cd"
tint_red = "#ef76b8"
statusline = "#eb82c9"
