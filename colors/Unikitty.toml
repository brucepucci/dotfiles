palette_2 = "#ff8cd9"
palette_3 = "#ff8cd9"
palette_4 = "#ff8cd9"
palette_5 = "#ff8cd9"
palette_6 = "#ff8cd9"
palette_7 = "#ff8cd9"
palette_8 = "#ff8cd9"
palette_9 = "#ff8cd9"
palette_10 = "#ff8cd9"
palette_11 = "#ff8cd9"
palette_12 = "#ff8cd9"
palette_13 = "#ff8cd9"
palette_14 = "#ff8cd9"
palette_15 = "#ff8cd9"

[roles]
