# Neopolitan
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#271f19"
foreground = "#ffffff"
cursor-color = "#ffffff"
cursor-text = "#bfbfbf"
selection-background = "#253b76"
selection-foreground = "#ffffff"
palette_0 = "#000000"
palette_1 = "#9a1a1a"
palette_2 = "#61ce3c"
palette_3 = "#fbde2d"
palette_4 = "#324883"
palette_5 = "#ff0080"
palette_6 = "#8da6ce"
palette_7 = "#f8f8f8"
palette_8 = "#4c4c4c"
palette_9 = "#9a1a1a"
palette_10 = "#61ce3c"
palette_11 = "#fbde2d"
palette_12 = "#324883"
palette_13 = "#ff0080"
palette_14 = "#8da6ce"
palette_15 = "#f8f8f8"

[roles]
bg = "#271f19"
bg_deep = "#1d1713"
surface = "#413a35"
fg = "#ffffff"
fg_soft = "#bebcba"
fg_bright = "#f8f8f8"
grey = "#9e9a98"
grey_dim = "#736d6a"
grey_neutral = "#b3b1ae"
grey_soft = "#888480"
red = "#9a1a1a"
orange = "#ca7c24"
yellow = "#fbde2d"
green = "#61ce3c"
aqua = "#8da6ce"
blue = "#324883"
purple = "#ff0080"
tint_green = "#313e1f"
tint_red = "#3c1e19"
statusline = "#38312b"
statusline_accent = "#4e4742"
statusline_fg = "#ffffff"
on_accent = "#ffffff"
mode_red = "#9a1a1a"
mode_green = "#61ce3c"
