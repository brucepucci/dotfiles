palette_7 = "#271f19"
palette_8 = "#271f19"
palette_9 = "#271f19"
palette_10 = "#271f19"
palette_11 = "#271f19"
palette_12 = "#271f19"
palette_13 = "#271f19"
palette_14 = "#271f19"
palette_15 = "#271f19"

