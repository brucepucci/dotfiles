# Nord
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#2e3440"
foreground = "#d8dee9"
cursor-color = "#eceff4"
cursor-text = "#282828"
selection-background = "#eceff4"
selection-foreground = "#4c566a"
palette_0 = "#3b4252"
palette_1 = "#bf616a"
palette_2 = "#a3be8c"
palette_3 = "#ebcb8b"
palette_4 = "#81a1c1"
palette_5 = "#b48ead"
palette_6 = "#88c0d0"
palette_7 = "#e5e9f0"
palette_8 = "#596377"
palette_9 = "#bf616a"
palette_10 = "#a3be8c"
palette_11 = "#ebcb8b"
palette_12 = "#81a1c1"
palette_13 = "#b48ead"
palette_14 = "#8fbcbb"
palette_15 = "#eceff4"

[roles]
bg = "#2e3440"
bg_deep = "#222730"
surface = "#424854"
fg = "#d8dee9"
fg_soft = "#a5abb6"
fg_bright = "#eceff4"
