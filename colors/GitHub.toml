# GitHub
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#f4f4f4"
foreground = "#3e3e3e"
cursor-color = "#3f3f3f"
cursor-text = "#f4f4f4"
selection-background = "#a9c1e2"
selection-foreground = "#535353"
palette_0 = "#3e3e3e"
palette_1 = "#970b16"
palette_2 = "#07962a"
palette_3 = "#c5bb94"
palette_4 = "#003e8a"
palette_5 = "#e94691"
palette_6 = "#7cc4df"
palette_7 = "#b2b2b2"
palette_8 = "#666666"
palette_9 = "#de0000"
palette_10 = "#7ac895"
palette_11 = "#d7b600"
palette_12 = "#2e6cba"
palette_13 = "#f29592"
palette_14 = "#00c7cb"
palette_15 = "#ffffff"

[roles]
bg = "#f4f4f4"
bg_deep = "#f7f7f7"
surface = "#dedede"
fg = "#3e3e3e"
fg_soft = "#757575"
fg_bright = "#282828"
grey = "#909090"
grey_dim = "#b4b4b4"
grey_neutral = "#7e7e7e"
grey_soft = "#a2a2a2"
red = "#970b16"
orange = "#ae6355"
yellow = "#c5bb94"
green = "#07962a"
aqua = "#7cc4df"
blue = "#003e8a"
purple = "#e94691"
tint_green = "#c9e3d0"
tint_red = "#e3cacc"
statusline = "#e5e5e5"
statusline_accent = "#d3d3d3"
statusline_fg = "#3e3e3e"
on_accent = "#f4f4f4"
mode_red = "#970b16"
mode_green = "#07962a"
mode_yellow = "#c5bb94"
mode_blue = "#003e8a"
