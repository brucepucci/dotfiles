palette_6 = "#282c34"
palette_7 = "#282c34"
palette_8 = "#282c34"
palette_9 = "#282c34"
palette_10 = "#282c34"
palette_11 = "#282c34"
palette_12 = "#282c34"
palette_13 = "#282c34"
palette_14 = "#282c34"
palette_15 = "#282c34"

