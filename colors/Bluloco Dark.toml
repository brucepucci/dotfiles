# Bluloco Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#282c34"
foreground = "#b9c0cb"
cursor-color = "#ffcc00"
cursor-text = "#282c34"
selection-background = "#b9c0ca"
selection-foreground = "#272b33"
palette_0 = "#41444d"
palette_1 = "#fc2f52"
palette_2 = "#25a45c"
palette_3 = "#ff936a"
palette_4 = "#3476ff"
palette_5 = "#7a82da"
palette_6 = "#4483aa"
palette_7 = "#cdd4e0"
palette_8 = "#8f9aae"
palette_9 = "#ff6480"
palette_10 = "#3fc56b"
palette_11 = "#f9c859"
palette_12 = "#10b1fe"
palette_13 = "#ff78f8"
palette_14 = "#5fb9bc"
palette_15 = "#ffffff"

[roles]
bg = "#282c34"
bg_deep = "#1e2127"
surface = "#393e46"
fg = "#b9c0cb"
fg_soft = "#8e949e"
fg_bright = "#ffffff"
grey = "#787d87"
grey_dim = "#5b6069"
grey_neutral = "#868c96"
grey_soft = "#696f78"
red = "#fc2f52"
orange = "#fe615e"
yellow = "#ff936a"
green = "#25a45c"
aqua = "#4483aa"
blue = "#3476ff"
purple = "#7a82da"
tint_green = "#27423b"
tint_red = "#4e2d39"
statusline = "#343840"
