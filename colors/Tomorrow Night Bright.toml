# Tomorrow Night Bright
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#eaeaea"
cursor-color = "#eaeaea"
cursor-text = "#000000"
selection-background = "#424242"
selection-foreground = "#eaeaea"
palette_0 = "#000000"
palette_1 = "#000000"
palette_2 = "#000000"
palette_3 = "#000000"
palette_4 = "#000000"
palette_5 = "#000000"
palette_6 = "#000000"
palette_7 = "#000000"
palette_8 = "#000000"
palette_9 = "#000000"
palette_10 = "#000000"
palette_11 = "#000000"
palette_12 = "#000000"
palette_13 = "#000000"
palette_14 = "#000000"
palette_15 = "#000000"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1c1c1c"
fg = "#eaeaea"
fg_soft = "#a4a4a4"
fg_bright = "#000000"
grey = "#818181"
grey_dim = "#525252"
grey_neutral = "#989898"
grey_soft = "#696969"
red = "#000000"
orange = "#000000"
yellow = "#000000"
green = "#000000"
aqua = "#000000"
blue = "#000000"
purple = "#000000"
tint_green = "#000000"
tint_red = "#000000"
statusline = "#131313"
