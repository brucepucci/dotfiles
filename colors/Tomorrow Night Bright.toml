# Tomorrow Night Bright
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#000000"
foreground = "#eaeaea"
cursor-color = "#eaeaea"
cursor-text = "#000000"
selection-background = "#424242"
selection-foreground = "#eaeaea"
palette_0 = "#000000"
palette_1 = "#d54e53"
palette_2 = "#b9ca4a"
palette_3 = "#e7c547"
palette_4 = "#7aa6da"
palette_5 = "#c397d8"
palette_6 = "#70c0b1"
palette_7 = "#ffffff"
palette_8 = "#404040"
palette_9 = "#d54e53"
palette_10 = "#b9ca4a"
palette_11 = "#e7c547"
palette_12 = "#7aa6da"
palette_13 = "#c397d8"
palette_14 = "#70c0b1"
palette_15 = "#ffffff"

[roles]
bg = "#000000"
bg_deep = "#000000"
surface = "#1c1c1c"
fg = "#eaeaea"
fg_soft = "#a4a4a4"
fg_bright = "#ffffff"
grey = "#818181"
grey_dim = "#525252"
grey_neutral = "#989898"
grey_soft = "#696969"
red = "#d54e53"
orange = "#de8a4d"
yellow = "#e7c547"
green = "#b9ca4a"
aqua = "#70c0b1"
blue = "#7aa6da"
purple = "#c397d8"
tint_green = "#21240d"
tint_red = "#260e0f"
statusline = "#131313"
statusline_accent = "#2a2a2a"
statusline_fg = "#eaeaea"
on_accent = "#000000"
mode_red = "#d54e53"
