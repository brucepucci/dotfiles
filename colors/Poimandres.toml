# Poimandres
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1e28"
foreground = "#a6accd"
cursor-color = "#ffffff"
cursor-text = "#1a1e29"
selection-background = "#a6accd"
selection-foreground = "#ffffff"
palette_0 = "#1a1e28"
palette_1 = "#d0679d"
palette_2 = "#5de4c7"
palette_3 = "#fffac2"
palette_4 = "#89ddff"
palette_5 = "#fcc5e9"
palette_6 = "#add7ff"
palette_7 = "#ffffff"
palette_8 = "#a6accd"
palette_9 = "#d0679d"
palette_10 = "#5de4c7"
palette_11 = "#fffac2"
palette_12 = "#add7ff"
palette_13 = "#fae4fc"
palette_14 = "#89ddff"
palette_15 = "#ffffff"

[roles]
bg = "#1a1e28"
bg_deep = "#14161e"
surface = "#2b2f3c"
fg = "#a6accd"
fg_soft = "#7c819c"
fg_bright = "#ffffff"
grey = "#676c83"
grey_dim = "#4b5062"
grey_neutral = "#757a93"
grey_soft = "#595e72"
red = "#d0679d"
orange = "#e8b0b0"
yellow = "#fffac2"
green = "#5de4c7"
aqua = "#add7ff"
blue = "#89ddff"
purple = "#fcc5e9"
tint_green = "#264245"
tint_red = "#3b2b3d"
statusline = "#252935"
statusline_accent = "#333846"
statusline_fg = "#a6accd"
on_accent = "#1a1e28"
mode_red = "#d0679d"
mode_green = "#5de4c7"
mode_yellow = "#fffac2"
mode_blue = "#89ddff"
mode_purple = "#fcc5e9"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
