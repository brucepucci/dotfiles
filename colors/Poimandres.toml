palette_6 = "#1a1e28"
palette_7 = "#1a1e28"
palette_8 = "#1a1e28"
palette_9 = "#1a1e28"
palette_10 = "#1a1e28"
palette_11 = "#1a1e28"
palette_12 = "#1a1e28"
palette_13 = "#1a1e28"
palette_14 = "#1a1e28"
palette_15 = "#1a1e28"

[roles]
