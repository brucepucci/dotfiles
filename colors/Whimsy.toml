palette_7 = "#29283b"
palette_8 = "#29283b"
palette_9 = "#29283b"
palette_10 = "#29283b"
palette_11 = "#29283b"
palette_12 = "#29283b"
palette_13 = "#29283b"
palette_14 = "#29283b"
palette_15 = "#29283b"

