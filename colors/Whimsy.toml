# Whimsy
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#29283b"
foreground = "#b3b0d6"
cursor-color = "#b3b0d6"
cursor-text = "#535178"
selection-background = "#3d3c58"
selection-foreground = "#ffffff"
palette_0 = "#535178"
palette_1 = "#ef6487"
palette_2 = "#5eca89"
palette_3 = "#fdd877"
palette_4 = "#65aef7"
palette_5 = "#aa7ff0"
palette_6 = "#43c1be"
palette_7 = "#ffffff"
palette_8 = "#535178"
palette_9 = "#ef6487"
palette_10 = "#5eca89"
palette_11 = "#fdd877"
palette_12 = "#65aef7"
palette_13 = "#aa7ff0"
palette_14 = "#43c1be"
palette_15 = "#ffffff"

[roles]
bg = "#29283b"
bg_deep = "#1f1e2c"
surface = "#3a384e"
fg = "#b3b0d6"
fg_soft = "#8a87a8"
fg_bright = "#ffffff"
grey = "#757390"
grey_dim = "#595871"
grey_neutral = "#8380a0"
grey_soft = "#676581"
red = "#ef6487"
orange = "#f69e7f"
yellow = "#fdd877"
green = "#5eca89"
aqua = "#43c1be"
