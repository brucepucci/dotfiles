palette_6 = "#17182b"
palette_7 = "#17182b"
palette_8 = "#17182b"
palette_9 = "#17182b"
palette_10 = "#17182b"
palette_11 = "#17182b"
palette_12 = "#17182b"
palette_13 = "#17182b"
palette_14 = "#17182b"
palette_15 = "#17182b"

