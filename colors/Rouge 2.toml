# Rouge 2
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#17182b"
foreground = "#a2a3aa"
cursor-color = "#969e92"
cursor-text = "#ffffff"
selection-background = "#5d5d6b"
selection-foreground = "#dfe5ee"
palette_0 = "#5d5d6b"
palette_1 = "#c6797e"
palette_2 = "#969e92"
palette_3 = "#dbcdab"
palette_4 = "#6e94b9"
palette_5 = "#4c4e78"
palette_6 = "#8ab6c1"
palette_7 = "#e8e8ea"
palette_8 = "#616274"
palette_9 = "#c6797e"
palette_10 = "#e6dcc4"
palette_11 = "#e6dcc4"
palette_12 = "#98b3cd"
palette_13 = "#8283a1"
palette_14 = "#abcbd3"
palette_15 = "#e8e8ea"

[roles]
bg = "#17182b"
bg_deep = "#111220"
surface = "#28293a"
fg = "#a2a3aa"
fg_soft = "#787984"
fg_bright = "#e8e8ea"
grey = "#636471"
grey_dim = "#484957"
grey_neutral = "#71727e"
grey_soft = "#565764"
red = "#c6797e"
orange = "#d0a394"
yellow = "#dbcdab"
green = "#969e92"
aqua = "#8ab6c1"
blue = "#6e94b9"
purple = "#4c4e78"
tint_green = "#2e303e"
tint_red = "#36293a"
statusline = "#222335"
