palette_2 = "#fdf6e3"
palette_3 = "#fdf6e3"
palette_4 = "#fdf6e3"
palette_5 = "#fdf6e3"
palette_6 = "#fdf6e3"
palette_7 = "#fdf6e3"
palette_8 = "#fdf6e3"
palette_9 = "#fdf6e3"
palette_10 = "#fdf6e3"
palette_11 = "#fdf6e3"
palette_12 = "#fdf6e3"
palette_13 = "#fdf6e3"
palette_14 = "#fdf6e3"
palette_15 = "#fdf6e3"

[roles]
bg = "#fdf6e3"
bg_deep = "#fef8ea"
surface = "#ebe7d7"
fg = "#657b83"
