# iTerm2 Solarized Light
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#fdf6e3"
foreground = "#657b83"
cursor-color = "#657b83"
cursor-text = "#eee8d5"
selection-background = "#eee8d5"
selection-foreground = "#586e75"
palette_0 = "#073642"
palette_1 = "#dc322f"
palette_2 = "#859900"
palette_3 = "#b58900"
palette_4 = "#268bd2"
palette_5 = "#d33682"
palette_6 = "#2aa198"
palette_7 = "#bbb5a2"
palette_8 = "#002b36"
palette_9 = "#cb4b16"
palette_10 = "#586e75"
palette_11 = "#657b83"
palette_12 = "#839496"
palette_13 = "#6c71c4"
palette_14 = "#93a1a1"
palette_15 = "#fdf6e3"

[roles]
bg = "#fdf6e3"
bg_deep = "#fef8ea"
surface = "#ebe7d7"
fg = "#657b83"
fg_soft = "#93a0a0"
fg_bright = "#425055"
grey = "#a9b2ae"
grey_dim = "#c8cbc1"
grey_neutral = "#9aa6a5"
grey_soft = "#b9bfb8"
red = "#dc322f"
orange = "#c85e18"
yellow = "#b58900"
green = "#859900"
aqua = "#2aa198"
blue = "#268bd2"
purple = "#d33682"
tint_green = "#e7e5ba"
