# Aizen Dark
# [terminal] is synced verbatim from Ghostty (ghostty +list-themes).
# [roles] map the 16 colors onto what our apps need; derived from them by scripts/sync-ghostty-themes.py -- edit freely.
# [apps] carries optional per-app hints (delta syntax theme, nvim
# colorscheme); templates fall back to derived/neutral values without them.

[meta]
curated = false

[terminal]
background = "#1a1a1a"
foreground = "#d0d6f0"
cursor-color = "#f8b080"
cursor-text = "#1a1a1a"
selection-background = "#333333"
selection-foreground = "#d0d6f0"
palette_0 = "#1a1a1a"
palette_1 = "#f08898"
palette_2 = "#a4e09c"
palette_3 = "#f5dea4"
palette_4 = "#84b4f8"
palette_5 = "#c8a2f4"
palette_6 = "#90dcd0"
palette_7 = "#d0d6f0"
palette_8 = "#444444"
palette_9 = "#f08898"
palette_10 = "#a4e09c"
palette_11 = "#f5dea4"
palette_12 = "#84b4f8"
palette_13 = "#c8a2f4"
palette_14 = "#90dcd0"
palette_15 = "#ffffff"

[roles]
bg = "#1a1a1a"
bg_deep = "#141414"
surface = "#303134"
fg = "#d0d6f0"
fg_soft = "#999eb0"
fg_bright = "#ffffff"
grey = "#7e8190"
grey_dim = "#5a5c65"
grey_neutral = "#9094a5"
grey_soft = "#6c6f7a"
red = "#f08898"
orange = "#f2b39e"
yellow = "#f5dea4"
green = "#a4e09c"
aqua = "#90dcd0"
blue = "#84b4f8"
purple = "#c8a2f4"
tint_green = "#333e31"
tint_red = "#412e31"
statusline = "#29292b"
statusline_accent = "#3b3c41"
statusline_fg = "#d0d6f0"
on_accent = "#1a1a1a"
mode_red = "#f08898"
mode_green = "#a4e09c"
mode_yellow = "#f5dea4"
mode_blue = "#84b4f8"
mode_purple = "#c8a2f4"

[apps]
delta_syntax_theme = "none"

[apps.nvim]
colorscheme = ""
