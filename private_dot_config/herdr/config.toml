# ~/.config/herdr/config.toml -- managed by chezmoi (this repo); edit here,
# then `chezmoi apply`. herdr's own state (herdr-server.log, session.json,
# .plugins.lock) lives beside this file -- chezmoi leaves that alone.
#
# Theme: the `terminal` built-in paints herdr's UI from the rendering
# terminal's own ANSI palette and default fg/bg (herdr queries OSC 10/11
# and OSC 4 at runtime). That is the repo's SSH rule, enforced: over SSH
# the TUI follows the viewing terminal, exactly like the prompt and pi --
# no literal hexes anywhere in this file, and nothing in it varies with
# settings.toml's appearance mode.
#
# Updates: the binary is brew-owned, so background checks are off and the
# self-updater is refused by the `herdr` wrapper in ~/.zshrc -- upgrade
# with `brew upgrade herdr` like every other formula. Keys: pane focus
# also works prefix-free via ctrl+alt+hjkl (see the [keys] section).
# See docs/herdr.md.
onboarding = false

[theme]
name = "terminal"

[keys]
# Pane focus, prefix-free: ctrl+alt+h/j/k/l moves between panes without
# touching the prefix chords. ctrl+alt is herdr's one upstream-safe direct
# family -- it has no legacy ASCII byte (ctrl+h is backspace, ctrl+j is
# Enter for anything that reads raw bytes), nothing on macOS or Ghostty
# claims it, and the collision-free list keeps nvim and zsh untouched.
# Lists layer the direct chords on top of the prefix chords.
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

[update]
channel = "stable"
version_check = false
manifest_check = false
