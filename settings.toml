# settings.toml -- the only file you edit: how everything looks, plus the
# one behavior knob (the tmux wrapper).
#
# FOUR SETTINGS, no hex, no per-app themes:
#
# APPEARANCE
#   theme        "system" -- follow the OS light/dark appearance, live
#                (the default; flips mid-day when the OS does)
#                "light"  -- light everywhere, always
#                "dark"   -- dark everywhere, always
#   light_theme  a theme name -- browse the gallery in the README of
#   dark_theme   https://github.com/mbadolato/iTerm2-Color-Schemes (the
#                names are the mirror's file names in themes/)
#
# BEHAVIOR
#   tmux_wrap    "on"  -- every new pi conversation gets its own detachable
#                tmux session (the default; detach Ctrl-b d, rejoin from
#                any device with `tmux attach -t <name>`)
#                "off" -- pi runs bare: no sessions, nothing to reattach
#                from the phone (`pi -c` still resumes a conversation from
#                any machine). The env override still wins per machine:
#                PI_TMUX_WRAP=never for one shell, =force to wrap for one
#                run despite the setting. A nonempty HC_TERMINAL_ID still
#                runs pi bare: core owns persistence, and tmux blocks status.
#
# These themed surfaces render from the two theme names:
#   Ghostty        the theme itself (light:/dark: pair when theme=system)
#   zsh prompt     indexed colors 0-15, inherited from the terminal palette
#   delta/git      diffs in the theme's own ANSI palette (no bat themes)
#   pi TUI         themes in the palette's own indexed slots -- they follow
#                  the viewing terminal, even over SSH
#   nvim + lualine a colorscheme generated from the palette's 16 colors
#   Herdr desktop  generated native theme pair: same terminal palettes as
#                  Ghostty, with UI derived by Herdr; live OS mode or pin
#                  follows theme above. Default main layout follows these;
#                  layout-local theme/color overrides can take precedence.
# App keys, core config, and runtime/layout state remain unmanaged.
#
# The names are resolved at apply time against the theme mirror committed
# in themes/ (a verbatim copy of iTerm2-Color-Schemes' ghostty/ directory,
# refreshed by scripts/themes-sync.sh), so any mirrored name works and
# `chezmoi apply` needs no network or Ghostty/Herdr install. After editing:
# `chezmoi diff && chezmoi apply`.

theme = "system"
light_theme = "Paper Crane"
dark_theme = "Paper Crane: Midnight Ink"

# pi conversations in tmux? on = detachable sessions (the feature), off =
# bare pi. Rendered into ~/.zshrc at apply time; see the header above.
tmux_wrap = "on"
