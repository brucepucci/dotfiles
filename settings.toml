# settings.toml -- the only file you edit: how everything looks, plus the
# one behavior knob (the tmux wrapper).
#
# FOUR SETTINGS, no hex, no per-app themes:
#
# APPEARANCE
#   theme        "system" -- follow the OS light/dark appearance, live
#                (the default; flips mid-day when the OS does)
#                "light"  -- light everywhere, always
#                "dark"   -- dark everywhere, always
#   light_theme  a Ghostty theme name -- browse with `ghostty +list-themes`
#   dark_theme   (highlighting a theme there shows its 16-color mapping)
#
# BEHAVIOR
#   tmux_wrap    "on"  -- every new pi conversation gets its own detachable
#                tmux session (the default; detach Ctrl-b d, rejoin from
#                any device with `tmux attach -t <name>`)
#                "off" -- pi runs bare: no sessions, nothing to reattach
#                from the phone (`pi -c` still resumes a conversation from
#                any machine). The env override still wins per machine:
#                PI_TMUX_WRAP=never for one shell, =force to wrap for one
#                run despite the setting.
#
# Every surface this repo manages renders from the two theme names:
#   Ghostty        the theme itself (light:/dark: pair when theme=system)
#   zsh prompt     indexed colors 0-15, inherited from the terminal palette
#   delta/git      diffs in the theme's own ANSI palette (no bat themes)
#   pi TUI         themes generated from the palette's 16 colors
#   nvim + lualine a colorscheme generated from the palette's 16 colors
#
# The names are resolved at apply time from Ghostty's own catalog by
# scripts/ghostty-theme.py, so any theme `ghostty +list-themes` lists works,
# including ones added by a Ghostty update. Ghostty must be installed where
# `chezmoi apply` runs. After editing: `chezmoi diff && chezmoi apply`.

theme = "system"
light_theme = "Gruvbox Light Hard"
dark_theme = "Gruvbox Material Dark"

# pi conversations in tmux? on = detachable sessions (the feature), off =
# bare pi. Rendered into ~/.zshrc at apply time; see the header above.
tmux_wrap = "on"
